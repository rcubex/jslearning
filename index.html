 "p", "x": "A packet filter decides whether to allow or drop traffic based on the 5-tuple (protocol, source and destination IP, source and destination port). There are two kinds."}, {"k": "p", "x": "A **stateful** filter keeps a table of active connections. When it allows an outbound request, it automatically allows the matching reply, because it recognises it as part of the same connection. You only write rules for who may *start* a connection."}, {"k": "p", "x": "A **stateless** filter judges every packet on its own, with no memory. If you allow inbound TCP 443 to a web server, you must also allow the outbound replies, which go to the client's random **ephemeral port** (1024–65535)."}, {"k": "ul", "x": ["AWS security groups, Azure NSGs, Google Cloud firewall rules and OCI NSGs are **stateful**", "AWS network ACLs are **stateless**; OCI security list rules are stateful by default but can be made stateless", "Stateless filters are simpler and faster but easier to get wrong"]}, {"k": "tip", "kind": "Watch out", "x": "The most common NACL mistake on AWS: allowing inbound 443 but forgetting outbound 1024–65535, so requests arrive and the replies are silently dropped."}]}, {"t": "Rule order and default deny", "tag": null, "blocks": [{"k": "p", "x": "Firewall rules are evaluated in order. In most systems (AWS NACLs, Azure NSGs, OCI, Google Cloud firewall priorities) the rules are checked by number or priority and the **first match wins**. AWS security groups are different: they only contain allow rules, and if any rule matches, traffic is allowed."}, {"k": "p", "x": "The golden rule is **default deny**: block everything, then add narrow allow rules for what is needed. Each allow rule should be as specific as possible:"}, {"k": "ul", "x": ["**Source**: a specific subnet or security group, not 0.0.0.0/0", "**Port**: 443, not \"all\"", "**Protocol**: TCP, not \"any\""]}, {"k": "code", "t": "A sensible three-tier rule set (conceptually)", "x": "web tier:  allow TCP 443 from 0.0.0.0/0\napp tier:  allow TCP 8080 from web-tier security group only\ndb tier:   allow TCP 5432 from app-tier security group only\nadmin:     no SSH/RDP from the Internet; use a managed bastion or session service\neverything else: denied"}, {"k": "tip", "kind": "Tip", "x": "Reference security groups (AWS), application security groups (Azure), service accounts or tags (Google Cloud) or NSGs (OCI) as rule sources instead of IP addresses. Rules then keep working as servers scale up and down."}]}, {"t": "Segmentation and the DMZ", "tag": null, "blocks": [{"k": "p", "x": "**Segmentation** divides a network into zones so that a breach in one zone does not give access to all the others. The classic design has three tiers:"}, {"k": "ol", "x": ["A **DMZ** or public zone for things the Internet must reach: load balancers, reverse proxies, VPN endpoints.", "An **application zone** reachable only from the DMZ.", "A **data zone** (databases, file stores) reachable only from the application zone."]}, {"k": "p", "x": "Further segmentation separates environments (production must not talk to development), business units and sensitivity levels (payment systems in their own segment for PCI DSS). **Micro-segmentation** goes further, with rules per workload rather than per subnet."}, {"k": "p", "x": "In the cloud you segment with separate subnets, separate VPCs/VNets, and per-workload security groups. Many organisations also use separate cloud accounts, subscriptions or projects per environment, which is the strongest boundary of all."}, {"k": "tip", "kind": "In the cloud", "x": "A database should never have a public IP address. Put it in a private subnet with a rule that only the application tier can reach its port."}]}, {"t": "VPNs, IPsec and IKE", "tag": null, "blocks": [{"k": "p", "x": "A **VPN** (virtual private network) builds an encrypted tunnel across an untrusted network such as the Internet."}, {"k": "p", "x": "**Site-to-site VPNs** join two networks, for example an office and a cloud VPC. They almost always use **IPsec**: **IKE** (Internet Key Exchange, UDP 500, and UDP 4500 when NAT is involved) authenticates both ends and negotiates keys, then **ESP** encrypts the traffic. Both sides must agree on parameters such as encryption algorithm (AES-256), integrity (SHA-256), Diffie-Hellman group and lifetimes. Mismatched parameters are the most common reason a tunnel will not come up."}, {"k": "p", "x": "**Remote access VPNs** connect individual users' devices. They use IPsec, SSL/TLS-based clients or WireGuard."}, {"k": "p", "x": "Every cloud offers a managed VPN gateway (AWS Site-to-Site VPN, Azure VPN Gateway, Google Cloud HA VPN, OCI Site-to-Site VPN), each providing two tunnels for redundancy. Use both."}, {"k": "code", "t": "What you agree with the other side (example)", "x": "IKE version:      IKEv2\nEncryption:       AES-256-GCM\nIntegrity / PRF:  SHA-256\nDH group:         14 or higher (2048-bit MODP) or 19/20 (ECP)\nPre-shared key:   long random string\nRouting:          BGP (preferred) or static"}, {"k": "tip", "kind": "Tip", "x": "If a tunnel shows \"IKE up, IPsec down\" or no traffic flows, compare phase 2 (IPsec) parameters and the traffic selectors / routes on both ends first."}]}, {"t": "Zero trust", "tag": null, "blocks": [{"k": "p", "x": "Traditional security assumed that anything inside the network perimeter could be trusted. That fails as soon as one laptop or server is compromised, and it does not fit cloud services and remote work."}, {"k": "p", "x": "**Zero trust** (NIST SP 800-207) removes trust based on network location. Every request is evaluated on:"}, {"k": "ul", "x": ["**Identity**: who is the user or workload, proven with strong authentication (MFA, certificates, workload identity)", "**Device**: is the device managed, patched and healthy", "**Context**: what resource, from where, at what time, with what risk", "**Least privilege**: grant only the access needed, for only as long as needed"]}, {"k": "p", "x": "Practical zero-trust building blocks in the cloud: identity-aware proxies (Google IAP, Microsoft Entra application proxy), managed admin access without open ports (AWS Systems Manager Session Manager, Azure Bastion, OCI Bastion), service-to-service mTLS in a service mesh, and private endpoints for managed services."}, {"k": "tip", "kind": "Analogy", "x": "The old model is a castle with a moat: once inside, you can go anywhere. Zero trust is a modern office where your badge is checked at every door."}]}, {"t": "Encryption in transit and defense in depth", "tag": null, "blocks": [{"k": "p", "x": "Encrypt data in transit everywhere, including inside your own network. Use TLS 1.2 or 1.3 for applications, IPsec for site-to-site links, and SSH (not Telnet) for administration. Cloud providers encrypt some traffic between their data centres automatically, but you are responsible for application-level encryption."}, {"k": "p", "x": "**Defense in depth** means stacking independent controls so that one failure is not fatal:"}, {"k": "ol", "x": ["Edge: DDoS protection and a web application firewall", "Network: segmentation, security groups, firewalls", "Identity: MFA, least privilege, no shared accounts", "Host: patching, hardening, endpoint protection", "Application: secure coding, input validation (see the OWASP Top 10)", "Data: encryption at rest and in transit, backups", "Monitoring: flow logs, audit logs, alerts"]}, {"k": "tip", "kind": "Watch out", "x": "A firewall rule is not a substitute for patching. Assume any single control can fail, and ask what stops an attacker at the next layer."}]}], "q": [{"t": "With a stateless filter, what must you add so a web server on 443 can reply?", "o": ["Nothing", "An outbound rule for ephemeral ports", "A DNS rule", "A NAT rule"], "a": 1, "x": "Stateless filters do not track connections, so return traffic to client ports (1024–65535) needs its own rule."}, {"t": "Zero trust removes trust based on what?", "o": ["Passwords", "Network location", "Encryption", "Certificates"], "a": 1, "x": "Being \"inside the network\" grants nothing; every request is verified."}, {"t": "Which source is best for a database rule that should only accept the app tier?", "o": ["0.0.0.0/0", "The whole VPC range", "The app tier's security group or tag", "The Internet gateway"], "a": 2, "x": "Referencing the app tier's group follows instances as they change and is as narrow as possible."}, {"t": "Which ports must be open for an IPsec VPN that crosses a NAT device?", "o": ["TCP 22 and 443", "UDP 500 and UDP 4500", "TCP 179", "UDP 53"], "a": 1, "x": "IKE uses UDP 500; NAT traversal moves IKE and ESP to UDP 4500."}, {"t": "What is the main purpose of network segmentation?", "o": ["Faster Internet access", "Fewer IP addresses", "Limiting how far an attacker can move after one compromise", "Removing the need for passwords"], "a": 2, "x": "Segments contain breaches and let you apply tighter rules to sensitive systems."}], "lv": 2, "h": 5, "goal": "Apply filtering, segmentation and encryption the way cloud controls expect.", "terms": ["stateful", "stateless", "ACL", "default deny", "least privilege", "DMZ", "segmentation", "IPsec", "IKE", "zero trust", "defense in depth"]}, {"id": "m07", "t": "Load Balancing, Proxies & CDNs", "res": [["Cloudflare Learning: what is a CDN", "https://www.cloudflare.com/learning/cdn/what-is-a-cdn/"], ["Nginx load balancing guide", "https://nginx.org/en/docs/http/load_balancing.html"], ["Cloudflare Learning: what is load balancing", "https://www.cloudflare.com/learning/performance/what-is-load-balancing/"]], "sum": ["L4 balances connections by IP and port; L7 understands HTTP and routes by content.", "Health checks decide where traffic goes; tune them carefully.", "Reverse proxies terminate TLS, cache and hide backends.", "CDNs and anycast bring content and entry points close to users."], "ls": [{"t": "L4 vs L7 load balancing", "tag": null, "blocks": [{"k": "p", "x": "A **load balancer** spreads traffic across several servers so that no single server is overloaded and failed servers are taken out of rotation."}, {"k": "p", "x": "A **Layer 4** load balancer works with IP addresses, protocols and ports. It forwards whole TCP or UDP connections to a backend without looking inside them. It is extremely fast, works with any protocol (databases, game servers, MQTT) and can preserve the client's source IP."}, {"k": "p", "x": "A **Layer 7** load balancer understands HTTP. It terminates the client's connection, reads the request and makes decisions based on content: host name (`api.example.com` vs `www.example.com`), path (`/api` vs `/images`), headers, cookies or query strings. It can also redirect HTTP to HTTPS, rewrite headers, and attach a WAF."}, {"k": "p", "x": "Common distribution algorithms: **round robin** (each server in turn), **least connections** (the least busy server), **weighted** (bigger servers get more) and **hash-based** (the same client always reaches the same server)."}, {"k": "ul", "x": ["Choose L4 for non-HTTP protocols, extreme performance or static IPs", "Choose L7 for websites and APIs, path/host routing, and WAF integration"]}, {"k": "tip", "kind": "In the cloud", "x": "AWS Network Load Balancer vs Application Load Balancer, Azure Load Balancer vs Application Gateway, Google Cloud passthrough Network Load Balancer vs Application Load Balancer, OCI Network Load Balancer vs Load Balancer."}]}, {"t": "Health checks", "tag": null, "blocks": [{"k": "p", "x": "A load balancer regularly sends **health checks** to each backend: a TCP connection attempt, or an HTTP request to a path such as `/healthz`. A backend that fails a set number of checks in a row (the **unhealthy threshold**) stops receiving traffic; after enough successful checks (the **healthy threshold**) it is added back."}, {"k": "p", "x": "Health checks are simple but cause many outages:"}, {"k": "ul", "x": ["A check that is too shallow (just \"is the port open\") keeps sending traffic to an app that is running but broken", "A check that is too deep (also tests the database) can mark *every* server unhealthy at once when the database blips, taking the whole site down", "A check blocked by a firewall makes all backends look dead, so the load balancer returns 502/503"]}, {"k": "code", "t": "A good health endpoint", "x": "GET /healthz  →  200 OK in under 100 ms\n- Confirms the process is running and can serve requests\n- Does NOT fail just because an optional dependency is slow"}, {"k": "tip", "kind": "Watch out", "x": "In every cloud, the backend's security rules must allow traffic from the load balancer's health-check source (for example, Google Cloud's health checks come from 35.191.0.0/16 and 130.211.0.0/22)."}]}, {"t": "Sessions, TLS termination and reverse proxies", "tag": null, "blocks": [{"k": "p", "x": "Some applications store user state on one server. **Sticky sessions** (session affinity) send a user's requests to the same backend, usually with a cookie. They help legacy apps but spread load unevenly; storing sessions in a shared cache (Redis) is better."}, {"k": "p", "x": "**TLS termination** means the load balancer or proxy decrypts HTTPS, so it can read and route the request. Traffic to the backend can then be plain HTTP (simple but unencrypted inside your network) or re-encrypted (**TLS re-encryption / end-to-end TLS**, recommended for sensitive data). **TLS passthrough** forwards encrypted traffic untouched, which requires an L4 balancer."}, {"k": "p", "x": "A **reverse proxy** sits in front of servers and handles TLS, compression, caching, rate limiting and request routing, while hiding the internal layout. Nginx, HAProxy and Envoy are the common open-source choices; cloud L7 load balancers are managed reverse proxies."}, {"k": "code", "t": "Nginx: a minimal reverse proxy with two backends", "x": "upstream app {\n    least_conn;\n    server 10.0.10.11:8080;\n    server 10.0.10.12:8080;\n}\nserver {\n    listen 443 ssl;\n    server_name app.example.com;\n    ssl_certificate     /etc/ssl/app.crt;\n    ssl_certificate_key /etc/ssl/app.key;\n    location / { proxy_pass http://app; proxy_set_header X-Forwarded-For $remote_addr; }\n}"}, {"k": "tip", "kind": "Tip", "x": "Behind an L7 proxy, the app sees the proxy's IP. The real client IP is in the `X-Forwarded-For` header."}]}, {"t": "CDNs and anycast", "tag": null, "blocks": [{"k": "p", "x": "A **CDN** (content delivery network) caches content in hundreds of **edge locations** close to users. A user in Dubai downloading an image from a server in Ireland gets it from a nearby edge instead, cutting latency and taking load off the origin. Modern CDNs also accelerate dynamic content, terminate TLS near the user, and provide DDoS protection and WAF at the edge."}, {"k": "p", "x": "How long content is cached is controlled by HTTP headers such as `Cache-Control: max-age=86400`. Changing content requires a new file name (versioned assets like `app.3f9a.js`) or an **invalidation**."}, {"k": "p", "x": "**Anycast** announces the same IP address from many locations. BGP routes each user to the nearest one. DNS resolvers like 1.1.1.1 and 8.8.8.8, CDNs and global cloud load balancers all use anycast. If one site fails, its route is withdrawn and users flow to the next nearest."}, {"k": "tip", "kind": "In the cloud", "x": "Amazon CloudFront, Azure Front Door, Google Cloud CDN with the global Application Load Balancer, and OCI's CDN partners. Google's global load balancer gives you one anycast IP for the whole world."}]}, {"t": "Choosing the right front door", "tag": null, "blocks": [{"k": "p", "x": "Decision guide for a new application:"}, {"k": "ol", "x": ["**Static website or global audience** → CDN in front, origin in object storage or behind a load balancer.", "**HTTP API or website in one region** → regional L7 load balancer with a WAF.", "**Global HTTP app needing failover between regions** → global L7 service (Azure Front Door, Google Cloud global Application Load Balancer, AWS CloudFront or Global Accelerator) or DNS-based failover.", "**Non-HTTP TCP/UDP service, or needs static IPs or extreme throughput** → L4 load balancer.", "**Inserting third-party firewalls inline** → AWS Gateway Load Balancer or Azure Gateway Load Balancer."]}, {"k": "tip", "kind": "Tip", "x": "Start simple. One regional L7 load balancer with a WAF covers most applications; add a CDN when users are far away or traffic is heavy."}]}], "q": [{"t": "You need /api to go to one service and /static to another. Which balancer type?", "o": ["L4", "L7", "DNS round-robin", "Anycast"], "a": 1, "x": "Path-based routing needs HTTP awareness, which is L7."}, {"t": "What makes one IP address reachable at the nearest of many locations?", "o": ["NAT", "Anycast", "Multicast", "VLAN"], "a": 1, "x": "Anycast announces the same prefix from many sites; BGP delivers users to the closest."}, {"t": "Your health check queries the database. The database restarts for 30 seconds. What can happen?", "o": ["Nothing", "Every backend is marked unhealthy and the whole site goes down", "Only one server is affected", "The CDN takes over automatically"], "a": 1, "x": "Deep health checks can fail on all servers at once. Keep health checks focused on the app itself."}, {"t": "Behind an L7 load balancer, where does the app find the real client IP?", "o": ["In the TCP source address", "In the X-Forwarded-For header", "In the TLS certificate", "In the DNS record"], "a": 1, "x": "The proxy opens a new connection, so the original client IP is passed in X-Forwarded-For."}, {"t": "Which header controls how long a CDN caches a file?", "o": ["Content-Type", "Host", "Cache-Control", "Authorization"], "a": 2, "x": "Cache-Control (for example max-age) tells caches how long the content stays fresh."}], "lv": 2, "h": 4, "goal": "Choose the right traffic distribution layer for an application.", "terms": ["L4 load balancer", "L7 load balancer", "health check", "round robin", "least connections", "sticky sessions", "TLS termination", "reverse proxy", "CDN", "anycast", "cache"]}, {"id": "m08", "t": "Linux Networking Toolkit", "res": [["tcpdump manual", "https://www.tcpdump.org/manpages/tcpdump.1.html"], ["iproute2 ip(8) manual", "https://man7.org/linux/man-pages/man8/ip.8.html"], ["curl documentation", "https://curl.se/docs/"]], "sum": ["ip addr and ip route are the first two commands on any broken VM.", "ss -tulpn proves a service is listening before you blame the network.", "curl, dig and nc test the application, DNS and raw ports separately.", "tcpdump shows the truth; MTU problems make large transfers hang."], "ls": [{"t": "Interfaces and routes", "tag": null, "blocks": [{"k": "p", "x": "On any Linux VM, start with two commands."}, {"k": "p", "x": "`ip addr` (short: `ip a`) lists network interfaces and their addresses. Check that the interface is `UP`, that it has the IP address you expect, and the prefix length."}, {"k": "p", "x": "`ip route` (short: `ip r`) shows the routing table. Check that there is a `default via ...` line and that it points to the subnet's gateway (in most clouds the first usable address, such as 10.0.1.1)."}, {"k": "code", "t": "First look at a VM", "x": "$ ip -br a\nlo      UNKNOWN 127.0.0.1/8\neth0    UP      10.0.1.25/24\n$ ip r\ndefault via 10.0.1.1 dev eth0\n10.0.1.0/24 dev eth0 proto kernel scope link src 10.0.1.25\n$ ip route get 8.8.8.8      # which route would be used for this destination?\n8.8.8.8 via 10.0.1.1 dev eth0 src 10.0.1.25\n$ cat /etc/resolv.conf      # which DNS server is configured?"}, {"k": "tip", "kind": "In the cloud", "x": "Don't change IP settings by hand on cloud VMs. Addresses come from the provider's DHCP; a manually set wrong address can cut you off completely. Change them in the console or with IaC instead."}]}, {"t": "Sockets and ports", "tag": null, "blocks": [{"k": "p", "x": "`ss` (socket statistics) shows connections and listening ports. The most useful form is `ss -tulpn`: **t**cp, **u**dp, **l**istening, **p**rocess, **n**umeric."}, {"k": "code", "t": "Is my service actually listening?", "x": "$ sudo ss -tulpn\nNetid State  Local Address:Port  Process\ntcp   LISTEN 127.0.0.1:5432      users:((\"postgres\",pid=812))\ntcp   LISTEN 0.0.0.0:22          users:((\"sshd\",pid=640))\ntcp   LISTEN *:8080              users:((\"java\",pid=1931))"}, {"k": "p", "x": "Pay attention to the local address. `127.0.0.1:5432` means PostgreSQL only accepts connections from the VM itself; no firewall rule will make it reachable from other machines until it listens on `0.0.0.0` or the VM's IP. `0.0.0.0` or `*` means all IPv4 interfaces."}, {"k": "p", "x": "`nc` (netcat) tests whether a remote port is reachable without any application: `nc -vz 10.0.2.30 5432`."}, {"k": "tip", "kind": "Tip", "x": "The order that saves hours: is the process running (`systemctl status`), is it listening on the right address (`ss`), is the host firewall open (`iptables`/`nft`/`ufw`), and only then the cloud security rules."}]}, {"t": "HTTP and DNS testing", "tag": null, "blocks": [{"k": "p", "x": "`curl` is the Swiss army knife for testing web services."}, {"k": "code", "t": "Useful curl patterns", "x": "curl -I https://app.example.com                 # headers only\ncurl -v https://app.example.com                 # full detail: DNS, TLS, headers\ncurl -s -o /dev/null -w '%{http_code} %{time_total}s\\n' https://app.example.com\ncurl --resolve app.example.com:443:10.0.1.50 https://app.example.com\n     # test a specific server without changing DNS\ncurl -k https://10.0.1.50                       # ignore certificate errors (testing only)"}, {"k": "p", "x": "`dig` tests DNS: `dig app.example.com +short`, `dig @10.0.0.2 app.internal` (ask a specific resolver), `dig -x 10.0.1.25` (reverse lookup)."}, {"k": "p", "x": "`traceroute` and `mtr` show the path. `mtr` combines ping and traceroute, and runs continuously to reveal which hop introduces loss or delay: `mtr -rwc 50 example.com`."}, {"k": "tip", "kind": "Watch out", "x": "Many clouds and firewalls block or deprioritise ICMP and traceroute probes. Missing hops are normal; consistent loss that continues all the way to the destination is what matters."}]}, {"t": "Packet capture", "tag": null, "blocks": [{"k": "p", "x": "When logs and tests disagree, look at the packets. `tcpdump` captures traffic on an interface."}, {"k": "code", "t": "tcpdump patterns", "x": "sudo tcpdump -i eth0 -nn port 443                 # all HTTPS traffic\nsudo tcpdump -i eth0 -nn host 10.0.2.30           # traffic to/from one host\nsudo tcpdump -i eth0 -nn 'tcp[tcpflags] & tcp-syn != 0'   # only SYNs\nsudo tcpdump -i eth0 -nn -w /tmp/cap.pcap port 5432       # save for Wireshark"}, {"k": "p", "x": "How to read the result:"}, {"k": "ul", "x": ["You see SYN going out and nothing coming back → something on the path is dropping it (security rule, NACL, route, or the far host is down)", "You see SYN and an immediate RST back → the host is reachable but nothing listens on that port", "You see the handshake complete, then a stall on large packets → suspect MTU"]}, {"k": "tip", "kind": "Tip", "x": "Capture on both ends at the same time. If the packet leaves A but never reaches B, the problem is in between, which narrows it down to routes and cloud firewalls."}]}, {"t": "MTU and fragmentation", "tag": null, "blocks": [{"k": "p", "x": "The **MTU** (maximum transmission unit) is the largest packet a link can carry. Standard Ethernet is 1,500 bytes. Some cloud networks support **jumbo frames**: AWS allows 9,001 bytes inside a VPC, a Google Cloud VPC's MTU can be set up to 8,896, and OCI supports 9,000 within a VCN. Azure VMs default to 1,500; check the current Azure documentation before raising it."}, {"k": "p", "x": "Tunnels add headers: IPsec, GRE, VXLAN and VPN connections all reduce the space left for data, so the effective MTU across a VPN might be around 1,400 bytes or less. If a packet is too big and has the \"don't fragment\" bit set, the router drops it and should send back an ICMP \"fragmentation needed\" message. If ICMP is blocked, the sender never learns, and you get a **PMTU black hole**: small requests work, large transfers hang."}, {"k": "code", "t": "Find the working MTU", "x": "ping -M do -s 1472 10.20.0.5    # 1472 + 28 bytes of headers = 1500\nping -M do -s 1372 10.20.0.5    # try smaller until it works\nip link show eth0 | grep mtu"}, {"k": "p", "x": "The usual fix is **MSS clamping** on the VPN or firewall, which tells TCP to use smaller segments, or lowering the interface MTU."}, {"k": "tip", "kind": "Watch out", "x": "Traffic leaving a VPC through an Internet gateway, VPN or peering connection to another region is usually limited to 1,500 bytes or less, even if instances use jumbo frames internally."}]}, {"t": "Host firewalls", "tag": null, "blocks": [{"k": "p", "x": "Linux has its own firewall in the kernel, managed with **iptables** or its successor **nftables**, or more simply with **ufw** (Ubuntu) and **firewalld** (RHEL family). A host firewall applies in addition to cloud security groups: traffic must pass both."}, {"k": "code", "t": "Check and manage host firewall rules", "x": "sudo ufw status verbose\nsudo ufw allow from 10.0.0.0/16 to any port 5432 proto tcp\nsudo firewall-cmd --list-all              # firewalld\nsudo nft list ruleset                     # nftables\nsudo iptables -L -n -v                    # legacy iptables"}, {"k": "p", "x": "Linux is also the basis of many network functions you will meet: routing (`sysctl net.ipv4.ip_forward=1`), NAT (`nft ... masquerade`), and Kubernetes networking (kube-proxy programs iptables or IPVS rules)."}, {"k": "tip", "kind": "Tip", "x": "When a port is open in the cloud security group but still unreachable, check the host firewall next. Both must allow the traffic."}]}], "q": [{"t": "Which command shows which process listens on a port?", "o": ["ip route", "ss -tulpn", "dig", "traceroute"], "a": 1, "x": "ss lists sockets; -p shows the owning process."}, {"t": "Large transfers hang over a VPN but small requests work. First suspect?", "o": ["DNS", "MTU", "ARP", "TTL"], "a": 1, "x": "Tunnel overhead shrinks the usable packet size; oversized packets get dropped."}, {"t": "ss shows PostgreSQL listening on 127.0.0.1:5432. Other VMs can't connect. Why?", "o": ["The security group is wrong", "PostgreSQL only accepts local connections on the loopback address", "DNS is broken", "The VM has no route"], "a": 1, "x": "A service bound to 127.0.0.1 can't be reached from outside the VM, whatever the firewall says."}, {"t": "tcpdump on the client shows SYN sent and no reply ever arrives. What is most likely?", "o": ["Nothing is listening on the port", "The certificate expired", "A firewall, security rule or route on the path is dropping the traffic", "The application crashed after connecting"], "a": 2, "x": "No reply at all means the packet is being dropped. \"Nothing listening\" would produce an RST."}, {"t": "Which curl option lets you test a specific server for a host name without changing DNS?", "o": ["-I", "-k", "--resolve", "-o"], "a": 2, "x": "--resolve host:port:ip forces curl to use that IP for the name."}], "lv": 2, "h": 4, "goal": "Troubleshoot any cloud VM from its own shell.", "terms": ["ip", "ss", "curl", "dig", "tcpdump", "traceroute", "mtr", "nc", "MTU", "MSS", "iptables", "nftables"]}, {"id": "m09", "t": "BGP & Internet Routing", "res": [["Cloudflare Learning: what is BGP", "https://www.cloudflare.com/learning/security/glossary/what-is-bgp/"], ["Hurricane Electric BGP Toolkit", "https://bgp.he.net/"], ["Cloudflare: is BGP safe yet (RPKI)", "https://isbgpsafeyet.com/"]], "sum": ["The Internet is ~75,000+ autonomous systems connected by BGP.", "Every cloud private link and dynamic VPN uses eBGP between your router and the provider.", "Steer outbound traffic with local preference; steer inbound traffic with prepending and MED.", "Always filter what you advertise and accept; route leaks cause real outages."], "ls": [{"t": "Autonomous systems", "tag": null, "blocks": [{"k": "p", "x": "An **autonomous system (AS)** is a network, or group of networks, run by one organisation with one routing policy. Each has an **ASN** (autonomous system number). Examples: Amazon is AS16509, Microsoft AS8075, Google AS15169, Oracle AS31898, Cloudflare AS13335."}, {"k": "p", "x": "Public ASNs are assigned by regional registries (RIPE NCC for the Middle East and Europe, ARIN for North America, APNIC for Asia-Pacific). For private use, such as between your data centre and the cloud, you use a **private ASN**: 64512–65534 in the 2-byte range, or 4200000000–4294967294 in the 4-byte range."}, {"k": "p", "x": "BGP is a **path-vector** protocol. Routers announce which IP **prefixes** they can reach, along with the list of ASNs the announcement has passed through (the **AS path**). This lets every network see the path, avoid loops and apply policy."}, {"k": "tip", "kind": "In the cloud", "x": "When you set up a cloud VPN or private link with BGP, you choose an ASN for your side (for example 65010) and the provider uses its own (AWS defaults to 64512 for a virtual private gateway, Azure VPN gateways use 65515, Google Cloud Router lets you pick, OCI uses 31898)."}]}, {"t": "eBGP and iBGP", "tag": null, "blocks": [{"k": "p", "x": "**eBGP** (external BGP) runs between routers in *different* autonomous systems, usually directly connected. **iBGP** (internal BGP) runs between routers in the *same* AS to spread externally learned routes across the organisation."}, {"k": "p", "x": "A BGP session runs over **TCP port 179**. The two routers (**peers** or **neighbours**) exchange their routes, then send updates only when something changes, plus small keepalive messages. If keepalives stop for the **hold time** (often 90 seconds; cloud services commonly use shorter timers or BFD for faster detection), the session drops and its routes are withdrawn."}, {"k": "code", "t": "Typical BGP neighbour setup on your router (Cisco-style)", "x": "router bgp 65010\n neighbor 169.254.10.1 remote-as 64512        ! the cloud side\n neighbor 169.254.10.1 password <md5-key>\n address-family ipv4\n  network 10.100.0.0 mask 255.255.0.0          ! advertise on-prem range\n  neighbor 169.254.10.1 activate\n  neighbor 169.254.10.1 prefix-list TO-CLOUD out\n  neighbor 169.254.10.1 prefix-list FROM-CLOUD in"}, {"k": "tip", "kind": "Tip", "x": "The 169.254.x.x addresses on cloud VPN and private-link interfaces are link-local \"inside tunnel\" addresses used only for the BGP session."}]}, {"t": "Path selection", "tag": null, "blocks": [{"k": "p", "x": "When a router learns several paths to the same prefix, BGP picks one using an ordered list of attributes. Simplified, the most important are:"}, {"k": "ol", "x": ["**Highest local preference**: set inside your AS to choose the *outbound* exit (prefer link A over link B for traffic you send).", "**Shortest AS path**: fewer ASNs wins.", "**Lowest origin type**.", "**Lowest MED** (multi-exit discriminator): a hint you give a neighbour about which of your links it should use to send traffic *to you*. Only compared between paths from the same neighbouring AS.", "eBGP over iBGP, then lowest IGP cost, then tie-breakers."]}, {"k": "p", "x": "Remember the direction:"}, {"k": "ul", "x": ["You control **outbound** traffic with **local preference** (and weight on Cisco).", "You influence **inbound** traffic with **AS-path prepending** (repeating your own ASN to make a path look longer) and **MED**."]}, {"k": "code", "t": "Make link B the backup for inbound traffic", "x": "route-map PREPEND-BACKUP permit 10\n set as-path prepend 65010 65010 65010\nrouter bgp 65010\n neighbor 169.254.20.1 route-map PREPEND-BACKUP out"}, {"k": "tip", "kind": "In the cloud", "x": "Providers document how they pick between your links. For example, AWS prefers Direct Connect over VPN for the same prefix and honours prepending and longest prefix; Azure ExpressRoute uses AS path and weight; always read the provider's routing-preference page before designing primary/backup."}]}, {"t": "Peering and transit", "tag": null, "blocks": [{"k": "p", "x": "Networks connect to each other in two commercial ways."}, {"k": "p", "x": "**Transit**: you pay a provider to carry your traffic to and from the entire Internet. Small networks buy transit from one or more ISPs."}, {"k": "p", "x": "**Peering**: two networks agree to exchange traffic directly between their own customers, usually without payment. It reduces cost and latency. Peering happens over private cables or at **Internet Exchange Points (IXPs)**, such as UAE-IX in Dubai, DE-CIX in Frankfurt or AMS-IX in Amsterdam, where hundreds of networks connect to a shared switch."}, {"k": "p", "x": "Cloud providers peer with thousands of ISPs worldwide, which is why traffic to them often enters their private backbone very close to the user."}, {"k": "tip", "kind": "Tip", "x": "Look up your ISP and the big clouds on bgp.he.net to see their prefixes, peers and the IXPs they connect at."}]}, {"t": "Route security and best practice", "tag": null, "blocks": [{"k": "p", "x": "BGP was designed on trust, and mistakes spread globally. A **route leak** or **hijack** happens when a network announces prefixes it should not, and traffic is misrouted, sometimes for whole countries or major services."}, {"k": "p", "x": "Defences:"}, {"k": "ul", "x": ["**Prefix filters**: only advertise your own prefixes, and only accept what you expect from each peer", "**Maximum-prefix limits**: shut the session if a peer suddenly sends far more routes than normal", "**RPKI** (Resource Public Key Infrastructure): cryptographically signed records (ROAs) saying which ASN may originate a prefix; routers drop invalid announcements", "**BGP authentication** (TCP MD5 or TCP-AO) on sessions", "**Summarise** routes: advertise 10.100.0.0/16, not 200 individual /24s"]}, {"k": "tip", "kind": "In the cloud", "x": "Clouds limit how many routes you can advertise to them (for example, AWS Direct Connect private virtual interfaces accept up to 100 prefixes by default, and Azure ExpressRoute private peering allows up to 4,000 with Standard). Exceed the limit and the session goes down. Summarise."}]}], "q": [{"t": "Which BGP technique makes a path look longer so peers prefer another link?", "o": ["MED", "AS-path prepending", "Local preference", "Route reflection"], "a": 1, "x": "Prepending repeats your ASN in the path, making it less attractive."}, {"t": "Which range is reserved for private 2-byte ASNs?", "o": ["1–1023", "64512–65534", "65535 only", "100–200"], "a": 1, "x": "64512–65534 is the private 16-bit ASN range."}, {"t": "Which TCP port does a BGP session use?", "o": ["22", "443", "179", "500"], "a": 2, "x": "BGP peers connect over TCP 179."}, {"t": "You have two links to the cloud and want your outbound traffic to prefer link A. Which attribute do you set?", "o": ["MED", "AS-path prepending", "Local preference", "Origin"], "a": 2, "x": "Local preference is set inside your AS and controls which exit you use for outbound traffic."}, {"t": "What does RPKI help prevent?", "o": ["Packet loss", "Unauthorised networks announcing your prefixes", "DNS spoofing", "MTU problems"], "a": 1, "x": "RPKI lets routers check that an ASN is authorised to originate a prefix."}], "lv": 2, "h": 5, "goal": "Read and reason about BGP, the protocol behind every hybrid cloud link.", "terms": ["autonomous system", "ASN", "eBGP", "iBGP", "prefix", "AS path", "local preference", "MED", "AS-path prepending", "peering", "transit", "IXP", "RPKI"]}, {"id": "m10", "t": "Cloud Foundations", "res": [["AWS shared responsibility model", "https://aws.amazon.com/compliance/shared-responsibility-model/"], ["Azure: shared responsibility in the cloud", "https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility"], ["Google Cloud: geography and regions", "https://cloud.google.com/docs/geography-and-regions"], ["OCI: regions and availability domains", "https://docs.oracle.com/en-us/iaas/Content/General/Concepts/regions.htm"]], "sum": ["You are always responsible for your network rules, identities and data.", "Spread workloads across zones (or OCI fault domains) for resilience.", "Data leaving the cloud, a zone or a region costs money; design for it.", "Organise accounts, subscriptions, projects or compartments before building networks."], "ls": [{"t": "Service models", "tag": "all", "blocks": [{"k": "p", "x": "Cloud services come in three broad models, depending on how much the provider manages for you."}, {"k": "ul", "x": ["**IaaS** (Infrastructure as a Service): you rent virtual machines, disks and networks. You manage the operating system, patches, middleware and applications. Examples: Amazon EC2, Azure Virtual Machines, Google Compute Engine, OCI Compute.", "**PaaS** (Platform as a Service): the provider runs the platform; you deploy code or data. Examples: managed databases (Amazon RDS, Azure SQL Database, Cloud SQL, Oracle Autonomous Database), Kubernetes services, serverless functions.", "**SaaS** (Software as a Service): finished applications such as Microsoft 365 or Salesforce."]}, {"k": "p", "x": "Networking skills matter most for IaaS and PaaS. Even fully managed PaaS services need networking decisions: should the database have a public endpoint or a private one inside your network? Which subnets can reach it?"}, {"k": "tip", "kind": "Tip", "x": "Prefer managed services where you can. Every server you do not run is one you do not have to patch, scale or secure at the OS level."}]}, {"t": "Shared responsibility", "tag": "all", "blocks": [{"k": "p", "x": "Security in the cloud is split between the provider and you."}, {"k": "p", "x": "The **provider** is responsible for security *of* the cloud: physical data centres, hardware, the global network, the hypervisor, and the managed parts of each service."}, {"k": "p", "x": "**You** are responsible for security *in* the cloud: who has access (identity and permissions), network rules (security groups, firewalls, public exposure), operating system patches on VMs, application code, and data protection (encryption, backups, classification)."}, {"k": "p", "x": "The line moves with the service model: with IaaS you own the OS; with PaaS the provider patches the platform, but you still own access, network exposure and data. You *never* hand over responsibility for identities and data."}, {"k": "tip", "kind": "Watch out", "x": "Most cloud security incidents are customer misconfigurations: storage buckets left public, databases with public IPs, SSH open to the world, leaked access keys. The provider's infrastructure is rarely the weak point."}]}, {"t": "Regions, zones and domains", "tag": "all", "blocks": [{"k": "p", "x": "A **region** is a geographic area with several data centres, such as AWS me-central-1 (UAE), Azure UAE North (Dubai), Google Cloud me-central1 (Doha) or OCI me-dubai-1. Choose regions for latency to users, data residency rules and service availability; not every service exists in every region."}, {"k": "p", "x": "Inside most regions are isolated failure areas:"}, {"k": "ul", "x": ["**AWS, Azure and Google Cloud**: **availability zones**, separate data centres with independent power, cooling and networking, connected by fast links (typically under 2 ms apart).", "**OCI**: **availability domains** (some regions have three, many have one) and, inside each, three **fault domains**, groupings of hardware that do not share single points of failure."]}, {"k": "p", "x": "To survive a data-centre failure, run at least two copies of each component in different zones (or OCI fault domains / availability domains), behind a load balancer. To survive a regional disaster, replicate to a second region."}, {"k": "ul", "x": ["Region = geography; zone/AD = data centre; fault domain = hardware group (OCI)", "Multi-zone for high availability; multi-region for disaster recovery"]}, {"k": "tip", "kind": "Tip", "x": "Zone names are mapped per account on AWS: your \"us-east-1a\" may be a different physical zone from someone else's. Use zone IDs (use1-az1) when coordinating across accounts."}]}, {"t": "The four providers at a glance", "tag": "all", "blocks": [{"k": "p", "x": "All four offer the same building blocks, but each has its own philosophy."}, {"k": "ul", "x": ["**AWS**: the largest catalogue and longest track record. Networks are built from many small, composable parts: VPC, subnets, route tables, gateways, Transit Gateway. Regional VPCs, subnets per zone.", "**Microsoft Azure**: deep integration with Microsoft Entra ID (identity), Windows and Microsoft 365. Strong hybrid story. Regional VNets with subnets that span zones; many services need their own dedicated subnet.", "**Google Cloud**: built on Google's private global backbone. A single **global VPC** can contain subnets in every region, and global load balancers use one anycast IP worldwide. Strong in data, analytics and Kubernetes (GKE).", "**Oracle Cloud Infrastructure (OCI)**: the natural home for Oracle Database and Exadata, with flat, predictable pricing and generous outbound data allowance. Regional VCNs with the Dynamic Routing Gateway as the hub."]}, {"k": "tip", "kind": "In the cloud", "x": "Use the Cloud Rosetta tab to translate service names between the four. The concepts are the same; the names and limits differ."}]}, {"t": "The cost of networking", "tag": "all", "blocks": [{"k": "p", "x": "Networking has its own line on the cloud bill, and it surprises many teams."}, {"k": "ul", "x": ["**Ingress** (data coming into the cloud from the Internet) is usually free.", "**Egress** (data going out to the Internet) is charged per GB on AWS, Azure and Google Cloud after a small free allowance. OCI includes 10 TB of outbound data per month free, which is much more generous.", "**Cross-zone** traffic is charged on some providers (for example, AWS charges for data between availability zones).", "**Cross-region** and inter-continental traffic costs more.", "**Managed network services** charge per hour and per GB: NAT gateways, load balancers, VPN gateways, Transit Gateway attachments, private endpoints, firewalls."]}, {"k": "p", "x": "Design habits that save money: keep chatty services in the same zone where resilience allows; use private endpoints or gateway endpoints for storage instead of routing through NAT; put a CDN in front of public content; and delete idle NAT gateways and load balancers in test environments."}, {"k": "tip", "kind": "Watch out", "x": "A NAT gateway left running in a lab costs money every hour even with no traffic. Always tear lab resources down."}]}, {"t": "Landing zones and resource organisation", "tag": "all", "blocks": [{"k": "p", "x": "Before building networks, decide how cloud resources are organised. This boundary controls billing, permissions, policy and blast radius."}, {"k": "ul", "x": ["**AWS**: **AWS Organizations** with many **accounts** (one per workload and environment), grouped into organizational units. **Service control policies (SCPs)** set guardrails. AWS Control Tower sets up a standard multi-account landing zone.", "**Azure**: **management groups** → **subscriptions** → **resource groups**. **Azure Policy** enforces rules. The Azure landing zone reference architecture is the standard pattern.", "**Google Cloud**: **organization** → **folders** → **projects**. **Organization policies** set constraints.", "**OCI**: a **tenancy** containing nested **compartments**. IAM policies are written against compartments."]}, {"k": "p", "x": "A **landing zone** is a pre-built, secure starting environment: account/subscription structure, identity, logging, central networking (hub), and guardrails. Networking teams typically own a shared \"network\" or \"connectivity\" account/subscription/project with the hub, VPN and private links."}, {"k": "tip", "kind": "Tip", "x": "Never put production and development in the same account, subscription or project. Separate boundaries make permissions, costs and incidents far easier to manage."}]}], "q": [{"t": "In the shared responsibility model, who configures security group rules?", "o": ["The provider", "The customer", "Both equally", "The ISP"], "a": 1, "x": "Everything you configure is your responsibility."}, {"t": "Which traffic is usually free?", "o": ["Internet egress", "Cross-region", "Inbound from the Internet", "NAT processing"], "a": 2, "x": "Ingress is generally free; egress and processing are billed."}, {"t": "On OCI, what is the hardware grouping inside an availability domain that you spread instances across?", "o": ["Zone", "Rack set", "Fault domain", "Compartment"], "a": 2, "x": "Each OCI availability domain has three fault domains."}, {"t": "Which provider's VPC can contain subnets in every region by default?", "o": ["AWS", "Azure", "Google Cloud", "OCI"], "a": 2, "x": "Google Cloud VPCs are global resources with regional subnets."}, {"t": "Which is the best way to protect production from mistakes made in development?", "o": ["Use different subnets in the same account", "Use naming conventions", "Use separate accounts, subscriptions or projects", "Use different regions"], "a": 2, "x": "Separate top-level boundaries isolate permissions, policies, billing and blast radius."}], "lv": 3, "h": 4, "goal": "Speak the shared language of all four providers.", "terms": ["IaaS", "PaaS", "SaaS", "shared responsibility", "region", "availability zone", "availability domain", "fault domain", "egress", "landing zone"]}, {"id": "m11", "t": "Cloud Identity & Access", "res": [["AWS IAM best practices", "https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html"], ["Azure RBAC overview", "https://learn.microsoft.com/en-us/azure/role-based-access-control/overview"], ["Google Cloud IAM overview", "https://cloud.google.com/iam/docs/overview"], ["OCI IAM policies", "https://docs.oracle.com/en-us/iaas/Content/Identity/Concepts/policygetstarted.htm"]], "sum": ["Identity is the real perimeter in the cloud; protect it with MFA and least privilege.", "Workloads should use roles, managed identities or service accounts, never stored keys.", "Permissions are inherited down the hierarchy; grant at the lowest level that works.", "Separate network administration from application administration."], "ls": [{"t": "IAM principles", "tag": "all", "blocks": [{"k": "p", "x": "Every cloud request answers three questions:"}, {"k": "ul", "x": ["**Authentication**: who are you? (password plus MFA, a certificate, a federated login, a workload token)", "**Authorization**: what are you allowed to do? (policies and roles)", "**Audit**: what did you do? (AWS CloudTrail, Azure Activity Log, Google Cloud Audit Logs, OCI Audit)"]}, {"k": "p", "x": "Core practices are the same everywhere:"}, {"k": "ul", "x": ["**Least privilege**: give only the permissions needed for the task", "**MFA** for every human, especially administrators", "**No long-lived keys**: workloads get temporary credentials from roles or managed identities", "**Federation**: log in with your company identity (Microsoft Entra ID, Okta, Google Workspace) via single sign-on rather than separate cloud users", "**Separation of duties**: network admins, security admins and developers get different roles"]}, {"k": "tip", "kind": "Watch out", "x": "The root/owner account of a cloud tenancy should have MFA, no access keys, and be used almost never. Lock it away."}]}, {"t": "AWS IAM", "tag": "aws", "blocks": [{"k": "p", "x": "AWS IAM has **users** (people or legacy apps), **groups** of users, and **roles**, identities without permanent credentials that can be *assumed* to get temporary credentials. Permissions are written in **JSON policies** that allow or deny actions on resources."}, {"k": "code", "t": "An AWS policy allowing read-only access to VPC configuration", "x": "{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [{\n    \"Effect\": \"Allow\",\n    \"Action\": [\"ec2:Describe*\"],\n    \"Resource\": \"*\"\n  }]\n}"}, {"k": "p", "x": "EC2 instances, Lambda functions and containers get permissions through an attached role (an **instance profile** for EC2). Humans should sign in through **IAM Identity Center** with single sign-on. Across many accounts, **service control policies (SCPs)** in AWS Organizations set maximum permissions; for example, \"nobody may delete VPC flow logs\" or \"only these regions may be used\"."}, {"k": "p", "x": "Useful managed policies for networking: **NetworkAdministrator** (job function) and **AmazonVPCReadOnlyAccess**."}, {"k": "tip", "kind": "Tip", "x": "An explicit Deny always wins over any Allow in AWS. Use SCP denies for guardrails that must never be bypassed."}]}, {"t": "Microsoft Entra ID and Azure RBAC", "tag": "az", "blocks": [{"k": "p", "x": "Azure identities live in **Microsoft Entra ID** (formerly Azure Active Directory): users, groups, and **service principals** for applications. Access to Azure resources is controlled by **Azure RBAC**: you assign a **role** to a **principal** at a **scope**."}, {"k": "p", "x": "Scopes form a hierarchy, and assignments inherit downwards: **management group → subscription → resource group → resource**. A Network Contributor assignment on a resource group applies to every network resource in it."}, {"k": "p", "x": "Built-in roles you will use: **Owner** (everything, including granting access), **Contributor** (everything except granting access), **Reader**, and **Network Contributor** (manage networks but not VMs or data)."}, {"k": "p", "x": "For workloads, use **managed identities**: Azure creates and rotates the credentials automatically. A VM or function with a managed identity can call other Azure services with no secrets in code."}, {"k": "code", "t": "Grant Network Contributor on one resource group (Azure CLI)", "x": "az role assignment create \\\n  --assignee netops@contoso.com \\\n  --role \"Network Contributor\" \\\n  --scope /subscriptions/<sub-id>/resourceGroups/rg-network-prod"}, {"k": "tip", "kind": "Tip", "x": "Use **Privileged Identity Management (PIM)** so administrators activate high-privilege roles only when needed, for a limited time, with approval."}]}, {"t": "Google Cloud IAM", "tag": "gcp", "blocks": [{"k": "p", "x": "In Google Cloud, you grant **roles** to **principals** (Google accounts, groups, service accounts, or federated identities) on a **resource**. The resource hierarchy is **organization → folders → projects → resources**, and permissions granted higher up are inherited below."}, {"k": "p", "x": "Roles come in three kinds: **basic** (Owner, Editor, Viewer; too broad for production), **predefined** (such as `roles/compute.networkAdmin`, `roles/compute.securityAdmin`, `roles/compute.networkViewer`) and **custom**."}, {"k": "p", "x": "**Service accounts** represent workloads. Attach one to a VM or GKE workload and the code gets credentials automatically. Avoid downloading service account keys; use **Workload Identity Federation** for workloads outside Google Cloud."}, {"k": "code", "t": "Grant network admin on a project (gcloud)", "x": "gcloud projects add-iam-policy-binding my-net-project \\\n  --member=\"group:netops@example.com\" \\\n  --role=\"roles/compute.networkAdmin\""}, {"k": "tip", "kind": "In the cloud", "x": "Google Cloud firewall rules can target VMs by **service account**, which is stronger than network tags, because changing a VM's service account requires IAM permission."}]}, {"t": "OCI IAM", "tag": "oci", "blocks": [{"k": "p", "x": "OCI organises resources in **compartments** inside a **tenancy**. Compartments can be nested, and policies apply to a compartment and everything below it. Identities live in **identity domains**: users, groups and **dynamic groups** (which match instances or functions by rules, so workloads can call OCI APIs without keys)."}, {"k": "p", "x": "OCI policies are written in readable sentences:"}, {"k": "code", "t": "Example OCI policies", "x": "Allow group NetAdmins to manage virtual-network-family in compartment Network\nAllow group AppTeam to use virtual-network-family in compartment Apps\nAllow group AppTeam to manage instance-family in compartment Apps\nAllow dynamic-group AppServers to read objects in compartment Data"}, {"k": "p", "x": "The verbs go from weakest to strongest: **inspect** (list), **read**, **use** (work with existing resources, such as attaching a VNIC to a subnet), **manage** (everything including create and delete). `virtual-network-family` covers VCNs, subnets, gateways, route tables and security lists."}, {"k": "tip", "kind": "Tip", "x": "A common OCI pattern: the network team *manages* the network in a shared compartment, and application teams get *use* permission so they can place instances in subnets without changing the network."}]}, {"t": "Separating network and application duties", "tag": "all", "blocks": [{"k": "p", "x": "In larger organisations, the network is a shared platform and should be protected from accidental changes by application teams. The same pattern exists in every cloud:"}, {"k": "ul", "x": ["**AWS**: a central network account owns VPCs and shares subnets to application accounts with **AWS Resource Access Manager (RAM)**. App teams launch resources into shared subnets but cannot change route tables or gateways.", "**Azure**: the hub VNet and firewall sit in a connectivity subscription owned by the platform team. App teams own spoke VNets but Azure Policy prevents risky changes (like adding public IPs).", "**Google Cloud**: **Shared VPC**: a host project owns the network; service projects attach to it. Granting `roles/compute.networkUser` on specific subnets lets app teams use them without managing them.", "**OCI**: the network in a dedicated compartment; app teams get `use virtual-network-family`."]}, {"k": "tip", "kind": "Tip", "x": "Combine this with guardrail policies (SCPs, Azure Policy, organization policies) such as \"no public IPs on VMs\" and \"flow logs must stay enabled\"."}]}], "q": [{"t": "Which OCI construct groups resources for policy and isolation?", "o": ["Resource group", "Compartment", "Project", "Account"], "a": 1, "x": "OCI policies are written against compartments."}, {"t": "Which Azure built-in role manages networks but not VMs?", "o": ["Owner", "Contributor", "Network Contributor", "Reader"], "a": 2, "x": "Network Contributor is scoped to networking resources."}, {"t": "What is the recommended way for an AWS EC2 instance to get permissions to call AWS APIs?", "o": ["Store an access key in a config file", "Use the root user's keys", "Attach an IAM role through an instance profile", "Use a shared IAM user"], "a": 2, "x": "Roles give temporary, automatically rotated credentials with no secrets on disk."}, {"t": "In Google Cloud, how can application teams deploy into a centrally managed network?", "o": ["VPC peering", "Shared VPC with the network user role on chosen subnets", "Giving them Owner on the host project", "Copying the network into each project"], "a": 1, "x": "Shared VPC lets service projects use subnets of a host project without managing it."}, {"t": "In AWS, if one policy allows an action and another explicitly denies it, what happens?", "o": ["The allow wins", "The explicit deny wins", "The most recent policy wins", "It depends on the region"], "a": 1, "x": "An explicit Deny always overrides any Allow."}], "lv": 3, "h": 4, "goal": "Control who can change your networks in every cloud.", "terms": ["authentication", "authorization", "least privilege", "MFA", "role", "policy", "RBAC", "managed identity", "service account", "compartment", "SCP"]}, {"id": "m12", "t": "Virtual Networks Across Clouds", "res": [["AWS VPC", "https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html"], ["Azure Virtual Network", "https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-overview"], ["Google Cloud VPC", "https://cloud.google.com/vpc/docs/overview"], ["OCI Networking", "https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/overview.htm"]], "sum": ["VPC, VNet, VCN and Google VPC are the same idea: your private network in the cloud.", "Scope differs: AWS subnets are per zone; Azure, Google Cloud and OCI subnets are regional.", "Public vs private is decided by routing (and, on OCI, by the subnet setting).", "Every cloud filters at the instance level; AWS and OCI also filter at the subnet level."], "ls": [{"t": "The virtual network", "tag": "all", "blocks": [{"k": "p", "x": "In every cloud you start by creating a private, isolated network and giving it one or more address ranges from RFC 1918. Then you divide it into **subnets**, attach **route tables**, add **gateways** for Internet or on-premises access, and apply **security rules**."}, {"k": "ul", "x": ["**AWS**: **VPC** (Virtual Private Cloud). Primary CIDR between /16 and /28, plus up to four secondary CIDRs by default.", "**Azure**: **VNet** (Virtual Network). One or more address spaces; you can add more later.", "**Google Cloud**: **VPC network**. The network itself has no CIDR; each subnet has its own primary range, plus optional secondary ranges (used by GKE).", "**OCI**: **VCN** (Virtual Cloud Network). One or more CIDR blocks (/16 to /30 each)."]}, {"k": "p", "x": "Under the hood these are software-defined networks: there are no real switches or VLANs you can see. The provider's virtual network delivers packets between your VMs, enforces your rules and answers ARP and DHCP on behalf of the network."}, {"k": "tip", "kind": "Tip", "x": "Before creating any network, take its range from your address plan (Module 03). Changing the range of a live network is difficult or impossible."}]}, {"t": "Scope differences", "tag": "all", "blocks": [{"k": "p", "x": "The biggest structural differences between providers are about *where* things live."}, {"k": "ul", "x": ["**AWS**: the VPC is regional. Each **subnet lives in exactly one availability zone**. For a three-zone design you create three public and three private subnets.", "**Azure**: the VNet is regional. **Subnets span all zones** in the region; you choose the zone per VM or service, not per subnet.", "**Google Cloud**: the **VPC is global**. **Subnets are regional** and span all zones in that region. VMs in different regions of the same VPC talk over internal IPs with no peering.", "**OCI**: the VCN is regional. **Subnets are regional** (recommended) or tied to a single availability domain."]}, {"k": "p", "x": "This changes how you design. On AWS, the number of subnets multiplies by the number of zones. On Azure, Google Cloud and OCI, one subnet per tier is often enough, and resilience comes from placing instances in different zones or fault domains."}, {"k": "tip", "kind": "Watch out", "x": "On AWS, if all your private subnets route to a NAT gateway in one zone and that zone fails, every zone loses Internet access. Use one NAT gateway per zone for production."}]}, {"t": "Routing in the cloud", "tag": "all", "blocks": [{"k": "p", "x": "Every virtual network automatically routes traffic between its own subnets (the **local** route). You add routes for everything else."}, {"k": "ul", "x": ["**AWS**: route tables are associated with subnets. A subnet is \"public\" only because its route table sends `0.0.0.0/0` to an **Internet gateway**; a \"private\" subnet sends it to a **NAT gateway** (or has no default route).", "**Azure**: **system routes** are created automatically, including a default route to the Internet. You override them with **user-defined routes (UDRs)** in route tables attached to subnets, for example sending `0.0.0.0/0` to Azure Firewall.", "**Google Cloud**: routes belong to the VPC network, not to subnets. There is a default route to the Internet gateway, and custom static routes can apply to all instances or only to instances with a given **network tag**, with priorities.", "**OCI**: **route tables** are attached to subnets, with rules pointing to an Internet gateway, NAT gateway, service gateway, DRG or a private IP (for a firewall appliance)."]}, {"k": "code", "t": "The same \"private subnet\" in each cloud", "x": "AWS:   private-rt: 0.0.0.0/0 → nat-gateway (in a public subnet)\nAzure: UDR on subnet: 0.0.0.0/0 → Azure Firewall private IP (or attach a NAT Gateway resource to the subnet)\nGCP:   VMs without external IPs + Cloud Router + Cloud NAT for the region\nOCI:   private subnet route table: 0.0.0.0/0 → NAT gateway; Oracle services → service gateway"}, {"k": "tip", "kind": "Tip", "x": "When something can't reach a destination, read the effective routes. Azure shows them per network interface (\"Effective routes\"); AWS Reachability Analyzer, Google Connectivity Tests and OCI Network Path Analyzer evaluate routes for you."}]}, {"t": "Filtering in the cloud", "tag": "all", "blocks": [{"k": "p", "x": "Each cloud filters traffic, but in different places."}, {"k": "ul", "x": ["**AWS**: **security groups** on network interfaces (stateful, allow-only, can reference other security groups) and **network ACLs** on subnets (stateless, numbered allow and deny rules).", "**Azure**: **network security groups (NSGs)** with priority-ordered allow and deny rules (stateful), attached to subnets, NICs, or both. **Application security groups** let rules target VMs by role.", "**Google Cloud**: **VPC firewall rules** and **firewall policies** (stateful), applied to the network and targeting instances by tag, service account or all instances. Every VPC has implied rules: allow all egress and deny all ingress.", "**OCI**: **security lists** on subnets and **network security groups** on VNICs. Rules are stateful by default; stateless is optional."]}, {"k": "code", "t": "\"Database only reachable from the app tier\", four ways", "x": "AWS:   sg-db inbound: TCP 5432 from sg-app\nAzure: NSG rule: allow TCP 5432 from ASG app-servers to ASG db-servers\nGCP:   firewall: allow tcp:5432 from service account app-sa to target service account db-sa\nOCI:   nsg-db ingress: TCP 5432 from source NSG nsg-app"}, {"k": "tip", "kind": "Watch out", "x": "If both a subnet-level and an instance-level filter apply (AWS NACL + security group, Azure subnet NSG + NIC NSG, OCI security list + NSG), traffic must be allowed by **both**."}]}, {"t": "Public IPs and Internet exposure", "tag": "all", "blocks": [{"k": "p", "x": "A resource can only be reached from the Internet if it has a public address (or sits behind something that does, like a load balancer) **and** routing and security rules allow it."}, {"k": "ul", "x": ["**AWS**: public IPv4 addresses (auto-assigned or **Elastic IPs**) on instances in subnets with an Internet gateway route. AWS charges for public IPv4 addresses.", "**Azure**: **public IP address** resources attached to NICs, load balancers or gateways. VMs without a public IP can still reach the Internet through a NAT gateway or firewall; Azure is retiring \"default outbound access\" for new VNets, so plan explicit egress.", "**Google Cloud**: **external IP addresses** (ephemeral or static) on VM interfaces.", "**OCI**: **public IPs** (ephemeral or reserved) on VNICs, only in **public subnets**. A subnet's public/private setting is fixed at creation."]}, {"k": "p", "x": "Best practice is the same everywhere: application and database servers have **no public IPs**. Only load balancers, NAT gateways, VPN gateways and (if needed) bastions face the Internet."}, {"k": "tip", "kind": "Tip", "x": "Use guardrail policies to block public IPs on VMs (AWS SCPs, Azure Policy, Google Cloud organization policy `compute.vmExternalIpAccess`, OCI security zones)."}]}, {"t": "Reference design: a three-tier network", "tag": "all", "blocks": [{"k": "p", "x": "Here is one design, used for the rest of the course, mapped to each provider."}, {"k": "ol", "x": ["**Public tier**: L7 load balancer with WAF, NAT gateway(s). The only Internet-facing parts.", "**App tier**: application servers or containers in private subnets, reachable only from the load balancer.", "**Data tier**: managed database with a private endpoint, reachable only from the app tier.", "**Admin access**: managed, identity-based access (Session Manager, Azure Bastion, IAP, OCI Bastion), never open SSH/RDP.", "**Logging**: flow logs enabled on the network."]}, {"k": "code", "t": "Mapping summary", "x": "              AWS                      Azure                         Google Cloud                OCI\nNetwork       VPC                      VNet                          VPC (global)                VCN\nPublic tier   ALB + WAF, NAT GW/AZ     App Gateway + WAF, NAT GW     Global ALB + Cloud Armor    LB + WAF, NAT GW\nApp tier      private subnet per AZ    snet-app (zone-redundant)     regional subnet             private regional subnet\nData tier     RDS in private subnets   Private Endpoint to Azure SQL Cloud SQL private IP / PSC   Autonomous DB private endpoint\nFiltering     SGs (+NACLs)             NSGs + ASGs                   firewall rules/policies     NSGs (+security lists)"}, {"k": "tip", "kind": "Tip", "x": "Draw this design for your own app before touching a console. Every deep-dive module in Level 4 builds this exact design on one provider."}]}], "q": [{"t": "Which provider VPC is global by default?", "o": ["AWS", "Azure", "Google Cloud", "OCI"], "a": 2, "x": "A Google Cloud VPC spans all regions; its subnets are regional."}, {"t": "In AWS, a subnet lives in…", "o": ["A region", "An availability zone", "A peering connection", "An edge location"], "a": 1, "x": "Each AWS subnet maps to exactly one AZ."}, {"t": "What makes an AWS subnet \"public\"?", "o": ["A checkbox on the subnet", "A route table entry sending 0.0.0.0/0 to an Internet gateway", "Having a NAT gateway", "Its CIDR range"], "a": 1, "x": "Public is a routing property: a default route to the Internet gateway."}, {"t": "An AWS NACL allows traffic but the instance's security group does not. What happens?", "o": ["Traffic is allowed", "Traffic is blocked", "Only replies are allowed", "It depends on the port"], "a": 1, "x": "Traffic must pass both the subnet filter and the instance filter."}, {"t": "On OCI, when is a subnet's public or private setting chosen?", "o": ["Any time, in the console", "When the subnet is created; it can't be changed later", "When the first instance launches", "When a route table is attached"], "a": 1, "x": "OCI fixes public/private at subnet creation, so plan it up front."}], "lv": 3, "h": 5, "goal": "Map one network design onto all four providers.", "terms": ["VPC", "VNet", "VCN", "subnet", "regional subnet", "route table", "Internet gateway", "NAT gateway", "security group", "NSG", "firewall rule", "security list"]}, {"id": "m13", "t": "AWS Networking", "res": [["Amazon VPC User Guide", "https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html"], ["AWS Transit Gateway", "https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html"], ["AWS PrivateLink", "https://docs.aws.amazon.com/vpc/latest/privatelink/what-is-privatelink.html"], ["Elastic Load Balancing", "https://docs.aws.amazon.com/elasticloadbalancing/latest/userguide/what-is-load-balancing.html"], ["AWS Direct Connect", "https://docs.aws.amazon.com/directconnect/latest/UserGuide/Welcome.html"]], "sum": ["Build one subnet per tier per AZ; route public subnets to an IGW and private ones to a NAT gateway per AZ.", "Security groups (stateful, reference each other) are the main control; NACLs are a coarse backstop.", "Use Transit Gateway or Cloud WAN once you have more than a handful of VPCs.", "Keep AWS service traffic private with gateway and interface endpoints."], "ls": [{"t": "VPC and subnets", "tag": null, "blocks": [{"k": "p", "x": "A **VPC** is a regional, isolated network. You give it a primary IPv4 CIDR (between /16 and /28) and optionally secondary CIDRs and an IPv6 /56. Inside it you create **subnets**, each in exactly one **availability zone**."}, {"k": "p", "x": "A standard production layout uses three AZs and three tiers, so nine subnets:"}, {"k": "code", "t": "Production VPC 10.10.0.0/16 across three AZs", "x": "public-a   10.10.0.0/24    public-b   10.10.1.0/24    public-c   10.10.2.0/24\napp-a      10.10.16.0/20   app-b      10.10.32.0/20   app-c      10.10.48.0/20\ndata-a     10.10.64.0/24   data-b     10.10.65.0/24   data-c     10.10.66.0/24"}, {"k": "p", "x": "Gateways and route tables make the tiers behave differently:"}, {"k": "ul", "x": ["**Internet gateway (IGW)**: one per VPC, horizontally scaled, free. Public subnets route `0.0.0.0/0 → igw-…`.", "**NAT gateway**: lives in a public subnet with an **Elastic IP**, gives private subnets outbound-only Internet access. It is zonal, so create **one per AZ** and point each private subnet's route table at the NAT gateway in its own AZ.", "**Egress-only Internet gateway**: the IPv6 equivalent of NAT (outbound only)."]}, {"k": "p", "x": "Every VPC also has a built-in DNS resolver at the VPC base address plus two (for 10.10.0.0/16 that is 10.10.0.2), and the instance metadata service at 169.254.169.254."}, {"k": "tip", "kind": "Tip", "x": "Make app subnets large (/20 or bigger). Containers on EKS with the VPC CNI and Lambda functions in a VPC consume IP addresses quickly."}]}, {"t": "Security groups vs network ACLs", "tag": null, "blocks": [{"k": "p", "x": "**Security groups (SGs)** attach to network interfaces (ENIs). They are **stateful** and contain only **allow** rules; anything not allowed is denied. Their superpower is that a rule's source can be **another security group**: \"allow 5432 from sg-app\" keeps working however many app instances exist and whatever their IPs."}, {"k": "p", "x": "**Network ACLs (NACLs)** attach to subnets. They are **stateless**, have numbered **allow and deny** rules evaluated lowest number first, and end with an implicit deny. Because they are stateless, you need rules for return traffic on ephemeral ports."}, {"k": "code", "t": "A three-tier security group design", "x": "sg-alb   inbound: TCP 443 from 0.0.0.0/0 (and ::/0)\nsg-app   inbound: TCP 8080 from sg-alb\nsg-db    inbound: TCP 5432 from sg-app\n(no inbound SSH anywhere; use Systems Manager Session Manager)"}, {"k": "p", "x": "Use security groups as your main control. Use NACLs sparingly, for coarse subnet-wide rules such as blocking a known bad range, or as a guardrail that a database subnet can never accept traffic from public subnets."}, {"k": "tip", "kind": "Watch out", "x": "The default NACL allows everything. A custom NACL starts by denying everything, including return traffic. If you add one, test both directions."}]}, {"t": "Connecting VPCs: peering, Transit Gateway and Cloud WAN", "tag": null, "blocks": [{"k": "p", "x": "**VPC peering** connects two VPCs (same or different account, same or different region) privately. It is simple and has no hourly charge, but it is **non-transitive**: if A peers with B and B with C, A cannot reach C through B. CIDRs must not overlap. Full mesh peering of 10 VPCs needs 45 connections, each with route table entries."}, {"k": "p", "x": "**AWS Transit Gateway (TGW)** is a regional, managed hub router. You attach VPCs, VPN connections, Direct Connect gateways and peering connections to other TGWs. TGW has its own **route tables**, so you can segment traffic: for example, production and development VPCs both reach shared services but not each other. It is billed per attachment-hour and per GB."}, {"k": "p", "x": "**AWS Cloud WAN** builds a global network from a central **policy**: you define segments (prod, dev, shared) and which attachments join which segment, and AWS builds the TGW-like core across regions for you."}, {"k": "code", "t": "Transit Gateway segmentation example", "x": "TGW route table \"prod\":    routes to prod VPCs + shared-services + on-prem\nTGW route table \"dev\":     routes to dev VPCs + shared-services\nTGW route table \"shared\":  routes to everything\nAttach each VPC to the table matching its environment."}, {"k": "tip", "kind": "Tip", "x": "Rough guide: peering for 2–5 VPCs, Transit Gateway for more or for hybrid hubs, Cloud WAN for multi-region networks managed as policy."}]}, {"t": "Private access to services", "tag": null, "blocks": [{"k": "p", "x": "By default, an instance in a private subnet reaching Amazon S3 or another AWS API goes out through the NAT gateway and over public endpoints. **VPC endpoints** keep that traffic inside AWS, improve security and often save NAT costs."}, {"k": "ul", "x": ["**Gateway endpoints** (S3 and DynamoDB only) add a route to the subnet route tables using a managed prefix list. They are **free**.", "**Interface endpoints** (powered by **AWS PrivateLink**) place an ENI with a private IP in your subnets for a specific service (STS, ECR, Secrets Manager, CloudWatch, and hundreds more). Private DNS makes the normal service hostname resolve to that private IP. They are billed per hour per AZ and per GB."]}, {"k": "p", "x": "**Endpoint policies** restrict what can be done through the endpoint, for example \"only these S3 buckets\", which helps prevent data exfiltration."}, {"k": "p", "x": "PrivateLink also lets you publish **your own** service: put it behind an NLB, create an **endpoint service**, and consumers in other VPCs or accounts create interface endpoints to it. Address ranges can overlap, because only the endpoint IP is exposed."}, {"k": "p", "x": "**VPC Lattice** is a newer application-networking service that connects services across VPCs and accounts at the application layer, with built-in auth policies."}, {"k": "tip", "kind": "Tip", "x": "Always add the S3 gateway endpoint to every VPC. It costs nothing and removes S3 traffic from the NAT gateway bill."}]}, {"t": "DNS with Route 53", "tag": null, "blocks": [{"k": "p", "x": "**Amazon Route 53** provides DNS in several roles:"}, {"k": "ul", "x": ["**Public hosted zones** for your Internet domains.", "**Private hosted zones** associated with one or more VPCs, for internal names like `db.prod.internal`.", "**Route 53 Resolver**: the VPC's built-in resolver. **Inbound endpoints** let on-premises DNS servers resolve your private zones; **outbound endpoints** with **forwarding rules** let VPCs resolve on-premises zones (such as `corp.example.com`).", "**Resolver DNS Firewall**: block or allow domain lookups from your VPCs."]}, {"k": "p", "x": "Routing policies decide which answer each user gets: **simple**, **weighted** (canary releases), **latency-based** (nearest region), **failover** (with health checks), **geolocation**, **geoproximity**, **multivalue** and **IP-based**."}, {"k": "p", "x": "**Alias records** point a name (including the zone apex) at AWS resources such as an ALB, CloudFront distribution or S3 website, with no extra query cost."}, {"k": "tip", "kind": "In the cloud", "x": "Resolver endpoints are the standard way to make DNS work across hybrid and multi-account networks; share forwarding rules to other accounts with AWS RAM."}]}, {"t": "Load balancing and edge services", "tag": null, "blocks": [{"k": "p", "x": "**Elastic Load Balancing** offers three types:"}, {"k": "ul", "x": ["**Application Load Balancer (ALB)**: L7 HTTP/HTTPS/gRPC. Host, path, header and query routing; redirects; authentication with OIDC or Amazon Cognito; integrates with **AWS WAF**. Targets can be instances, IPs or Lambda functions.", "**Network Load Balancer (NLB)**: L4 TCP/UDP/TLS. Very high throughput, a static IP per AZ (or your Elastic IPs), preserves client IP, can sit in front of PrivateLink services.", "**Gateway Load Balancer (GWLB)**: inserts third-party virtual appliances (firewalls, IDS) transparently using GENEVE encapsulation, with **GWLB endpoints** as route targets."]}, {"k": "p", "x": "At the edge: **Amazon CloudFront** (CDN with edge TLS, caching and WAF), **AWS Global Accelerator** (two static anycast IPs routing users over the AWS backbone to the closest healthy regional endpoint), **AWS Shield** (DDoS protection; Advanced adds response team support and cost protection)."}, {"k": "tip", "kind": "Tip", "x": "Put internet-facing ALBs in public subnets and their targets in private subnets. Targets need no public IPs; the ALB reaches them over private addresses."}]}, {"t": "Hybrid connectivity on AWS", "tag": null, "blocks": [{"k": "p", "x": "**AWS Site-to-Site VPN** creates two IPsec tunnels (in different AZs) from a **virtual private gateway** or **Transit Gateway** to your customer gateway device. Each tunnel supports up to 1.25 Gbps; with Transit Gateway and ECMP you can spread traffic over many tunnels. Use BGP for automatic failover."}, {"k": "p", "x": "**AWS Direct Connect (DX)** gives a private, dedicated connection from your router at a DX location to AWS:"}, {"k": "ul", "x": ["**Dedicated connections** of 1, 10, 100 or 400 Gbps, or **hosted connections** from a partner (from 50 Mbps upwards).", "**Virtual interfaces (VIFs)**: **private VIF** to a VPC (via virtual private gateway or Direct Connect gateway), **transit VIF** to Transit Gateways via a Direct Connect gateway, **public VIF** to AWS public services.", "A **Direct Connect gateway** is a global object that lets one connection reach VPCs and TGWs in many regions.", "**MACsec** encryption is available on many dedicated connections."]}, {"k": "p", "x": "For production, AWS recommends **maximum resiliency**: connections at two DX locations, two devices at each. A common budget design is one DX connection plus Site-to-Site VPN as backup."}, {"k": "tip", "kind": "Watch out", "x": "A private VIF accepts a limited number of prefixes from you (100 by default). Advertising more drops the BGP session; summarise your on-premises routes."}]}, {"t": "Operating and troubleshooting AWS networks", "tag": null, "blocks": [{"k": "p", "x": "AWS gives you several tools that save hours:"}, {"k": "ul", "x": ["**VPC Flow Logs**: metadata for every accepted and rejected flow at VPC, subnet or ENI level, sent to CloudWatch Logs, S3 or Firehose. A `REJECT` tells you a security group or NACL dropped the traffic.", "**Reachability Analyzer**: picks a source and destination and analyses route tables, SGs, NACLs and gateways, then tells you exactly which component blocks the path, without sending packets.", "**Network Access Analyzer**: finds unintended access, such as \"any path from the Internet to a database subnet\".", "**Traffic Mirroring**: copies packets from an ENI to a monitoring appliance for deep inspection.", "**AWS Network Firewall**: managed stateful firewall with Suricata-compatible rules and domain filtering, deployed into dedicated subnets."]}, {"k": "code", "t": "A flow log record, decoded", "x": "2 123456789012 eni-0a1b2c 10.10.16.25 10.10.64.10 49152 5432 6 10 840 1700000000 1700000060 REJECT OK\n          (version account interface src dst srcport dstport proto packets bytes start end action status)\n→ App server 10.10.16.25 tried PostgreSQL on 10.10.64.10 and was REJECTED: check sg-db and the data subnet NACL."}, {"k": "tip", "kind": "Tip", "x": "Run Reachability Analyzer before opening a support case. It names the exact security group, NACL or route that blocks traffic."}]}], "q": [{"t": "Which AWS control is stateless?", "o": ["Security group", "Network ACL", "PrivateLink", "Route 53 Resolver"], "a": 1, "x": "NACLs need explicit rules for return traffic."}, {"t": "VPC A peers with B and B peers with C. Can A reach C through B?", "o": ["Yes", "No", "Only with NAT", "Only over IPv6"], "a": 1, "x": "Peering is non-transitive. Use Transit Gateway or a direct peering."}, {"t": "Why should production VPCs have one NAT gateway per availability zone?", "o": ["NAT gateways are free", "A NAT gateway is zonal; if its AZ fails, private subnets in other AZs lose Internet access", "AWS requires it", "It doubles bandwidth for each instance"], "a": 1, "x": "Keep each AZ's egress independent so one AZ failure doesn't spread."}, {"t": "Which endpoint type is free and supports only S3 and DynamoDB?", "o": ["Interface endpoint", "Gateway endpoint", "Gateway
