 under management without recreating them.", "**Refactoring**: `moved` blocks rename resources or move them into modules without destroying them.", "**Upgrades**: pin provider versions, upgrade them deliberately, and read the changelogs."]}, {"k": "code", "t": "Bring an existing VPC under Terraform", "x": "import {\n  to = aws_vpc.legacy\n  id = \"vpc-0abc123def4567890\"\n}\nresource \"aws_vpc\" \"legacy\" {\n  cidr_block = \"10.9.0.0/16\"\n}\n# terraform plan -generate-config-out=generated.tf can draft the resource block for you"}, {"k": "tip", "kind": "Tip", "x": "Start small: put one non-critical network under Terraform, practise plan/apply/import, then expand."}]}], "q": [{"t": "Which command shows changes without applying them?", "o": ["terraform init", "terraform plan", "terraform apply", "terraform fmt"], "a": 1, "x": "plan previews; apply executes."}, {"t": "Which OCI service runs Terraform for you?", "o": ["Resource Manager", "Cloud Shell", "DevOps", "Bastion"], "a": 0, "x": "OCI Resource Manager is managed Terraform."}, {"t": "Why must Terraform state be stored remotely with locking?", "o": ["To make plans faster", "So team members share one source of truth and two runs can't corrupt it at once", "Because providers require it", "To encrypt the code"], "a": 1, "x": "Locking prevents concurrent applies; remote storage gives everyone the same state."}, {"t": "A plan shows a production subnet \"must be replaced\". What should you do?", "o": ["Apply quickly before anyone notices", "Stop and review: replacement deletes the subnet and everything in it", "Ignore it; subnets are recreated without impact", "Run terraform fmt"], "a": 1, "x": "Replacing network resources is destructive; change the approach or plan a migration."}, {"t": "Which Terraform feature brings an existing, hand-made resource under management?", "o": ["moved block", "import block", "output block", "backend block"], "a": 1, "x": "import blocks attach existing resources to Terraform state without recreating them."}], "lv": 5, "h": 7, "goal": "Define every network in reviewable, repeatable code.", "terms": ["IaC", "Terraform", "HCL", "provider", "resource", "module", "state", "plan", "apply", "drift", "Bicep", "CloudFormation", "policy as code", "CI/CD"]}, {"id": "m21", "t": "Kubernetes & Container Networking", "res": [["Kubernetes: services and networking", "https://kubernetes.io/docs/concepts/services-networking/"], ["Amazon EKS networking", "https://docs.aws.amazon.com/eks/latest/best-practices/networking.html"], ["AKS networking concepts", "https://learn.microsoft.com/en-us/azure/aks/concepts-network"], ["GKE networking overview", "https://cloud.google.com/kubernetes-engine/docs/concepts/network-overview"], ["OKE pod networking", "https://docs.oracle.com/en-us/iaas/Content/ContEng/Concepts/contengpodnetworking.htm"]], "sum": ["Every pod gets an IP and can reach every other pod; a CNI plugin makes it happen.", "Services give pods stable addresses; Ingress or Gateway API handles HTTP routing.", "VPC-native pod networking consumes many cloud IPs; plan ranges early.", "Default-deny NetworkPolicies are essential, and only work with a policy-capable CNI."], "ls": [{"t": "The Kubernetes network model", "tag": "all", "blocks": [{"k": "p", "x": "Kubernetes defines simple rules for networking:"}, {"k": "ul", "x": ["Every **pod** gets its own IP address.", "Every pod can reach every other pod on any node **without NAT**.", "Agents on a node (such as the kubelet) can reach all pods on that node."]}, {"k": "p", "x": "Kubernetes itself does not implement this. A **CNI plugin** (Container Network Interface) does. There are two broad approaches:"}, {"k": "ul", "x": ["**Overlay** (such as Flannel VXLAN, Calico in overlay mode, Azure CNI Overlay): pods get addresses from a private range that the cloud network doesn't know about; traffic between nodes is encapsulated or routed by the plugin. Saves cloud IP addresses.", "**VPC-native / routed** (AWS VPC CNI, Azure CNI with pod subnets, GKE VPC-native, OKE VCN-native pod networking): pods get real addresses from the cloud network. Pods are directly reachable and visible in flow logs, but they consume many IPs."]}, {"k": "p", "x": "Modern CNIs such as **Cilium** use **eBPF** in the Linux kernel for fast routing, load balancing, network policy and visibility."}, {"k": "tip", "kind": "Tip", "x": "The CNI choice is hard to change after the cluster is built. Decide it together with your IP plan."}]}, {"t": "Services, Ingress and Gateway API", "tag": "all", "blocks": [{"k": "p", "x": "Pods come and go, so their IPs change. A **Service** gives a set of pods a stable name and virtual IP:"}, {"k": "ul", "x": ["**ClusterIP** (default): reachable only inside the cluster, for example `orders.prod.svc.cluster.local`.", "**NodePort**: opens a port (30000–32767) on every node.", "**LoadBalancer**: asks the cloud to create a load balancer (an L4 load balancer by default on all four clouds) that forwards to the pods.", "**Headless** (`clusterIP: None`): DNS returns the pod IPs directly, used by databases and stateful sets."]}, {"k": "p", "x": "**kube-proxy** (or the CNI's eBPF replacement) programs each node so traffic to a Service IP reaches a healthy pod. **CoreDNS** answers DNS for Services and pods."}, {"k": "p", "x": "For HTTP, an **Ingress** or the newer **Gateway API** describes host and path routing, TLS and more, implemented by a controller: AWS Load Balancer Controller (creates ALBs), Application Gateway for Containers on Azure, GKE Gateway controller (Google Cloud load balancers), OCI native ingress controller, or in-cluster controllers like NGINX and Envoy-based gateways."}, {"k": "code", "t": "A Gateway API route", "x": "apiVersion: gateway.networking.k8s.io/v1\nkind: HTTPRoute\nmetadata: { name: shop, namespace: prod }\nspec:\n  parentRefs: [ { name: public-gw } ]\n  hostnames: [ \"shop.example.com\" ]\n  rules:\n  - matches: [ { path: { type: PathPrefix, value: /api } } ]\n    backendRefs: [ { name: orders, port: 8080 } ]\n  - backendRefs: [ { name: web, port: 80 } ]"}, {"k": "tip", "kind": "Tip", "x": "Gateway API is the successor to Ingress, with clearer roles (platform team owns the Gateway, app teams own their routes). Prefer it for new clusters."}]}, {"t": "Managed clusters in each cloud", "tag": "all", "blocks": [{"k": "p", "x": "Each managed Kubernetes service has its own networking defaults:"}, {"k": "ul", "x": ["**Amazon EKS**: the **Amazon VPC CNI** gives each pod a real VPC IP from the node's subnet (secondary IPs or prefix delegation). Options: custom networking to place pods in separate subnets, and **security groups for pods**. Cluster endpoints can be public, private or both.", "**Azure AKS**: **Azure CNI Overlay** (pods in a private overlay range; recommended default for most clusters), **Azure CNI** with pod subnets (pods get VNet IPs), or kubenet (legacy). **Azure CNI Powered by Cilium** adds eBPF dataplane and policy. Private clusters keep the API server off the Internet.", "**Google GKE**: **VPC-native** clusters use alias IPs from subnet **secondary ranges** for pods and Services. **GKE Dataplane V2** (based on Cilium/eBPF) provides network policy and logging. Private clusters, Autopilot mode, and multi-cluster Gateways.", "**Oracle OKE**: **VCN-native pod networking** (pods get VCN IPs, with NSGs applied to pods) or the **flannel overlay**. Virtual nodes offer a serverless option."]}, {"k": "tip", "kind": "In the cloud", "x": "Private clusters (API server reachable only from your network) are the secure default in all four. Reach them via a bastion, VPN or a CI runner inside the network."}]}, {"t": "IP planning for pods", "tag": "all", "blocks": [{"k": "p", "x": "VPC-native pod networking is powerful but hungry for addresses. A rough sizing formula:"}, {"k": "code", "t": "Estimate addresses for VPC-native pods", "x": "nodes × max pods per node = pod IPs needed\n50 nodes × 30 pods = 1,500 pod IPs  → at least a /21 (2,048), more for upgrades and scaling\nAdd surge capacity: rolling node upgrades temporarily add extra nodes."}, {"k": "p", "x": "Guidelines per provider:"}, {"k": "ul", "x": ["**EKS**: use prefix delegation to fit more pods per node; give pods their own large subnets (custom networking) or a secondary CIDR such as 100.64.0.0/16 if the primary range is short.", "**AKS**: Azure CNI Overlay avoids the problem entirely for most clusters; with pod subnets, size them for the maximum pod count.", "**GKE**: plan secondary ranges for pods (often a /14 to /16) and Services (often a /20); the max-pods-per-node setting decides how much range each node reserves.", "**OKE**: with VCN-native pods, size pod subnets for nodes × pods per node."]}, {"k": "tip", "kind": "Watch out", "x": "Running out of pod IPs makes new pods stay \"Pending\" with network errors and blocks node scaling and upgrades. Monitor subnet utilisation."}]}, {"t": "Network policies", "tag": "all", "blocks": [{"k": "p", "x": "By default, every pod can talk to every other pod in the cluster, across namespaces. A **NetworkPolicy** restricts that, selecting pods by label and allowing specific ingress and egress."}, {"k": "p", "x": "Start with **default deny** in each namespace, then allow only the required flows:"}, {"k": "code", "t": "Default deny, then allow frontend → backend on 8080", "x": "apiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: { name: default-deny, namespace: prod }\nspec:\n  podSelector: {}\n  policyTypes: [ Ingress, Egress ]\n---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: { name: backend-from-frontend, namespace: prod }\nspec:\n  podSelector: { matchLabels: { app: backend } }\n  ingress:\n  - from: [ { podSelector: { matchLabels: { app: frontend } } } ]\n    ports: [ { protocol: TCP, port: 8080 } ]"}, {"k": "p", "x": "Remember that a default-deny egress policy also blocks DNS, so add a rule allowing UDP/TCP 53 to CoreDNS."}, {"k": "p", "x": "NetworkPolicies only work if the CNI enforces them: Calico, Cilium, GKE Dataplane V2, Azure Network Policy Manager or Cilium on AKS, the VPC CNI's network policy feature on EKS, and Calico on OKE."}, {"k": "tip", "kind": "Tip", "x": "Cilium and Calico also offer richer policies (DNS/FQDN-based egress rules, cluster-wide policies, L7 rules) beyond the standard NetworkPolicy API."}]}, {"t": "Service mesh", "tag": "all", "blocks": [{"k": "p", "x": "A **service mesh** adds a layer for service-to-service traffic without changing application code:"}, {"k": "ul", "x": ["**mTLS**: every connection between services is encrypted and both sides authenticated with certificates issued by the mesh.", "**Traffic management**: retries, timeouts, circuit breaking, canary releases (send 5% of traffic to a new version).", "**Observability**: request-level metrics and traces for every service call.", "**Authorization policies**: \"only the orders service may call payments, and only POST /charge\"."]}, {"k": "p", "x": "Popular meshes are **Istio** (including its sidecar-less **ambient mode**), **Linkerd** and **Cilium Service Mesh**. Managed options include **Istio-based service mesh add-on for AKS** and **Cloud Service Mesh** on Google Cloud."}, {"k": "tip", "kind": "Tip", "x": "A mesh adds real operational complexity. Adopt one when you need mTLS everywhere or advanced traffic control across many services, not by default."}]}], "q": [{"t": "What enforces Kubernetes NetworkPolicy?", "o": ["kube-proxy", "The CNI plugin", "CoreDNS", "etcd"], "a": 1, "x": "Without a policy-capable CNI, NetworkPolicies have no effect."}, {"t": "Which GKE feature gives pods IPs from VPC secondary ranges?", "o": ["VPC-native (alias IPs)", "Cloud NAT", "Shared VPC", "Autopilot"], "a": 0, "x": "VPC-native clusters allocate pod IPs from alias ranges."}, {"t": "Which Service type is reachable only from inside the cluster?", "o": ["ClusterIP", "NodePort", "LoadBalancer", "ExternalName"], "a": 0, "x": "ClusterIP is the default internal virtual IP."}, {"t": "After applying a default-deny egress policy, pods can't resolve any names. Why?", "o": ["CoreDNS crashed", "The policy also blocks DNS traffic to CoreDNS on port 53", "The CNI doesn't support DNS", "Services were deleted"], "a": 1, "x": "Default-deny egress blocks everything, including DNS; add an allow rule for port 53."}, {"t": "Which AKS networking option avoids consuming VNet addresses for every pod?", "o": ["Azure CNI with pod subnets", "Azure CNI Overlay", "Host networking", "Service endpoints"], "a": 1, "x": "In overlay mode, pods use a private range separate from the VNet."}], "lv": 5, "h": 7, "goal": "Plan and secure pod networking on EKS, AKS, GKE and OKE.", "terms": ["pod", "CNI", "overlay", "VPC-native", "ClusterIP", "NodePort", "LoadBalancer", "Ingress", "Gateway API", "NetworkPolicy", "CoreDNS", "kube-proxy", "eBPF", "service mesh", "mTLS"]}, {"id": "m22", "t": "Troubleshooting & Capstone", "res": [["AWS Reachability Analyzer", "https://docs.aws.amazon.com/vpc/latest/reachability/what-is-reachability-analyzer.html"], ["Azure Network Watcher", "https://learn.microsoft.com/en-us/azure/network-watcher/network-watcher-overview"], ["Google Cloud Connectivity Tests", "https://cloud.google.com/network-intelligence-center/docs/connectivity-tests/concepts/overview"], ["OCI Network Path Analyzer", "https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/path_analyzer.htm"]], "sum": ["Work methodically up the layers and change one thing at a time.", "Use each cloud's path analyzer before guessing.", "Flow logs and packet captures show what really happened.", "Design, build, break and fix a real two-cloud system to prove your skills."], "ls": [{"t": "A method for every outage", "tag": "all", "blocks": [{"k": "p", "x": "Good troubleshooting is a method, not luck. Use the same steps every time:"}, {"k": "ol", "x": ["**Define the problem precisely**: what source, what destination, what port, since when, for whom? \"The app is down\" is not a problem statement; \"VMs in app-subnet can't reach the database on 5432 since 14:10\" is.", "**Check what changed**: deployments, rule changes, route changes, certificate expiry. Audit logs (CloudTrail, Activity Log, Cloud Audit Logs, OCI Audit) answer this quickly.", "**Walk the path layer by layer**: is the target running and listening? Does DNS resolve correctly? Is there a route each way? Do all filters (OS firewall, security group/NSG, subnet ACL, cloud firewall) allow it in both directions? Is NAT or a load balancer in the path healthy?", "**Form one hypothesis, test it, change one thing.**", "**Fix, verify, and write down what happened.**"]}, {"k": "code", "t": "The questions, in order", "x": "Is the destination up and listening?        ss -tulpn / service status\nDoes the name resolve to the right IP?       dig / nslookup\nIs there a route there AND back?             cloud route tables, effective routes\nDo all filters allow it, both ways?          SG/NSG/NACL/firewall + host firewall\nIs anything in between unhealthy?            NAT, LB health checks, VPN/BGP state"}, {"k": "tip", "kind": "Tip", "x": "Most outages are caused by recent changes. Always ask \"what changed?\" before diving deep."}]}, {"t": "Built-in path analyzers", "tag": "all", "blocks": [{"k": "p", "x": "All four clouds offer tools that analyse configuration and tell you where a path is blocked, without needing access to the VMs:"}, {"k": "ul", "x": ["**AWS Reachability Analyzer**: source and destination (instances, ENIs, gateways, endpoints); checks routes, SGs, NACLs, gateways and peering, and names the blocking component.", "**Azure Network Watcher**: IP flow verify (which NSG rule matches), next hop, effective routes and security rules, and connection troubleshoot.", "**Google Cloud Connectivity Tests**: analyses routes, firewall policies and rules, load balancers, Cloud NAT and hybrid paths; optionally checks the live data plane.", "**OCI Network Path Analyzer**: analyses route tables, security lists, NSGs, gateways and DRG routing between endpoints."]}, {"k": "p", "x": "These tools are the fastest way to rule configuration in or out. If the analyzer says the path is open, look at the guest OS, the application, DNS or something outside the cloud."}, {"k": "tip", "kind": "Tip", "x": "Run the analyzer in both directions. Many problems are on the return path."}]}, {"t": "Packet-level visibility", "tag": "all", "blocks": [{"k": "p", "x": "When configuration looks right but traffic still fails, capture the packets:"}, {"k": "ul", "x": ["**AWS Traffic Mirroring**: copies traffic from an ENI to a monitoring target.", "**Azure Network Watcher packet capture**: captures on a VM (or scale set) to storage, readable in Wireshark.", "**Google Cloud Packet Mirroring**: clones traffic from instances to a collector behind an internal load balancer.", "**OCI VTAP** with capture filters: mirrors traffic from VNICs and other sources."]}, {"k": "p", "x": "Or simply run `tcpdump` on both ends (Module 08). Combine with **flow logs**, which show accepted and rejected flows at scale, to find which direction and which hop is failing."}, {"k": "tip", "kind": "Tip", "x": "Capture on the sender and the receiver at the same time. If packets leave A but never reach B, the problem is in the network between; if they reach B and B replies, but A never gets the reply, look at the return path."}]}, {"t": "Common failure patterns", "tag": "all", "blocks": [{"k": "p", "x": "Most cloud network problems fall into a handful of patterns. Learn to recognise them:"}, {"k": "ul", "x": ["**Connection timeout** to a new VM: security group/NSG/firewall rule missing, or wrong route. Check the analyzer.", "**Works from one subnet, not another**: subnet-level filter (NACL, subnet NSG, security list) or route table differs.", "**Private VM can't reach the Internet**: no NAT route, NAT gateway in the wrong place, or (AWS) NACL blocking return ports.", "**Load balancer returns 502/503**: health checks failing; backend security rule doesn't allow the LB's ranges, or the app isn't listening.", "**Works by IP but not by name**: DNS; especially private zones not linked to the network, or hybrid forwarding missing.", "**Small requests work, large ones hang**: MTU across VPN or tunnels.", "**Intermittent failures under load**: NAT port exhaustion, connection limits, or one unhealthy backend.", "**Hybrid traffic one-way**: asymmetric routing through stateful firewalls, or a missing route on one side.", "**Everything broke at once at a specific time**: a change, or an expired certificate."]}, {"k": "tip", "kind": "Tip", "x": "Keep a personal runbook. Each time you solve a problem, add the symptom, the cause and the fix."}]}, {"t": "Cost and performance review", "tag": "all", "blocks": [{"k": "p", "x": "A network can work and still be expensive or slow. Review it regularly:"}, {"k": "ul", "x": ["**Egress**: which flows leave the cloud, cross regions or cross zones? Can a CDN, caching or co-locating services reduce them?", "**NAT gateways**: high NAT data processing often means traffic to cloud services that should use endpoints instead (S3 gateway endpoint, Private Google Access, OCI service gateway, Azure Private Endpoints or service endpoints).", "**Idle resources**: unused load balancers, NAT gateways, VPN gateways, public IPs and endpoints left from tests.", "**Latency**: place services that talk a lot in the same zone or region; use the providers' latency dashboards.", "**Right-sizing**: VPN/ExpressRoute gateway SKUs, interconnect bandwidth and firewall capacity sized for real usage."]}, {"k": "tip", "kind": "Tip", "x": "Tag every network resource with an owner and environment. Unowned resources are usually the ones nobody remembered to delete."}]}, {"t": "Capstone brief", "tag": "all", "blocks": [{"k": "p", "x": "Prove your skills end to end. Build a small but real system across two clouds of your choice."}, {"k": "p", "x": "**Requirements**"}, {"k": "ol", "x": ["An address plan for both clouds and an imaginary data centre, with no overlaps.", "In cloud A: a hub-and-spoke network; a public L7 load balancer with WAF; app servers or containers in private subnets; a managed database with a private endpoint and no public access; NAT for outbound traffic; managed admin access with no open SSH/RDP.", "In cloud B: a private network with one service that the app in cloud A must call privately.", "A cloud-to-cloud HA VPN with BGP between the two clouds.", "Private DNS working in both directions.", "Flow logs and firewall logs enabled.", "Everything built with Terraform, with a policy check that blocks SSH from the Internet."]}, {"k": "p", "x": "**Then break it on purpose** and fix it using only the tools from this course: remove a route, delete a firewall rule, break a DNS forwarding rule, and shut one VPN tunnel. Note how you found each fault."}, {"k": "p", "x": "**Deliverables**: an architecture diagram, the IP plan, the Terraform code, and a one-page runbook. Then tear everything down."}, {"k": "tip", "kind": "Tip", "x": "Keep costs low by using the smallest sizes, running the lab for a few hours at a time, and destroying it with `terraform destroy` when you stop. Set a budget alert before you start."}]}], "q": [{"t": "A private AWS instance cannot reach the Internet. A route to the NAT exists and the security group allows egress. What next?", "o": ["The CPU", "The subnet NACL, including the return path", "The DNS TTL", "The instance size"], "a": 1, "x": "Stateless NACLs often block the return traffic on ephemeral ports."}, {"t": "Which path-analysis tool belongs to OCI?", "o": ["Reachability Analyzer", "Connectivity Tests", "Network Path Analyzer", "Network Watcher"], "a": 2, "x": "AWS, Google Cloud and Azure use the other three names."}, {"t": "Everything worked yesterday and fails today for all users. What should you check first?", "o": ["Replace the load balancer", "What changed: recent deployments, rule changes and certificate expiry", "Reboot every server", "Increase the instance sizes"], "a": 1, "x": "Most outages follow a change; audit logs show what changed and when."}, {"t": "Requests work by IP address but fail by host name. Where is the fault?", "o": ["Routing", "MTU", "DNS", "Security groups"], "a": 2, "x": "If the IP works, the network path is fine; name resolution is the problem."}, {"t": "NAT gateway data-processing charges are very high. What is a likely improvement?", "o": ["Add a second NAT gateway", "Route traffic to cloud services through private or gateway endpoints instead of NAT", "Use bigger instances", "Disable flow logs"], "a": 1, "x": "Traffic to storage and other cloud APIs often goes through NAT unnecessarily; endpoints avoid it."}], "lv": 5, "h": 12, "goal": "Diagnose any cloud network fault and prove your skills end to end.", "terms": ["runbook", "hypothesis", "path analysis", "effective routes", "packet mirroring", "flow logs", "egress review", "postmortem", "capstone"]}];

function overall(){const u=M.reduce((a,m)=>a+modUnits(m),0), d=M.reduce((a,m)=>a+modDone(m),0); return Math.round(d/u*100);}

/* ---------------- subnet calculator ---------------- */
const ip2n=s=>{const p=s.split('.').map(Number); if(p.length!==4||p.some(x=>!Number.isInteger(x)||x<0||x>255)) return null; return ((p[0]<<24)>>>0)+(p[1]<<16)+(p[2]<<8)+p[3];};
const n2ip=n=>[n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
let snIn='10.20.0.0/16', snSplit=24;
function vSubnets(){
  app.innerHTML=`<div class="view">
  <div class="view-head"><div class="eyebrow">Subnet Calculator</div><h2>Slice any IPv4 block</h2><p class="lede">Type a block to see its range, the binary split between network and host bits, usable addresses in each cloud, and how it divides into smaller subnets.</p></div>
  <div class="sn-grid">
    <div class="panel"><label class="eyebrow" for="cidr">IPv4 block</label><div class="field" style="margin-top:6px"><input id="cidr" value="${esc(snIn)}" spellcheck="false" autocomplete="off"></div><div id="snOut"></div></div>
    <div class="panel"><div class="eyebrow">Usable addresses per subnet</div><div id="snCloud"></div></div>
  </div>
  <div class="panel" style="margin-top:16px"><div class="field"><span class="eyebrow">Split into</span><select id="split" aria-label="New prefix"></select><span id="splitInfo" class="mono" style="color:var(--muted)"></span></div><div id="splitOut" style="margin-top:12px"></div></div></div>`;
  const inp=document.getElementById('cidr'); inp.oninput=()=>{snIn=inp.value; calc();};
  document.getElementById('split').onchange=e=>{snSplit=+e.target.value; calc();};
  calc();
}
function calc(){
  const out=document.getElementById('snOut'), cl=document.getElementById('snCloud'), sp=document.getElementById('splitOut'), sel=document.getElementById('split'), si=document.getElementById('splitInfo');
  const mt=snIn.trim().match(/^(\d{1,3}(?:\.\d{1,3}){3})\/(\d{1,2})$/); const ip=mt?ip2n(mt[1]):null, p=mt?+mt[2]:-1;
  if(ip===null||p<0||p>32){out.innerHTML='<p class="err">Enter a block like 10.0.0.0/16: four numbers from 0 to 255, then / and a prefix from 0 to 32.</p>'; cl.innerHTML=''; sp.innerHTML=''; sel.innerHTML=''; si.textContent=''; return;}
  const mask=p===0?0:(0xFFFFFFFF<<(32-p))>>>0, net=(ip&mask)>>>0, size=2**(32-p), bc=net+size-1;
  const bin=n2ip(net).split('.').map(o=>(+o).toString(2).padStart(8,'0')).join('');
  const bits=bin.split('').map((b,i)=>`<span class="${i<p?'n':'h'}">${b}</span>${(i%8===7&&i<31)?'.':''}`).join('');
  const priv=(net>=ip2n('10.0.0.0')&&bc<=ip2n('10.255.255.255'))||(net>=ip2n('172.16.0.0')&&bc<=ip2n('172.31.255.255'))||(net>=ip2n('192.168.0.0')&&bc<=ip2n('192.168.255.255'));
  out.innerHTML=`<dl class="kv"><dt>Network</dt><dd>${n2ip(net)}/${p}${net!==ip?' <span style="color:var(--signal)">(normalised)</span>':''}</dd><dt>Range</dt><dd>${n2ip(net)} – ${n2ip(bc)}</dd><dt>Subnet mask</dt><dd>${n2ip(mask)}</dd><dt>Wildcard</dt><dd>${n2ip((~mask)>>>0)}</dd><dt>Addresses</dt><dd>${size.toLocaleString()}</dd><dt>Classic usable</dt><dd>${p>=31?size:(size-2).toLocaleString()}</dd><dt>RFC 1918</dt><dd>${priv?'Yes, private':'No, not a private range'}</dd></dl><div class="bits" aria-label="Binary">${bits}</div>`;
  const clouds=[['aws',5,16,28,'VPC and subnet: /16 to /28'],['az',5,2,29,'Smallest subnet /29'],['gcp',4,8,29,'Smallest IPv4 subnet /29'],['oci',3,16,30,'VCN and subnet: /16 to /30']];
  cl.innerHTML=`<dl class="kv">${clouds.map(([k,r,mn,mx,nt])=>{const ok=p>=mn&&p<=mx; return `<dt><span class="dot" style="background:var(${PROV[k].v})"></span>${PROV[k].n}</dt><dd>${ok?(size-r).toLocaleString()+' usable <span style="color:var(--muted)">(−'+r+')</span>':'<span style="color:var(--bad)">/'+p+' not allowed</span>'}<br><span style="color:var(--muted);font-family:var(--f-body);font-size:12.5px">${nt}</span></dd>`;}).join('')}</dl>`;
  const opts=[]; for(let n=p+1;n<=Math.min(32,p+16);n++) opts.push(n);
  if(!opts.length){sel.innerHTML=''; si.textContent='A /32 cannot be split'; sp.innerHTML=''; return;}
  if(!opts.includes(snSplit)) snSplit=opts.includes(24)?24:opts[Math.min(2,opts.length-1)];
  sel.innerHTML=opts.map(n=>`<option value="${n}" ${n===snSplit?'selected':''}>/${n}</option>`).join('');
  const cnt=2**(snSplit-p), each=2**(32-snSplit), show=Math.min(cnt,64);
  si.textContent=`${cnt.toLocaleString()} subnets × ${each.toLocaleString()} addresses`;
  let rows=''; for(let i=0;i<show;i++){const s=net+i*each; rows+=`<tr><td class="mono">${i+1}</td><td class="mono">${n2ip(s)}/${snSplit}</td><td class="mono">${n2ip(s)} – ${n2ip(s+each-1)}</td><td class="mono">${Math.max(0,each-5).toLocaleString()}</td></tr>`;}
  sp.innerHTML=`<div class="tscroll"><table><thead><tr><th>#</th><th>Subnet</th><th>Range</th><th>AWS / Azure usable</th></tr></thead><tbody>${rows}</tbody></table></div>${cnt>show?`<p class="empty">Showing the first ${show} of ${cnt.toLocaleString()}.</p>`:''}`;
}

/* ===== V3: separate persistent academies and per-entry workbook ===== */
const GRC = [
 {id:'g01',name:'Governance, Risk and Compliance Foundations',lessons:[
  ['Governance, Risk and Compliance Explained','Governance defines direction and accountability; risk management handles uncertainty affecting objectives; compliance means meeting applicable obligations. They work together but are not interchangeable. In a bank, the board establishes risk appetite, management implements policies and the compliance function helps evaluate regulatory obligations.','Example: A company adopts a cloud service. Governance approves the strategy, risk management identifies exposure to outages and data leakage, and compliance determines applicable legal and contractual obligations. Evidence includes approved policies, risk assessments and management reporting.'],
  ['Policies, Standards, Procedures and Guidelines','A policy defines management intent and mandatory expectations. Standards provide enforceable requirements, procedures set out repeatable steps and guidelines offer recommended approaches. Clear ownership, approval, periodic review and exception management keep documents effective.','Example: An access control policy mandates least privilege; a standard specifies multifactor authentication; a procedure explains how joiner/mover/leaver tickets are processed.'],
  ['Controls: Preventive, Detective and Corrective','Preventive controls reduce the likelihood of undesirable events. Detective controls identify conditions or events; corrective controls restore normal operation. Controls can be manual or automated and should have clear owners, scope, frequency and evidence.','Example: Approval before granting privileged access is preventive; access monitoring is detective; revocation of inappropriate privileges is corrective.'] ]},
 {id:'g02',name:'Risk Management and Risk Registers',lessons:[
  ['Understanding Inherent and Residual Risk','Inherent risk represents exposure before considering relevant controls. Residual risk reflects exposure after those controls are considered. Ratings depend on the organization’s approved methodology: likelihood, impact, time horizon and effectiveness cannot be assumed to be universally numeric.','Scenario: A payment platform has a significant outage exposure. Redundant infrastructure and recovery arrangements reduce risk, but dependency on a common network provider leaves residual risk.'],
  ['Risk Identification and Treatment','Risk statements identify a cause, event and possible consequence. Treatment choices normally include mitigation, avoidance, transfer or acceptance within delegated authority. Assign a risk owner and document decisions, deadlines and reassessments.','Scenario: A third-party provider stores sensitive records. Record the confidentiality exposure, existing contractual/technical controls, gaps, mitigation owner and accepted residual risk.'],
  ['Risk Registers and Reporting','A useful risk register includes ID, business process, threat/event, assets, inherent assessment, controls, residual assessment, treatment, accountable owner, due date and review status. Metrics and escalation rules make it useful to decision makers.','Example: A quarterly review finds an overdue remediation. The owner explains exposure and escalation occurs under the approved risk acceptance policy.'] ]},
 {id:'g03',name:'Information Security Frameworks',lessons:[
  ['ISO 27001 and ISO 27002','ISO/IEC 27001 defines requirements for an information security management system including organizational context, leadership, risk planning, support, operation, performance evaluation and improvement. ISO/IEC 27002 provides implementation guidance for security controls. Certification evaluates the management system against the relevant requirements and scope.','Scenario: An organization selects controls based on a risk assessment, documents applicability and evaluates its ISMS through audits and management review.'],
  ['NIST Cybersecurity Framework','NIST CSF 2.0 organizes outcomes through Govern, Identify, Protect, Detect, Respond and Recover. It is a risk management framework, not a prescriptive checklist or automatic compliance certification. Profiles help compare current and target practices.','Scenario: A cloud migration team maps desired outcomes to its cloud identity, monitoring and recovery activities and defines prioritized improvements.'],
  ['PCI DSS and Control Applicability','PCI DSS establishes security requirements for defined payment-card environments. Scoping matters: connected-to and security-impacting systems may affect the assessment. Validation mechanisms depend on an organization’s role and its applicable program.','Scenario: A merchant documents cardholder data flows, evaluates segmentation and demonstrates evidence for requirements that apply to its environment.'] ]},
 {id:'g04',name:'IT General Controls and Access Governance',lessons:[
  ['Identity Lifecycle and Access Reviews','Access governance covers onboarding, changes, leavers, authorization, privileged access and periodic certification. Access should have a documented owner and business justification. Periodic review effectiveness depends on accurate populations, appropriate reviewers and evidence of remediation.','Scenario: A reviewer finds an inactive contractor with privileged cloud access. The organization documents investigation, removal and root cause.'],
  ['Change Management Controls','A reliable change process evaluates need, risks, testing, authorization, segregation, deployment, rollback and post-implementation review. Emergency changes may use an expedited but documented process.','Scenario: A production firewall rule is changed without authorization. Review logs, approvals and exceptions to determine scope and operating effectiveness.'],
  ['Audit Evidence and Testing','A control can be well designed yet fail in operation. Auditors evaluate control purpose, ownership, evidence completeness, period coverage and representative samples consistent with audit methodology. Screenshots alone can omit important context.','Scenario: An access review marked completed has no user population, decision record or remediation trail, so evidence is insufficient to conclude effectiveness.'] ]},
 {id:'g05',name:'Business Continuity and Third-Party Risk',lessons:[
  ['Business Impact Analysis and Recovery Objectives','A BIA identifies critical processes, dependencies and impacts over time. RTO is the targeted maximum time to resume a service after disruption; RPO defines the maximum targeted data-loss interval measured backward from an incident. These targets need practical validation.','Scenario: Banking operations require rapid restoration. Compare documented objectives with recovery exercises and actual dependencies.'],
  ['Vendor Due Diligence and Continuous Monitoring','Third-party risk assessment considers service criticality, data access, concentration, subcontractors, financial resilience, security assurance and exit feasibility. A vendor certificate is evidence, not a replacement for evaluating applicability and scope.','Scenario: Two important services depend on the same cloud region. Review concentration risk and contractual recovery commitments.'],
  ['Cloud Shared Responsibility','The cloud provider and customer have different responsibilities that vary by service model. Provider assurance does not automatically prove the customer has configured identity, logging or data protection correctly.','Scenario: A managed database provider secures underlying infrastructure while the customer remains responsible for appropriate access and data handling.'] ]},
 {id:'g06',name:'Advanced GRC Case Studies',lessons:[
  ['Assessing a Cloud Migration','Start with business objectives, asset and data classification, applicable obligations, architecture and vendor dependencies. Identify material risks and control owners. Evaluate access, logging, encryption, availability and contractual evidence before risk sign-off.','Scenario: A regulated enterprise moves customer records to cloud storage. Track residency obligations, keys, access approvals, third parties and recovery objectives.'],
  ['Evaluating a Regulatory Finding','Distinguish the observed condition from its root cause, risk exposure and corrective action. A good action plan contains an accountable owner, measurable deliverables, evidence and validation approach.','Scenario: A recurring access recertification failure requires process ownership and automated population controls, not merely one-off account removals.'],
  ['Reporting to Senior Management','Good GRC reporting distinguishes facts, assumptions and open questions. Summarize the affected business process, residual exposure, control deficiencies, treatment options and requested decisions using clear risk language.','Scenario: A critical vendor lacks a tested exit plan. Present potential customer impact, mitigations, timeline and decision required from the risk committee.'] ]}
];

/* ---------------- router ---------------- */
const VIEWS={dashboard:vDashboard,courses:vCourses,grc:vGRC,workbook:vWorkbook,insights:vInsights,explore:vExplore,rosetta:vRosetta,subnets:vSubnets,certs:vCerts,log:vLog};
let pendingLevel=null;
function route(){
  let h=(location.hash||'').replace('#','')||'dashboard'; if(h==='contents') h='courses';
  const isMod=/^m\d\d$/.test(h); const isGRC=/^g\d\d$/.test(h);
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-current',String(t.dataset.v===(isMod?'courses':isGRC?'grc':h))));
  if(isMod) vModule(h); else if(isGRC) vGRCModule(h); else (VIEWS[h]||vDashboard)();
  updateTop();
}
function afterRoute(){ if(pendingLevel){const el=document.getElementById('lv-'+pendingLevel); pendingLevel=null; if(el){el.scrollIntoView({block:'start'}); return;}} window.scrollTo(0,0);}
function go(view,level){pendingLevel=level||null; if(location.hash.replace('#','')===view){route(); afterRoute();} else location.hash=view;}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('.tab'); if(b) go(b.dataset.v);};


/* ---------------- sync: Firebase ---------------- */
const configured=!firebaseConfig.apiKey.startsWith('PASTE');
const fbApp=configured?initializeApp(firebaseConfig):null;
const auth=fbApp?getAuth(fbApp):null;
const fdb=fbApp?getFirestore(fbApp):null;
let KEY='p2c-guest', dbRef=null, writing=Promise.resolve(), dbTimer=null;
function setSync(txt,ok){const el=document.getElementById('sync'); el.textContent=txt; el.classList.toggle('ok',!!ok);}
function loadLocal(){try{const raw=localStorage.getItem(KEY); return raw?Object.assign(blank(),JSON.parse(raw)):null;}catch(e){return null;}}
function save(){
  S.t=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(dbRef){clearTimeout(dbTimer); setSync('Saving…',false); dbTimer=setTimeout(flush,1200);}
  updateTop();
}
function flush(){
  if(!dbRef) return writing;
  clearTimeout(dbTimer); dbTimer=null;
  const ref=dbRef, body=JSON.parse(JSON.stringify(S));
  writing=writing.then(()=>setDoc(ref,body)).then(()=>setSync('Synced',true)).catch(()=>setSync('Offline: saved on this device',false));
  return writing;
}
window.addEventListener('pagehide',()=>{if(dbTimer) flush();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&dbTimer) flush();});
async function startSession(user){
  KEY='p2c-'+user.uid;
  dbRef=doc(fdb,'progress',user.uid);
  S=loadLocal()||blank();
  document.getElementById('who').textContent=user.email||'';
  setSync('Loading…',false);
  route();
  await loadV3(user.uid);
  try{
    const snap=await getDoc(dbRef);
    if(snap.exists()){const d=snap.data(); if((d.t||0)>=(S.t||0)){S=Object.assign(blank(),d); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} route();} else {await flush();}}
    else if(S.t>0){await flush();}
    setSync('Synced',true);
  }catch(e){setSync('Offline: saved on this device',false);}
}
window.addEventListener('hashchange',()=>{if(dbRef){route(); afterRoute();}});

const gate=document.getElementById('gate'), msg=document.getElementById('gateMsg'), btn=document.getElementById('loginBtn'), FX=window.gateFX||{ready(){},burst(){},shake(){},leave:()=>Promise.resolve(),reset(){}};
const say=(t,cls)=>{msg.textContent=t; msg.className='gate-msg '+(cls||'');};
const ERR={'auth/invalid-credential':'That email and password don’t match. Try again.','auth/wrong-password':'That email and password don’t match. Try again.','auth/user-not-found':'That email and password don’t match. Try again.','auth/invalid-email':'Enter a valid email address.','auth/missing-password':'Enter your password.','auth/too-many-requests':'Too many attempts. Wait a few minutes and try again.','auth/network-request-failed':'No connection. Check your internet and try again.','auth/user-disabled':'This account has been turned off.','auth/api-key-not-valid.-please-pass-a-valid-api-key.':'The Firebase settings in index.html are not valid. Copy your real config from Firebase → Project settings → Your apps.','auth/invalid-api-key':'The Firebase settings in index.html are not valid. Copy your real config from Firebase → Project settings → Your apps.','auth/configuration-not-found':'Email/Password sign-in is not turned on in Firebase (SETUP.md, step 2).','auth/operation-not-allowed':'Email/Password sign-in is not turned on in Firebase (SETUP.md, step 2).','auth/unauthorized-domain':'This website address isn’t allowed yet. Add it under Firebase → Authentication → Settings → Authorized domains.'};
let justSubmitted=false;
function showGate(on){gate.hidden=!on; document.querySelector('.top').hidden=on; app.hidden=on; if(on) FX.reset();}
showGate(true);
if(!configured){
  FX.ready();
}else{
  onAuthStateChanged(auth,async user=>{
    FX.ready();
    if(user){ if(!ALLOWED_USER_UIDS.includes(user.uid)){await signOut(auth);say('This account is not approved for this private workbook.','bad');return;} if(justSubmitted){justSubmitted=false; await FX.leave();} showGate(false); window.scrollTo(0,0); startSession(user);}
    else{ dbRef=null; v3uid=null; S=blank(); app.innerHTML=''; showGate(true); document.getElementById('password').value=''; }
  });
}
document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault(); if(!auth){FX.shake(); say('Sign-in isn’t available right now.','bad'); return;}
  const em=document.getElementById('email').value.trim(), pw=document.getElementById('password').value;
  if(!em||!pw){say('Enter your email and password.','bad'); FX.shake(); return;}
  btn.disabled=true; btn.querySelector('span').textContent='Summoning…'; say(''); FX.burst(btn);
  justSubmitted=true;
  try{await signInWithEmailAndPassword(auth,em,pw);}
  catch(err){justSubmitted=false; FX.shake(); say(ERR[err.code]||'Sign-in failed ('+(err.code||'unknown error')+').','bad');}
  finally{btn.disabled=false; btn.querySelector('span').textContent='Sign in';}
});
document.getElementById('signout').onclick=async()=>{await flush(); await signOut(auth); go('dashboard');};
