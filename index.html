t never reaches B, the problem is in between, which narrows it down to routes and cloud firewalls."}]}, {"t": "MTU and fragmentation", "tag": null, "blocks": [{"k": "p", "x": "The **MTU** (maximum transmission unit) is the largest packet a link can carry. Standard Ethernet is 1,500 bytes. Some cloud networks support **jumbo frames**: AWS allows 9,001 bytes inside a VPC, a Google Cloud VPC's MTU can be set up to 8,896, and OCI supports 9,000 within a VCN. Azure VMs default to 1,500; check the current Azure documentation before raising it."}, {"k": "p", "x": "Tunnels add headers: IPsec, GRE, VXLAN and VPN connections all reduce the space left for data, so the effective MTU across a VPN might be around 1,400 bytes or less. If a packet is too big and has the \"don't fragment\" bit set, the router drops it and should send back an ICMP \"fragmentation needed\" message. If ICMP is blocked, the sender never learns, and you get a **PMTU black hole**: small requests work, large transfers hang."}, {"k": "code", "t": "Find the working MTU", "x": "ping -M do -s 1472 10.20.0.5    # 1472 + 28 bytes of headers = 1500\nping -M do -s 1372 10.20.0.5    # try smaller until it works\nip link show eth0 | grep mtu"}, {"k": "p", "x": "The usual fix is **MSS clamping** on the VPN or firewall, which tells TCP to use smaller segments, or lowering the interface MTU."}, {"k": "tip", "kind": "Watch out", "x": "Traffic leaving a VPC through an Internet gateway, VPN or peering connection to another region is usually limited to 1,500 bytes or less, even if instances use jumbo frames internally."}]}, {"t": "Host firewalls", "tag": null, "blocks": [{"k": "p", "x": "Linux has its own firewall in the kernel, managed with **iptables** or its successor **nftables**, or more simply with **ufw** (Ubuntu) and **firewalld** (RHEL family). A host firewall applies in addition to cloud security groups: traffic must pass both."}, {"k": "code", "t": "Check and manage host firewall rules", "x": "sudo ufw status verbose\nsudo ufw allow from 10.0.0.0/16 to any port 5432 proto tcp\nsudo firewall-cmd --list-all              # firewalld\nsudo nft list ruleset                     # nftables\nsudo iptables -L -n -v                    # legacy iptables"}, {"k": "p", "x": "Linux is also the basis of many network functions you will meet: routing (`sysctl net.ipv4.ip_forward=1`), NAT (`nft ... masquerade`), and Kubernetes networking (kube-proxy programs iptables or IPVS rules)."}, {"k": "tip", "kind": "Tip", "x": "When a port is open in the cloud security group but still unreachable, check the host firewall next. Both must allow the traffic."}]}, {"t": "Real-world scenario: works with curl, fails in the app", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** A Java application on a cloud VM can't connect to a partner's HTTPS API: \"connection timed out\". The engineer runs `curl https://api.partner.example` from the same VM and it works instantly."}, {"k": "p", "x": "**Investigation.**"}, {"k": "ol", "x": ["`dig api.partner.example` returns two addresses: an IPv6 AAAA and an IPv4 A record.", "`curl -v` shows curl tried IPv6 first, failed quickly, and fell back to IPv4 (the \"happy eyeballs\" behaviour).", "The Java runtime was configured to prefer IPv6 and waited the full timeout on the IPv6 address before giving up. The VM had an IPv6 address but the subnet's route table had no IPv6 default route.", "`tcpdump -i eth0 -nn ip6` confirmed SYN packets to the IPv6 address with no replies."]}, {"k": "p", "x": "**Fix.** Either add the IPv6 route (via the Internet gateway or egress-only gateway) and security rules, or remove IPv6 from the VM's interface until IPv6 is properly supported. The team added the egress-only gateway route; both curl and Java worked."}, {"k": "p", "x": "**Lessons learned.** Tools behave differently: curl's fallback hid a broken path. tcpdump shows what really happens on the wire. Half-configured IPv6 is a common cause of mysterious timeouts."}]}], "q": [{"t": "Which command shows which process listens on a port?", "o": ["ip route", "ss -tulpn", "dig", "traceroute"], "a": 1, "x": "ss lists sockets; -p shows the owning process."}, {"t": "Large transfers hang over a VPN but small requests work. First suspect?", "o": ["DNS", "MTU", "ARP", "TTL"], "a": 1, "x": "Tunnel overhead shrinks the usable packet size; oversized packets get dropped."}, {"t": "ss shows PostgreSQL listening on 127.0.0.1:5432. Other VMs can't connect. Why?", "o": ["The security group is wrong", "PostgreSQL only accepts local connections on the loopback address", "DNS is broken", "The VM has no route"], "a": 1, "x": "A service bound to 127.0.0.1 can't be reached from outside the VM, whatever the firewall says."}, {"t": "tcpdump on the client shows SYN sent and no reply ever arrives. What is most likely?", "o": ["Nothing is listening on the port", "The certificate expired", "A firewall, security rule or route on the path is dropping the traffic", "The application crashed after connecting"], "a": 2, "x": "No reply at all means the packet is being dropped. \"Nothing listening\" would produce an RST."}, {"t": "Which curl option lets you test a specific server for a host name without changing DNS?", "o": ["-I", "-k", "--resolve", "-o"], "a": 2, "x": "--resolve host:port:ip forces curl to use that IP for the name."}, {"t": "curl works but the application times out to the same host. What does tcpdump reveal in the scenario?", "o": ["DNS failures", "SYNs sent over IPv6 with no replies, because IPv6 routing was missing", "Certificate errors", "MTU problems"], "a": 1, "x": "The application preferred IPv6, which had no working route."}], "lv": 2, "h": 4, "goal": "Troubleshoot any cloud VM from its own shell.", "terms": ["ip", "ss", "curl", "dig", "tcpdump", "traceroute", "mtr", "nc", "MTU", "MSS", "iptables", "nftables"]}, {"id": "m09", "t": "BGP & Internet Routing", "res": [["Cloudflare Learning: what is BGP", "https://www.cloudflare.com/learning/security/glossary/what-is-bgp/"], ["Hurricane Electric BGP Toolkit", "https://bgp.he.net/"], ["Cloudflare: is BGP safe yet (RPKI)", "https://isbgpsafeyet.com/"]], "sum": ["The Internet is ~75,000+ autonomous systems connected by BGP.", "Every cloud private link and dynamic VPN uses eBGP between your router and the provider.", "Steer outbound traffic with local preference; steer inbound traffic with prepending and MED.", "Always filter what you advertise and accept; route leaks cause real outages."], "ls": [{"t": "Autonomous systems", "tag": null, "blocks": [{"k": "p", "x": "An **autonomous system (AS)** is a network, or group of networks, run by one organisation with one routing policy. Each has an **ASN** (autonomous system number). Examples: Amazon is AS16509, Microsoft AS8075, Google AS15169, Oracle AS31898, Cloudflare AS13335."}, {"k": "p", "x": "Public ASNs are assigned by regional registries (RIPE NCC for the Middle East and Europe, ARIN for North America, APNIC for Asia-Pacific). For private use, such as between your data centre and the cloud, you use a **private ASN**: 64512–65534 in the 2-byte range, or 4200000000–4294967294 in the 4-byte range."}, {"k": "p", "x": "BGP is a **path-vector** protocol. Routers announce which IP **prefixes** they can reach, along with the list of ASNs the announcement has passed through (the **AS path**). This lets every network see the path, avoid loops and apply policy."}, {"k": "tip", "kind": "In the cloud", "x": "When you set up a cloud VPN or private link with BGP, you choose an ASN for your side (for example 65010) and the provider uses its own (AWS defaults to 64512 for a virtual private gateway, Azure VPN gateways use 65515, Google Cloud Router lets you pick, OCI uses 31898)."}]}, {"t": "eBGP and iBGP", "tag": null, "blocks": [{"k": "p", "x": "**eBGP** (external BGP) runs between routers in *different* autonomous systems, usually directly connected. **iBGP** (internal BGP) runs between routers in the *same* AS to spread externally learned routes across the organisation."}, {"k": "p", "x": "A BGP session runs over **TCP port 179**. The two routers (**peers** or **neighbours**) exchange their routes, then send updates only when something changes, plus small keepalive messages. If keepalives stop for the **hold time** (often 90 seconds; cloud services commonly use shorter timers or BFD for faster detection), the session drops and its routes are withdrawn."}, {"k": "code", "t": "Typical BGP neighbour setup on your router (Cisco-style)", "x": "router bgp 65010\n neighbor 169.254.10.1 remote-as 64512        ! the cloud side\n neighbor 169.254.10.1 password <md5-key>\n address-family ipv4\n  network 10.100.0.0 mask 255.255.0.0          ! advertise on-prem range\n  neighbor 169.254.10.1 activate\n  neighbor 169.254.10.1 prefix-list TO-CLOUD out\n  neighbor 169.254.10.1 prefix-list FROM-CLOUD in"}, {"k": "tip", "kind": "Tip", "x": "The 169.254.x.x addresses on cloud VPN and private-link interfaces are link-local \"inside tunnel\" addresses used only for the BGP session."}]}, {"t": "Path selection", "tag": null, "blocks": [{"k": "p", "x": "When a router learns several paths to the same prefix, BGP picks one using an ordered list of attributes. Simplified, the most important are:"}, {"k": "ol", "x": ["**Highest local preference**: set inside your AS to choose the *outbound* exit (prefer link A over link B for traffic you send).", "**Shortest AS path**: fewer ASNs wins.", "**Lowest origin type**.", "**Lowest MED** (multi-exit discriminator): a hint you give a neighbour about which of your links it should use to send traffic *to you*. Only compared between paths from the same neighbouring AS.", "eBGP over iBGP, then lowest IGP cost, then tie-breakers."]}, {"k": "p", "x": "Remember the direction:"}, {"k": "ul", "x": ["You control **outbound** traffic with **local preference** (and weight on Cisco).", "You influence **inbound** traffic with **AS-path prepending** (repeating your own ASN to make a path look longer) and **MED**."]}, {"k": "code", "t": "Make link B the backup for inbound traffic", "x": "route-map PREPEND-BACKUP permit 10\n set as-path prepend 65010 65010 65010\nrouter bgp 65010\n neighbor 169.254.20.1 route-map PREPEND-BACKUP out"}, {"k": "tip", "kind": "In the cloud", "x": "Providers document how they pick between your links. For example, AWS prefers Direct Connect over VPN for the same prefix and honours prepending and longest prefix; Azure ExpressRoute uses AS path and weight; always read the provider's routing-preference page before designing primary/backup."}]}, {"t": "Peering and transit", "tag": null, "blocks": [{"k": "p", "x": "Networks connect to each other in two commercial ways."}, {"k": "p", "x": "**Transit**: you pay a provider to carry your traffic to and from the entire Internet. Small networks buy transit from one or more ISPs."}, {"k": "p", "x": "**Peering**: two networks agree to exchange traffic directly between their own customers, usually without payment. It reduces cost and latency. Peering happens over private cables or at **Internet Exchange Points (IXPs)**, such as UAE-IX in Dubai, DE-CIX in Frankfurt or AMS-IX in Amsterdam, where hundreds of networks connect to a shared switch."}, {"k": "p", "x": "Cloud providers peer with thousands of ISPs worldwide, which is why traffic to them often enters their private backbone very close to the user."}, {"k": "tip", "kind": "Tip", "x": "Look up your ISP and the big clouds on bgp.he.net to see their prefixes, peers and the IXPs they connect at."}]}, {"t": "Route security and best practice", "tag": null, "blocks": [{"k": "p", "x": "BGP was designed on trust, and mistakes spread globally. A **route leak** or **hijack** happens when a network announces prefixes it should not, and traffic is misrouted, sometimes for whole countries or major services."}, {"k": "p", "x": "Defences:"}, {"k": "ul", "x": ["**Prefix filters**: only advertise your own prefixes, and only accept what you expect from each peer", "**Maximum-prefix limits**: shut the session if a peer suddenly sends far more routes than normal", "**RPKI** (Resource Public Key Infrastructure): cryptographically signed records (ROAs) saying which ASN may originate a prefix; routers drop invalid announcements", "**BGP authentication** (TCP MD5 or TCP-AO) on sessions", "**Summarise** routes: advertise 10.100.0.0/16, not 200 individual /24s"]}, {"k": "tip", "kind": "In the cloud", "x": "Clouds limit how many routes you can advertise to them (for example, AWS Direct Connect private virtual interfaces accept up to 100 prefixes by default, and Azure ExpressRoute private peering allows up to 4,000 with Standard). Exceed the limit and the session goes down. Summarise."}]}, {"t": "Deep dive: BGP communities and route reflectors", "tag": null, "blocks": [{"k": "p", "x": "**BGP communities** are tags attached to routes. They let networks signal intentions to each other: \"don't advertise this route further\", \"prefer this path\", \"this is a customer route\". Standard communities look like `ASN:value` (for example `65010:100`); well-known ones include **NO_EXPORT** (don't send outside this AS)."}, {"k": "p", "x": "Cloud providers use communities so you can influence routing on private links:"}, {"k": "ul", "x": ["**AWS Direct Connect**: local preference communities (`7224:7100` low, `7224:7200` medium, `7224:7300` high) that you attach to routes you advertise, to choose which Direct Connect connection AWS uses to send traffic to you; and scope communities on public VIFs that control how far your prefixes propagate.", "**Azure ExpressRoute**: Microsoft tags routes learned over Microsoft peering with regional communities, so you can filter which regions' prefixes you accept.", "Other providers document their own community schemes; check before designing."]}, {"k": "p", "x": "**Route reflectors** solve an iBGP scaling problem. iBGP requires every router to peer with every other router (a full mesh). With 50 routers that's 1,225 sessions. A **route reflector** lets routers peer only with one or two reflectors, which reflect routes to everyone. Large enterprises and all service providers use them; cloud hub routers (Transit Gateway, Cloud Router, DRG) act in a similar central role."}, {"k": "code", "t": "Tag routes to make AWS prefer this Direct Connect for return traffic", "x": "ip prefix-list ONPREM seq 10 permit 10.100.0.0/14\nroute-map TO-AWS-PRIMARY permit 10\n match ip address prefix-list ONPREM\n set community 7224:7300\nrouter bgp 65010\n neighbor 169.254.30.1 send-community\n neighbor 169.254.30.1 route-map TO-AWS-PRIMARY out"}, {"k": "tip", "kind": "Tip", "x": "Communities only work if you remember `send-community` (or the equivalent) on the BGP session. Without it, tags are stripped silently."}]}, {"t": "Real-world scenario: the route leak that blackholed the cloud", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** A company connects its data centre to AWS via Direct Connect (primary) and Site-to-Site VPN (backup). One evening, users suddenly can't reach any cloud application, although both connections show \"up\"."}, {"k": "p", "x": "**Investigation.**"}, {"k": "ol", "x": ["On the on-premises edge router, `show ip bgp` shows the cloud prefixes still learned over Direct Connect, but a new, more specific route `10.32.0.0/16` points to a lab firewall.", "A network engineer, testing in the lab, had advertised `10.32.0.0/16` into the company's OSPF from a lab firewall by mistake. It was redistributed into BGP and to the data centre core.", "Longest-prefix match beat the cloud's `10.32.0.0/14` route, so traffic for the main production VPC went to the lab and died there."]}, {"k": "p", "x": "**Fix.** Remove the lab route, then prevent recurrence: prefix lists on OSPF-to-BGP redistribution accepting only approved on-premises ranges, filters on the core refusing cloud ranges from internal sources, and an alert when routes for cloud ranges appear from unexpected neighbours."}, {"k": "p", "x": "**Lessons learned.** A single wrong advertisement can override correct routes because more specific prefixes always win. Filter what you accept and redistribute, not just what you send."}]}], "q": [{"t": "Which BGP technique makes a path look longer so peers prefer another link?", "o": ["MED", "AS-path prepending", "Local preference", "Route reflection"], "a": 1, "x": "Prepending repeats your ASN in the path, making it less attractive."}, {"t": "Which range is reserved for private 2-byte ASNs?", "o": ["1–1023", "64512–65534", "65535 only", "100–200"], "a": 1, "x": "64512–65534 is the private 16-bit ASN range."}, {"t": "Which TCP port does a BGP session use?", "o": ["22", "443", "179", "500"], "a": 2, "x": "BGP peers connect over TCP 179."}, {"t": "You have two links to the cloud and want your outbound traffic to prefer link A. Which attribute do you set?", "o": ["MED", "AS-path prepending", "Local preference", "Origin"], "a": 2, "x": "Local preference is set inside your AS and controls which exit you use for outbound traffic."}, {"t": "What does RPKI help prevent?", "o": ["Packet loss", "Unauthorised networks announcing your prefixes", "DNS spoofing", "MTU problems"], "a": 1, "x": "RPKI lets routers check that an ASN is authorised to originate a prefix."}, {"t": "Which AWS Direct Connect community gives the highest local preference for traffic AWS sends to you?", "o": ["7224:7100", "7224:7200", "7224:7300", "7224:9999"], "a": 2, "x": "7224:7300 is high preference; 7100 low, 7200 medium."}, {"t": "Why do large networks use BGP route reflectors?", "o": ["To encrypt BGP", "To avoid needing a full mesh of iBGP sessions between all routers", "To replace OSPF", "To filter prefixes"], "a": 1, "x": "Reflectors relay routes so routers don't all have to peer with each other."}], "lv": 2, "h": 5, "goal": "Read and reason about BGP, the protocol behind every hybrid cloud link.", "terms": ["autonomous system", "ASN", "eBGP", "iBGP", "prefix", "AS path", "local preference", "MED", "AS-path prepending", "peering", "transit", "IXP", "RPKI"]}, {"id": "m24", "t": "DNS in Depth", "res": [["Cloudflare Learning: DNS records", "https://www.cloudflare.com/learning/dns/dns-records/"], ["Cloudflare Learning: how DNSSEC works", "https://www.cloudflare.com/learning/dns/dnssec/how-dnssec-works/"], ["Amazon Route 53 Resolver", "https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver.html"], ["Azure DNS Private Resolver", "https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview"]], "sum": ["DNS is a tree of delegated zones; NS and DS records link parent to child.", "Caching (including negative caching) decides how fast changes take effect.", "DNSSEC proves answers are genuine; DoH/DoT protect queries in transit.", "Hybrid and cloud DNS is built from private zones, inbound/outbound resolvers and forwarding rules."], "ls": [{"t": "Zones and delegation", "tag": null, "blocks": [{"k": "p", "x": "DNS is a distributed tree. The root (`.`) delegates `com.`, which delegates `example.com.`, which can delegate `eu.example.com.` to someone else. Each delegated piece is a **zone**, served by its own **authoritative name servers**."}, {"k": "p", "x": "Delegation is done with **NS records** in the parent zone: the `.com` servers hold NS records saying which servers are authoritative for `example.com`. When those name servers live inside the zone they serve (such as `ns1.example.com`), the parent also stores their IP addresses as **glue records** to avoid a chicken-and-egg problem."}, {"k": "p", "x": "Every zone starts with an **SOA** (start of authority) record holding the primary server, the admin contact, a **serial number** (increment it on every change when using zone transfers), refresh timers, and the **negative-caching TTL**."}, {"k": "code", "t": "A small zone file", "x": "$TTL 3600\n@     IN SOA  ns1.example.com. hostmaster.example.com. ( 2026102701 7200 900 1209600 300 )\n@     IN NS   ns1.example.com.\n@     IN NS   ns2.example.com.\n@     IN A    203.0.113.10\nwww   IN CNAME example.com.\napi   IN A    203.0.113.20\n@     IN MX 10 mail.example.com.\n@     IN TXT  \"v=spf1 include:_spf.example.net -all\""}, {"k": "tip", "kind": "In the cloud", "x": "When you create a public hosted zone in Route 53, Azure DNS, Cloud DNS or OCI DNS, the provider gives you a set of name servers. You must update the NS records at your domain registrar (the delegation) before the zone is live on the Internet."}]}, {"t": "Resolution and caching in detail", "tag": null, "blocks": [{"k": "p", "x": "A **stub resolver** (your laptop) sends one **recursive** query to a **recursive resolver**. The resolver does the work, making **iterative** queries to root, TLD and authoritative servers, then caches every answer for its **TTL**."}, {"k": "p", "x": "Things that catch people out:"}, {"k": "ul", "x": ["**Negative caching**: an NXDOMAIN (\"name does not exist\") is also cached, for the time set in the SOA. Look up a record *before* you create it and some resolvers will keep saying it doesn't exist for a while.", "**TTL strategy**: long TTLs (hours) reduce load and latency; short TTLs (60–300 s) make changes and failovers fast. Lower TTLs a day before a planned change.", "**Clients and applications cache too**: browsers, operating systems and some runtimes (for example the JVM) keep their own caches, sometimes ignoring TTLs.", "**UDP and TCP**: most queries use UDP 53; large responses (DNSSEC, many records) need **EDNS** larger UDP sizes or fall back to TCP 53. Firewalls must allow both."]}, {"k": "p", "x": "Queries can be encrypted between client and resolver with **DNS over TLS (DoT, TCP 853)** or **DNS over HTTPS (DoH, 443)**. This protects privacy but can bypass company DNS controls, so many organisations manage which resolvers devices use."}, {"k": "tip", "kind": "Tip", "x": "\"DNS propagation\" is really just caches expiring. Nothing is pushed; resolvers fetch new data when their cached copy's TTL runs out."}]}, {"t": "DNSSEC", "tag": null, "blocks": [{"k": "p", "x": "Plain DNS answers can be forged, for example by cache poisoning. **DNSSEC** adds digital signatures so resolvers can prove an answer is genuine and unmodified."}, {"k": "p", "x": "How the chain of trust works:"}, {"k": "ol", "x": ["Each signed zone publishes its public keys in **DNSKEY** records and signs every record set, producing **RRSIG** records.", "The parent zone holds a **DS** (delegation signer) record, a hash of the child's key-signing key. The parent signs the DS, linking parent to child.", "Validating resolvers start from the root's trusted key and follow DS → DNSKEY → RRSIG down to the answer. Any mismatch returns **SERVFAIL**.", "**NSEC/NSEC3** records prove that a name does not exist."]}, {"k": "p", "x": "DNSSEC protects integrity, not privacy (that's DoH/DoT). Its main operational risk is key management: a broken DS at the parent or an expired signature makes the whole domain fail to resolve for validating resolvers."}, {"k": "p", "x": "The major cloud DNS services support DNSSEC signing for public zones; you then add the DS record at your registrar. Check your provider's documentation for the exact steps and supported algorithms."}, {"k": "tip", "kind": "Watch out", "x": "When moving a DNSSEC-signed domain between providers, follow a careful key rollover or temporarily disable DNSSEC by removing the DS record first, and wait for the TTL. Otherwise validating resolvers will reject the domain."}]}, {"t": "Split-horizon and private DNS design", "tag": null, "blocks": [{"k": "p", "x": "**Split-horizon DNS** returns different answers depending on who asks. For example, `app.example.com` resolves to a public load balancer for Internet users and to a private IP for internal users."}, {"k": "p", "x": "In the cloud you build this with **private zones** linked to your networks:"}, {"k": "ul", "x": ["**AWS**: Route 53 private hosted zones associated with VPCs (including VPCs in other accounts).", "**Azure**: Private DNS zones with virtual network links (optionally with autoregistration of VM names).", "**Google Cloud**: Cloud DNS private zones visible to chosen VPC networks; peering zones to share resolution between VPCs.", "**OCI**: private zones attached to private views used by each VCN's resolver."]}, {"k": "p", "x": "For hybrid environments, design DNS like routing:"}, {"k": "code", "t": "A hybrid DNS design", "x": "On-prem DNS  --forward cloud.example.com, privatelink zones-->  cloud inbound resolver endpoint\nCloud outbound resolver endpoint  --forward corp.example.com-->  on-prem DNS servers\nEach environment authoritative only for its own zones"}, {"k": "tip", "kind": "Tip", "x": "Avoid using the same zone name both publicly and privately unless you really need split-horizon. It is a common source of \"works inside, broken outside\" confusion."}]}, {"t": "DNS for traffic management and failover", "tag": null, "blocks": [{"k": "p", "x": "DNS is often used to steer users: weighted answers for canary releases, latency-based answers for nearest region, geolocation answers for compliance, and failover answers driven by health checks. **Route 53**, **Azure Traffic Manager**, **Cloud DNS routing policies** and **OCI DNS traffic management steering policies** all do this."}, {"k": "p", "x": "DNS-based failover has limits you must design around:"}, {"k": "ul", "x": ["Failover speed depends on health check interval plus TTL plus client caching; expect tens of seconds to minutes.", "Some clients cache answers far longer than the TTL.", "DNS answers the resolver, not the user; with public resolvers, \"nearest\" is approximated (EDNS Client Subnet helps when supported)."]}, {"k": "p", "x": "For faster, connection-level failover, anycast global load balancers (Google Cloud global load balancing, Azure Front Door, AWS Global Accelerator) are usually better."}, {"k": "tip", "kind": "Tip", "x": "Use DNS failover for disaster recovery between regions, and load balancers for high availability within a region."}]}, {"t": "Troubleshooting DNS", "tag": null, "blocks": [{"k": "p", "x": "Learn to read DNS responses precisely:"}, {"k": "ul", "x": ["**NOERROR with answers**: success.", "**NOERROR with no answers (NODATA)**: the name exists but not with that record type.", "**NXDOMAIN**: the name does not exist (check typos and which zone you're querying).", "**SERVFAIL**: the resolver couldn't get a valid answer: broken delegation, unreachable authoritative servers, or DNSSEC validation failure.", "**REFUSED**: the server won't answer you (not authoritative, or recursion not allowed for your IP)."]}, {"k": "code", "t": "dig patterns for troubleshooting", "x": "dig api.example.com                    # normal lookup via your resolver\ndig @ns1.example.com api.example.com   # ask the authoritative server directly\ndig +trace api.example.com             # follow the delegation chain\ndig +dnssec api.example.com            # show RRSIG records\ndig +cd api.example.com                # disable DNSSEC checking: if this works but normal fails, DNSSEC is broken\ndig api.example.com +short @10.0.0.2   # ask the cloud VPC resolver"}, {"k": "tip", "kind": "Tip", "x": "Always compare three answers: the authoritative server, your resolver, and the client. If the authoritative answer is right and the client is wrong, it's caching or forwarding, not the zone."}]}, {"t": "Real-world scenario: Private Endpoint names resolving to public IPs", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** A company enables Private Endpoints for its Azure storage accounts and disables public access. Apps in Azure work, but on-premises servers start failing with \"403 / public access is disabled\" errors."}, {"k": "p", "x": "**Investigation.**"}, {"k": "ol", "x": ["From an on-premises server, `nslookup mystorage.blob.core.windows.net` returns a **public** IP.", "From an Azure VM, the same lookup returns `10.20.5.10`, because the VNet is linked to the `privatelink.blob.core.windows.net` Private DNS zone.", "On-premises DNS forwards everything to the Internet, so it follows the public CNAME chain and never sees the private zone."]}, {"k": "p", "x": "**Fix.**"}, {"k": "ol", "x": ["Deploy **Azure DNS Private Resolver** with an inbound endpoint in the hub VNet (reachable over ExpressRoute).", "On on-premises DNS servers, add **conditional forwarders** for `blob.core.windows.net` (and the other service zones in use) to the inbound endpoint IP.", "Verify from on-premises: the name now returns `10.20.5.10`, and traffic flows over ExpressRoute."]}, {"k": "p", "x": "The same pattern applies to AWS interface endpoints (Route 53 Resolver inbound endpoints), Google Private Service Connect (Cloud DNS inbound server policies) and OCI private endpoints (resolver listening endpoints)."}, {"k": "p", "x": "**Lessons learned.** Private endpoints are half networking and half DNS. Every network that must use them needs its DNS to resolve the private address."}]}], "q": [{"t": "What links a parent zone to a child zone's DNSSEC keys?", "o": ["An MX record", "A CNAME record", "A DS record", "A TXT record"], "a": 2, "x": "The DS record in the parent holds a hash of the child's key-signing key."}, {"t": "You queried a name before creating it, and now it still returns NXDOMAIN for some users. Why?", "o": ["DNSSEC is broken", "Negative caching: resolvers cached the \"does not exist\" answer", "The TTL is too short", "The zone has no SOA"], "a": 1, "x": "NXDOMAIN answers are cached for the SOA's negative-caching TTL."}, {"t": "A lookup fails with SERVFAIL, but succeeds with dig +cd. What is the likely cause?", "o": ["The record doesn't exist", "The firewall blocks UDP 53", "DNSSEC validation is failing", "The client cache is stale"], "a": 2, "x": "+cd disables validation; success then points to a DNSSEC problem."}, {"t": "Which ports must firewalls allow for DNS to work reliably?", "o": ["UDP 53 only", "UDP 53 and TCP 53", "TCP 443 only", "UDP 123"], "a": 1, "x": "Large responses fall back to TCP 53, so both are needed."}, {"t": "Why is DNS failover slower than load-balancer failover?", "o": ["DNS servers are slow", "It depends on health-check intervals, TTLs and client caching", "DNS uses TCP", "Load balancers don't use health checks"], "a": 1, "x": "Clients keep using cached answers until they expire, and some cache longer."}, {"t": "On-premises servers resolve an Azure storage account to its public IP after Private Endpoints were enabled. What fixes it?", "o": ["A bigger ExpressRoute circuit", "Conditional forwarding of the service zone to an Azure DNS Private Resolver inbound endpoint", "Re-enabling public access", "A NAT gateway"], "a": 1, "x": "On-premises DNS must reach the Private DNS zone through a resolver inbound endpoint."}], "lv": 2, "h": 5, "goal": "Design, secure and troubleshoot DNS for hybrid and cloud networks.", "terms": ["zone", "delegation", "SOA", "NS", "glue record", "recursive resolver", "negative caching", "EDNS", "DoH", "DoT", "DNSSEC", "DS record", "split-horizon", "conditional forwarding", "NXDOMAIN", "SERVFAIL"]}, {"id": "m25", "t": "TLS, PKI & Certificates", "res": [["Cloudflare Learning: what happens in a TLS handshake", "https://www.cloudflare.com/learning/ssl/what-happens-in-a-tls-handshake/"], ["Let's Encrypt: how it works", "https://letsencrypt.org/how-it-works/"], ["AWS Certificate Manager", "https://docs.aws.amazon.com/acm/latest/userguide/acm-overview.html"], ["Google Cloud Certificate Manager", "https://cloud.google.com/certificate-manager/docs/overview"], ["CA/Browser Forum", "https://cabforum.org/"]], "sum": ["TLS 1.3 negotiates keys with ECDHE and authenticates the server with a certificate.", "Clients trust a certificate through a chain up to a root CA; send the full chain.", "Public certificate lifetimes are shrinking, so automate issuance and renewal.", "mTLS authenticates both sides and is the backbone of zero-trust service traffic."], "ls": [{"t": "Why TLS and how the handshake works", "tag": null, "blocks": [{"k": "p", "x": "**TLS** gives three guarantees: **confidentiality** (encryption), **integrity** (tampering is detected) and **authentication** (you are talking to the real server). It protects HTTPS, secure email, database connections, VPNs built on TLS, and service-to-service APIs."}, {"k": "p", "x": "A **TLS 1.3** handshake takes one round trip:"}, {"k": "ol", "x": ["**ClientHello**: supported versions and cipher suites, a key share for **ECDHE** key exchange, the **SNI** (server name the client wants) and **ALPN** (application protocol, such as `h2` for HTTP/2).", "**ServerHello**: the server picks parameters and sends its key share. From here everything is encrypted.", "The server sends its **certificate** and a **CertificateVerify** signature proving it holds the private key, then **Finished**.", "The client validates the certificate, sends **Finished**, and application data flows."]}, {"k": "p", "x": "ECDHE gives **forward secrecy**: even if the server's private key leaks later, past sessions can't be decrypted. TLS 1.3 removed old, weak options; TLS 1.2 is still acceptable with modern cipher suites (ECDHE with AES-GCM or ChaCha20-Poly1305). TLS 1.0 and 1.1 are obsolete and should be disabled."}, {"k": "tip", "kind": "Tip", "x": "**SNI** is why one IP address can host hundreds of HTTPS sites: the load balancer reads the requested name from the ClientHello and picks the matching certificate."}]}, {"t": "Certificates and chains of trust", "tag": null, "blocks": [{"k": "p", "x": "A **certificate** (X.509) binds a public key to identities and is signed by a **certificate authority (CA)**. Key fields:"}, {"k": "ul", "x": ["**Subject Alternative Name (SAN)**: the DNS names (or IPs) the certificate is valid for. Browsers check the SAN, not the old Common Name.", "**Validity**: not-before and not-after dates.", "**Issuer**: the CA that signed it.", "**Key usage**: what the key may be used for (server auth, client auth)."]}, {"k": "p", "x": "Clients trust a small set of **root CAs** built into the operating system or browser. Roots sign **intermediate CAs**, which sign server certificates. The server must send its certificate **plus the intermediates** (the **chain**); clients already have the root."}, {"k": "p", "x": "A **wildcard** certificate (`*.example.com`) covers one level of subdomains (`api.example.com`, not `v1.api.example.com`)."}, {"k": "p", "x": "**Lifetimes are shrinking.** The CA/Browser Forum has agreed to phase down the maximum validity of publicly trusted TLS certificates: 200 days from March 2026, 100 days from March 2027, and 47 days from March 2029. Manual renewal no longer scales."}, {"k": "code", "t": "Inspect a server's chain and dates", "x": "openssl s_client -connect app.example.com:443 -servername app.example.com -showcerts </dev/null\necho | openssl s_client -connect app.example.com:443 -servername app.example.com 2>/dev/null \\\n  | openssl x509 -noout -subject -issuer -dates -ext subjectAltName"}, {"k": "tip", "kind": "Watch out", "x": "\"Works in my browser but fails in curl or Java\" usually means the server isn't sending its intermediate certificate. Browsers sometimes fetch it themselves; other clients don't."}]}, {"t": "Automating certificates with ACME", "tag": null, "blocks": [{"k": "p", "x": "**ACME** (RFC 8555) is the protocol behind **Let's Encrypt** and many other CAs. A client proves control of a domain and receives a certificate automatically:"}, {"k": "ul", "x": ["**HTTP-01** challenge: serve a token at `http://<domain>/.well-known/acme-challenge/...`", "**DNS-01** challenge: create a TXT record `_acme-challenge.<domain>`; required for wildcard certificates and handy when servers aren't publicly reachable.", "**TLS-ALPN-01**: answer a special TLS handshake on port 443."]}, {"k": "p", "x": "Popular clients: **certbot**, **acme.sh**, **lego**, **Caddy** (built-in), and **cert-manager** for Kubernetes, which issues and renews certificates as Kubernetes resources."}, {"k": "code", "t": "Get a certificate with certbot using the Nginx plugin", "x": "sudo certbot --nginx -d app.example.com -d www.example.com\nsudo certbot renew --dry-run      # test automatic renewal"}, {"k": "tip", "kind": "Tip", "x": "Monitor expiry independently of the renewal system: an alert 14–21 days before expiry catches broken automation before users do."}]}, {"t": "Certificate services in the four clouds", "tag": null, "blocks": [{"k": "p", "x": "Managed certificate services handle issuance, storage and renewal for cloud load balancers and CDNs:"}, {"k": "ul", "x": ["**AWS Certificate Manager (ACM)**: free public certificates (DNS or email validation) that renew automatically when attached to ALB, NLB, CloudFront or API Gateway; imported certificates; **AWS Private CA** for private PKI.", "**Azure**: **Key Vault** stores and can auto-renew certificates (with integrated CAs), used by Application Gateway and Front Door; Front Door and App Service also offer free managed certificates.", "**Google Cloud**: **Certificate Manager** provides Google-managed certificates (including DNS authorization and wildcards) for load balancers; **Certificate Authority Service** runs private CAs.", "**OCI**: **OCI Certificates** issues and manages certificates (including from private CAs) and integrates with OCI Load Balancer and API Gateway."]}, {"k": "tip", "kind": "In the cloud", "x": "Terminate public TLS at the managed load balancer or CDN with a managed certificate, and use private CA certificates (or the platform's built-in options) for backend and service-to-service encryption."}]}, {"t": "Mutual TLS and private PKI", "tag": null, "blocks": [{"k": "p", "x": "In normal TLS only the server proves its identity. In **mutual TLS (mTLS)** the client also presents a certificate, so both sides are authenticated cryptographically. It is used for:"}, {"k": "ul", "x": ["Service-to-service traffic in zero-trust architectures and service meshes (Istio, Linkerd issue short-lived certificates automatically)", "APIs for partners and IoT devices", "Securing connections to databases and message brokers"]}, {"k": "p", "x": "mTLS needs a **private PKI**: a private root CA (kept offline or in an HSM), intermediate CAs for issuing, short certificate lifetimes, automated rotation and a revocation plan. Managed options include AWS Private CA, Google Certificate Authority Service and OCI Certificates; tools such as HashiCorp Vault and cert-manager are also common."}, {"k": "p", "x": "Many cloud load balancers can verify client certificates: AWS ALB mutual authentication, Azure Application Gateway mutual authentication, Google Cloud load balancer mTLS with a trust config, and OCI Load Balancer client certificate verification."}, {"k": "tip", "kind": "Tip", "x": "Keep mTLS certificates short-lived (hours to days) and automate rotation. Short lifetimes reduce the need for revocation checking."}]}, {"t": "Troubleshooting TLS", "tag": null, "blocks": [{"k": "p", "x": "Most TLS failures fall into a few categories:"}, {"k": "ul", "x": ["**Expired certificate**: check the not-after date.", "**Name mismatch**: the requested host name isn't in the SAN list (often after adding a new domain).", "**Incomplete chain**: intermediate missing on the server.", "**Untrusted issuer**: a private CA the client doesn't trust, or a TLS-inspection proxy re-signing traffic.", "**Protocol or cipher mismatch**: an old client needs TLS 1.0, or a hardened server rejects the client's ciphers.", "**Wrong SNI**: the client doesn't send SNI, so the server returns its default certificate.", "**Clock skew**: a device with the wrong date thinks valid certificates are expired or not yet valid."]}, {"k": "code", "t": "Quick TLS checks", "x": "curl -vI https://app.example.com 2>&1 | grep -E 'SSL|TLS|subject|issuer|expire|error'\nopenssl s_client -connect app.example.com:443 -servername app.example.com -tls1_2 </dev/null\nopenssl s_client -connect app.example.com:443 -servername wrong.example.com </dev/null  # test SNI behaviour"}, {"k": "tip", "kind": "Watch out", "x": "Never \"fix\" TLS errors in production by disabling certificate verification (curl -k, verify=False). Fix the certificate or trust store instead."}]}, {"t": "Real-world scenario: the certificate that expired on a Sunday", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** At 03:00 on a Sunday, a company's mobile app stops working for all users. The website works in browsers, but the app shows a network error. The API's certificate expired at midnight UTC."}, {"k": "p", "x": "**Investigation.**"}, {"k": "ol", "x": ["`openssl s_client` confirms the API certificate's not-after date has passed.", "The website uses a managed certificate on the CDN that renews automatically. The API, on a separate load balancer, used a manually imported certificate that someone renewed by hand each year. That person had left the company.", "Browsers were unaffected because they were going to a different, still-valid certificate."]}, {"k": "p", "x": "**Fix.**"}, {"k": "ol", "x": ["Issue a new certificate (using the cloud's managed certificate service with DNS validation) and attach it. Service restored within an hour of the on-call engineer starting.", "Replace every manually managed public certificate with managed or ACME-automated certificates.", "Add certificate expiry monitoring with alerts at 30, 14 and 7 days, independent of the renewal system.", "Keep an inventory of every certificate, its owner and where it's deployed."]}, {"k": "p", "x": "**Lessons learned.** Manual certificate renewal fails eventually, usually at a bad time. With certificate lifetimes shrinking to 200 days now and 47 days by 2029, automation is mandatory."}]}], "q": [{"t": "What does SNI let a server do?", "o": ["Encrypt traffic faster", "Choose the right certificate for the requested host name on a shared IP", "Skip certificate validation", "Use UDP instead of TCP"], "a": 1, "x": "The client sends the host name in the ClientHello, so the server can pick the matching certificate."}, {"t": "Clients other than browsers fail with \"unable to get local issuer certificate\". The most likely cause?", "o": ["The certificate expired", "The server isn't sending the intermediate certificate", "The client has no Internet", "The wrong port is used"], "a": 1, "x": "Servers must send the full chain; browsers sometimes hide this mistake."}, {"t": "Which ACME challenge is required for wildcard certificates?", "o": ["HTTP-01", "DNS-01", "TLS-ALPN-01", "Email validation"], "a": 1, "x": "Wildcards need DNS-01 proof of control of the whole domain."}, {"t": "What property does ECDHE key exchange provide?", "o": ["Smaller certificates", "Forward secrecy", "Client authentication", "DNS validation"], "a": 1, "x": "Ephemeral keys mean a later key compromise can't decrypt past sessions."}, {"t": "In mutual TLS, who presents a certificate?", "o": ["Only the server", "Only the client", "Both client and server", "Neither; it uses passwords"], "a": 2, "x": "mTLS authenticates both sides with certificates."}, {"t": "What is the most durable fix for expired-certificate outages?", "o": ["Buy certificates with longer validity", "Automate issuance and renewal, and monitor expiry independently", "Disable certificate checks in the app", "Renew all certificates on the same day each year"], "a": 1, "x": "Automation plus independent monitoring prevents surprise expirations."}], "lv": 2, "h": 5, "goal": "Understand, deploy and troubleshoot TLS and certificates across cloud services.", "terms": ["TLS 1.3", "handshake", "ECDHE", "cipher suite", "SNI", "ALPN", "X.509", "certificate chain", "intermediate CA", "SAN", "wildcard", "ACME", "OCSP", "mTLS", "private CA"]}, {"id": "m26", "t": "IPv6 in Depth", "res": [["RFC 8200: IPv6 specification", "https://www.rfc-editor.org/rfc/rfc8200"], ["AWS: IPv6 on AWS", "https://docs.aws.amazon.com/whitepapers/latest/ipv6-on-aws/IPv6-on-AWS.html"], ["Azure: IPv6 for Azure Virtual Network", "https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/ipv6-overview"], ["Google Cloud: IPv6 support", "https://cloud.google.com/vpc/docs/subnets#ipv6-ranges"]], "sum": ["IPv6 has no broadcast; it uses link-local addresses, multicast and NDP instead of ARP.", "Hosts configure themselves with SLAAC or DHCPv6, driven by router advertisements.", "All four clouds support dual-stack; several support IPv6-only subnets with NAT64/DNS64.", "Security rules must cover IPv6 explicitly, and essential ICMPv6 must stay allowed."], "ls": [{"t": "IPv6 address types", "tag": null, "blocks": [{"k": "p", "x": "IPv6 replaces broadcast with **multicast** and gives every interface several addresses with different scopes:"}, {"k": "ul", "x": ["**Global unicast** (`2000::/3`): routable on the Internet, the equivalent of a public IPv4 address.", "**Link-local** (`fe80::/10`): automatically present on every IPv6 interface, valid only on that link. Routers and neighbour discovery use them.", "**Unique local addresses, ULA** (`fc00::/7`, used as `fd00::/8`): private addresses similar to RFC 1918, not routed on the Internet.", "**Multicast** (`ff00::/8`): one-to-many; for example `ff02::1` (all nodes on the link) and `ff02::2` (all routers).", "**Loopback** `::1` and the unspecified address `::`."]}, {"k": "p", "x": "A typical global address is split into a **routing prefix** from the provider (for example a /48 for a site or a /56 for a VPC), a **subnet ID**, and a 64-bit **interface identifier**:"}, {"k": "code", "t": "Reading an IPv6 address", "x": "2001:db8:4f2a:0010:0000:0000:0000:0025/64\n└── /48 site ──┘└sub┘└─── interface ID ───┘\ncompressed: 2001:db8:4f2a:10::25/64"}, {"k": "tip", "kind": "Tip", "x": "Every IPv6 subnet should be a /64. Smaller subnets break SLAAC and other features; there is no shortage to save."}]}, {"t": "SLAAC, NDP and DHCPv6", "tag": null, "blocks": [{"k": "p", "x": "IPv6 hosts configure themselves using **Neighbor Discovery Protocol (NDP)**, which runs over ICMPv6 and replaces ARP:"}, {"k": "ul", "x": ["**Router Solicitation / Router Advertisement (RS/RA)**: hosts ask for, and routers announce, the prefix, default gateway and flags.", "**Neighbor Solicitation / Neighbor Advertisement (NS/NA)**: the IPv6 version of ARP, mapping addresses to MAC addresses, plus **duplicate address detection**."]}, {"k": "p", "x": "Using the information in RAs, a host can build its own address with **SLAAC** (stateless address autoconfiguration). Flags in the RA can instead point hosts to **DHCPv6** for addresses (stateful) or just for extra options such as DNS servers (stateless DHCPv6). DNS servers can also be announced directly in RAs (RDNSS)."}, {"k": "p", "x": "Clients often generate **temporary privacy addresses** that change over time, so their outgoing connections can't easily be tracked."}, {"k": "code", "t": "Look at IPv6 on Linux", "x": "ip -6 addr                 # global, link-local and temporary addresses\nip -6 route                # default route via a link-local fe80:: gateway\nip -6 neigh                # the NDP neighbour table (like ARP)\nping -6 2606:4700:4700::1111"}, {"k": "tip", "kind": "In the cloud", "x": "Cloud networks handle RA and DHCPv6 for you, usually assigning addresses through their own DHCPv6 service. You just enable IPv6 on the network, subnet and interface."}]}, {"t": "ICMPv6 and IPv6 security", "tag": null, "blocks": [{"k": "p", "x": "ICMPv6 is not optional in IPv6. Blocking it breaks the network:"}, {"k": "ul", "x": ["**NDP** (neighbour and router discovery) uses ICMPv6 types 133–137.", "**Packet Too Big** (type 2) is how path MTU discovery works; IPv6 routers never fragment, so blocking it creates black holes.", "Echo request and reply (128/129) are useful for diagnostics."]}, {"k": "p", "x": "Security considerations specific to IPv6:"}, {"k": "ul", "x": ["**Rules for both stacks**: an IPv4 rule doesn't cover IPv6. Every \"deny 0.0.0.0/0\" needs a matching \"::/0\" policy.", "**No NAT by default**: instances with global IPv6 addresses are reachable from the Internet unless a firewall stops it. Use security groups and **egress-only gateways** for outbound-only access.", "**Rogue RAs**: on networks you control, RA Guard prevents unauthorised routers from advertising themselves.", "**Extension headers**: can be abused to evade filters; modern firewalls inspect or limit them."]}, {"k": "tip", "kind": "Watch out", "x": "Teams often enable IPv6 on a load balancer and forget their WAF or firewall rules only cover IPv4. Test both protocols."}]}, {"t": "IPv6 in the four clouds", "tag": null, "blocks": [{"k": "p", "x": "All four providers support **dual-stack** networking, and support for **IPv6-only** keeps growing:"}, {"k": "ul", "x": ["**AWS**: a VPC gets an Amazon-provided /56 (or your own via BYOIP or IPAM); subnets get /64s. Instances can be dual-stack or **IPv6-only**. **Egress-only Internet gateways** allow outbound-only IPv6. **DNS64** on Route 53 Resolver plus **NAT64** on NAT gateways let IPv6-only workloads reach IPv4 services. ALB, NLB and CloudFront support dual-stack.", "**Azure**: dual-stack VNets and subnets with /64 IPv6 ranges; IPv6 on VMs, Standard Load Balancer and public IPs. Check service support, as not every PaaS service is IPv6-ready.", "**Google Cloud**: dual-stack subnets and **IPv6-only subnets**, with **internal IPv6** (ULA from the VPC's /48) or **external IPv6** (globally routable) ranges; global load balancers accept IPv6 clients.", "**OCI**: VCNs support IPv6 /56 prefixes (Oracle-allocated or your own) with /64 subnets; dual-stack instances, load balancers and gateways."]}, {"k": "tip", "kind": "Tip", "x": "A practical rollout order: make public entry points (load balancers, CDN) dual-stack first, since that's where users arrive; move internal networks later."}]}, {"t": "Transition mechanisms", "tag": null, "blocks": [{"k": "p", "x": "The Internet will run IPv4 and IPv6 side by side for years. Common transition tools:"}, {"k": "ul", "x": ["**Dual-stack**: hosts and networks run both. Simple and the most common, but you still need IPv4 addresses.", "**NAT64 + DNS64**: IPv6-only clients reach IPv4-only servers. DNS64 synthesises AAAA records from A records using the prefix `64:ff9b::/96`, and NAT64 translates the traffic. Cloud NAT64 options exist on AWS (NAT gateway) and Google Cloud (Cloud NAT with DNS64).", "**464XLAT**: lets IPv4-only apps work on IPv6-only mobile networks (used by many mobile carriers).", "**Tunnels** (6in4, 6rd, and IPv6 over IPsec): carry IPv6 across IPv4-only networks."]}, {"k": "p", "x": "Why go IPv6-only in parts of the cloud? Public IPv4 addresses now cost money on every major cloud, large Kubernetes clusters can exhaust private IPv4 space, and IPv6-only subnets remove that pressure."}, {"k": "code", "t": "How DNS64 synthesises an address", "x": "Query:  AAAA api.legacy.example  → none exists, A = 198.51.100.7\nDNS64:  returns AAAA 64:ff9b::c633:6407  (198.51.100.7 embedded in the last 32 bits)\nNAT64:  translates traffic to 64:ff9b::/96 into IPv4 toward 198.51.100.7"}, {"k": "tip", "kind": "Tip", "x": "Start IPv6-only with new, containerised workloads that talk mostly to modern services, and keep dual-stack for everything that faces users."}]}, {"t": "Real-world scenario: dual-stack load balancer, IPv4-only firewall", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** A company enables IPv6 on its public load balancer to support mobile carriers that are moving to IPv6. A week later, the security team notices that the WAF dashboards show less traffic than the load balancer, and a penetration test reaches an admin page that should be blocked."}, {"k": "p", "x": "**Investigation.** The WAF and access rules were written with IPv4 sources only (allow-lists of office IPs for `/admin`, deny lists of known bad IPv4 ranges). IPv6 clients matched none of the IPv4 rules. The \"allow office only\" rule didn't block IPv6, because the default for unmatched traffic on that path was allow."}, {"k": "p", "x": "**Fix.**"}, {"k": "ol", "x": ["Rewrite rules to cover both families: office IPv6 prefixes added to the admin allow-list, and the default action for `/admin` changed to deny.", "Review every firewall, security group and WAF rule for missing `::/0` or IPv6 equivalents.", "Add IPv6 cases to automated security tests."]}, {"k": "p", "x": "**Lessons learned.** Enabling IPv6 creates a second, parallel path into your systems. Every control (security groups, NACLs, WAF, rate limits, logging) must be checked for IPv6 before you turn it on."}]}], "q": [{"t": "Which IPv6 range is link-local?", "o": ["2000::/3", "fd00::/8", "fe80::/10", "ff00::/8"], "a": 2, "x": "fe80::/10 addresses exist on every interface and stay on the local link."}, {"t": "What replaces ARP in IPv6?", "o": ["DHCPv6", "Neighbor Discovery (NS/NA messages)", "Multicast DNS", "SLAAC"], "a": 1, "x": "NDP neighbour solicitation and advertisement map IPv6 addresses to link-layer addresses."}, {"t": "Why must ICMPv6 \"Packet Too Big\" never be blocked?", "o": ["It carries DNS", "IPv6 routers don't fragment, so path MTU discovery depends on it", "It is needed for SLAAC", "It is required by TLS"], "a": 1, "x": "Without Packet Too Big messages, large packets silently disappear."}, {"t": "An IPv6-only workload needs to call an IPv4-only API. Which combination helps?", "o": ["SLAAC and DHCPv6", "DNS64 and NAT64", "ULA and link-local", "Egress-only gateway alone"], "a": 1, "x": "DNS64 creates synthetic AAAA records and NAT64 translates the traffic to IPv4."}, {"t": "An AWS instance has a global IPv6 address. How do you allow outbound IPv6 but block inbound connections?", "o": ["Use a NAT gateway", "Route ::/0 to an egress-only Internet gateway", "Remove the IPv6 address", "Use an IPv4 security group rule"], "a": 1, "x": "Egress-only Internet gateways allow outbound IPv6 and block unsolicited inbound traffic."}, {"t": "After enabling IPv6 on a load balancer, an admin page that should be blocked is reachable. Why?", "o": ["IPv6 bypasses TLS", "The access rules only covered IPv4 sources and the default for unmatched traffic was allow", "The certificate didn't include IPv6", "IPv6 is always unfiltered"], "a": 1, "x": "IPv6 clients didn't match IPv4-only rules; controls must cover both families with a deny default."}], "lv": 2, "h": 5, "goal": "Plan, run and secure IPv6 and dual-stack networks in the cloud.", "terms": ["global unicast", "link-local", "ULA", "multicast", "SLAAC", "NDP", "router advertisement", "DHCPv6", "privacy addresses", "ICMPv6", "dual-stack", "IPv6-only", "NAT64", "DNS64", "egress-only gateway"]}, {"id": "m27", "t": "Advanced Routing & Overlays", "res": [["Cloudflare Learning: what is MPLS", "https://www.cloudflare.com/learning/network-layer/what-is-mpls/"], ["RFC 7348: VXLAN", "https://www.rfc-editor.org/rfc/rfc7348"], ["RFC 8926: Geneve", "https://www.rfc-editor.org/rfc/rfc8926"], ["AWS Gateway Load Balancer (Geneve)", "https://docs.aws.amazon.com/elasticloadbalancing/latest/gateway/introduction.html"]], "sum": ["OSPF builds a shared map inside an organisation; BGP connects organisations.", "Administrative distance and longest-prefix match decide which route wins.", "VRFs give separate routing tables on shared hardware, like cloud route-table segmentation.", "Overlays (GRE, VXLAN, Geneve) carry virtual networks across physical ones; mind the MTU."], "ls": [{"t": "OSPF in depth", "tag": null, "blocks": [{"k": "p", "x": "**OSPF** (Open Shortest Path First) is the most widely used interior routing protocol. Each router floods **link-state advertisements (LSAs)** describing its links, so every router builds the same map (the link-state database) and runs Dijkstra's shortest-path algorithm on it."}, {"k": "p", "x": "Key ideas:"}, {"k": "ul", "x": ["**Cost**: each link has a cost, normally based on bandwidth. The path with the lowest total cost wins.", "**Areas**: large networks are split into areas connected to a backbone **area 0**. Routers at area borders (**ABRs**) summarise routes, limiting how far changes spread.", "**Neighbours**: routers form adjacencies with hello packets; on shared segments a **designated router (DR)** reduces flooding.", "**Fast convergence**: when a link fails, LSAs flood and routers recalculate within seconds (faster with tuned timers and BFD)."]}, {"k": "code", "t": "Minimal OSPF configuration (Cisco-style)", "x": "router ospf 1\n router-id 10.255.0.1\n network 10.10.0.0 0.0.255.255 area 0\n passive-interface default\n no passive-interface Gi0/1"}, {"k": "tip", "kind": "In the cloud", "x": "Clouds don't run OSPF with you; their edges speak BGP. A common on-premises design runs OSPF (or IS-IS) inside the campus and data centre, and BGP at the edge toward ISPs and clouds."}]}, {"t": "Route selection and administrative distance", "tag": null, "blocks": [{"k": "p", "x": "A router can learn the same prefix from several sources. It chooses in this order:"}, {"k": "ol", "x": ["**Longest prefix match**: the most specific route always wins, whatever its source.", "For identical prefixes, **administrative distance (AD)**: how trustworthy the source is. Typical Cisco values: connected 0, static 1, eBGP 20, OSPF 110, IS-IS 115, RIP 120, iBGP 200. Lower wins.", "Within one protocol, its own **metric** (OSPF cost, BGP attributes)."]}, {"k": "p", "x": "This explains many surprises. A static route to `10.20.0.0/16` beats the same prefix learned via OSPF; a more specific `/24` learned from BGP beats a static `/16`."}, {"k": "p", "x": "**Floating static routes** use a deliberately high AD (for example 250) as a backup: they are only installed if the dynamic route disappears."}, {"k": "code", "t": "A floating static backup route", "x": "ip route 10.20.0.0 255.255.0.0 192.0.2.1          ! primary via link A\nip route 10.20.0.0 255.255.0.0 198.51.100.1 250   ! used only if the primary disappears"}, {"k": "tip", "kind": "In the cloud", "x": "Cloud route tables have their own priority rules when prefixes tie, for example static routes over propagated ones, or Direct Connect over VPN. Read each provider's route-priority documentation when mixing static and BGP routes."}]}, {"t": "ECMP and load sharing", "tag": null, "blocks": [{"k": "p", "x": "**Equal-cost multipath (ECMP)** installs several next hops for the same prefix when they have equal cost, and spreads traffic across them. Routers hash fields of each packet (usually the 5-tuple), so all packets of one flow follow the same path and stay in order, while different flows use different paths."}, {"k": "p", "x": "Consequences:"}, {"k": "ul", "x": ["One large flow (a single big file copy) still uses only one path; ECMP helps with many flows.", "Adding or removing a path can rehash flows onto different paths; stateful devices in the path may drop them unless they share state.", "In the cloud, ECMP over several VPN tunnels (for example, Transit Gateway with ECMP, or multiple HA VPN tunnels) increases total bandwidth beyond a single tunnel's limit."]}, {"k": "tip", "kind": "Watch out", "x": "Placing stateful firewalls on ECMP paths without symmetric hashing or state sharing causes \"random\" connection drops, because replies return through a different firewall than the request."}]}, {"t": "VRFs and network segmentation", "tag": null, "blocks": [{"k": "p", "x": "A **VRF** (virtual routing and forwarding instance) gives a router several completely separate routing tables. Interfaces belong to one VRF, and traffic in one VRF can't reach another unless you explicitly **leak** routes between them. The same address range can even exist in two VRFs."}, {"k": "p", "x": "Uses:"}, {"k": "ul", "x": ["Separating tenants, environments (prod/dev) or security zones on shared hardware", "Carrier networks: **MPLS L3VPN** gives each customer its own VRF across the provider's backbone, with labels (rather than IP lookups) forwarding traffic through the core", "Management networks isolated from data traffic"]}, {"k": "p", "x": "The same idea appears throughout the cloud, under different names:"}, {"k": "code", "t": "VRF-style segmentation in the cloud", "x": "AWS:   Transit Gateway route tables; Cloud WAN segments\nAzure: Virtual WAN route tables and labels; separate hub VNets\nGCP:   separate VPC networks connected through NCC with spoke filtering\nOCI:   DRG route tables with import route distributions"}, {"k": "tip", "kind": "Tip", "x": "Design segmentation once (\"prod, non-prod, shared, on-prem\") and implement it as VRFs on-premises and as route-table segmentation in each cloud."}]}, {"t": "Overlays and tunnels", "tag": null, "blocks": [{"k": "p", "x": "An **overlay** carries one network's packets inside another's, by adding an outer header. The underlying network (the **underlay**) only sees the outer addresses."}, {"k": "ul", "x": ["**GRE** (IP protocol 47): a simple generic tunnel, often combined with IPsec for encryption, and used by some cloud services to carry BGP to virtual appliances.", "**IPsec**: encrypted tunnels for site-to-site VPNs (tunnel mode).", "**VXLAN** (UDP 4789): wraps Ethernet frames in UDP, with a 24-bit **VNI** allowing about 16 million segments instead of 4,094 VLANs. The standard data-centre overlay, typically with **EVPN** (BGP-based) as the control plane to share MAC and IP locations.", "**Geneve** (UDP 6081): a flexible successor with extensible metadata. **AWS Gateway Load Balancer** uses Geneve to send traffic to firewall appliances, and many cloud virtual networks use similar encapsulation internally."]}, {"k": "p", "x": "Every overlay adds header bytes: GRE about 24, VXLAN about 50, IPsec around 50–70 depending on options. Without jumbo frames in the underlay or a reduced inner MTU, large packets fragment or drop."}, {"k": "tip", "kind": "Tip", "x": "When you design any tunnel, write down the MTU budget: underlay MTU minus all added headers equals the maximum inner packet. Then set MSS clamping accordingly."}]}, {"t": "Policy-based routing and redistribution", "tag": null, "blocks": [{"k": "p", "x": "Normal routing looks only at the destination. **Policy-based routing (PBR)** can choose a next hop based on source address, port or application; for example, sending guest Wi-Fi traffic out a cheaper Internet link. It's powerful but easy to forget, so document it carefully."}, {"k": "p", "x": "**Redistribution** copies routes from one protocol into another, such as static routes into OSPF, or OSPF into BGP at the edge. Done carelessly it causes routing loops, suboptimal paths and leaks of internal prefixes. Good practice:"}, {"k": "ul", "x": ["Filter with **route maps** or prefix lists: redistribute only what's needed", "**Tag** redistributed routes to stop them being redistributed back", "**Summarise** at boundaries", "Prefer one direction of redistribution where possible"]}, {"k": "code", "t": "Redistribute only approved prefixes into BGP", "x": "ip prefix-list ONPREM-SUMMARY seq 10 permit 10.100.0.0/14\nroute-map OSPF-TO-BGP permit 10\n match ip address prefix-list ONPREM-SUMMARY\nrouter bgp 65010\n redistribute ospf 1 route-map OSPF-TO-BGP"}, {"k": "tip", "kind": "Watch out", "x": "Redistributing a full on-premises routing table into a cloud BGP session can exceed the provider's prefix limit and drop the session. Advertise filtered summaries only."}]}, {"t": "Real-world scenario: ECMP and the stateful firewalls", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** A data centre connects to a cloud hub through two firewall clusters for capacity, using ECMP on the routers on both sides. Some users report that SSH sessions and database connections drop randomly, while web browsing mostly works."}, {"k": "p", "x": "**Investigation.**"}, {"k": "ol", "x": ["Flow logs and firewall logs show many connections where the SYN passed firewall A but the SYN-ACK arrived at firewall B, which had no state for the connection and dropped it.", "The on-premises routers hashed traffic using the 5-tuple, but the cloud-side routers hashed on source and destination IP only, so the two directions of a connection could take different paths.", "Web browsing \"mostly worked\" because browsers retry and open many short connections."]}, {"k": "p", "x": "**Fix.** Options considered: synchronise state between the firewall clusters, make hashing symmetric on both sides, or steer each direction deterministically. The team configured symmetric hashing and, for the cloud side, used the provider's appliance-mode or flow-stickiness setting (for example, appliance mode on AWS Transit Gateway VPC attachments keeps both directions of a flow on the same appliance)."}, {"k": "p", "x": "**Lessons learned.** ECMP and stateful devices need symmetric paths. Whenever you add a firewall to a multipath design, ask: will both directions of every flow reach the same firewall?"}]}], "q": [{"t": "Which route wins: a static route to 10.20.0.0/16 or an OSPF route to 10.20.5.0/24, for traffic to 10.20.5.9?", "o": ["The static route, because its administrative distance is lower", "The OSPF /24, because longest-prefix match comes first", "Both are used equally", "Neither; the packet is dropped"], "a": 1, "x": "Longest-prefix match is evaluated before administrative distance."}, {"t": "Why does one large file transfer not get faster with four ECMP paths?", "o": ["ECMP only works for UDP", "Each flow is hashed onto a single path to keep packets in order", "ECMP requires jumbo frames", "The paths must have different costs"], "a": 1, "x": "ECMP spreads flows, not individual packets, across paths."}, {"t": "How many segments can a 24-bit VXLAN network identifier address?", "o": ["4,094", "65,536", "About 16 million", "Unlimited"], "a": 2, "x": "2^24 ≈ 16.7 million segments, versus 4,094 VLANs."}, {"t": "What do VRFs provide on a single router?", "o": ["Faster forwarding", "Separate, isolated routing tables", "Encryption", "Wireless roaming"], "a": 1, "x": "Each VRF has its own routing table; traffic doesn't cross without route leaking."}, {"t": "Which encapsulation does AWS Gateway Load Balancer use to send traffic to appliances?", "o": ["GRE", "VXLAN", "Geneve", "MPLS"], "a": 2, "x": "Gateway Load Balancer uses Geneve on UDP 6081."}, {"t": "Connections through two ECMP-balanced stateful firewalls drop randomly. What is the likely cause?", "o": ["MTU", "DNS", "Asymmetric paths: the reply reaches a firewall that never saw the request", "An expired certificate"], "a": 2, "x": "Stateful firewalls need both directions of a flow; symmetric hashing or state sync fixes it."}], "lv": 2, "h": 6, "goal": "Master the routing and tunnelling techniques used inside enterprise and cloud backbones.", "terms": ["OSPF", "area", "LSA", "cost", "administrative distance", "ECMP", "VRF", "route leaking", "MPLS", "GRE", "VXLAN", "VNI", "Geneve", "EVPN", "policy-based routing", "redistribution"]}, {"id": "m10", "t": "Cloud Foundations", "res": [["AWS shared responsibility model", "https://aws.amazon.com/compliance/shared-responsibility-model/"], ["Azure: shared responsibility in the cloud", "https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility"], ["Google Cloud: geography and regions", "https://cloud.google.com/docs/geography-and-regions"], ["OCI: regions and availability domains", "https://docs.oracle.com/en-us/iaas/Content/General/Concepts/regions.htm"]], "sum": ["You are always responsible for your network rules, identities and data.", "Spread workloads across zones (or OCI fault domains) for resilience.", "Data leaving the cloud, a zone or a region costs money; design for it.", "Organise accounts, subscriptions, projects or compartments before building networks."], "ls": [{"t": "Service models", "tag": "all", "blocks": [{"k": "p", "x": "Cloud services come in three broad models, depending on how much the provider manages for you."}, {"k": "ul", "x": ["**IaaS** (Infrastructure as a Service): you rent virtual machines, disks and networks. You manage the operating system, patches, middleware and applications. Examples: Amazon EC2, Azure Virtual Machines, Google Compute Engine, OCI Compute.", "**PaaS** (Platform as a Service): the provider runs the platform; you deploy code or data. Examples: managed databases (Amazon RDS, Azure SQL Database, Cloud SQL, Oracle Autonomous Database), Kubernetes services, serverless functions.", "**SaaS** (Software as a Service): finished applications such as Microsoft 365 or Salesforce."]}, {"k": "p", "x": "Networking skills matter most for IaaS and PaaS. Even fully managed PaaS services need networking decisions: should the database have a public endpoint or a private one inside your network? Which subnets can reach it?"}, {"k": "tip", "kind": "Tip", "x": "Prefer managed services where you can. Every server you do not run is one you do not have to patch, scale or secure at the OS level."}]}, {"t": "Shared responsibility", "tag": "all", "blocks": [{"k": "p", "x": "Security in the cloud is split between the provider and you."}, {"k": "p", "x": "The **provider** is responsible for security *of* the cloud: physical data centres, hardware, the global network, the hypervisor, and the managed parts of each service."}, {"k": "p", "x": "**You** are responsible for security *in* the cloud: who has access (identity and permissions), network rules (security groups, firewalls, public exposure), operating system patches on VMs, application code, and data protection (encryption, backups, classification)."}, {"k": "p", "x": "The line moves with the service model: with IaaS you own the OS; with PaaS the provider patches the platform, but you still own access, network exposure and data. You *never* hand over responsibility for identities and data."}, {"k": "tip", "kind": "Watch out", "x": "Most cloud security incidents are customer misconfigurations: storage buckets left public, databases with public IPs, SSH open to the world, leaked access keys. The provider's infrastructure is rarely the weak point."}]}, {"t": "Regions, zones and domains", "tag": "all", "blocks": [{"k": "p", "x": "A **region** is a geographic area with several data centres, such as AWS me-central-1 (UAE), Azure UAE North (Dubai), Google Cloud me-central1 (Doha) or OCI me-dubai-1. Choose regions for latency to users, data residency rules and service availability; not every service exists in every region."}, {"k": "p", "x": "Inside most regions are isolated failure areas:"}, {"k": "ul", "x": ["**AWS, Azure and Google Cloud**: **availability zones**, separate data centres with independent power, cooling and networking, connected by fast links (typically under 2 ms apart).", "**OCI**: **availability domains** (some regions have three, many have one) and, inside each, three **fault domains**, groupings of hardware that do not share single points of failure."]}, {"k": "p", "x": "To survive a data-centre failure, run at least two copies of each component in different zones (or OCI fault domains / availability domains), behind a load balancer. To survive a regional disaster, replicate to a second region."}, {"k": "ul", "x": ["Region = geography; zone/AD = data centre; fault domain = hardware group (OCI)", "Multi-zone for high availability; multi-region for disaster recovery"]}, {"k": "tip", "kind": "Tip", "x": "Zone names are mapped per account on AWS: your \"us-east-1a\" may be a different physical zone from someone else's. Use zone IDs (use1-az1) when coordinating across accounts."}]}, {"t": "The four providers at a glance", "tag": "all", "blocks": [{"k": "p", "x": "All four offer the same building blocks, but each has its own philosophy."}, {"k": "ul", "x": ["**AWS**: the largest catalogue and longest track record. Networks are built from many small, composable parts: VPC, subnets, route tables, gateways, Transit Gateway. Regional VPCs, subnets per zone.", "**Microsoft Azure**: deep integration with Microsoft Entra ID (identity), Windows and Microsoft 365. Strong hybrid story. Regional VNets with subnets that span zones; many services need their own dedicated subnet.", "**Google Cloud**: built on Google's private global backbone. A single **global VPC** can contain subnets in every region, and global load balancers use one anycast IP worldwide. Strong in data, analytics and Kubernetes (GKE).", "**Oracle Cloud Infrastructure (OCI)**: the natural home for Oracle Database and Exadata, with flat, predictable pricing and generous outbound data allowance. Regional VCNs with the Dynamic Routing Gateway as the hub."]}, {"k": "tip", "kind": "In the cloud", "x": "Use the Cloud Rosetta tab to translate service names between the four. The concepts are the same; the names and limits differ."}]}, {"t": "The cost of networking", "tag": "all", "blocks": [{"k": "p", "x": "Networking has its own line on the cloud bill, and it surprises many teams."}, {"k": "ul", "x": ["**Ingress** (data coming into the cloud from the Internet) is usually free.", "**Egress** (data going out to the Internet) is charged per GB on AWS, Azure and Google Cloud after a small free allowance. OCI includes 10 TB of outbound data per month free, which is much more generous.", "**Cross-zone** traffic is charged on some providers (for example, AWS charges for data between availability zones).", "**Cross-region** and inter-continental traffic costs more.", "**Managed network services** charge per hour and per GB: NAT gateways, load balancers, VPN gateways, Transit Gateway attachments, private endpoints, firewalls."]}, {"k": "p", "x": "Design habits that save money: keep chatty services in the same zone where resilience allows; use private endpoints or gateway endpoints for storage instead of routing through NAT; put a CDN in front of public content; and delete idle NAT gateways and load balancers in test environments."}, {"k": "tip", "kind": "Watch out", "x": "A NAT gateway left running in a lab costs money every hour even with no traffic. Always tear lab resources down."}]}, {"t": "Landing zones and resource organisation", "tag": "all", "blocks": [{"k": "p", "x": "Before building networks, decide how cloud resources are organised. This boundary controls billing, permissions, policy and blast radius."}, {"k": "ul", "x": ["**AWS**: **AWS Organizations** with many **accounts** (one per workload and environment), grouped into organizational units. **Service control policies (SCPs)** set guardrails. AWS Control Tower sets up a standard multi-account landing zone.", "**Azure**: **management groups** → **subscriptions** → **resource groups**. **Azure Policy** enforces rules. The Azure landing zone reference architecture is the standard pattern.", "**Google Cloud**: **organization** → **folders** → **projects**. **Organization policies** set constraints.", "**OCI**: a **tenancy** containing nested **compartments**. IAM policies are written against compartments."]}, {"k": "p", "x": "A **landing zone** is a pre-built, secure starting environment: account/subscription structure, identity, logging, central networking (hub), and guardrails. Networking teams typically own a shared \"network\" or \"connectivity\" account/subscription/project with the hub, VPN and private links."}, {"k": "tip", "kind": "Tip", "x": "Never put production and development in the same account, subscription or project. Separate boundaries make permissions, costs and incidents far easier to manage."}]}, {"t": "Real-world scenario: the surprise network bill", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** A company's first month on the cloud ends with a network bill three times the estimate. Compute and storage costs were as expected."}, {"k": "p", "x": "**Investigation (using the billing breakdown and flow logs).**"}, {"k": "ol", "x": ["**NAT gateway data processing** is the biggest item: application servers in private subnets download container images and read terabytes from object storage *through the NAT gateway*.", "**Cross-zone data transfer**: the app tier in zone A talks constantly to a cache cluster in zone B.", "**Internet egress**: users download large reports directly from the servers, with no CDN.", "Two forgotten test environments, each with its own NAT gateway and load balancer, run 24/7."]}, {"k": "p", "x": "**Fix.**"}, {"k": "ol", "x": ["Add a storage gateway endpoint (free) and private endpoints for the container registry, removing most NAT traffic.", "Use zone-aware routing so app servers prefer the cache node in their own zone.", "Serve reports through a CDN and object storage with signed URLs.", "Schedule test environments to shut down at night and delete unused NAT gateways and load balancers."]}, {"k": "p", "x": "The next month's network bill fell by about 70%."}, {"k": "p", "x": "**Lessons learned.** Network costs follow the path data takes. Draw the data paths, check which ones cross NAT, zones, regions or the Internet, and design to keep heavy flows local and private."}]}], "q": [{"t": "In the shared responsibility model, who configures security group rules?", "o": ["The provider", "The customer", "Both equally", "The ISP"], "a": 1, "x": "Everything you configure is your responsibility."}, {"t": "Which traffic is usually free?", "o": ["Internet egress", "Cross-region", "Inbound from the Internet", "NAT processing"], "a": 2, "x": "Ingress is generally free; egress and processing are billed."}, {"t": "On OCI, what is the hardware grouping inside an availability domain that you spread instances across?", "o": ["Zone", "Rack set", "Fault domain", "Compartment"], "a": 2, "x": "Each OCI availability domain has three fault domains."}, {"t": "Which provider's VPC can contain subnets in every region by default?", "o": ["AWS", "Azure", "Google Cloud", "OCI"], "a": 2, "x": "Google Cloud VPCs are global resources with regional subnets."}, {"t": "Which is the best way to protect production from mistakes made in development?", "o": ["Use different subnets in the same account", "Use naming conventions", "Use separate accounts, subscriptions or projects", "Use different regions"], "a": 2, "x": "Separate top-level boundaries isolate permissions, policies, billing and blast radius."}, {"t": "Which change usually removes the most NAT gateway cost for workloads reading object storage?", "o": ["Bigger instances", "A storage gateway or private endpoint so traffic bypasses NAT", "A second NAT gateway", "A longer DNS TTL"], "a": 1, "x": "Endpoints keep storage traffic off the NAT gateway and its per-GB charge."}], "lv": 3, "h": 4, "goal": "Speak the shared language of all four providers.", "terms": ["IaaS", "PaaS", "SaaS", "shared responsibility", "region", "availability zone", "availability domain", "fault domain", "egress", "landing zone"]}, {"id": "m11", "t": "Cloud Identity & Access", "res": [["AWS IAM best practices", "https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html"], ["Azure RBAC overview", "https://learn.microsoft.com/en-us/azure/role-based-access-control/overview"], ["Google Cloud IAM overview", "https://cloud.google.com/iam/docs/overview"], ["OCI IAM policies", "https://docs.oracle.com/en-us/iaas/Content/Identity/Concepts/policygetstarted.htm"]], "sum": ["Identity is the real perimeter in the cloud; protect it with MFA and least privilege.", "Workloads should use roles, managed identities or service accounts, never stored keys.", "Permissions are inherited down the hierarchy; grant at the lowest level that works.", "Separate network administration from application administration."], "ls": [{"t": "IAM principles", "tag": "all", "blocks": [{"k": "p", "x": "Every cloud request answers three questions:"}, {"k": "ul", "x": ["**Authentication**: who are you? (password plus MFA, a certificate, a federated login, a workload token)", "**Authorization**: what are you allowed to do? (policies and roles)", "**Audit**: what did you do? (AWS CloudTrail, Azure Activity Log, Google Cloud Audit Logs, OCI Audit)"]}, {"k": "p", "x": "Core practices are the same everywhere:"}, {"k": "ul", "x": ["**Least privilege
