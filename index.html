 Load Balancer endpoint", "Resolver endpoint"], "a": 1, "x": "Gateway endpoints add routes for S3 and DynamoDB at no charge."}, {"t": "Which tool tells you which security group or route blocks traffic between two resources, without sending packets?", "o": ["VPC Flow Logs", "Traffic Mirroring", "Reachability Analyzer", "CloudTrail"], "a": 2, "x": "Reachability Analyzer analyses configuration and names the blocking component."}], "lv": 4, "h": 9, "p": "aws", "goal": "Design and build production VPC networks on AWS.", "terms": ["VPC", "subnet", "Internet gateway", "NAT gateway", "Elastic IP", "security group", "network ACL", "VPC peering", "Transit Gateway", "Cloud WAN", "gateway endpoint", "PrivateLink", "Route 53", "ALB", "NLB", "Direct Connect"]}, {"id": "m14", "t": "Azure Networking", "res": [["Azure Virtual Network documentation", "https://learn.microsoft.com/en-us/azure/virtual-network/"], ["Azure hub-spoke topology", "https://learn.microsoft.com/en-us/azure/architecture/networking/architecture/hub-spoke"], ["Azure Private Link and Private Endpoint", "https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview"], ["Azure ExpressRoute", "https://learn.microsoft.com/en-us/azure/expressroute/expressroute-introduction"], ["Azure Network Watcher", "https://learn.microsoft.com/en-us/azure/network-watcher/network-watcher-overview"]], "sum": ["VNets are regional, subnets are zone-spanning; several services need their own named subnet.", "NSGs with service tags and ASGs are the core filter; UDRs force traffic through a firewall.", "Hub-and-spoke (or Virtual WAN) is the standard enterprise topology.", "Private Endpoints plus Private DNS zones keep PaaS traffic off the Internet."], "ls": [{"t": "VNets and subnets", "tag": null, "blocks": [{"k": "p", "x": "An Azure **virtual network (VNet)** is regional and has one or more address spaces. **Subnets** span every availability zone in the region; you pick the zone per VM or per zone-redundant service."}, {"k": "p", "x": "Several Azure services require a **dedicated subnet with a fixed name** and minimum size:"}, {"k": "ul", "x": ["**GatewaySubnet** for VPN and ExpressRoute gateways (/27 or larger recommended)", "**AzureFirewallSubnet** for Azure Firewall (/26)", "**AzureBastionSubnet** for Azure Bastion (/26 or larger)", "**RouteServerSubnet** for Azure Route Server (/26 or larger)"]}, {"k": "p", "x": "Other services use **subnet delegation**, which hands a subnet to a PaaS service (such as Azure SQL Managed Instance, App Service VNet integration or Azure Container Instances) so it can create its own resources there."}, {"k": "code", "t": "Create a VNet with app and data subnets (Azure CLI)", "x": "az network vnet create -g rg-net-prod -n vnet-prod-uaen \\\n  --address-prefixes 10.20.0.0/16 \\\n  --subnet-name snet-app --subnet-prefixes 10.20.1.0/24\naz network vnet subnet create -g rg-net-prod --vnet-name vnet-prod-uaen \\\n  -n snet-data --address-prefixes 10.20.2.0/24"}, {"k": "tip", "kind": "Watch out", "x": "Azure reserves 5 addresses per subnet, and you cannot resize a subnet that has resources in it. Size dedicated subnets generously from the start."}]}, {"t": "NSGs, ASGs and service tags", "tag": null, "blocks": [{"k": "p", "x": "A **network security group (NSG)** is a stateful list of allow and deny rules, evaluated by **priority** (100–4096, lowest number first, first match wins). Attach NSGs to subnets, NICs or both; traffic must pass both if both are present."}, {"k": "p", "x": "Every NSG has **default rules** at priorities 65000+: allow traffic within the VNet (`VirtualNetwork` tag), allow Azure Load Balancer probes, allow all outbound to the Internet, and deny everything else inbound."}, {"k": "p", "x": "Two features make NSG rules much cleaner:"}, {"k": "ul", "x": ["**Service tags** are Microsoft-maintained groups of IP ranges, such as `Internet`, `VirtualNetwork`, `AzureLoadBalancer`, `Storage`, `Sql.UAENorth` or `AzureCloud`. They update automatically.", "**Application security groups (ASGs)** group NICs by role. A rule like \"allow 1433 from asg-app to asg-db\" follows VMs regardless of their IPs."]}, {"k": "code", "t": "NSG rules for a data subnet", "x": "Priority 100  Allow  TCP 1433  from ASG asg-app   to ASG asg-db\nPriority 4000 Deny   Any       from VirtualNetwork to Any\n(defaults below: AllowVnetInBound would otherwise allow all VNet traffic)"}, {"k": "tip", "kind": "Tip", "x": "The default \"AllowVnetInBound\" rule allows all traffic inside the VNet, including from peered VNets. Add an explicit deny above it on sensitive subnets."}]}, {"t": "Routing, UDRs and Route Server", "tag": null, "blocks": [{"k": "p", "x": "Azure creates **system routes** automatically: local VNet traffic, peered VNets, gateway-learned routes and a default route to the Internet."}, {"k": "p", "x": "**User-defined routes (UDRs)** in **route tables** attached to subnets override them. Each route has a next hop type: **Virtual appliance** (a firewall's private IP), **Virtual network gateway**, **Internet**, **Virtual network** or **None** (drop)."}, {"k": "p", "x": "The most common UDR sends everything leaving a spoke subnet through the hub firewall:"}, {"k": "code", "t": "Force tunnelling a spoke through Azure Firewall", "x": "Route table rt-spoke-app (attached to snet-app)\n  0.0.0.0/0     → Virtual appliance 10.0.1.4   (Azure Firewall private IP)\n  10.0.0.0/8    → Virtual appliance 10.0.1.4   (east-west inspection)\nOption on the route table: disable BGP route propagation if on-prem routes should also go via the firewall"}, {"k": "p", "x": "**Azure Route Server** lets network virtual appliances (third-party firewalls, SD-WAN routers) exchange routes with the VNet using **BGP**, so you don't have to maintain UDRs by hand."}, {"k": "tip", "kind": "Tip", "x": "In the portal, a VM's NIC shows **Effective routes** and **Effective security rules**. These are the first things to check when traffic goes the wrong way."}]}, {"t": "Hub-and-spoke, Virtual WAN and Virtual Network Manager", "tag": null, "blocks": [{"k": "p", "x": "**VNet peering** connects VNets in the same region or across regions (global peering) over Microsoft's backbone with low latency. It is **non-transitive**: two spokes peered to the same hub cannot talk to each other unless traffic is routed through something in the hub (a firewall or NVA) with UDRs."}, {"k": "p", "x": "The **hub-and-spoke** pattern puts shared services in a **hub VNet**: Azure Firewall, VPN/ExpressRoute gateways, Bastion and DNS resolvers. Each workload gets a **spoke VNet** peered to the hub. Peering options **Allow gateway transit** (on the hub) and **Use remote gateways** (on the spoke) let spokes use the hub's VPN/ExpressRoute gateway."}, {"k": "p", "x": "**Azure Virtual WAN** is a Microsoft-managed hub: you deploy **virtual hubs** per region, connect VNets, VPN sites, ExpressRoute and remote users, and the hubs route between all of them automatically. A **secured virtual hub** includes Azure Firewall and routing intent to inspect traffic."}, {"k": "p", "x": "**Azure Virtual Network Manager (AVNM)** manages connectivity and security at scale: create hub-and-spoke or mesh topologies across many VNets and subscriptions, and apply **security admin rules** that override NSGs (for example, \"always deny RDP from the Internet\")."}, {"k": "tip", "kind": "Tip", "x": "Choose self-managed hub-and-spoke when you need full control or third-party appliances; choose Virtual WAN when you have many branches and regions and want Microsoft to manage the routing."}]}, {"t": "Private Endpoints and Private DNS", "tag": null, "blocks": [{"k": "p", "x": "Azure PaaS services (Storage, SQL Database, Key Vault, Cosmos DB and many more) have public endpoints by default. Two ways keep traffic private:"}, {"k": "ul", "x": ["**Service endpoints**: extend your VNet identity to the service over the Azure backbone; the service's firewall can then allow only your subnet. The service still uses its public IP.", "**Private Endpoints** (Azure Private Link): a NIC with a **private IP in your subnet** that maps to one specific resource (one storage account, one SQL server). You can then disable public access entirely. This is the recommended approach."]}, {"k": "p", "x": "Private Endpoints need DNS to work: the public name `mystorage.blob.core.windows.net` must resolve to the private IP. Azure does this with a CNAME to `mystorage.privatelink.blob.core.windows.net` and a **Private DNS zone** `privatelink.blob.core.windows.net` linked to your VNets."}, {"k": "p", "x": "For hybrid DNS, **Azure DNS Private Resolver** provides an **inbound endpoint** (on-premises DNS forwards Azure zones to it) and an **outbound endpoint** with forwarding rulesets (Azure resolves on-premises zones)."}, {"k": "tip", "kind": "Watch out", "x": "The most common Private Endpoint problem is DNS: on-premises clients still resolve the public IP. Forward `privatelink.*` zones (or the service zones) to the Private Resolver inbound endpoint."}]}, {"t": "Load balancing and edge services", "tag": null, "blocks": [{"k": "p", "x": "Azure has four main traffic services:"}, {"k": "ul", "x": ["**Azure Load Balancer** (Standard SKU): regional L4, TCP/UDP, zone-redundant, internal or public. Also used for outbound rules.", "**Application Gateway v2**: regional L7 reverse proxy with path and host routing, TLS termination, autoscaling and **Web Application Firewall** (OWASP rule sets, bot protection).", "**Azure Front Door** (Standard/Premium): global L7 entry point on Microsoft's edge, with CDN caching, WAF, and Private Link to origins (Premium).", "**Traffic Manager**: DNS-based global routing (priority, weighted, performance, geographic)."]}, {"k": "p", "x": "Protection: **Azure DDoS Protection** (network-level, per VNet) and **Azure Firewall** in three SKUs: Basic, Standard (FQDN filtering, threat intelligence) and Premium (TLS inspection, IDPS, URL filtering)."}, {"k": "tip", "kind": "Tip", "x": "A typical global web app: Front Door (WAF) → Application Gateway or AKS ingress in two regions → private backends. For a single region: Application Gateway with WAF in front of private backends."}]}, {"t": "Hybrid connectivity on Azure", "tag": null, "blocks": [{"k": "p", "x": "**VPN Gateway** provides site-to-site IPsec (IKEv1/IKEv2), point-to-site for users, and VNet-to-VNet tunnels. SKUs (VpnGw1–5 and their zone-redundant **AZ** variants) set throughput and tunnel counts. Deploy **active-active** with BGP for resilience."}, {"k": "p", "x": "**ExpressRoute** provides private connectivity through a connectivity provider or directly (**ExpressRoute Direct**, 10 or 100 Gbps ports):"}, {"k": "ul", "x": ["An **ExpressRoute circuit** has two connections for redundancy.", "**Private peering** reaches your VNets; **Microsoft peering** reaches Microsoft 365 and Azure public services.", "**ExpressRoute Global Reach** links your on-premises sites to each other through Microsoft's backbone.", "**FastPath** sends traffic directly to VMs, bypassing the gateway, for higher performance.", "Premium add-on extends reach across geopolitical regions and raises route limits."]}, {"k": "code", "t": "Typical resilient hybrid design", "x": "Two ExpressRoute circuits in different peering locations\n  → zone-redundant ExpressRoute gateway (ErGw*AZ) in the hub\nSite-to-Site VPN (active-active, BGP) as backup over the Internet\nBGP: on-prem advertises summaries; prefer ExpressRoute by default"}, {"k": "tip", "kind": "Watch out", "x": "ExpressRoute is not encrypted by default. Use MACsec on ExpressRoute Direct, or run IPsec over private peering when encryption is required."}]}, {"t": "Operating and troubleshooting Azure networks", "tag": null, "blocks": [{"k": "p", "x": "**Azure Network Watcher** is the toolbox:"}, {"k": "ul", "x": ["**IP flow verify**: is a specific packet to or from a VM allowed, and by which NSG rule?", "**Next hop**: where would traffic to a given IP go, and which route table decides it?", "**Connection troubleshoot**: test reachability from a VM to an endpoint, with hop-by-hop details.", "**Packet capture**: capture traffic on a VM to a storage account.", "**VNet flow logs**: record flows across a VNet (they replace the older NSG flow logs), viewable with **Traffic Analytics**.", "**Connection monitor**: continuous reachability and latency tests."]}, {"k": "code", "t": "Quick checks from the CLI", "x": "az network watcher test-ip-flow -g rg-app --vm vm-app1 \\\n  --direction Inbound --protocol TCP --local 10.20.1.4:443 --remote 10.0.1.10:50000\naz network watcher show-next-hop -g rg-app --vm vm-app1 \\\n  --source-ip 10.20.1.4 --dest-ip 10.30.2.5\naz network nic show-effective-route-table -g rg-app -n nic-app1 -o table"}, {"k": "tip", "kind": "Tip", "x": "If IP flow verify says \"Allowed\" and traffic still fails, the problem is not the NSG: check routes (next hop), the guest OS firewall, and whether the application is listening."}]}], "q": [{"t": "Two spoke VNets are both peered to a hub. By default, can they reach each other?", "o": ["Yes", "No", "Only through Bastion", "Only over IPv6"], "a": 1, "x": "Peering is non-transitive; route through a hub firewall or use Virtual WAN."}, {"t": "Which Azure service is a global L7 entry point with CDN features?", "o": ["Application Gateway", "Load Balancer", "Front Door", "VPN Gateway"], "a": 2, "x": "Front Door is global; Application Gateway is regional."}, {"t": "What must the subnet for an Azure VPN or ExpressRoute gateway be named?", "o": ["VpnSubnet", "HubSubnet", "GatewaySubnet", "AzureGatewaySubnet"], "a": 2, "x": "Gateways deploy only into a subnet named exactly GatewaySubnet."}, {"t": "A Private Endpoint for a storage account is created, but on-premises clients still reach the public IP. What is the likely cause?", "o": ["The NSG blocks traffic", "The Private Endpoint is in the wrong region", "On-premises DNS is not forwarding the privatelink zone to Azure", "ExpressRoute is down"], "a": 2, "x": "Private Endpoints depend on DNS resolving the name to the private IP."}, {"t": "Which NSG feature lets rules target VMs by role instead of IP address?", "o": ["Service tags", "Application security groups", "Route tables", "Subnet delegation"], "a": 1, "x": "ASGs group NICs so rules follow workloads, not addresses."}], "lv": 4, "h": 9, "p": "az", "goal": "Design hub-and-spoke and private networks on Azure.", "terms": ["VNet", "subnet delegation", "GatewaySubnet", "NSG", "ASG", "service tag", "UDR", "Route Server", "VNet peering", "Virtual WAN", "Virtual Network Manager", "Private Endpoint", "Private DNS zone", "Application Gateway", "Front Door", "ExpressRoute"]}, {"id": "m15", "t": "Google Cloud Networking", "res": [["Google Cloud VPC overview", "https://cloud.google.com/vpc/docs/overview"], ["Cloud NGFW (firewall) overview", "https://cloud.google.com/firewall/docs/about-firewalls"], ["Cloud Load Balancing overview", "https://cloud.google.com/load-balancing/docs/load-balancing-overview"], ["Cloud NAT overview", "https://cloud.google.com/nat/docs/overview"], ["Network Connectivity Center", "https://cloud.google.com/network-connectivity/docs/network-connectivity-center/concepts/overview"]], "sum": ["One global VPC with regional subnets; use custom mode and plan secondary ranges for GKE.", "Firewall policies plus service-account or secure-tag targets give scalable, IAM-controlled rules.", "Shared VPC is the standard way to centralise networking across projects.", "Cloud NAT, Private Google Access and Private Service Connect keep VMs private."], "ls": [{"t": "The global VPC", "tag": null, "blocks": [{"k": "p", "x": "A Google Cloud **VPC network** is a **global** resource. **Subnets** are regional, and each has a primary IPv4 range and optional **secondary ranges** (used for GKE Pods and Services). VMs in any region of the same VPC communicate over internal IPs across Google's private backbone, with no peering or VPN."}, {"k": "p", "x": "VPCs come in two modes. **Auto mode** creates a /20 subnet in every region from 10.128.0.0/9; convenient for labs but it will overlap with other auto-mode VPCs and wastes space. **Custom mode** lets you create exactly the subnets you need. Use custom mode for anything real; the `default` network in new projects is auto mode, so delete it."}, {"k": "code", "t": "Create a custom-mode VPC with two regional subnets (gcloud)", "x": "gcloud compute networks create vpc-prod --subnet-mode=custom\ngcloud compute networks subnets create snet-me-central1 --network=vpc-prod \\\n  --region=me-central1 --range=10.30.0.0/20 \\\n  --secondary-range=pods=10.31.0.0/16,services=10.32.0.0/20 \\\n  --enable-private-ip-google-access\ngcloud compute networks subnets create snet-europe-west1 --network=vpc-prod \\\n  --region=europe-west1 --range=10.30.16.0/20"}, {"k": "p", "x": "Google Cloud also offers two **network service tiers**: **Premium** (traffic enters and leaves Google's network close to the user; required for global load balancing) and **Standard** (traffic uses the public Internet more; cheaper, regional only)."}, {"k": "tip", "kind": "Tip", "x": "You can expand a subnet's primary range later (for example /20 → /19) without downtime, but you can't shrink it. Start reasonably and grow."}]}, {"t": "Firewall rules and policies", "tag": null, "blocks": [{"k": "p", "x": "Google Cloud's distributed firewall (**Cloud NGFW**) is stateful and enforced at each VM. Every VPC has two **implied rules**: allow all egress, and deny all ingress (priority 65535)."}, {"k": "p", "x": "Rules have a **priority** (0–65535, lower wins; default 1000), a direction, an action, a source or destination, protocols and ports, and a **target**:"}, {"k": "ul", "x": ["**All instances** in the network", "**Network tags** (free-text labels on VMs; anyone who can edit the VM can change them)", "**Service accounts** (stronger, because changing a VM's service account needs IAM permission)", "**Secure tags** (IAM-governed tags, usable in firewall policies)"]}, {"k": "p", "x": "There are several layers, evaluated in order: **hierarchical firewall policies** (at organization and folder level, set by the security team), **global and regional network firewall policies** (attached to a VPC), then **VPC firewall rules**. Cloud NGFW **Enterprise** adds intrusion prevention (IPS) and TLS inspection."}, {"k": "code", "t": "Allow load balancer health checks and HTTPS to web servers", "x": "gcloud compute firewall-rules create allow-hc-and-web --network=vpc-prod \\\n  --direction=INGRESS --action=ALLOW --rules=tcp:443,tcp:8080 \\\n  --source-ranges=35.191.0.0/16,130.211.0.0/22 \\\n  --target-service-accounts=web-sa@my-proj.iam.gserviceaccount.com"}, {"k": "tip", "kind": "Tip", "x": "Use **Firewall Insights** to find shadowed, unused and overly permissive rules, and enable **firewall rules logging** on the rules you need to audit."}]}, {"t": "Shared VPC, peering and Network Connectivity Center", "tag": null, "blocks": [{"k": "p", "x": "**Shared VPC** lets a **host project** own the VPC while **service projects** deploy VMs, GKE clusters and serverless connectors into its subnets. The network team keeps control of subnets, routes and firewalls; app teams get `roles/compute.networkUser` on chosen subnets. This is Google's recommended pattern for organisations."}, {"k": "p", "x": "**VPC Network Peering** connects two VPCs (in any projects or organisations) with internal IP connectivity. It is **non-transitive** and the ranges must not overlap. Each side controls whether it imports and exports custom routes."}, {"k": "p", "x": "**Network Connectivity Center (NCC)** is a hub-and-spoke service. **VPC spokes** connect many VPCs through a central hub with full mesh or star topologies, and **hybrid spokes** (HA VPN tunnels, Interconnect attachments, router appliances) can use Google's backbone to connect your sites to each other."}, {"k": "tip", "kind": "Tip", "x": "A common enterprise layout: one Shared VPC host project per environment (prod, non-prod), each with regional subnets, connected to on-premises with Interconnect, and NCC when you need many VPCs to talk."}]}, {"t": "Cloud Router and Cloud NAT", "tag": null, "blocks": [{"k": "p", "x": "**Cloud Router** is a managed BGP speaker. It exchanges routes with your on-premises routers over HA VPN and Interconnect, and advertises your VPC subnets automatically (or custom ranges you choose). The VPC's **dynamic routing mode** decides whether learned routes apply only in the Cloud Router's region (**regional**) or in all regions (**global**)."}, {"k": "p", "x": "**Cloud NAT** gives VMs without external IPs outbound Internet access. It is not a VM or appliance: it is software-defined and configured on a Cloud Router, per region. You choose which subnets use it and whether it uses automatically allocated or reserved external IPs. **Dynamic port allocation** helps busy VMs avoid port exhaustion. **Private NAT** translates between overlapping private ranges (for example, between VPCs connected via NCC)."}, {"k": "code", "t": "Cloud NAT for a region", "x": "gcloud compute routers create cr-me-central1 --network=vpc-prod --region=me-central1\ngcloud compute routers nats create nat-me-central1 --router=cr-me-central1 \\\n  --region=me-central1 --auto-allocate-nat-external-ips \\\n  --nat-all-subnet-ip-ranges --enable-dynamic-port-allocation"}, {"k": "tip", "kind": "Watch out", "x": "Cloud NAT does not handle inbound connections. VMs behind it remain unreachable from the Internet, which is usually what you want."}]}, {"t": "Private Google Access and Private Service Connect", "tag": null, "blocks": [{"k": "p", "x": "**Private Google Access** (a per-subnet setting) lets VMs without external IPs reach Google APIs such as Cloud Storage and BigQuery. Combine it with the special domains `private.googleapis.com` (199.36.153.8/30) or `restricted.googleapis.com` (199.36.153.4/30, for use with VPC Service Controls), and DNS that points `*.googleapis.com` at them."}, {"k": "p", "x": "**Private Service Connect (PSC)** creates **endpoints** with internal IPs in your VPC:"}, {"k": "ul", "x": ["PSC endpoints for **Google APIs** (an internal IP for all supported APIs)", "PSC endpoints for **published services**: services from other VPCs, other organisations or Google-managed services (such as Cloud SQL, AlloyDB, Vertex AI). Producers publish a **service attachment**, consumers create an endpoint. Address ranges can overlap."]}, {"k": "p", "x": "**VPC Service Controls** adds a security perimeter around Google-managed services to stop data exfiltration, even by someone with valid credentials."}, {"k": "tip", "kind": "Tip", "x": "For Cloud SQL and other managed databases, choose a private IP (via PSC or private services access) and disable the public IP."}]}, {"t": "Load balancing, Cloud CDN and Cloud Armor", "tag": null, "blocks": [{"k": "p", "x": "Google Cloud load balancers are software-defined and many are **global**:"}, {"k": "ul", "x": ["**Application Load Balancers** (L7, HTTP/HTTPS): **global external** (one anycast IP worldwide, routing users to the nearest healthy backend in any region), regional external, regional internal and cross-region internal.", "**Proxy Network Load Balancers** (L4 TCP proxy, with optional SSL offload): global or regional.", "**Passthrough Network Load Balancers** (L4, TCP/UDP/ESP/ICMP): regional, preserve client IPs, backends see the original packets."]}, {"k": "p", "x": "Backends are **instance groups**, **network endpoint groups (NEGs)** for containers, serverless (Cloud Run) or Internet backends."}, {"k": "p", "x": "**Cloud CDN** caches content at Google's edge for global external Application Load Balancers. **Cloud Armor** adds WAF rules (preconfigured OWASP rules), rate limiting, geo-blocking, bot management and DDoS protection, attached as security policies to backend services."}, {"k": "tip", "kind": "Tip", "x": "A single global external Application Load Balancer with backends in two regions gives you multi-region failover with one IP address and one TLS certificate, without DNS tricks."}]}, {"t": "Hybrid connectivity on Google Cloud", "tag": null, "blocks": [{"k": "p", "x": "**Cloud VPN** connects through IPsec:"}, {"k": "ul", "x": ["**HA VPN**: a gateway with two interfaces (two public IPs). With two tunnels to your peer devices and BGP via Cloud Router, it offers a **99.99% SLA**. This is the recommended option.", "**Classic VPN**: a single interface, 99.9% SLA, mostly legacy."]}, {"k": "p", "x": "**Cloud Interconnect** provides private connections:"}, {"k": "ul", "x": ["**Dedicated Interconnect**: your own 10 Gbps or 100 Gbps circuits in a Google colocation facility.", "**Partner Interconnect**: through a service provider, from 50 Mbps to 50 Gbps.", "**Cross-Cloud Interconnect**: dedicated links from Google Cloud to other clouds (AWS, Azure, OCI, Alibaba)."]}, {"k": "p", "x": "**VLAN attachments** connect an Interconnect to a Cloud Router in a region. For 99.99% availability Google requires connections in two metropolitan areas with four connections in total; 99.9% needs two connections in one metro, in different edge availability domains."}, {"k": "tip", "kind": "Tip", "x": "HA VPN over Interconnect lets you encrypt traffic across a private Interconnect when compliance requires it."}]}, {"t": "Operating and troubleshooting Google Cloud networks", "tag": null, "blocks": [{"k": "p", "x": "**Network Intelligence Center** groups the analysis tools:"}, {"k": "ul", "x": ["**Connectivity Tests**: static analysis of a path between two endpoints (VMs, IPs, load balancers, Cloud SQL), showing which route or firewall rule allows or drops it, plus an optional live data-plane check.", "**Network Topology**: a live map of your VPCs, regions and traffic.", "**Performance Dashboard**: packet loss and latency between zones and regions.", "**Firewall Insights**: shadowed, unused and overly broad rules.", "**Network Analyzer**: automatic detection of misconfigurations such as IP exhaustion or invalid routes."]}, {"k": "p", "x": "Logging: **VPC Flow Logs** (sampled flow records per subnet), **firewall rules logging**, **Cloud NAT logging**, and **Packet Mirroring** to send copies of traffic to an inspection tool."}, {"k": "code", "t": "Run a connectivity test", "x": "gcloud network-management connectivity-tests create app-to-db \\\n  --source-instance=projects/p/zones/me-central1-a/instances/app-1 \\\n  --destination-ip-address=10.30.4.5 --destination-port=5432 --protocol=TCP\ngcloud network-management connectivity-tests describe app-to-db"}, {"k": "tip", "kind": "Tip", "x": "Connectivity Tests understand GKE, Cloud SQL, load balancers and hybrid routes. Run one before guessing."}]}], "q": [{"t": "How do two VMs in different regions of the same Google Cloud VPC communicate?", "o": ["They need VPC peering", "Directly over internal IPs", "Only via Cloud NAT", "Only via VPN"], "a": 1, "x": "The VPC is global, so internal routing works across regions."}, {"t": "Which service gives private VMs outbound Internet access without a NAT VM?", "o": ["Cloud Router", "Cloud NAT", "Private Google Access", "Cloud Armor"], "a": 1, "x": "Cloud NAT is a managed, software-defined NAT."}, {"t": "Why is targeting firewall rules by service account stronger than by network tag?", "o": ["Service accounts are faster", "Changing a VM's service account requires IAM permission, while tags can be edited by anyone who can edit the VM", "Tags don't work with ingress rules", "Service accounts are free"], "a": 1, "x": "Service-account targets tie firewall scope to IAM, preventing users from tagging their way past rules."}, {"t": "What does HA VPN need to reach its 99.99% SLA?", "o": ["One tunnel and static routes", "Two tunnels using both gateway interfaces, with BGP via Cloud Router", "A Classic VPN gateway", "Dedicated Interconnect"], "a": 1, "x": "HA VPN's SLA requires both interfaces in use with dynamic routing."}, {"t": "Which feature lets service projects deploy into subnets owned by a central project?", "o": ["VPC Network Peering", "Shared VPC", "Private Service Connect", "Cloud Router"], "a": 1, "x": "Shared VPC separates network ownership (host project) from workload projects."}], "lv": 4, "h": 9, "p": "gcp", "goal": "Use the global VPC, Shared VPC and Google’s load balancers well.", "terms": ["global VPC", "custom-mode", "secondary range", "firewall policy", "network tag", "secure tag", "Shared VPC", "VPC Network Peering", "Network Connectivity Center", "Cloud Router", "Cloud NAT", "Private Google Access", "Private Service Connect", "Cloud Armor", "HA VPN", "Interconnect"]}, {"id": "m16", "t": "Oracle Cloud (OCI) Networking", "res": [["OCI Networking overview", "https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/overview.htm"], ["OCI Dynamic Routing Gateways", "https://docs.oracle.com/en-us/iaas/Content/Network/Tasks/managingDRGs.htm"], ["OCI FastConnect", "https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/fastconnect.htm"], ["OCI Network Load Balancer", "https://docs.oracle.com/en-us/iaas/Content/NetworkLoadBalancer/overview.htm"]], "sum": ["VCNs are regional; prefer regional subnets, chosen as public or private at creation.", "Prefer NSGs for per-workload rules; use security lists for broad subnet rules.", "Internet, NAT and Service gateways cover public, outbound and Oracle-service traffic.", "The DRG is OCI's hub for VCNs, VPNs, FastConnect and other regions."], "ls": [{"t": "VCNs and subnets", "tag": null, "blocks": [{"k": "p", "x": "An OCI **Virtual Cloud Network (VCN)** is regional and holds one or more IPv4 CIDR blocks (each /16 to /30) and optional IPv6 prefixes. You create **subnets** inside it."}, {"k": "p", "x": "Two choices are made per subnet **at creation and cannot be changed**:"}, {"k": "ul", "x": ["**Regional or AD-specific**: regional subnets span all availability domains in the region (recommended); AD-specific subnets exist in one AD.", "**Public or private**: instances in private subnets cannot have public IPs."]}, {"k": "p", "x": "OCI reserves 3 addresses per subnet (first two and last). Each VCN and subnet can have a **DNS label**, so instances get hostnames like `app1.snetapp.vcnprod.oraclevcn.com` resolved by the VCN's built-in resolver."}, {"k": "code", "t": "Create a VCN and a private regional subnet (OCI CLI)", "x": "oci network vcn create --compartment-id $C --cidr-blocks '[\"10.40.0.0/16\"]' \\\n  --display-name vcn-prod --dns-label vcnprod\noci network subnet create --compartment-id $C --vcn-id $VCN \\\n  --cidr-block 10.40.10.0/24 --display-name snet-app \\\n  --prohibit-public-ip-on-vnic true --dns-label snetapp"}, {"k": "tip", "kind": "Tip", "x": "Because public/private can't be changed, decide per tier up front: only load balancers, bastions and NAT-facing resources need public subnets."}]}, {"t": "Security lists and NSGs", "tag": null, "blocks": [{"k": "p", "x": "OCI has two firewall mechanisms, both **stateful by default** (stateless rules are optional):"}, {"k": "ul", "x": ["**Security lists** apply to **every VNIC in a subnet**. A subnet can have up to five. Good for broad rules that apply to the whole subnet.", "**Network security groups (NSGs)** apply to the **VNICs you choose**, regardless of subnet. Rules can use another NSG as the source or destination, just like AWS security groups. Oracle recommends NSGs for most designs."]}, {"k": "p", "x": "If both apply, traffic is allowed if **either** a security list or an NSG allows it (the union of rules). This differs from AWS and Azure, where both layers must allow traffic."}, {"k": "p", "x": "Every new VCN gets a **default security list** that allows SSH from anywhere and some ICMP. Tighten or replace it before production."}, {"k": "code", "t": "NSG rules for a three-tier app", "x": "nsg-lb   ingress: TCP 443 from 0.0.0.0/0\nnsg-app  ingress: TCP 8080 from NSG nsg-lb\nnsg-db   ingress: TCP 1521 from NSG nsg-app\ndefault security list: remove \"SSH from 0.0.0.0/0\""}, {"k": "tip", "kind": "Watch out", "x": "Because security lists and NSGs combine as a union, a permissive default security list can open access your NSGs were meant to block."}]}, {"t": "Gateways", "tag": null, "blocks": [{"k": "p", "x": "OCI gives each kind of traffic its own gateway, used as a route target:"}, {"k": "ul", "x": ["**Internet gateway**: two-way Internet access for resources with public IPs in public subnets.", "**NAT gateway**: outbound-only Internet access for private subnets, with a public IP Oracle provides (or one you reserve).", "**Service gateway**: private access to Oracle services (such as Object Storage, Autonomous Database public endpoints, OS update mirrors) without the Internet. Route rules target the service CIDR label **All <region> Services in Oracle Services Network** or **OCI <region> Object Storage**.", "**Dynamic Routing Gateway (DRG)**: connects the VCN to other VCNs, on-premises networks and other regions.", "**Local peering gateway (LPG)**: the older way to peer two VCNs in the same region; DRG attachments are now preferred."]}, {"k": "code", "t": "Route tables for public and private subnets", "x": "rt-public:   0.0.0.0/0 → Internet gateway\nrt-private:  0.0.0.0/0 → NAT gateway\n             All <region> Services in Oracle Services Network → Service gateway\n             10.0.0.0/8 (on-prem and other VCNs) → DRG"}, {"k": "tip", "kind": "Tip", "x": "A private subnet can have both a NAT gateway route (0.0.0.0/0) and a service gateway route. The service gateway route is more specific, so traffic to Oracle services stays private and only other Internet traffic uses NAT."}]}, {"t": "The DRG as a hub", "tag": null, "blocks": [{"k": "p", "x": "The **Dynamic Routing Gateway (DRG)** is OCI's virtual router and its central hub. A single DRG can have many **attachments**:"}, {"k": "ul", "x": ["**VCN attachments** (many VCNs in the same region, for hub-and-spoke)", "**IPSec tunnel attachments** (Site-to-Site VPN)", "**Virtual circuit attachments** (FastConnect)", "**Remote peering connection (RPC) attachments** (to DRGs in other regions or tenancies)"]}, {"k": "p", "x": "Each attachment uses a **DRG route table**, and **import route distributions** decide which routes each table learns. This lets you build segmentation and **transit routing**, such as sending all spoke-to-spoke and on-premises traffic through a firewall in a hub VCN."}, {"k": "code", "t": "Hub-and-spoke with a firewall in the hub VCN", "x": "DRG route table for spoke VCN attachments:  0.0.0.0/0 → hub VCN attachment\nDRG route table for the hub attachment:     imports routes from all spokes and on-prem\nHub VCN ingress route table (on the DRG attachment): 0.0.0.0/0 → firewall private IP"}, {"k": "tip", "kind": "Tip", "x": "Use one DRG per region as the hub, and remote peering connections between regional DRGs for a global network."}]}, {"t": "Load balancing, DNS and edge security", "tag": null, "blocks": [{"k": "p", "x": "**OCI Load Balancer** (flexible shape) is an L7 HTTP/HTTPS proxy that can also balance TCP. It supports path and host routing, TLS termination, session persistence and integration with **OCI WAF**. Bandwidth is set as a flexible range (minimum and maximum Mbps)."}, {"k": "p", "x": "**OCI Network Load Balancer** is an L3/L4 pass-through load balancer for TCP, UDP and ICMP, preserving source and destination IPs, with very low latency. It is free of charge, which makes it popular for internal services and appliance clusters."}, {"k": "p", "x": "**OCI DNS** hosts public zones and, inside VCNs, **private DNS** with **private views** and a **resolver** per VCN. **Listening endpoints** answer queries from on-premises; **forwarding endpoints** with rules send queries for on-premises zones to your DNS servers."}, {"k": "p", "x": "Edge protection: **OCI WAF** (attached to load balancers or as an edge policy), DDoS protection included at the edge, and **OCI Network Firewall** (a managed next-generation firewall built with Palo Alto Networks technology) for inspection inside VCNs."}, {"k": "tip", "kind": "Tip", "x": "Public load balancers need a public subnet; their backends should sit in private subnets reachable only from the load balancer's NSG."}]}, {"t": "Hybrid and multi-cloud connectivity on OCI", "tag": null, "blocks": [{"k": "p", "x": "**Site-to-Site VPN** connects your network to a DRG with **two redundant IPsec tunnels** per connection. Routing can be **BGP** (recommended), static, or policy-based. Use IKEv2 and configure both tunnels."}, {"k": "p", "x": "**FastConnect** provides private connectivity:"}, {"k": "ul", "x": ["**Oracle partner**: through a service provider, in bandwidths from 1 Gbps", "**Colocation with Oracle**: your own cross-connects of 1, 10, 100 or 400 Gbps at an Oracle FastConnect location", "**Third-party provider**: through a provider not in the partner list", "**Private peering** reaches your VCNs via the DRG; **public peering** reaches OCI public services.", "**MACsec** encryption is supported on cross-connects."]}, {"k": "p", "x": "For multi-cloud, **Oracle Interconnect for Microsoft Azure** and **Oracle Interconnect for Google Cloud** provide direct, low-latency private links between OCI and those clouds in paired regions, and **Oracle Database@Azure / @Google Cloud / @AWS** run Oracle Database services inside those clouds' data centres."}, {"k": "tip", "kind": "Tip", "x": "Two FastConnect virtual circuits at different locations (or one FastConnect plus Site-to-Site VPN as backup) with BGP is the standard resilient design."}]}, {"t": "Operating and troubleshooting OCI networks", "tag": null, "blocks": [{"k": "p", "x": "Key tools in OCI's **Network Command Center**:"}, {"k": "ul", "x": ["**Network Path Analyzer**: analyses route tables, security lists, NSGs and gateways between a source and destination and shows where traffic is allowed or blocked.", "**VCN flow logs**: records of accepted and rejected traffic, configured per subnet, VNIC or VCN through capture filters, delivered to OCI Logging.", "**Capture filters and VTAP**: virtual test access points mirror traffic from a source (VNIC, load balancer, database) to a target for deep analysis.", "**Inter-region latency** dashboards."]}, {"k": "p", "x": "**OCI Bastion** provides time-limited, audited SSH sessions to private instances without public IPs or open SSH from the Internet."}, {"k": "code", "t": "Typical checklist when an OCI instance can't reach something", "x": "1. Subnet route table: is there a rule to the right gateway (NAT, service, DRG)?\n2. Security lists + NSGs: does any rule allow it? (union of both)\n3. Instance OS firewall: Oracle Linux images ship with firewalld enabled\n4. DRG route tables and import distributions (for cross-VCN/on-prem)\n5. Run Network Path Analyzer to confirm"}, {"k": "tip", "kind": "Watch out", "x": "Oracle-provided Linux images have firewalld (and on some images iptables rules) enabled by default. Opening an NSG is not enough; open the port in the OS too."}]}], "q": [{"t": "Which OCI gateway gives private subnets access to Object Storage without the Internet?", "o": ["Internet Gateway", "NAT Gateway", "Service Gateway", "DRG"], "a": 2, "x": "The Service Gateway reaches Oracle Services Network privately."}, {"t": "How many IP addresses does OCI reserve in each subnet?", "o": ["3", "4", "5", "0"], "a": 0, "x": "The first two and the last address."}, {"t": "A VNIC is covered by both a security list and an NSG. When is traffic allowed?", "o": ["Only if both allow it", "If either the security list or the NSG allows it", "Only if the NSG allows it", "Never"], "a": 1, "x": "OCI evaluates the union of security list and NSG rules."}, {"t": "Which OCI component connects VCNs, VPN tunnels, FastConnect and other regions as a hub?", "o": ["Local peering gateway", "NAT gateway", "Dynamic Routing Gateway", "Service gateway"], "a": 2, "x": "The DRG is OCI's virtual router with attachments for all of these."}, {"t": "You open port 8080 in an NSG, but an Oracle Linux instance still refuses connections from other hosts. What should you check next?", "o": ["The Internet gateway", "The instance's firewalld rules", "The DNS label", "The compartment policy"], "a": 1, "x": "Oracle Linux images enable the host firewall by default, so the port must be opened there too."}], "lv": 4, "h": 9, "p": "oci", "goal": "Build VCNs and use the DRG as a routing hub.", "terms": ["VCN", "regional subnet", "security list", "network security group", "Internet gateway", "NAT gateway", "service gateway", "DRG", "DRG attachment", "remote peering connection", "FastConnect", "Network Load Balancer", "Network Path Analyzer"]}, {"id": "m17", "t": "Hybrid Connectivity", "res": [["AWS Direct Connect resiliency recommendations", "https://docs.aws.amazon.com/directconnect/latest/UserGuide/resiliency_toolkit.html"], ["Azure ExpressRoute high availability", "https://learn.microsoft.com/en-us/azure/expressroute/designing-for-high-availability-with-expressroute"], ["Google Cloud Interconnect topologies", "https://cloud.google.com/network-connectivity/docs/interconnect/concepts/overview"], ["OCI FastConnect redundancy best practices", "https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/fastconnectresiliency.htm"]], "sum": ["Every cloud's private link uses eBGP; your router design is the same everywhere.", "Resilience needs two links, two locations, two devices and tested failover.", "Steer primary and backup paths deliberately with BGP attributes, and summarise routes.", "Private links are not encrypted by default; add MACsec or IPsec when required."], "ls": [{"t": "Private links in all four clouds", "tag": "all", "blocks": [{"k": "p", "x": "Each provider sells a dedicated private connection from your network to theirs:"}, {"k": "ul", "x": ["**AWS Direct Connect**: dedicated 1/10/100/400 Gbps ports or hosted connections via partners; virtual interfaces (private, transit, public); Direct Connect gateway for multi-region reach.", "**Azure ExpressRoute**: circuits through a connectivity provider or ExpressRoute Direct (10/100 Gbps); private peering and Microsoft peering; Global Reach between your sites.", "**Google Cloud Interconnect**: Dedicated (10/100 Gbps), Partner (50 Mbps–50 Gbps) and Cross-Cloud Interconnect; VLAN attachments to Cloud Router.", "**OCI FastConnect**: partner, colocation (1/10/100/400 Gbps cross-connects) or third-party; private and public peering via the DRG."]}, {"k": "p", "x": "They all follow the same pattern: a **physical connection** at a colocation facility or through a carrier, a **logical circuit** (VLAN, virtual interface, VLAN attachment, virtual circuit) on top, and an **eBGP session** over that circuit to exchange routes."}, {"k": "p", "x": "Why use them instead of VPN over the Internet? Predictable latency and throughput, higher bandwidth, lower data-transfer prices on some providers, and traffic that never touches the public Internet."}, {"k": "tip", "kind": "Tip", "x": "Many enterprises meet all their clouds in one or two carrier-neutral colocation facilities (Equinix, Digital Realty and similar), with short cross-connects to each provider. That colocation becomes the network's centre."}]}, {"t": "VPN as primary or backup", "tag": "all", "blocks": [{"k": "p", "x": "**Site-to-site IPsec VPN** over the Internet is quick to set up (minutes, not weeks), cheap, and available everywhere. Its limits are variable latency, lower throughput per tunnel (for example, about 1.25 Gbps per AWS tunnel), and dependence on Internet quality."}, {"k": "p", "x": "Common patterns:"}, {"k": "ul", "x": ["**VPN only**: small sites, labs, or while waiting for a private link.", "**Private link primary, VPN backup**: the most common enterprise design. BGP prefers the private link; if it fails, routes fail over to the VPN automatically.", "**VPN over the private link**: encrypts traffic across Direct Connect, ExpressRoute, Interconnect or FastConnect when compliance requires encryption.", "**SD-WAN**: branch routers build overlay tunnels to cloud hubs (AWS Cloud WAN, Azure Virtual WAN, Google NCC router appliances and OCI all integrate with SD-WAN vendors)."]}, {"k": "tip", "kind": "Watch out", "x": "When VPN backs up a private link, make sure the VPN can actually carry the load. A 10 Gbps link failing over to a 1 Gbps VPN still causes an outage for heavy workloads."}]}, {"t": "Designing for resilience", "tag": "all", "blocks": [{"k": "p", "x": "A single connection will fail eventually: fibre cuts, device failures, provider maintenance. Design so that any one component can fail without an outage."}, {"k": "p", "x": "The resilience ladder, from weakest to strongest:"}, {"k": "ol", "x": ["One connection, one device, one location: **no redundancy**.", "Two connections at **one location**, on two devices: survives a device or port failure, not a site failure.", "Connections at **two locations**, one device each: survives a site failure.", "**Two locations, two devices and two connections at each**: the maximum resiliency model AWS, Azure, Google Cloud and Oracle all describe for critical workloads."]}, {"k": "p", "x": "Also remove shared dependencies: different carriers, different building entrances, separate power. And make failover fast: use **BFD** (Bidirectional Forwarding Detection) where supported so BGP notices a dead link in about a second instead of 90 seconds."}, {"k": "code", "t": "Checklist for a production hybrid design", "x": "[ ] At least two physical connections, at two locations\n[ ] Separate customer routers for each connection\n[ ] BGP on every link; BFD enabled where supported\n[ ] Failover tested by shutting each link in a maintenance window\n[ ] Monitoring and alerts on BGP session state and link utilisation"}, {"k": "tip", "kind": "Tip", "x": "Test failover regularly. An untested backup link is often a broken backup link."}]}, {"t": "Steering traffic with BGP", "tag": "all", "blocks": [{"k": "p", "x": "With two or more links you decide which one carries traffic in each direction."}, {"k": "p", "x": "**Traffic from you to the cloud (outbound)**: set **local preference** on the routes you learn from the cloud. Higher wins. For example, local-pref 200 on the primary link and 100 on the backup."}, {"k": "p", "x": "**Traffic from the cloud to you (inbound)**: influence the cloud's choice with **AS-path prepending** (make the backup path look longer), **MED**, or by advertising **more specific prefixes** on the primary link. Each provider documents its own preference order, so check it:"}, {"k": "ul", "x": ["AWS prefers the longest prefix, then Direct Connect over VPN, then honours AS-path length and local preference communities on Direct Connect.", "Azure ExpressRoute prefers the longest prefix and then the shortest AS path; connection **weight** can set preference.", "Google Cloud Router uses **advertised route priority (MED)** that you set per BGP session.", "OCI uses the longest prefix match first and lets you influence the choice with AS-path prepending; check OCI's route-preference rules for FastConnect versus VPN."]}, {"k": "p", "x": "**Equal-cost multipath (ECMP)** lets you use several links at once for more bandwidth when paths look identical."}, {"k": "code", "t": "Primary/backup with prepending and local preference (Cisco-style)", "x": "! Prefer link A for outbound\nroute-map FROM-CLOUD-A permit 10\n set local-preference 200\n! Make link B less attractive for inbound\nroute-map TO-CLOUD-B permit 10\n set as-path prepend 65010 65010 65010"}, {"k": "tip", "kind": "Watch out", "x": "Asymmetric routing (out via link A, back via link B) breaks stateful firewalls in the path. Steer both directions consistently."}]}, {"t": "Encryption, MTU and route limits", "tag": "all", "blocks": [{"k": "p", "x": "Three details cause many hybrid problems."}, {"k": "p", "x": "**Encryption.** Private links are private, not encrypted. Options: **MACsec** (Layer 2 encryption on supported dedicated ports: AWS Direct Connect, ExpressRoute Direct, Google Dedicated/Cross-Cloud Interconnect, OCI FastConnect cross-connects), **IPsec over the private link**, or application-level TLS everywhere."}, {"k": "p", "x": "**MTU.** Private links typically support 1,500 bytes and some support jumbo frames (AWS Direct Connect private VIFs up to 9,001; Google Interconnect up to 8,896). VPN tunnels need a smaller MTU, often around 1,400 bytes once IPsec headers are added. Mismatches cause large transfers to hang; use MSS clamping on the tunnel interfaces."}, {"k": "p", "x": "**Route limits.** Every provider limits the number of prefixes you can advertise per session (for example, 100 on an AWS private VIF; 4,000 on ExpressRoute private peering with Standard, 10,000 with Premium). Exceeding the limit drops the BGP session. Advertise **summaries** such as `10.100.0.0/14` rather than every subnet."}, {"k": "tip", "kind": "Tip", "x": "Before go-live, agree in writing on the prefixes each side advertises and the filters each side applies. Most hybrid incidents come from unexpected route advertisements."}]}, {"t": "A complete hybrid design", "tag": "all", "blocks": [{"k": "p", "x": "Putting the pieces together for an organisation with a Dubai data centre and workloads in two clouds:"}, {"k": "ol", "x": ["**Colocation**: rent space in a carrier-neutral facility near the cloud regions. Place two routers there.", "**Cloud links**: from each router, a private link to AWS (Direct Connect via a Direct Connect gateway to Transit Gateway) and to Azure (ExpressRoute to a hub VNet or Virtual WAN). Use a second colocation site for the second pair of links.", "**Data centre link**: two diverse circuits from the data centre to the colocation routers.", "**Backup**: Site-to-Site VPN from the data centre directly to each cloud, with BGP, lower preference.", "**Routing**: on-premises advertises `10.100.0.0/14`; each cloud advertises its summary (for example AWS `10.64.0.0/12`, Azure `10.80.0.0/12`). No overlaps.", "**DNS**: conditional forwarding between on-premises DNS and each cloud's resolver endpoints.", "**Security**: inspection firewalls in the cloud hubs; MACsec on dedicated ports or IPsec where policy requires.", "**Operations**: monitor BGP sessions, utilisation and latency; test failover every quarter."]}, {"k": "tip", "kind": "In the cloud", "x": "The colocation routers can also route between the two clouds, so AWS and Azure traffic stays on private links instead of crossing the Internet."}]}], "q": [{"t": "Which protocol do all four providers use to exchange routes over private links?", "o": ["OSPF", "BGP", "RIP", "EIGRP"], "a": 1, "x": "eBGP is universal for cloud hybrid connectivity."}, {"t": "Is traffic on a dedicated private link encrypted by default?", "o": ["Yes, always", "No", "Only for IPv6", "Only on Azure"], "a": 1, "x": "Private does not mean encrypted; add MACsec or IPsec."}, {"t": "Which design survives the loss of an entire colocation facility?", "o": ["Two connections at one location on one device", "Two connections at one location on two devices", "Connections at two different locations", "One connection with a bigger port"], "a": 2, "x": "Only diversity across locations protects against a site-level failure."}, {"t": "Which feature helps BGP detect a failed link in about a second?", "o": ["Prepending", "MED", "BFD", "Route summarisation"], "a": 2, "x": "Bidirectional Forwarding Detection detects path failure much faster than BGP hold timers."}, {"t": "You advertise 300 individual /24 routes over an AWS private VIF and the session keeps dropping. Best fix?", "o": ["Use a bigger port", "Add a VPN", "Advertise summary routes to stay under the prefix limit", "Change the ASN"], "a": 2, "x": "Private VIFs accept a limited number of prefixes; summarise."}], "lv": 5, "h": 7, "goal": "Connect data centres to cloud with resilient, BGP-steered links.", "terms": ["Direct Connect", "ExpressRoute", "Interconnect", "FastConnect", "colocation", "cross-connect", "virtual circuit", "BFD", "ECMP", "MACsec", "SD-WAN"]}, {"id": "m18", "t": "Multi-Cloud Architecture", "res": [["Google Cloud: hybrid and multi-cloud patterns", "https://cloud.google.com/architecture/hybrid-multicloud-patterns-and-practices"], ["AWS: building a scalable multi-VPC network", "https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/welcome.html"], ["Azure landing zone network topology", "https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/azure-best-practices/define-an-azure-network-topology"], ["OCI and Azure interconnect", "https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/azure.htm"]], "sum": ["One address plan for everything; no overlaps, room to grow.", "Use each cloud's native transit hub, then connect hubs to each other and to on-premises.", "DNS must be designed across clouds as carefully as routing.", "Only go multi-cloud for a clear reason, and design for egress costs."], "ls": [{"t": "IP address management (IPAM)", "tag": "all", "blocks": [{"k": "p", "x": "In a multi-cloud estate, address overlaps are the most expensive mistake. Two networks with the same range cannot be routed to each other without NAT, which complicates everything that follows."}, {"k": "p", "x": "Build one hierarchical plan and allocate from it:"}, {"k": "code", "t": "A multi-cloud address plan inside 10.0.0.0/8", "x": "10.0.0.0/12     on-premises data centres and offices\n10.16.0.0/12    reserved for growth\n10.32.0.0/12    AWS     (10.32/14 me-central-1, 10.36/14 eu-west-1, ...)\n10.48.0.0/12    Azure   (10.48/14 UAE North, 10.52/14 West Europe, ...)\n10.64.0.0/12    Google Cloud\n10.80.0.0/12    OCI\n10.96.0.0/11    Kubernetes pod and service ranges (or use non-routed overlays)"}, {"k": "p", "x": "Tools help enforce it: **Amazon VPC IPAM** can allocate VPC CIDRs automatically from pools and monitor usage; **Azure Virtual Network Manager IPAM** manages address pools across subscriptions; Google Cloud and OCI rely on careful planning plus third-party IPAM (Infoblox, NetBox)."}, {"k": "tip", "kind": "Tip", "x": "Each cloud gets one large, summarisable block per region. Then on-premises routers need only one route per cloud region, and routing stays simple."}]}, {"t": "Topologies", "tag": "all", "blocks": [{"k": "p", "x": "Choose a topology inside each cloud, then connect the clouds."}, {"k": "p", "x": "Inside a cloud, the standard is **hub-and-spoke**: workload networks (spokes) connect to a hub that holds shared services, firewalls and the hybrid links. Each provider has a native hub: **AWS Transit Gateway / Cloud WAN**, **Azure hub VNet or Virtual WAN**, **Google NCC or Shared VPC**, **OCI DRG**."}, {"k": "p", "x": "Between clouds and on-premises, common shapes are:"}, {"k": "ul", "x": ["**On-premises as the hub**: every cloud connects back to the data centre. Simple, but cloud-to-cloud traffic hairpins through the data centre.", "**Colocation as the hub**: routers in a colocation facility connect to all clouds and to on-premises. Short paths and one place for policy.", "**Direct cloud-to-cloud**: provider interconnects such as Oracle Interconnect for Azure and for Google Cloud, or Google Cross-Cloud Interconnect. Lowest latency for heavy flows between two clouds.", "**Cloud VPN mesh**: IPsec between cloud VPN gateways. Quick and cheap, limited throughput."]}, {"k": "tip", "kind": "Tip", "x": "Segment consistently everywhere. If \"prod\" and \"dev\" are separate route domains in AWS Transit Gateway, keep them separate in Azure, Google Cloud and OCI too, and across the interconnects."}]}, {"t": "Connecting the clouds", "tag": "all", "blocks": [{"k": "p", "x": "For each pair of clouds that must talk, weigh bandwidth, latency, cost and effort:"}, {"k": "ul", "x": ["**VPN between cloud gateways** (for example, AWS Site-to-Site VPN to Azure VPN Gateway, or Google HA VPN to AWS). Set up in an hour, encrypted, but limited per tunnel and crosses the Internet.", "**Private links meeting in colocation**: Direct Connect, ExpressRoute, Interconnect and FastConnect all land on your routers, which route between them. High bandwidth, predictable, but you operate the routers.", "**Provider-to-provider interconnects**: Oracle Interconnect for Microsoft Azure and for Google Cloud link specific region pairs directly with sub-2 ms latency in many locations. Google Cross-Cloud Interconnect provides dedicated physical links from Google to AWS, Azure, OCI and Alibaba Cloud.", "**Partner network-as-a-service**: Equinix Fabric, Megaport and similar let you create virtual circuits between clouds in minutes from a portal."]}, {"k": "tip", "kind": "In the cloud", "x": "A typical example is an application on Azure using Oracle Database on OCI over the Oracle–Azure interconnect, or Oracle Database@Azure, which runs Oracle's database service inside Azure data centres."}]}, {"t": "DNS across clouds", "tag": "all", "blocks": [{"k": "p", "x": "Every cloud has its own private DNS, and each one only answers for its own zones by default. A multi-cloud design must let every environment resolve names in every other."}, {"k": "p", "x": "The building blocks are the same in each cloud: an **inbound** endpoint (others can send queries in) and an **outbound** endpoint with **forwarding rules** (send queries for other zones out):"}, {"k": "ul", "x": ["**AWS**: Route 53 Resolver inbound and outbound endpoints with forwarding rules", "**Azure**: DNS Private Resolver inbound and outbound endpoints with forwarding rulesets", "**Google Cloud**: Cloud DNS inbound server policies and forwarding zones", "**OCI**: private DNS resolver with listening and forwarding endpoints"]}, {"k": "p", "x": "A clean design gives each environment its own zone, such as `aws.corp.example`, `azure.corp.example`, `gcp.corp.example`, `oci.corp.example` and `dc.corp.example`, and forwards each zone to the resolver that owns it. Many organisations make on-premises DNS (or a central resolver in the colocation) the hub for forwarding."}, {"k": "tip", "kind": "Watch out", "x": "Private endpoint zones (`privatelink.*` on Azure, PSC and interface endpoint names elsewhere) must also be forwarded, or clients in other environments will resolve the public addresses."}]}, {"t": "Choosing where workloads live", "tag": "all", "blocks": [{"k": "p", "x": "Multi-cloud adds complexity: more skills to maintain, more tools, more connections and more places for mistakes. Adopt it for a clear reason:"}, {"k": "ul", "x": ["**Best-of-breed services**: Oracle Database on OCI, analytics on Google Cloud, Microsoft workloads on Azure.", "**Regulation and sovereignty**: a service must stay in a country where only one provider has a region.", "**Acquisitions**: two companies already use different clouds.", "**Resilience or negotiating leverage** (harder to justify; true active-active across clouds is expensive)."]}, {"k": "p", "x": "Then place each workload by **data gravity** (keep compute close to its largest data), **latency to users**, **egress cost** (cross-cloud data transfer is billed as egress by the sending cloud), **compliance**, and **team skills**."}, {"k": "tip", "kind": "Tip", "x": "Make chatty systems live in the same cloud and region. Send only summarised, infrequent traffic across clouds."}]}, {"t": "Running multi-cloud as code", "tag": "all", "blocks": [{"k": "p", "x": "At this scale, networks must be managed as code and observed in one place."}, {"k": "ul", "x": ["**Infrastructure as code**: Terraform with all four providers (covered in Module 20), one repository per layer (foundation, hubs, spokes), reviewed changes, and automated policy checks.", "**Central policy**: guardrails in every cloud (SCPs, Azure Policy, organization policies, OCI security zones) enforcing no public IPs on VMs, mandatory flow logs, approved regions.", "**Unified observability**: send flow logs and firewall logs from every cloud to one SIEM; monitor BGP sessions and interconnects in one dashboard.", "**Documentation as data**: the IP plan, DNS zones and connectivity matrix kept in version control (or in a tool like NetBox), never in someone's head."]}, {"k": "tip", "kind": "Tip", "x": "Write an \"allowed flows\" matrix (which environment may talk to which, on which ports) and implement it identically in each cloud's firewall layer. It becomes the single source of truth for audits."}]}], "q": [{"t": "What breaks peering and hybrid routing most often in multi-cloud?", "o": ["Too many subnets", "Overlapping CIDR ranges", "Using IPv6", "Using BGP"], "a": 1, "x": "Overlapping ranges cannot be routed between."}, {"t": "What lets each cloud resolve private names hosted in another cloud?", "o": ["A NAT gateway", "Conditional DNS forwarding", "VPC peering", "A CDN"], "a": 1, "x": "Resolver endpoints forward specific zones to the cloud that hosts them."}, {"t": "Which is a direct private interconnect between two different cloud providers?", "o": ["AWS Transit Gateway", "Oracle Interconnect for Microsoft Azure", "Azure Virtual WAN", "Google Shared VPC"], "a": 1, "x": "Oracle and Microsoft link paired OCI and Azure regions directly."}, {"t": "Why give each cloud region one large, summarisable address block?", "o": ["It is required by all providers", "Other networks then need only one route per region, keeping routing simple", "It makes IPv6 unnecessary", "It reduces egress cost"], "a": 1, "x": "Summarisable blocks keep route tables small and stay under BGP prefix limits."}, {"t": "Which factor is \"data gravity\" about?", "o": ["The weight of servers", "Keeping compute close to where its largest datasets live", "The number of regions", "DNS TTLs"], "a": 1, "x": "Moving large data is slow and costly, so applications are best placed next to it."}], "lv": 5, "h": 7, "goal": "Plan addresses, topology and DNS across four clouds and on-premises.", "terms": ["IPAM", "landing zone", "transit hub", "colocation", "cloud-to-cloud interconnect", "DNS forwarding", "data gravity", "egress cost", "segmentation", "network as code"]}, {"id": "m19", "t": "Cloud Network Security", "res": [["AWS Network Firewall", "https://docs.aws.amazon.com/network-firewall/latest/developerguide/what-is-aws-network-firewall.html"], ["Azure Firewall features", "https://learn.microsoft.com/en-us/azure/firewall/features-by-sku"], ["Google Cloud Armor", "https://cloud.google.com/armor/docs/cloud-armor-overview"], ["OCI Network Firewall", "https://docs.oracle.com/en-us/iaas/Content/network-firewall/overview.htm"], ["CIS Benchmarks", "https://www.cisecurity.org/cis-benchmarks"]], "sum": ["Stack controls: edge (DDoS, WAF), network (segmentation, firewalls), identity, host, data, monitoring.", "Inspect egress and east-west traffic, not only inbound.", "Nothing internal should have a public IP; admin access goes through identity-aware services.", "Log every flow and decision, and alert on what matters."], "ls": [{"t": "Defense in depth", "tag": "all", "blocks": [{"k": "p", "x": "No single control stops every attack. Cloud network security layers independent controls so that an attacker who gets past one is stopped by the next:"}, {"k": "ol", "x": ["**Edge**: DDoS protection, CDN and WAF in front of public endpoints.", "**Perimeter**: only load balancers and gateways face the Internet.", "**Segmentation**: separate accounts/subscriptions/projects, separate networks per environment, separate subnets per tier, security groups per workload.", "**Inspection**: managed firewalls for egress and east-west traffic.", "**Identity**: MFA, least privilege, no long-lived keys, identity-aware admin access.", "**Data**: private endpoints for managed services, encryption in transit and at rest.", "**Detection**: flow logs, firewall logs, DNS logs, threat detection services, SIEM."]}, {"k": "tip", "kind": "Tip", "x": "For each layer, write down which service you use in each cloud. Gaps in the table are your next priorities."}]}, {"t": "Edge protection", "tag": "all", "blocks": [{"k": "p", "x": "Every public endpoint should sit behind DDoS protection and a web application firewall."}, {"k": "ul", "x": ["**AWS**: **AWS Shield** Standard (automatic, free) and Advanced (paid, with the Shield Response Team and cost protection); **AWS WAF** on CloudFront, ALB, API Gateway and others.", "**Azure**: **Azure DDoS Protection** (network or IP protection plans); **Azure WAF** on Application Gateway and Front Door.", "**Google Cloud**: **Cloud Armor** security policies on external load balancers: WAF rules, rate limiting, geo and IP rules, Adaptive Protection that learns normal traffic, and bot management.", "**OCI**: built-in DDoS protection at the edge; **OCI WAF** on load balancers or as an edge policy."]}, {"k": "p", "x": "A good WAF policy starts with the provider's managed rule sets (OWASP Top 10 protections such as SQL injection and cross-site scripting), adds rate limits per client IP, and blocks countries or IP lists you never expect traffic from. Run new rules in **count / detection mode** first to avoid blocking real users."}, {"k": "tip", "kind": "Watch out", "x": "A WAF in front of a load balancer does nothing if the backend also has a public IP that attackers can hit directly. Lock backends so they only accept traffic from the load balancer."}]}, {"t": "Central inspection with managed firewalls", "tag": "all", "blocks": [{"k": "p", "x": "Security groups decide *who* may connect; a firewall can also inspect *what* is being sent. Each cloud has a managed next-generation firewall:"}, {"k": "ul", "x": ["**AWS Network Firewall**: stateful rules, Suricata-compatible IPS signatures, domain allow and deny lists, TLS inspection. Deployed in dedicated subnets, often in an inspection VPC behind Transit Gateway.", "**Azure Firewall**: Standard (FQDN filtering, threat intelligence) and Premium (TLS inspection, IDPS, URL filtering, web categories). Usually in the hub VNet with UDRs from spokes.", "**Google Cloud NGFW**: distributed firewall policies; the Enterprise tier adds IPS and TLS inspection through firewall endpoints.", "**OCI Network Firewall**: managed NGFW based on Palo Alto Networks technology with URL filtering, IPS and TLS inspection."]}, {"k": "p", "x": "Inspect three directions:"}, {"k": "ul", "x": ["**North-south inbound**: Internet → app (usually WAF plus load balancer is enough for HTTP)", "**North-south outbound (egress)**: app → Internet. Allow only required domains; this blocks malware call-backs and data exfiltration", "**East-west**: between VPCs/VNets, environments and tiers"]}, {"k": "tip", "kind": "Tip", "x": "Egress filtering is one of the highest-value controls. Most servers only need to reach a handful of domains (OS updates, a payment API). Allow those, deny the rest, and log the denials."}]}, {"t": "Private by default", "tag": "all", "blocks": [{"k": "p", "x": "Reduce what is reachable at all."}, {"k": "ul", "x": ["**No public IPs** on VMs, databases or containers. Enforce it with policy (AWS SCPs, Azure Policy, Google organization policy, OCI security zones).", "**Private endpoints** for managed services: AWS interface and gateway endpoints, Azure Private Endpoints, Google Private Service Connect and Private Google Access, OCI service gateway and private endpoints. Disable public network access on the services themselves.", "**Managed administrative access** instead of open SSH/RDP:", "AWS **Systems Manager Session Manager** (no inbound ports at all) or EC2 Instance Connect Endpoint", "**Azure Bastion** (browser or native client, through the portal)", "Google Cloud **IAP TCP forwarding** (`gcloud compute ssh --tunnel-through-iap`)", "**OCI Bastion** (time-limited sessions)"]}, {"k": "code", "t": "SSH to a private Google Cloud VM through IAP", "x": "# Firewall: allow tcp:22 only from IAP's range 35.235.240.0/20\ngcloud compute ssh app-1 --zone=me-central1-a --tunnel-through-iap"}, {"k": "tip", "kind": "Tip", "x": "Every one of these logs who connected and when, which an open SSH port never does well."}]}, {"t": "Flow logs and detection", "tag": "all", "blocks": [{"k": "p", "x": "You cannot defend what you cannot see. Turn on logging everywhere and send it to one place."}, {"k": "ul", "x": ["**Flow logs**: AWS VPC Flow Logs, Azure VNet flow logs, Google Cloud VPC Flow Logs, OCI VCN flow logs.", "**Firewall and WAF logs**: every allow and deny with the rule that matched.", "**DNS query logs**: Route 53 Resolver query logs, Azure DNS (via Private Resolver and Azure Firewall DNS proxy logs), Cloud DNS logging, OCI DNS logs. DNS logs often reveal malware first.", "**Threat detection**: Amazon GuardDuty, Microsoft Defender for Cloud, Google Security Command Center, OCI Cloud Guard. These analyse logs for suspicious behaviour such as crypto-mining, port scans or calls to known malicious IPs.", "**Posture management (CSPM)**: continuously checks for misconfigurations such as open security groups or public buckets."]}, {"k": "p", "x": "Send everything to a **SIEM** (Microsoft Sentinel, Google Security Operations, Splunk and others) and write alerts for what matters: rejected traffic to databases, outbound traffic to new countries, changes to security groups or route tables."}, {"k": "tip", "kind": "Watch out", "x": "Logs cost money to store. Keep high-volume flow logs for a shorter period or sample them, and keep security-relevant logs longer."}]}, {"t": "Security checklist for a cloud network", "tag": "all", "blocks": [{"k": "p", "x": "Use this checklist for any new environment, in any cloud:"}, {"k": "ol", "x": ["No resource except load balancers, NAT and VPN gateways has a public IP.", "No security rule allows SSH (22) or RDP (3389) from 0.0.0.0/0 or ::/0.", "Databases accept connections only from the application tier.", "Managed services use private endpoints with public access disabled.", "Public endpoints sit behind WAF and DDoS protection.", "Egress is filtered through a firewall with a domain allow list.", "Production and non-production are separated at the account/subscription/project level.", "Flow logs, firewall logs and DNS logs are enabled and centralised.", "Network changes are made through reviewed infrastructure as code.", "Guardrail policies prevent the above from being undone."]}, {"k": "tip", "kind": "Tip", "x": "Benchmarks such as the CIS Foundations Benchmarks for AWS, Azure, Google Cloud and OCI turn these principles into hundreds of checkable rules; posture management tools can scan for them automatically."}]}], "q": [{"t": "What is the managed way to SSH into a private Google Cloud VM with no public IP?", "o": ["Cloud NAT", "IAP TCP forwarding", "Cloud Armor", "Private Service Connect"], "a": 1, "x": "Identity-Aware Proxy tunnels SSH after checking identity."}, {"t": "Where should a WAF sit?", "o": ["Behind the database", "In front of public web endpoints", "Inside each VM", "On the DNS server"], "a": 1, "x": "A WAF inspects HTTP requests before they reach your app."}, {"t": "Why is egress filtering valuable?", "o": ["It speeds up downloads", "It blocks malware call-backs and data exfiltration to unapproved destinations", "It removes the need for a WAF", "It is required for NAT to work"], "a": 1, "x": "Most servers need only a few destinations; denying the rest limits damage after a compromise."}, {"t": "Which AWS service lets you reach an instance's shell with no inbound ports open?", "o": ["Elastic IP", "Systems Manager Session Manager", "Network ACL", "Route 53"], "a": 1, "x": "Session Manager connects through the SSM agent's outbound connection, with IAM authentication and logging."}, {"t": "New WAF rules should first be deployed in which mode?", "o": ["Block mode", "Count or detection mode", "Disabled", "Bypass mode"], "a": 1, "x": "Observe what the rule would block before enforcing, to avoid blocking real users."}], "lv": 5, "h": 7, "goal": "Build defense in depth with each provider’s native controls.", "terms": ["WAF", "DDoS", "NGFW", "IDPS", "TLS inspection", "egress filtering", "bastion", "private endpoint", "flow logs", "SIEM", "CSPM", "microsegmentation"]}, {"id": "m20", "t": "Infrastructure as Code", "res": [["Terraform documentation", "https://developer.hashicorp.com/terraform/docs"], ["Terraform AWS provider", "https://registry.terraform.io/providers/hashicorp/aws/latest/docs"], ["Azure Bicep documentation", "https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/overview"], ["OCI Resource Manager", "https://docs.oracle.com/en-us/iaas/Content/ResourceManager/Concepts/resourcemanager.htm"], ["Checkov", "https://www.checkov.io/"]], "sum": ["Networks built in code are reviewable, repeatable and recoverable.", "Terraform's plan shows exactly what will change; always read it.", "Keep state remote, locked and separated per environment.", "Check every change automatically with policy as code before it reaches production."], "ls": [{"t": "Why infrastructure as code", "tag": "all", "blocks": [{"k": "p", "x": "Clicking through a console is fine for learning, but it fails for real networks: nobody can review the change, it cannot be repeated exactly in another region, and after a few months nobody knows why a rule exists."}, {"k": "p", "x": "**Infrastructure as code (IaC)** describes the desired network in text files kept in Git. Benefits:"}, {"k": "ul", "x": ["**Review**: every change is a pull request someone checks before it is applied", "**Repeatability**: the same code builds identical dev, test and prod networks, or a new region", "**History**: Git shows who changed which rule, when and why", "**Recovery**: if something is deleted, the code rebuilds it", "**Drift detection**: the tool reports when someone changed things by hand"]}, {"k": "tip", "kind": "Tip", "x": "Treat the console as read-only for production networks. If a change isn't in code, it shouldn't exist."}]}, {"t": "Terraform across clouds", "tag": "all", "blocks": [{"k": "p", "x": "**Terraform** (and its open-source fork **OpenTofu**) uses one language, **HCL**, for all four clouds through **providers**: `hashicorp/aws`, `hashicorp/azurerm`, `hashicorp/google` and `oracle/oci`."}, {"k": "p", "x": "The workflow is always the same: `terraform init` (download providers), `terraform plan` (show the changes), `terraform apply` (make them), and `terraform destroy` (remove everything)."}, {"k": "code", "t": "A minimal AWS VPC with Terraform", "x": "terraform {\n  required_providers { aws = { source = \"hashicorp/aws\", version = \"~> 5.0\" } }\n}\nprovider \"aws\" { region = \"me-central-1\" }\n\nresource \"aws_vpc\" \"main\" {\n  cidr_block           = \"10.32.0.0/16\"\n  enable_dns_hostnames = true\n  tags = { Name = \"vpc-prod\" }\n}\n\nresource \"aws_subnet\" \"app_a\" {\n  vpc_id            = aws_vpc.main.id\n  cidr_block        = \"10.32.16.0/20\"\n  availability_zone = \"me-central-1a\"\n  tags = { Name = \"app-a\" }\n}"}, {"k": "p", "x": "Key concepts: **resources** (things to create), **data sources** (read existing things), **variables** and **outputs**, and **modules** (reusable packages, such as \"a standard three-tier network\"). Use well-maintained community modules (for example `terraform-aws-modules/vpc/aws`) or write your own organisation-standard modules."}, {"k": "tip", "kind": "Tip", "x": "Build one module per cloud with the same inputs (name, CIDR, zones, tiers). Teams then request a network the same way regardless of provider."}]}, {"t": "Native tools", "tag": "all", "blocks": [{"k": "p", "x": "Each provider also has its own IaC option:"}, {"k": "ul", "x": ["**AWS CloudFormation** (YAML/JSON templates) and the **AWS CDK** (write infrastructure in TypeScript, Python, Java and others, compiled to CloudFormation).", "**Azure Bicep**: a concise language compiled to ARM templates, with excellent support for new Azure features on day one. **Azure Verified Modules** provide tested building blocks.", "**Google Cloud Infrastructure Manager**: runs Terraform as a managed service; Google also publishes Terraform blueprints (Cloud Foundation Fabric).", "**OCI Resource Manager**: runs Terraform as a managed service with stored state, drift detection and ready-made stacks."]}, {"k": "code", "t": "The same VNet in Bicep", "x": "resource vnet 'Microsoft.Network/virtualNetworks@2023-09-01' = {\n  name: 'vnet-prod-uaen'\n  location: 'uaenorth'\n  properties: {\n    addressSpace: { addressPrefixes: [ '10.48.0.0/16' ] }\n    subnets: [ { name: 'snet-app', properties: { addressPrefix: '10.48.1.0/24' } } ]\n  }\n}"}, {"k": "tip", "kind": "Tip", "x": "Use Terraform when you span several clouds; native tools are a good choice if you are committed to one provider and want the newest features immediately."}]}, {"t": "State and safety", "tag": "all", "blocks": [{"k": "p", "x": "Terraform records what it created in a **state file**. State is critical: lose it and Terraform no longer knows what it manages; corrupt it with two simultaneous runs and you get broken infrastructure."}, {"k": "p", "x": "Rules:"}, {"k": "ul", "x": ["Store state **remotely** with **locking**: an S3 bucket (with native S3 locking or DynamoDB), Azure Storage with blob leases, a Google Cloud Storage bucket, OCI Object Storage, HCP Terraform, or OCI Resource Manager.", "**Separate state per environment and layer** (prod-network, prod-apps, dev-network) so a mistake has a small blast radius.", "**Never commit secrets** or state files to Git; state can contain sensitive values.", "**Read every plan**. Watch especially for `destroy` and `forces replacement` on networks, gateways and subnets.", "Protect critical resources with `lifecycle { prevent_destroy = true }`."]}, {"k": "code", "t": "Remote state in Azure Storage", "x": "terraform {\n  backend \"azurerm\" {\n    resource_group_name  = \"rg-tfstate\"\n    storage_account_name = \"sttfstateprod01\"\n    container_name       = \"tfstate\"\n    key                  = \"prod/network.tfstate\"\n  }\n}"}, {"k": "tip", "kind": "Watch out", "x": "Changing a subnet's CIDR or an immutable property usually *replaces* the subnet, deleting everything in it. The plan says \"must be replaced\"; stop and rethink when you see it on a network."}]}, {"t": "Policy as code and CI/CD", "tag": "all", "blocks": [{"k": "p", "x": "Automate checks so that mistakes are caught before they reach the cloud."}, {"k": "ul", "x": ["**Static analysis**: **Checkov**, **tfsec/Trivy** or **KICS** scan Terraform for risky patterns (security group open to the world, missing flow logs, public storage).", "**Custom policies**: **Open Policy Agent** with **Conftest**, or HashiCorp **Sentinel**, enforce your own rules on the plan output, such as \"only approved CIDRs\" or \"no public IPs\".", "**Pipeline**: on every pull request, run `terraform fmt -check`, `terraform validate`, `terraform plan` and the policy checks, and post the plan to the pull request. After approval, apply from the pipeline, never from a laptop."]}, {"k": "code", "t": "A small Conftest (Rego) policy: no SSH from the Internet", "x": "package main\ndeny[msg] {\n  r := input.resource_changes[_]\n  r.type == \"aws_security_group_rule\"\n  r.change.after.from_port <= 22\n  r.change.after.to_port >= 22\n  r.change.after.cidr_blocks[_] == \"0.0.0.0/0\"\n  msg := sprintf(\"%s opens SSH to the Internet\", [r.address])\n}"}, {"k": "tip", "kind": "Tip", "x": "Use the cloud's workload identity (OIDC federation from GitHub Actions or GitLab to AWS roles, Azure managed identities, Google Workload Identity Federation, OCI) so pipelines need no stored keys."}]}, {"t": "Drift, imports and day-two operations", "tag": "all", "blocks": [{"k": "p", "x": "Real environments change. Handle it deliberately:"}, {"k": "ul", "x": ["**Drift**: someone changes a rule by hand. `terraform plan` shows the difference; either revert it by applying, or update the code to match. Scheduled plans can alert on drift.", "**Importing existing resources**: `import` blocks (Terraform 1.5+) bring resources created by hand
