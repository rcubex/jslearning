const GRC_PLUS = {"g01": {"goal": "Understand how governance, risk management and compliance fit together, and who does what.", "res": [["IIA Three Lines Model", "https://www.theiia.org/en/content/position-papers/2020/the-iias-three-lines-model-an-update-of-the-three-lines-of-defense/"], ["ISO 31000 Risk management", "https://www.iso.org/iso-31000-risk-management.html"]], "sum": ["Governance sets direction and accountability; risk management handles uncertainty; compliance meets obligations.", "Policies state intent; standards make it measurable; procedures make it repeatable.", "Controls are preventive, detective or corrective, and each needs an owner and evidence.", "The three lines model separates doing, overseeing and independently assuring."], "ls": [{"t": "Governance, Risk and Compliance Explained", "tag": null, "blocks": [{"k": "p", "x": "Think of GRC as three questions an organisation must always be able to answer. **Governance**: who decides, and how do we know decisions are carried out? **Risk management**: what could stop us reaching our objectives, and what are we doing about it? **Compliance**: which laws, regulations and contracts apply, and can we prove we meet them?"}, {"k": "p", "x": "They depend on each other. Governance without risk information makes blind decisions. Risk management without governance has no authority to act. Compliance without risk thinking becomes box-ticking that satisfies an auditor but misses real threats."}, {"k": "p", "x": "A useful structure for who does what is the **Three Lines Model** (Institute of Internal Auditors):"}, {"k": "ul", "x": ["**First line**: business and IT management who own and manage risks day to day (for example, the cloud platform team running access controls).", "**Second line**: specialist functions such as risk management, compliance and information security that set frameworks, challenge and monitor.", "**Third line**: internal audit, which gives independent assurance to the board.", "The **governing body** (board and its committees) sets direction and risk appetite and holds management accountable."]}, {"k": "tip", "kind": "Tip", "x": "When you read any GRC finding, ask which line owns the fix. Most remediation sits with the first line; the second line helps design it; the third line checks it worked."}]}, {"t": "Policies, Standards, Procedures and Guidelines", "tag": null, "blocks": [{"k": "p", "x": "Documents form a hierarchy, and each level has a different job:"}, {"k": "ul", "x": ["**Policy**: short, approved by senior management, states intent and mandatory principles. \"Access to information systems is granted on least privilege and reviewed regularly.\"", "**Standard**: makes the policy measurable. \"Privileged accounts require MFA; access is reviewed every 90 days.\"", "**Procedure**: step-by-step how-to. \"To request admin access, raise a ticket, obtain the system owner's approval…\"", "**Guideline**: recommended but optional good practice."]}, {"k": "p", "x": "Good documents have an **owner**, an **approval** record, a **version** and **review date**, a defined **scope**, and an **exception process** with expiry dates. Auditors often find that documents exist but are outdated, unapproved, or describe a process nobody follows. The gap between \"documented\" and \"practised\" is itself a finding."}, {"k": "tip", "kind": "Watch out", "x": "Writing technical settings (specific products, versions, port numbers) into a policy makes it go stale quickly. Put them in standards, which are easier to update."}]}, {"t": "Controls: Preventive, Detective and Corrective", "tag": null, "blocks": [{"k": "p", "x": "A **control** is any measure that modifies risk. Classify controls by when they act:"}, {"k": "ul", "x": ["**Preventive** controls stop the event happening: approval before granting access, firewall rules, input validation, segregation of duties.", "**Detective** controls notice the event: log monitoring, reconciliations, access reviews, intrusion detection.", "**Corrective** controls limit damage and restore normal operation: incident response, backup restore, revoking access."]}, {"k": "p", "x": "Controls can also be **manual** or **automated** (automated controls are usually more reliable and easier to test), and **key** or **secondary** depending on how much of the risk they address."}, {"k": "p", "x": "A well-defined control has: a clear **objective** (which risk it addresses), an **owner**, a **frequency** (each change, daily, quarterly), a **population** it applies to, and the **evidence** it produces. \"IT reviews access\" is not a control description; \"Each quarter, system owners review all privileged accounts in the finance ERP, approve or remove each, and record decisions in the GRC tool\" is."}, {"k": "tip", "kind": "Tip", "x": "Pair controls. A preventive control (MFA) plus a detective control (alerts on unusual logins) plus a corrective control (automatic session revocation) covers the same risk from three angles."}]}, {"t": "Real-world scenario: a cloud migration with no owner", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** A retail company moves its customer database to a managed cloud service. Six months later, a security review finds the database has public network access enabled, backups are untested, and nobody can say who approved the design."}, {"k": "p", "x": "**Analysis through the GRC lens.**"}, {"k": "ul", "x": ["**Governance gap**: no architecture approval step for cloud services, and no named system owner. Decisions were made informally by a project team that has since moved on.", "**Risk gap**: no risk assessment covered data exposure or recovery. The board's stated low appetite for customer-data breaches was never translated into requirements.", "**Compliance gap**: data protection obligations (encryption, access logging, retention) were not mapped to the new service."]}, {"k": "p", "x": "**Fix.**"}, {"k": "ol", "x": ["Assign a system owner (first line) and record the design decision retrospectively with security sign-off.", "Remediate: disable public access, add private connectivity, test a restore.", "Introduce a cloud intake process: architecture review, risk assessment and compliance mapping before any production data moves.", "Add a detective control: posture management alerts on public endpoints for databases."]}, {"k": "p", "x": "**Lessons learned.** Most control failures trace back to governance: unclear ownership and missing decision points. Fixing the technical issue without fixing ownership invites the same problem next quarter."}]}], "q": [{"t": "Which statement best describes compliance?", "o": ["Deciding the organisation's strategy", "Identifying uncertainty that affects objectives", "Meeting applicable legal, regulatory and contractual obligations and being able to prove it", "Independently auditing the board"], "a": 2, "x": "Compliance is about obligations and evidence; governance and risk management cover direction and uncertainty."}, {"t": "In the Three Lines Model, who provides independent assurance to the board?", "o": ["First line management", "The risk management function", "Internal audit (third line)", "External vendors"], "a": 2, "x": "Internal audit is the independent third line."}, {"t": "\"Privileged accounts require MFA and are reviewed every 90 days.\" What type of document is this?", "o": ["Policy", "Standard", "Procedure", "Guideline"], "a": 1, "x": "It makes a policy principle specific and measurable, which is the role of a standard."}, {"t": "A monthly reconciliation that finds unauthorised payments is which type of control?", "o": ["Preventive", "Detective", "Corrective", "Directive"], "a": 1, "x": "It identifies events after they occur."}, {"t": "What is missing from the control description \"IT reviews access\"?", "o": ["Nothing; it is complete", "Scope, frequency, owner and evidence", "A risk rating", "The policy number only"], "a": 1, "x": "A testable control states who does what, how often, over which population, and what evidence results."}]}, "g02": {"goal": "Identify, assess, treat and report risks in a way decision-makers can act on.", "res": [["ISO 31000 Risk management", "https://www.iso.org/iso-31000-risk-management.html"], ["NIST SP 800-30 Guide for Conducting Risk Assessments", "https://csrc.nist.gov/pubs/sp/800/30/r1/final"]], "sum": ["Inherent risk is before controls; residual risk is after them.", "A good risk statement links a cause, an event and a consequence.", "Treatment options are mitigate, avoid, transfer or accept, within delegated authority.", "A register is useful only if it is owned, current and reported against risk appetite."], "ls": [{"t": "Understanding Inherent and Residual Risk", "tag": null, "blocks": [{"k": "p", "x": "**Inherent risk** is the exposure before considering the controls you rely on. **Residual risk** is what remains after those controls are taken into account. The difference between them shows how much you depend on your controls, which tells you which controls matter most and deserve testing."}, {"k": "p", "x": "Risk is usually assessed on two dimensions using the organisation's approved scales:"}, {"k": "ul", "x": ["**Likelihood**: how probable the event is over a defined period (for example, rare, unlikely, possible, likely, almost certain).", "**Impact**: the consequence if it happens, across financial, regulatory, customer, operational and reputational dimensions."]}, {"k": "p", "x": "A **heat map** plots these. But numbers like \"4 × 5 = 20\" are only as good as the definitions behind them. Use the organisation's criteria, document your reasoning, and state assumptions and uncertainty explicitly."}, {"k": "p", "x": "**Risk appetite** is the amount and type of risk the board is willing to accept to achieve objectives (for example, \"very low appetite for customer data breaches\"). **Tolerances** turn appetite into measurable limits. A residual risk above appetite needs action or a formal decision by someone with the authority to accept it."}, {"k": "tip", "kind": "Watch out", "x": "If residual risk is rated much lower than inherent risk, the controls had better be tested. Assuming controls work without evidence is one of the most common rating errors."}]}, {"t": "Risk Identification and Treatment", "tag": null, "blocks": [{"k": "p", "x": "Strong risk statements have three parts: **cause** (vulnerability or condition), **event** (what could happen) and **consequence** (impact on objectives)."}, {"k": "ul", "x": ["Weak: \"Cyber risk.\"", "Strong: \"Because former contractors keep access to the reporting system (cause), they could access or change financial reports (event), leading to misstatement, regulatory sanctions and reputational damage (consequence).\""]}, {"k": "p", "x": "Sources for identifying risks include process walkthroughs, threat intelligence, incident and audit history, changes (new systems, vendors, regulations) and workshops with process owners."}, {"k": "p", "x": "**Treatment options**:"}, {"k": "ul", "x": ["**Mitigate**: add or improve controls (remove stale access, automate leaver processing).", "**Avoid**: stop the activity (don't store card data at all).", "**Transfer / share**: insurance or contracts (shifts financial impact, not accountability).", "**Accept**: knowingly retain the risk, within delegated authority, with a documented rationale and a review date."]}, {"k": "p", "x": "Every risk needs an **owner** with authority to act, a **treatment plan** with deadlines, and periodic **reassessment**."}, {"k": "tip", "kind": "Tip", "x": "Insurance and outsourcing transfer some financial impact, but regulators still hold the organisation accountable. You can't outsource responsibility."}]}, {"t": "Risk Registers and Reporting", "tag": null, "blocks": [{"k": "p", "x": "A **risk register** is the record of identified risks and what is being done about them. Useful fields: ID, title and statement, business process and assets, category, inherent rating, key controls, residual rating, treatment and actions, owner, due dates, status, last review date, and links to incidents or findings."}, {"k": "p", "x": "Registers fail when they become static lists: risks never closed, ratings never changed, owners who have left. Keep them alive with:"}, {"k": "ul", "x": ["Regular review cycles with owners", "**Key risk indicators (KRIs)**: metrics that warn when risk is rising (for example, number of privileged accounts not reviewed in 90 days)", "Escalation rules when residual risk exceeds appetite or actions are overdue", "Clear reporting to committees: top risks, trends, overdue actions, decisions needed"]}, {"k": "code", "t": "Example register entry", "x": "ID: R-042   Process: Financial reporting   Owner: Head of Finance Systems\nStatement: Stale contractor access to reporting system could allow unauthorised changes to reports.\nInherent: Likely / Major (High)   Key controls: quarterly access review; HR leaver feed\nResidual: Possible / Major (Medium)   Appetite: Low → above appetite\nTreatment: Mitigate – automate leaver deprovisioning by 31 Dec; monthly KRI on stale accounts\nStatus: In progress   Last review: 01 Oct"}, {"k": "tip", "kind": "Tip", "x": "Report risks in business language. \"Stale access could allow changes to the published financial statements\" gets attention; \"IAM hygiene issue\" does not."}]}, {"t": "Real-world scenario: the risk accepted by the wrong person", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** An internal audit at a bank finds that a high residual risk (unencrypted backups of customer data held by a third-party provider) was \"accepted\" eighteen months ago by an IT team lead. The bank's policy allows only the Chief Risk Officer to accept high risks to customer data."}, {"k": "p", "x": "**Analysis.** The acceptance is invalid: it exceeded delegated authority, had no expiry date and no compensating controls documented. The risk was effectively untreated and invisible to senior management."}, {"k": "p", "x": "**Fix.**"}, {"k": "ol", "x": ["Escalate the risk immediately to the correct authority with a clear briefing on exposure and options.", "Require the vendor to encrypt backups (mitigation) with a deadline, or move backups in-house.", "Update the risk acceptance procedure: an authority matrix by risk level, mandatory expiry dates (for example 12 months), compensating controls, and automatic re-review.", "Add a KRI: number of accepted risks past expiry or accepted below the required authority."]}, {"k": "p", "x": "**Lessons learned.** Risk acceptance is a governance decision, not an administrative step. It must sit with someone who has the authority and accountability to live with the consequences."}]}], "q": [{"t": "What is residual risk?", "o": ["Risk before any controls", "Risk remaining after considering existing controls", "Risk transferred to an insurer", "Risk that has been closed"], "a": 1, "x": "Residual risk reflects exposure after controls are taken into account."}, {"t": "Which is the best risk statement?", "o": ["\"Cloud risk is high\"", "\"Contractors\"", "\"Because contractor access isn't removed on exit, former contractors could alter financial reports, causing misstatement and sanctions\"", "\"We need better IAM\""], "a": 2, "x": "It names a cause, an event and a consequence."}, {"t": "Buying cyber insurance is which treatment option?", "o": ["Avoid", "Accept", "Transfer (share)", "Mitigate"], "a": 2, "x": "It shares financial impact, though accountability stays with the organisation."}, {"t": "What is a key risk indicator (KRI)?", "o": ["A risk rating formula", "A metric that warns when a risk is increasing", "An audit finding", "A control owner"], "a": 1, "x": "KRIs are early-warning metrics tied to specific risks."}, {"t": "An IT team lead accepts a high risk that policy says only the CRO may accept. What is the problem?", "o": ["None, if it is documented", "The acceptance exceeds delegated authority and is invalid", "The risk should have been avoided", "Team leads may accept any risk"], "a": 1, "x": "Acceptance must be made by someone with the authority defined in the risk policy."}]}, "g03": {"goal": "Know what the major frameworks require, how they differ, and how to use them together.", "res": [["ISO/IEC 27001", "https://www.iso.org/standard/27001"], ["NIST Cybersecurity Framework 2.0", "https://www.nist.gov/cyberframework"], ["PCI Security Standards Council", "https://www.pcisecuritystandards.org/"]], "sum": ["ISO 27001 certifies a management system; ISO 27002 guides control implementation.", "NIST CSF 2.0 organises outcomes into Govern, Identify, Protect, Detect, Respond and Recover.", "PCI DSS applies to the cardholder data environment; scoping and segmentation decide its reach.", "Map one set of controls to many frameworks instead of running separate programmes."], "ls": [{"t": "ISO 27001 and ISO 27002", "tag": null, "blocks": [{"k": "p", "x": "**ISO/IEC 27001** specifies requirements for an **information security management system (ISMS)**: a repeatable way to manage information security risks. Its clauses cover context and scope, leadership, planning (including risk assessment and treatment), support (resources, competence, awareness, documentation), operation, performance evaluation (monitoring, internal audit, management review) and improvement."}, {"k": "p", "x": "**Annex A** lists reference controls. In the 2022 edition there are 93 controls grouped into four themes: organisational, people, physical and technological. You select controls based on your risk assessment and record them in a **Statement of Applicability (SoA)**, with justification for inclusion or exclusion."}, {"k": "p", "x": "**ISO/IEC 27002** gives implementation guidance for those controls; it is not certifiable on its own."}, {"k": "p", "x": "Certification is performed by an accredited certification body against a defined **scope**. A narrow scope (one data centre, one product) can be certified while the rest of the company is not, so always read the scope statement on a certificate."}, {"k": "tip", "kind": "Watch out", "x": "An ISO 27001 certificate shows that a management system exists and was assessed. It does not prove that every control works perfectly everywhere. Check the scope and the date."}]}, {"t": "NIST Cybersecurity Framework", "tag": null, "blocks": [{"k": "p", "x": "The **NIST Cybersecurity Framework (CSF) 2.0**, published in 2024, organises cybersecurity outcomes into six **functions**:"}, {"k": "ul", "x": ["**Govern**: strategy, roles, policy, risk management and supply chain oversight (new in 2.0)", "**Identify**: understand assets, risks and improvement needs", "**Protect**: safeguards such as access control, training, data security and platform security", "**Detect**: find and analyse possible attacks", "**Respond**: act on detected incidents", "**Recover**: restore assets and operations"]}, {"k": "p", "x": "Each function breaks down into **categories** and **subcategories** describing outcomes, not prescribed controls. Organisations create **profiles**: a **current profile** (where we are) and a **target profile** (where we want to be), then prioritise the gaps. **Tiers** describe how rigorous and integrated the organisation's practices are."}, {"k": "p", "x": "CSF is voluntary and not certifiable, which makes it a flexible common language for boards and technical teams, and it maps to other frameworks such as ISO 27001 and NIST SP 800-53."}, {"k": "tip", "kind": "Tip", "x": "CSF's Govern function is a natural home for cloud governance: who approves cloud services, how third-party risk is managed and how cyber risk is reported to the board."}]}, {"t": "PCI DSS and Control Applicability", "tag": null, "blocks": [{"k": "p", "x": "The **Payment Card Industry Data Security Standard (PCI DSS)** applies to entities that store, process or transmit cardholder data, or that can affect the security of that environment. Version 4.0 (and its 4.0.1 update) is current, with requirements across twelve areas: network security controls, secure configurations, protecting stored data, encrypting transmission, malware protection, secure systems and software, access restriction, identification and authentication, physical access, logging and monitoring, testing, and policies and programmes."}, {"k": "p", "x": "**Scoping** is the most important step. The **cardholder data environment (CDE)** includes systems that handle card data, plus systems **connected to** or able to **affect the security of** it. **Network segmentation** can reduce scope if it is properly designed and tested; without it, the whole network may be in scope."}, {"k": "p", "x": "Validation depends on the entity's role and transaction volume: a **Report on Compliance (ROC)** by a Qualified Security Assessor, or a **Self-Assessment Questionnaire (SAQ)** for smaller merchants, as set by the card brands and acquirer."}, {"k": "tip", "kind": "Tip", "x": "The cheapest way to reduce PCI scope is not to touch card data at all: use a payment provider's hosted page or tokenisation, so card numbers never enter your systems."}]}, {"t": "Real-world scenario: one control set, three frameworks", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** A fintech company must hold ISO 27001 certification, satisfy a bank partner's NIST CSF-based questionnaire, and comply with PCI DSS. Three teams run three separate spreadsheets, collect the same evidence three times, and disagree about which access review is \"the\" control."}, {"k": "p", "x": "**Approach.**"}, {"k": "ol", "x": ["Build a **unified control library**: one control per real activity (for example, \"quarterly privileged access review\"), each with owner, frequency and evidence.", "**Map** each control to the requirements it satisfies: ISO 27001 Annex A controls, CSF subcategories, PCI DSS requirements.", "Collect evidence **once** in a GRC tool, tagged for all mapped frameworks.", "Use the mapping to find **gaps** (PCI requirements with no control) and **redundancies** (three near-identical reviews).", "Report status by framework from the same data."]}, {"k": "p", "x": "**Result.** Evidence requests fell by about half, audits became predictable, and control owners understood exactly what they were accountable for."}, {"k": "p", "x": "**Lessons learned.** Frameworks describe what good looks like; controls are what you actually do. Run one control programme and map it to many frameworks."}]}], "q": [{"t": "What does an ISO 27001 Statement of Applicability record?", "o": ["The certification fee", "Which Annex A controls are applied or excluded, with justification", "Every employee's training record", "The risk appetite"], "a": 1, "x": "The SoA links selected controls to the risk assessment and justifies exclusions."}, {"t": "Which function was added in NIST CSF 2.0?", "o": ["Identify", "Detect", "Govern", "Recover"], "a": 2, "x": "CSF 2.0 added Govern to the original five functions."}, {"t": "Which systems are in PCI DSS scope?", "o": ["Only the database storing card numbers", "Systems that store, process or transmit card data, plus systems connected to or able to affect the CDE", "Every system the company owns, always", "Only payment terminals"], "a": 1, "x": "Connected and security-impacting systems are in scope unless properly segmented."}, {"t": "What is the main benefit of mapping one control set to several frameworks?", "o": ["It removes the need for audits", "Evidence is collected once and gaps and overlaps become visible", "It guarantees certification", "It replaces risk assessment"], "a": 1, "x": "A unified control library avoids duplicated work and shows coverage clearly."}, {"t": "Is NIST CSF a certifiable standard?", "o": ["Yes, like ISO 27001", "No, it is a voluntary framework of outcomes", "Only for US federal agencies", "Only with PCI DSS"], "a": 1, "x": "CSF is voluntary and outcome-based; organisations use profiles rather than certificates."}]}, "g04": {"goal": "Design and test the IT controls auditors rely on: access, change and operations.", "res": [["ISACA COBIT", "https://www.isaca.org/resources/cobit"], ["NIST SP 800-53 (control catalogue)", "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"]], "sum": ["ITGCs cover access, change management, operations and development of systems that matter.", "Access must be requested, approved, provisioned, reviewed and removed, with evidence at each step.", "Change management balances speed with authorisation, testing and segregation of duties.", "Test both design and operating effectiveness with complete populations and representative samples."], "ls": [{"t": "Identity Lifecycle and Access Reviews", "tag": null, "blocks": [{"k": "p", "x": "**IT general controls (ITGCs)** are the foundational controls over the systems that support important processes (for example, financial reporting). Auditors rely on them before trusting any automated control or system report."}, {"k": "p", "x": "The **identity lifecycle** is where most access failures happen:"}, {"k": "ul", "x": ["**Joiner**: access granted based on role, approved by the right manager or system owner.", "**Mover**: access adjusted when someone changes role; old access removed (the classic failure is accumulating access over years).", "**Leaver**: all access removed promptly, ideally triggered automatically by HR.", "**Privileged access**: admin rights limited, time-bound (just-in-time), monitored and reviewed more often.", "**Service and shared accounts**: owned by a named person, credentials vaulted and rotated."]}, {"k": "p", "x": "**User access reviews (certifications)** are a detective control: owners periodically confirm each user's access is still needed. An effective review has a **complete and accurate population** (extracted directly from the system), a **reviewer with knowledge** (not the person whose access is reviewed), a **recorded decision** for each account, and **evidence that removals actually happened**."}, {"k": "tip", "kind": "Watch out", "x": "\"Rubber-stamp\" reviews, where a manager approves 500 accounts in two minutes, are common. Look at review timestamps and removal rates as signs of quality."}]}, {"t": "Change Management Controls", "tag": null, "blocks": [{"k": "p", "x": "Change management ensures that changes to systems are **authorised, tested and implemented correctly**, without unauthorised changes slipping in."}, {"k": "p", "x": "Key elements:"}, {"k": "ul", "x": ["**Request and classification**: standard (pre-approved, low risk), normal (needs assessment and approval), emergency (expedited, approved retrospectively).", "**Risk and impact assessment**, including rollback plans.", "**Testing** in a non-production environment, with evidence.", "**Approval** by an appropriate authority (a change advisory board for significant changes).", "**Segregation of duties**: the person who writes a change shouldn't be the only one who approves and deploys it to production.", "**Post-implementation review** for significant or failed changes.", "**Detection of unauthorised changes**: comparing production with approved changes (for example, configuration drift alerts, file integrity monitoring)."]}, {"k": "p", "x": "In cloud and DevOps environments, these controls are often automated: pull-request reviews, pipeline approvals, infrastructure-as-code plans, and restrictions so only the pipeline can deploy to production. Auditors accept automated evidence when the pipeline and its permissions are themselves controlled."}, {"k": "tip", "kind": "Tip", "x": "Ask \"could a developer push straight to production without anyone else seeing it?\" If yes, segregation of duties is broken regardless of what the policy says."}]}, {"t": "Audit Evidence and Testing", "tag": null, "blocks": [{"k": "p", "x": "Controls are tested in two ways:"}, {"k": "ul", "x": ["**Design effectiveness**: if the control operates as described, would it address the risk? (Walkthrough: follow one example through the process.)", "**Operating effectiveness**: did it actually operate consistently throughout the period? (Test a sample across the period.)"]}, {"k": "p", "x": "Good testing requires:"}, {"k": "ul", "x": ["**Complete and accurate population**: how do you know the list of changes or users is complete? Ideally extracted by the tester or with evidence of the query.", "**Representative sampling** according to the audit methodology, covering the whole period.", "**Sufficient, appropriate evidence**: system-generated records, approvals with dates, before-and-after configurations. Screenshots without dates or context are weak.", "**Clear conclusions**: effective, or deficient with a described exception and its impact."]}, {"k": "tip", "kind": "Watch out", "x": "An exception in a sample is not automatically minor. Ask what it means for the population: if one of 25 sampled changes was unapproved, how many of the 2,000 in the year might be?"}]}, {"t": "Real-world scenario: the access review that proved nothing", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** During an external audit of a payments company, the quarterly privileged access review for the core database is marked \"completed\" every quarter. The auditor asks for evidence and receives a signed email: \"Reviewed, all OK.\""}, {"k": "p", "x": "**Testing.**"}, {"k": "ol", "x": ["The auditor asks how the user list was produced. Nobody knows; it was a spreadsheet maintained by hand.", "A fresh system extract shows 41 privileged accounts; the spreadsheet listed 29.", "Of the 12 missing accounts, 4 belonged to people who had left the company, and 2 were unowned service accounts."]}, {"k": "p", "x": "**Conclusion.** The control was deficient in design (no reliable population) and operation (no per-account decisions, no removals). The auditor reported a significant deficiency."}, {"k": "p", "x": "**Remediation.**"}, {"k": "ol", "x": ["Remove the leavers' accounts immediately; assign owners to service accounts and vault their credentials.", "Generate review populations directly from the system with a documented query.", "Use a tool or template capturing a decision per account, with reviewer, date and follow-up of removals.", "Connect HR leaver events to automatic deprovisioning."]}, {"k": "p", "x": "**Lessons learned.** Evidence must show that a control operated over a complete population and led to action. \"Reviewed, all OK\" is not evidence."}]}], "q": [{"t": "What does testing operating effectiveness check?", "o": ["Whether the control is documented", "Whether the control actually operated consistently throughout the period", "Whether the policy is approved", "Whether the risk is high"], "a": 1, "x": "Operating effectiveness tests real performance over time, usually through sampling."}, {"t": "Which is the classic access failure in the \"mover\" stage?", "o": ["Accounts created too slowly", "Old access not removed when someone changes role, so access accumulates", "Passwords too long", "MFA prompts"], "a": 1, "x": "Movers often keep previous access, breaking least privilege."}, {"t": "A developer can merge and deploy their own code to production with no other review. Which principle is broken?", "o": ["Data residency", "Segregation of duties", "Risk appetite", "Business continuity"], "a": 1, "x": "One person controlling a change end to end defeats independent review."}, {"t": "Why is a \"complete and accurate population\" essential for an access review?", "o": ["It makes the review faster", "Without it, accounts can be missed and the review cannot be relied on", "Auditors require spreadsheets", "It removes the need for sampling"], "a": 1, "x": "Missing accounts were exactly what the unreliable spreadsheet hid in the scenario."}, {"t": "What are the three classes of change?", "o": ["Small, medium, large", "Standard, normal and emergency", "Manual, automated, hybrid", "Internal, external, vendor"], "a": 1, "x": "Change processes typically distinguish pre-approved standard changes, normal changes and emergency changes."}]}, "g05": {"goal": "Keep critical services running through disruption and manage the risks of depending on suppliers.", "res": [["ISO 22301 Business continuity", "https://www.iso.org/standard/75106.html"], ["NIST SP 800-34 Contingency Planning", "https://csrc.nist.gov/pubs/sp/800/34/r1/upd1/final"]], "sum": ["A BIA identifies critical processes, dependencies and how impact grows over time.", "RTO is how fast to recover; RPO is how much data loss is acceptable.", "Third-party risk is assessed by criticality, data access, concentration and exit feasibility.", "The cloud provider's assurance covers its part; you must still evidence yours."], "ls": [{"t": "Business Impact Analysis and Recovery Objectives", "tag": null, "blocks": [{"k": "p", "x": "A **business impact analysis (BIA)** identifies which processes matter most and what happens to the organisation as each is disrupted over time."}, {"k": "p", "x": "For each critical process, record:"}, {"k": "ul", "x": ["**Impact over time** (1 hour, 4 hours, 1 day, 1 week) across customers, finance, regulation and reputation", "**Maximum tolerable period of disruption (MTPD)**: beyond this, damage becomes unacceptable", "**RTO** (recovery time objective): the target time to restore the process, shorter than the MTPD", "**RPO** (recovery point objective): the maximum acceptable data loss, measured backwards from the incident", "**Dependencies**: people, sites, applications, data, networks, suppliers, and other processes"]}, {"k": "p", "x": "Then compare **targets with capability**. If payments require an RTO of 2 hours but the database restore takes 9 hours, that gap is a risk to treat, not a footnote."}, {"k": "tip", "kind": "Tip", "x": "Dependency mapping often reveals hidden single points of failure: one network provider, one key person, one identity provider used by everything."}]}, {"t": "Vendor Due Diligence and Continuous Monitoring", "tag": null, "blocks": [{"k": "p", "x": "Organisations depend on suppliers for cloud hosting, payments, software, support and more. Regulators increasingly expect **third-party risk management (TPRM)** throughout the lifecycle:"}, {"k": "ol", "x": ["**Planning and tiering**: classify suppliers by **criticality** (would failure stop a critical service?), **data access** (do they handle sensitive data?), and **concentration** (do many services depend on one supplier?).", "**Due diligence** proportional to the tier: security questionnaires, certifications and reports (ISO 27001 certificate with scope, SOC 2 Type II report), financial health, subcontractors (fourth parties), location of data.", "**Contracting**: security requirements, audit rights, breach notification timelines, service levels, data return and deletion, and **exit** provisions.", "**Ongoing monitoring**: periodic reassessment, performance against SLAs, incident notifications, news and financial signals.", "**Exit**: a tested plan for leaving the supplier without breaking critical services."]}, {"k": "tip", "kind": "Watch out", "x": "A SOC 2 report lists **complementary user entity controls (CUECs)**: controls the customer must operate for the supplier's controls to be effective. Read them; they are your responsibilities."}]}, {"t": "Cloud Shared Responsibility", "tag": null, "blocks": [{"k": "p", "x": "In the cloud, responsibility is split between provider and customer, and the split changes with the service model (IaaS, PaaS, SaaS)."}, {"k": "ul", "x": ["The **provider** secures the physical facilities, hardware, network and virtualisation, and the managed layers of each service. They prove it with certifications and reports (ISO 27001, SOC 2, CSA STAR and others) available to customers.", "The **customer** remains responsible for identity and access, configuration (network exposure, encryption settings, logging), data classification and handling, and, for IaaS, the operating system and applications."]}, {"k": "p", "x": "For assurance, this means:"}, {"k": "ul", "x": ["Provider reports cover only the provider's part. You still need evidence of your own controls: access reviews, configuration baselines, logging, key management.", "Configuration risks are the most common cause of cloud incidents, so continuous configuration monitoring (posture management) is a key control.", "Concentration risk matters: many critical services in one region or provider may need a resilience plan."]}, {"k": "tip", "kind": "Tip", "x": "Build a responsibility matrix per major cloud service: for each control area, mark provider, customer or shared, and where the evidence comes from."}]}, {"t": "Real-world scenario: the supplier outage nobody planned for", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** A healthcare company's appointment booking runs on a SaaS platform. One Monday, the supplier suffers a 14-hour outage. Clinics can't see bookings; staff fall back to phoning patients from memory. The BIA had classified booking as critical with an RTO of 4 hours, but nobody had checked the supplier's recovery capability."}, {"k": "p", "x": "**Analysis.**"}, {"k": "ul", "x": ["The supplier's contract promised 99.9% monthly availability, with service credits but no recovery time commitment.", "No offline export of the day's appointments existed.", "The supplier was tiered \"medium\" because it stored no clinical records, although the process it supported was critical."]}, {"k": "p", "x": "**Fix.**"}, {"k": "ol", "x": ["Re-tier suppliers by the **criticality of the process** they support, not only by data sensitivity.", "Negotiate recovery commitments and incident communication timelines; review the supplier's continuity testing evidence.", "Build a **workaround**: an automatic nightly export of the next two days' appointments, available offline to clinics.", "Exercise the scenario annually with clinic staff."]}, {"k": "p", "x": "**Lessons learned.** Your RTO is only as good as your weakest dependency. Third-party risk and business continuity must be managed together."}]}], "q": [{"t": "What does RPO measure?", "o": ["How quickly service is restored", "The maximum acceptable data loss, measured in time", "The number of recovery sites", "Supplier uptime"], "a": 1, "x": "RPO is about how much data you can afford to lose."}, {"t": "A BIA says RTO is 2 hours, but restores take 9 hours. What is this?", "o": ["Acceptable variance", "A capability gap and a risk that needs treatment", "A compliance success", "An RPO issue only"], "a": 1, "x": "Targets must be compared with proven capability."}, {"t": "In a SOC 2 report, what are complementary user entity controls?", "o": ["Controls the auditor performs", "Controls the customer must operate for the supplier's controls to be effective", "Optional supplier controls", "Controls for subcontractors only"], "a": 1, "x": "CUECs describe customer responsibilities; ignoring them leaves gaps."}, {"t": "How should suppliers be tiered?", "o": ["Only by contract value", "By criticality of the services they support, data access and concentration", "Alphabetically", "Only by data sensitivity"], "a": 1, "x": "The scenario showed that process criticality matters even without sensitive data."}, {"t": "Does a cloud provider's ISO 27001 certificate prove your cloud configuration is secure?", "o": ["Yes, it covers everything in the cloud", "No, it covers the provider's controls within its scope; you must evidence your own", "Only for IaaS", "Only if you are certified too"], "a": 1, "x": "Shared responsibility means customer controls need their own evidence."}]}, "g06": {"goal": "Apply GRC thinking to complex, realistic situations and communicate decisions clearly.", "res": [["COSO Enterprise Risk Management", "https://www.coso.org/enterprise-risk-management"], ["IIA Global Internal Audit Standards", "https://www.theiia.org/en/standards/2024-standards/global-internal-audit-standards/"]], "sum": ["Start from business objectives and obligations, then risks, then controls and evidence.", "Separate a finding's condition, criteria, cause, effect and corrective action.", "Senior management needs exposure, options and the decision required, not technical detail.", "Good GRC work is traceable: from obligation to control to evidence to decision."], "ls": [{"t": "Assessing a Cloud Migration", "tag": null, "blocks": [{"k": "p", "x": "A cloud migration changes risk in many directions at once, so assess it systematically:"}, {"k": "ol", "x": ["**Objectives and scope**: what is moving, why (cost, scale, resilience), and what success looks like.", "**Data classification and obligations**: which data types move (customer, financial, health), where they will be stored and processed, and which laws, regulations and contracts apply (data residency, sector rules, customer commitments).", "**Architecture and responsibilities**: service models used, the shared responsibility split, identity design, network exposure, encryption and key ownership, logging.", "**Third parties**: the cloud provider and any managed service partners, their assurance reports and contracts.", "**Resilience**: regions and zones, backup and restore, recovery objectives compared with the BIA, exit strategy.", "**Material risks and treatment**: documented, owned and rated against appetite.", "**Sign-off**: risk acceptance at the right authority before production data moves."]}, {"k": "tip", "kind": "Tip", "x": "Ask for evidence early: architecture diagrams, data-flow diagrams, the provider's SOC 2 and ISO certificates, the landing-zone guardrails, and a tested restore. Gaps found before go-live are far cheaper."}]}, {"t": "Evaluating a Regulatory Finding", "tag": null, "blocks": [{"k": "p", "x": "A well-written finding has five parts (often called the **5 Cs**):"}, {"k": "ul", "x": ["**Condition**: what was found (\"23 of 60 sampled privileged users had no access review in the last two quarters\").", "**Criteria**: what should have been true (the access management standard requiring quarterly reviews).", "**Cause**: why it happened (no automated population; reviewer role unassigned after a reorganisation).", "**Consequence / effect**: the risk created (unauthorised access to customer data may go undetected).", "**Corrective action**: what will be done, by whom, by when."]}, {"k": "p", "x": "A strong **action plan** fixes the **root cause**, not only the symptoms. Removing the 23 stale accounts fixes today's condition; assigning ownership, automating the population and adding a KRI stops it recurring. Plans need an accountable owner, measurable milestones, evidence of completion and **independent validation** before closure."}, {"k": "tip", "kind": "Watch out", "x": "Regulators notice repeat findings. A finding closed by a one-off clean-up that reappears next year signals weak governance and often brings stronger supervisory action."}]}, {"t": "Reporting to Senior Management", "tag": null, "blocks": [{"k": "p", "x": "Boards and executive committees have little time and broad responsibility. Effective GRC reporting:"}, {"k": "ul", "x": ["**Leads with the message**: \"Our recovery capability for payments does not meet the board-approved RTO.\"", "**Explains exposure in business terms**: customers affected, financial and regulatory consequences, likelihood.", "**Separates facts, assumptions and unknowns.**", "**Presents options** with cost, time and residual risk for each (mitigate, transfer, accept).", "**States the decision required** and by when.", "**Tracks trends**: top risks over time, overdue actions, risks above appetite."]}, {"k": "code", "t": "A one-page risk briefing structure", "x": "1. Headline: the issue in one sentence\n2. Why it matters: business impact and likelihood, versus appetite\n3. What we know / don't know\n4. Options: A (cost, timing, residual risk), B (…), C: accept (with conditions)\n5. Recommendation and decision requested\n6. Next update date"}, {"k": "tip", "kind": "Tip", "x": "Avoid acronyms and tool names in board papers. If a director needs a glossary to understand the risk, the paper hasn't done its job."}]}, {"t": "Real-world scenario: a regulator's letter after an outage", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** A digital bank suffers a 6-hour outage of mobile payments caused by an expired certificate on an internal API gateway. The regulator requests a report within 10 working days: cause, customer impact, and remediation."}, {"k": "p", "x": "**How the GRC function responds.**"}, {"k": "ol", "x": ["**Facts**: timeline from monitoring and incident records; number of failed transactions and affected customers; complaints received.", "**Root cause analysis**: the immediate cause was the expired certificate. Underlying causes were manual renewal, no expiry monitoring, no certificate inventory, and an untested failover that depended on the same certificate.", "**Control assessment**: certificate management was not covered in the IT risk register; change management did not track renewal tasks.", "**Remediation plan**: automated certificate issuance and renewal, an inventory with owners, expiry alerts at 30, 14 and 7 days, failover testing, and a risk entry with KRIs. Each action has an owner, date and validation step.", "**Report**: clear, factual, no blame, with the board's oversight of the plan documented."]}, {"k": "p", "x": "**Lessons learned.** Regulators look for honest analysis, root causes and credible, governed remediation. A technically small failure becomes a governance story if controls and ownership were missing."}]}], "q": [{"t": "Which part of a finding describes what should have been true?", "o": ["Condition", "Criteria", "Cause", "Consequence"], "a": 1, "x": "Criteria are the requirements or expectations the condition is compared against."}, {"t": "Why should an action plan address the root cause?", "o": ["Auditors prefer longer plans", "Fixing only symptoms lets the problem recur and creates repeat findings", "Root causes are cheaper", "It avoids needing an owner"], "a": 1, "x": "Repeat findings signal weak governance; root-cause fixes prevent recurrence."}, {"t": "What should a board risk paper lead with?", "o": ["The full technical background", "The key message and the decision required", "A list of acronyms", "The audit methodology"], "a": 1, "x": "Senior readers need the headline, exposure and decision first."}, {"t": "Before production data moves to the cloud, what should exist?", "o": ["Only a project plan", "A risk assessment with treatment and sign-off at the right authority", "A marketing announcement", "Nothing until the first audit"], "a": 1, "x": "Material risks must be assessed, owned and accepted or treated before go-live."}, {"t": "In the regulator scenario, which was an underlying cause rather than the immediate cause?", "o": ["The certificate expired", "Certificates were renewed manually with no inventory or expiry monitoring", "Customers couldn't pay", "The outage lasted 6 hours"], "a": 1, "x": "The expiry was the trigger; missing controls and ownership were the underlying causes."}]}, "g07": {"goal": "Run information security risk assessments that produce defensible, actionable ratings.", "res": [["NIST SP 800-30 Guide for Conducting Risk Assessments", "https://csrc.nist.gov/pubs/sp/800/30/r1/final"], ["ISO/IEC 27005 Information security risk management", "https://www.iso.org/standard/80585.html"]], "sum": ["Risk statements tie an asset, a threat event, a weakness and a business consequence.", "A control can be well designed yet fail in operation; test both.", "Residual ratings must be justified by evidence about the controls.", "State assumptions and uncertainty instead of inventing precision."], "ls": [{"t": "Building a reliable risk statement", "tag": null, "blocks": [{"k": "p", "x": "An information security risk assessment usually follows these steps:"}, {"k": "ol", "x": ["**Context**: the business process and its objectives, scope, and the organisation's rating criteria.", "**Assets**: information and systems that support the process, and how critical they are (confidentiality, integrity, availability).", "**Threats and threat events**: who or what could cause harm (external attackers, insiders, failures, suppliers) and how.", "**Vulnerabilities and control gaps**: weaknesses that make the event possible or more likely.", "**Likelihood and impact** using approved scales.", "**Risk statement and rating.**"]}, {"k": "p", "x": "A defensible risk statement separates **observed facts** from **potential consequences**. \"Fourteen former contractors still have active accounts on the reporting system\" is a fact. \"They could alter published financial reports\" is a plausible consequence. Rate the scenario honestly: is the access usable remotely? Is there evidence of use? How sensitive are the reports?"}, {"k": "p", "x": "Where information is missing (for example, asset criticality isn't documented), record the **assumption** and the action to confirm it rather than guessing."}, {"k": "tip", "kind": "Tip", "x": "Scenario-based risk statements (\"an attacker uses stolen VPN credentials to reach the ERP\") are easier for owners to understand and act on than abstract categories (\"unauthorised access\")."}]}, {"t": "Control design versus operating effectiveness", "tag": null, "blocks": [{"k": "p", "x": "Two different questions decide whether a control reduces risk:"}, {"k": "ul", "x": ["**Design effectiveness**: if performed as described, would the control address the risk? A quarterly access review designed without privileged accounts in scope is poorly designed, however diligently it runs.", "**Operating effectiveness**: was it actually performed consistently, by the right people, over the period, with evidence? A well-designed MFA control that has 40 exempted accounts isn't operating effectively."]}, {"k": "p", "x": "Ways to gather evidence: **inquiry** (asking; weakest alone), **observation** (watching it happen), **inspection** (reviewing records and configurations), and **re-performance** (doing the control yourself to see if you get the same result; strongest)."}, {"k": "p", "x": "Automated controls (for example, a configuration enforced by policy in the cloud) can be tested once for design and then by confirming the configuration hasn't changed during the period, which is why automation makes assurance cheaper."}, {"k": "tip", "kind": "Watch out", "x": "Interviews alone are not evidence of operation. \"We always do that\" must be supported by records."}]}, {"t": "From inherent risk to residual risk", "tag": null, "blocks": [{"k": "p", "x": "The step from inherent to residual risk is where many assessments go wrong. To justify a lower residual rating:"}, {"k": "ol", "x": ["**Identify the specific controls** that reduce likelihood or impact for this scenario.", "**Check their evidence**: tested recently? Any exceptions? Do they cover the whole population?", "**Adjust only as far as the evidence supports.** Untested controls should reduce the rating little, if at all.", "**Record the reasoning** so a reviewer can follow it."]}, {"k": "p", "x": "Then compare the residual rating with **risk appetite**. If it's above appetite, the owner needs a treatment plan or a formal acceptance at the right level."}, {"k": "code", "t": "Worked example", "x": "Scenario: Stolen admin credentials used to access the cloud console\nInherent: Likely / Severe\nControls: MFA on all console users (tested, 0 exceptions); alerting on console logins from new countries (tested, 2 missed alerts in sample)\nResidual: Unlikely / Severe → Medium\nAbove appetite? Yes (appetite: Low for admin compromise) → treatment: phishing-resistant MFA keys for admins, fix alert gaps"}, {"k": "tip", "kind": "Tip", "x": "Impact rarely drops much through controls; likelihood usually does. If a control claims to cut impact, check it: backups, encryption and segmentation are typical examples that genuinely limit impact."}]}, {"t": "Real-world scenario: assessing a new SaaS HR system", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** HR wants to adopt a SaaS platform that will hold all employee personal data, salaries and performance reviews. Go-live is in six weeks; the security team is asked for a risk assessment."}, {"k": "p", "x": "**Assessment.**"}, {"k": "ol", "x": ["**Assets and data**: highly sensitive personal data for 4,000 employees; integrity of payroll inputs.", "**Threat events**: account takeover of HR admins; misconfigured sharing exposing reports; supplier breach; data residency breach if stored outside the approved country.", "**Controls reviewed**: SSO with MFA through the corporate identity provider (supported); role-based permissions (supported, but default admin roles too broad); supplier's SOC 2 Type II (clean opinion, includes CUECs on access reviews and SSO); data hosted in an approved region (confirmed in contract).", "**Gaps**: no plan for periodic access reviews; audit logs retained only 90 days by default; no tested export for exit.", "**Ratings**: account takeover Medium after SSO/MFA; misconfiguration High until roles are redesigned."]}, {"k": "p", "x": "**Outcome.** Go-live approved with conditions: least-privilege role design before data load, quarterly access reviews (meeting the CUEC), log export to the SIEM, and an exit plan within three months. The residual risk for misconfiguration was formally accepted by the HR director for the six-week period until roles were fixed."}, {"k": "p", "x": "**Lessons learned.** A useful assessment ends with clear conditions, owners and dates, not just a heat map."}]}], "q": [{"t": "Which evidence-gathering technique is strongest?", "o": ["Inquiry", "Observation", "Inspection", "Re-performance"], "a": 3, "x": "Re-performing the control shows directly whether it produces the right result."}, {"t": "A review that never includes privileged accounts is an example of what?", "o": ["An operating failure", "A design deficiency", "A compliant control", "A KRI"], "a": 1, "x": "It wouldn't address the risk even if performed perfectly."}, {"t": "How far should an untested control reduce a residual risk rating?", "o": ["As much as the owner wishes", "Little or not at all, until evidence supports it", "By exactly one level", "Fully to low"], "a": 1, "x": "Residual ratings must be justified by evidence."}, {"t": "Asset criticality is unknown during an assessment. What should you do?", "o": ["Assume it is low", "Skip the risk", "Record the assumption and an action to confirm it", "Rate everything critical without explanation"], "a": 2, "x": "Transparent assumptions keep the assessment defensible."}, {"t": "What did the SaaS assessment end with?", "o": ["Only a heat map", "Approval with specific conditions, owners and dates, plus a time-bound formal acceptance", "Automatic rejection", "No decision"], "a": 1, "x": "Actionable conditions make an assessment useful."}]}, "g08": {"goal": "Plan audits, judge evidence quality, and write findings that lead to real change.", "res": [["IIA Global Internal Audit Standards", "https://www.theiia.org/en/standards/2024-standards/global-internal-audit-standards/"], ["ISACA IT Audit Framework (ITAF)", "https://www.isaca.org/resources/itaf"]], "sum": ["Scope and objectives come from risk, and must be agreed and documented.", "Good evidence is relevant, reliable, sufficient and covers the period.", "Findings link condition, criteria, cause and effect, rated by significance.", "Remediation is closed only after independent validation."], "ls": [{"t": "Understanding audit scope and objectives", "tag": null, "blocks": [{"k": "p", "x": "An audit starts with **planning**, driven by risk:"}, {"k": "ul", "x": ["**Objective**: what the audit will conclude on (\"whether privileged access to production cloud environments is effectively controlled\").", "**Scope**: which systems, processes, locations and time period are included, and what is explicitly excluded.", "**Criteria**: the policies, standards, regulations or frameworks used as the yardstick.", "**Approach**: walkthroughs, control testing, data analytics, sampling strategy.", "**Resources and timing.**"]}, {"k": "p", "x": "Planning includes understanding the process (interviews, documents, walkthroughs), identifying key risks and controls, and agreeing the scope with management in an engagement letter or planning memo. Scope changes during fieldwork must be documented and justified."}, {"k": "tip", "kind": "Tip", "x": "Write the audit objective as a question you'll answer with a conclusion. Vague objectives (\"review cloud security\") produce vague reports."}]}, {"t": "Evaluating evidence quality", "tag": null, "blocks": [{"k": "p", "x": "Evidence supports conclusions only if it is:"}, {"k": "ul", "x": ["**Relevant**: it relates to the control and the objective being tested.", "**Reliable**: its source and integrity can be trusted. System-generated records from controlled systems beat manually prepared spreadsheets; evidence obtained directly by the auditor beats evidence handed over by the auditee.", "**Sufficient**: enough of it, based on sample sizes and risk.", "**Timely and covering the period**: evidence from the audit period, not just today's state."]}, {"k": "p", "x": "Common weak evidence:"}, {"k": "ul", "x": ["Screenshots without dates, system names or filters visible", "\"Point-in-time\" configurations offered as proof of a full year", "Approvals dated after the change was implemented", "Populations without proof of completeness"]}, {"k": "p", "x": "Strengthen evidence by watching the auditee run queries, recording parameters, using read-only audit access to pull data directly, and corroborating from multiple sources."}, {"k": "tip", "kind": "Watch out", "x": "Data analytics on full populations (for example, every change ticket for the year) can replace sampling and find patterns sampling would miss, but only if the data's completeness and accuracy are verified first."}]}, {"t": "Writing findings and remediation plans", "tag": null, "blocks": [{"k": "p", "x": "A finding must be clear to someone who wasn't there. Structure it with **condition, criteria, cause, effect** (consequence) and **recommendation**, and rate it by **significance** using the audit function's methodology (for example, high, medium, low), considering both likelihood and impact on objectives."}, {"k": "p", "x": "Good findings:"}, {"k": "ul", "x": ["State facts precisely (\"7 of 25 sampled production changes had no recorded approval before implementation\").", "Explain why it matters in business terms.", "Identify the **root cause**, which drives the recommendation.", "Avoid blaming individuals; focus on processes and controls."]}, {"k": "p", "x": "**Management responses** should include an action, an owner, a target date and, ideally, how completion will be evidenced. The audit function tracks actions and **validates** remediation before closing them; self-reported closure without evidence is a common weakness."}, {"k": "tip", "kind": "Tip", "x": "Recommendations should say what outcome is needed, leaving management room to choose how. \"Ensure only approved changes reach production\" is better than \"buy tool X\"."}]}, {"t": "Real-world scenario: auditing cloud change management", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** Internal audit reviews change management for a company's cloud platform, where infrastructure is deployed through pipelines."}, {"k": "p", "x": "**Fieldwork.**"}, {"k": "ol", "x": ["**Walkthrough**: a change starts as a pull request, requires one reviewer, passes automated tests, and is deployed by the pipeline.", "**Design questions**: can anyone bypass the pipeline? The auditor reviews IAM permissions and finds 9 engineers with direct console admin rights in production.", "**Population**: the auditor extracts all production deployments for the year from the pipeline (2,140) and all console changes from the audit log (310).", "**Testing**: pipeline changes, sampled, all had reviews. Of the 310 console changes, 64 had no corresponding ticket.", "**Root cause**: break-glass admin access was granted permanently during an incident and never removed; no detective control compared console changes with approved tickets."]}, {"k": "p", "x": "**Finding** (high): unauthorised production changes possible and occurring outside the controlled pipeline. **Recommendations**: just-in-time break-glass access with approval and expiry; alerts on console changes in production; periodic reconciliation of changes with tickets."}, {"k": "p", "x": "**Lessons learned.** In automated environments, the main audit question is \"what can bypass the automation?\" The pipeline was well controlled; the side door wasn't."}]}], "q": [{"t": "What makes evidence reliable?", "o": ["It was emailed by the auditee", "Its source and integrity can be trusted, such as system records obtained directly by the auditor", "It is a long document", "It was produced today"], "a": 1, "x": "Reliability depends on source and integrity."}, {"t": "A configuration screenshot taken today is offered as evidence for the whole year. What is the problem?", "o": ["It is too small", "It shows a point in time, not operation throughout the period", "Screenshots are never allowed", "It lacks a risk rating"], "a": 1, "x": "Evidence must cover the audit period."}, {"t": "Who should validate remediation before a finding is closed?", "o": ["The person who caused the issue", "The audit function, using evidence", "Nobody; management's word is enough", "The external regulator always"], "a": 1, "x": "Independent validation prevents unsupported closure."}, {"t": "In the cloud change audit, what was the key design weakness?", "o": ["Pipelines lacked tests", "Permanent console admin access allowed changes outside the controlled pipeline", "Too many pull requests", "No change tickets existed at all"], "a": 1, "x": "Bypass paths undermine otherwise strong automated controls."}, {"t": "What should a good recommendation describe?", "o": ["A specific product to buy", "The outcome needed, addressing the root cause", "The names of people to blame", "Only the condition"], "a": 1, "x": "Outcome-focused recommendations let management choose the best solution."}]}, "g09": {"goal": "Govern cloud use with clear responsibilities, guardrails and continuous evidence.", "res": [["CSA Cloud Controls Matrix", "https://cloudsecurityalliance.org/research/cloud-controls-matrix"], ["Microsoft Cloud Adoption Framework: governance", "https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/govern/"]], "sum": ["Responsibilities shift by service model; document who owns each control.", "Landing zones and policy guardrails make good behaviour the default.", "Continuous configuration monitoring is the main source of cloud compliance evidence.", "Risk decisions in the cloud must consider concentration, residency and exit."], "ls": [{"t": "Shared responsibility across service models", "tag": null, "blocks": [{"k": "p", "x": "The provider-customer split shifts with the service model:"}, {"k": "ul", "x": ["**IaaS**: the provider runs facilities, hardware, network and hypervisor. You own the OS, middleware, applications, data, identities and network configuration.", "**PaaS**: the provider also runs the OS and platform. You own application code, data, identities, access configuration and network exposure.", "**SaaS**: the provider runs almost everything. You still own identities, access permissions, data classification, configuration settings (sharing, retention) and how the service is used."]}, {"k": "p", "x": "For governance, turn this into a **responsibility matrix** per key service, mapping control areas (identity, encryption, logging, backup, vulnerability management, incident response) to provider, customer or shared, with the evidence source for each. The **CSA Cloud Controls Matrix** is a useful reference that maps cloud controls to frameworks such as ISO 27001 and NIST."}, {"k": "tip", "kind": "Watch out", "x": "SaaS feels \"fully outsourced\", yet misconfigured sharing settings and over-privileged admin accounts in SaaS tools are among the most common causes of data exposure."}]}, {"t": "Landing zones and cloud governance", "tag": null, "blocks": [{"k": "p", "x": "A **landing zone** is a pre-configured, governed cloud foundation, built before workloads arrive. Its governance features:"}, {"k": "ul", "x": ["**Account / subscription / project structure** separating environments and business units", "**Central identity** with SSO, MFA and role-based access", "**Guardrails**: preventive policies (AWS SCPs, Azure Policy deny, Google Cloud organization policies, OCI security zones) that stop prohibited actions, such as public storage, unapproved regions or disabling logs", "**Central logging** that workload teams cannot alter", "**Network baseline**: hub, private connectivity, controlled Internet exposure", "**Tagging standards** for ownership, cost and data classification"]}, {"k": "p", "x": "Governance processes around it include a **cloud service approval** process, **policy exceptions** with expiry, **cost governance** (budgets, alerts) and regular review of guardrail effectiveness."}, {"k": "tip", "kind": "Tip", "x": "Preventive guardrails are the strongest cloud controls: a policy that blocks public buckets beats a quarterly review that finds them."}]}, {"t": "Cloud audit evidence and risk decisions", "tag": null, "blocks": [{"k": "p", "x": "Cloud environments generate evidence continuously, which changes how assurance works:"}, {"k": "ul", "x": ["**Configuration evidence**: posture management tools (Microsoft Defender for Cloud, AWS Security Hub and Config, Google Security Command Center, OCI Cloud Guard) assess resources against benchmarks continuously.", "**Activity evidence**: audit logs (CloudTrail, Activity Log, Cloud Audit Logs, OCI Audit) show who changed what and when.", "**Policy evidence**: guardrail definitions and their assignment history.", "**Provider evidence**: certifications and reports from the provider's compliance portal."]}, {"k": "p", "x": "Risk decisions specific to cloud:"}, {"k": "ul", "x": ["**Data residency and sovereignty**: where data and backups are stored and processed, and which laws apply.", "**Concentration risk**: many critical services on one provider or region.", "**Exit and portability**: can you leave, in what time, at what cost?", "**Key management**: who controls encryption keys (provider-managed vs customer-managed vs external HSM)."]}, {"k": "tip", "kind": "Tip", "x": "Ask for exports of continuous compliance results over the audit period, not a single dashboard screenshot. Most tools can show history."}]}, {"t": "Real-world scenario: the public storage bucket", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** A marketing team created a cloud storage bucket for a campaign and set it to public to share files with an agency. It also contained an export of 30,000 customer email addresses. A researcher reported it."}, {"k": "p", "x": "**GRC analysis.**"}, {"k": "ul", "x": ["**Governance**: no guardrail prevented public storage in the marketing account; the account had been created outside the landing zone.", "**Risk**: customer data exposed publicly; potential notification obligations under data protection law.", "**Compliance**: the incident had to be assessed for regulatory notification within the applicable deadline."]}, {"k": "p", "x": "**Response.**"}, {"k": "ol", "x": ["Remove public access immediately; review access logs to establish whether data was downloaded.", "Legal and privacy assess notification obligations; communicate as required.", "Move the account into the landing zone, inheriting a guardrail that blocks public storage, with an exception process for genuine public content.", "Provide a secure, approved method for sharing files with agencies.", "Add continuous detection of public resources across all accounts."]}, {"k": "p", "x": "**Lessons learned.** People will find a way to get work done. Good governance offers a safe, easy path (approved sharing) and blocks the dangerous one (public buckets) by default."}]}], "q": [{"t": "In SaaS, which responsibility remains with the customer?", "o": ["Patching the provider's servers", "Identities, access permissions, data classification and configuration settings", "Physical security of data centres", "Hypervisor security"], "a": 1, "x": "Even in SaaS, how you configure and use the service is your responsibility."}, {"t": "Which is the strongest type of cloud guardrail?", "o": ["A quarterly manual review", "A preventive policy that blocks prohibited actions", "An annual training course", "A wiki page"], "a": 1, "x": "Preventive guardrails stop issues before they happen."}, {"t": "What evidence best shows cloud configuration compliance over a year?", "o": ["One dashboard screenshot", "Exported history from continuous posture monitoring and audit logs over the period", "A verbal statement", "The provider's marketing page"], "a": 1, "x": "Continuous records demonstrate compliance across the period."}, {"t": "Why was the public bucket possible in the scenario?", "o": ["The provider was breached", "The account sat outside the landing zone, without guardrails", "Encryption was disabled", "The agency hacked it"], "a": 1, "x": "Accounts outside governance lack preventive controls."}, {"t": "Which is a cloud-specific risk decision?", "o": ["Office seating plans", "Data residency, concentration risk, exit and key management", "Payroll timing", "Printer maintenance"], "a": 1, "x": "These questions arise specifically from depending on cloud providers."}]}, "g10": {"goal": "Gain assurance over suppliers and prove that continuity plans actually work.", "res": [["ISO 22301 Business continuity", "https://www.iso.org/standard/75106.html"], ["AICPA SOC 2 overview", "https://www.aicpa-cima.com/topic/audit-assurance/audit-and-assurance-greater-than-soc-2"]] /* ---------------- subnet calculator ---------------- */
const ip2n=s=>{const p=s.split('.').map(Number); if(p.length!==4||p.some(x=>!Number.isInteger(x)||x<0||x>255)) return null; return ((p[0]<<24)>>>0)+(p[1]<<16)+(p[2]<<8)+p[3];};
const n2ip=n=>[n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
let snIn='10.20.0.0/16', snSplit=24;
function vSubnets(){
  app.innerHTML=`<div class="view">
  <div class="view-head"><div class="eyebrow">Subnet Calculator</div><h2>Slice any IPv4 block</h2><p class="lede">Type a block to see its range, the binary split between network and host bits, usable addresses in each cloud, and how it divides into smaller subnets.</p></div>
  <div class="sn-grid">
    <div class="panel"><label class="eyebrow" for="cidr">IPv4 block</label><div class="field" style="margin-top:6px"><input id="cidr" value="${esc(snIn)}" spellcheck="false" autocomplete="off"></div><div id="snOut"></div></div>
    <div class="panel"><div class="eyebrow">Usable addresses per subnet</div><div id="snCloud"></div></div>
  </div>
  <div class="panel" style="margin-top:16px"><div class="field"><span class="eyebrow">Split into</span><select id="split" aria-label="New prefix"></select><span id="splitInfo" class="mono" style="color:var(--muted)"></span></div><div id="splitOut" style="margin-top:12px"></div></div></div>`;
  const inp=document.getElementById('cidr'); inp.oninput=()=>{snIn=inp.value; calc();};
  document.getElementById('split').onchange=e=>{snSplit=+e.target.value; calc();};
  calc();
}
function calc(){
  const out=document.getElementById('snOut'), cl=document.getElementById('snCloud'), sp=document.getElementById('splitOut'), sel=document.getElementById('split'), si=document.getElementById('splitInfo');
  const mt=snIn.trim().match(/^(\d{1,3}(?:\.\d{1,3}){3})\/(\d{1,2})$/); const ip=mt?ip2n(mt[1]):null, p=mt?+mt[2]:-1;
  if(ip===null||p<0||p>32){out.innerHTML='<p class="err">Enter a block like 10.0.0.0/16: four numbers from 0 to 255, then / and a prefix from 0 to 32.</p>'; cl.innerHTML=''; sp.innerHTML=''; sel.innerHTML=''; si.textContent=''; return;}
  const mask=p===0?0:(0xFFFFFFFF<<(32-p))>>>0, net=(ip&mask)>>>0, size=2**(32-p), bc=net+size-1;
  const bin=n2ip(net).split('.').map(o=>(+o).toString(2).padStart(8,'0')).join('');
  const bits=bin.split('').map((b,i)=>`<span class="${i<p?'n':'h'}">${b}</span>${(i%8===7&&i<31)?'.':''}`).join('');
  const priv=(net>=ip2n('10.0.0.0')&&bc<=ip2n('10.255.255.255'))||(net>=ip2n('172.16.0.0')&&bc<=ip2n('172.31.255.255'))||(net>=ip2n('192.168.0.0')&&bc<=ip2n('192.168.255.255'));
  out.innerHTML=`<dl class="kv"><dt>Network</dt><dd>${n2ip(net)}/${p}${net!==ip?' <span style="color:var(--signal)">(normalised)</span>':''}</dd><dt>Range</dt><dd>${n2ip(net)} – ${n2ip(bc)}</dd><dt>Subnet mask</dt><dd>${n2ip(mask)}</dd><dt>Wildcard</dt><dd>${n2ip((~mask)>>>0)}</dd><dt>Addresses</dt><dd>${size.toLocaleString()}</dd><dt>Classic usable</dt><dd>${p>=31?size:(size-2).toLocaleString()}</dd><dt>RFC 1918</dt><dd>${priv?'Yes, private':'No, not a private range'}</dd></dl><div class="bits" aria-label="Binary">${bits}</div>`;
  const clouds=[['aws',5,16,28,'VPC and subnet: /16 to /28'],['az',5,2,29,'Smallest subnet /29'],['gcp',4,8,29,'Smallest IPv4 subnet /29'],['oci',3,16,30,'VCN and subnet: /16 to /30']];
  cl.innerHTML=`<dl class="kv">${clouds.map(([k,r,mn,mx,nt])=>{const ok=p>=mn&&p<=mx; return `<dt><span class="dot" style="background:var(${PROV[k].v})"></span>${PROV[k].n}</dt><dd>${ok?(size-r).toLocaleString()+' usable <span style="color:var(--muted)">(−'+r+')</span>':'<span style="color:var(--bad)">/'+p+' not allowed</span>'}<br><span style="color:var(--muted);font-family:var(--f-body);font-size:12.5px">${nt}</span></dd>`;}).join('')}</dl>`;
  const opts=[]; for(let n=p+1;n<=Math.min(32,p+16);n++) opts.push(n);
  if(!opts.length){sel.innerHTML=''; si.textContent='A /32 cannot be split'; sp.innerHTML=''; return;}
  if(!opts.includes(snSplit)) snSplit=opts.includes(24)?24:opts[Math.min(2,opts.length-1)];
  sel.innerHTML=opts.map(n=>`<option value="${n}" ${n===snSplit?'selected':''}>/${n}</option>`).join('');
  const cnt=2**(snSplit-p), each=2**(32-snSplit), show=Math.min(cnt,64);
  si.textContent=`${cnt.toLocaleString()} subnets × ${each.toLocaleString()} addresses`;
  let rows=''; for(let i=0;i<show;i++){const s=net+i*each; rows+=`<tr><td class="mono">${i+1}</td><td class="mono">${n2ip(s)}/${snSplit}</td><td class="mono">${n2ip(s)} – ${n2ip(s+each-1)}</td><td class="mono">${Math.max(0,each-5).toLocaleString()}</td></tr>`;}
  sp.innerHTML=`<div class="tscroll"><table><thead><tr><th>#</th><th>Subnet</th><th>Range</th><th>AWS / Azure usable</th></tr></thead><tbody>${rows}</tbody></table></div>${cnt>show?`<p class="empty">Showing the first ${show} of ${cnt.toLocaleString()}.</p>`:''}`;
}
