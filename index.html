it?", "**Connection troubleshoot**: test reachability from a VM to an endpoint, with hop-by-hop details.", "**Packet capture**: capture traffic on a VM to a storage account.", "**VNet flow logs**: record flows across a VNet (they replace the older NSG flow logs), viewable with **Traffic Analytics**.", "**Connection monitor**: continuous reachability and latency tests."]}, {"k": "code", "t": "Quick checks from the CLI", "x": "az network watcher test-ip-flow -g rg-app --vm vm-app1 \\\n  --direction Inbound --protocol TCP --local 10.20.1.4:443 --remote 10.0.1.10:50000\naz network watcher show-next-hop -g rg-app --vm vm-app1 \\\n  --source-ip 10.20.1.4 --dest-ip 10.30.2.5\naz network nic show-effective-route-table -g rg-app -n nic-app1 -o table"}, {"k": "tip", "kind": "Tip", "x": "If IP flow verify says \"Allowed\" and traffic still fails, the problem is not the NSG: check routes (next hop), the guest OS firewall, and whether the application is listening."}]}, {"t": "Deep dive: Azure landing zone networking", "tag": null, "blocks": [{"k": "p", "x": "Microsoft's **Azure landing zone** reference architecture gives enterprises a standard starting point. Its networking part follows these principles:"}, {"k": "ul", "x": ["**Platform vs application landing zones**: a **connectivity subscription** (owned by the platform team) holds hubs, firewalls, gateways and DNS; **application landing zones** (one subscription per workload and environment) hold spokes.", "**Topology choice**: traditional **hub-and-spoke** (customer-managed hub VNet) or **Virtual WAN** (Microsoft-managed hubs). Both are supported; Virtual WAN suits many regions and branches.", "**Policy-driven guardrails**: Azure Policy assignments at management-group level deny public IPs on NICs, require NSGs on subnets, enforce Private Endpoints and DNS zone integration, and deploy diagnostics automatically.", "**Centralised Private DNS**: all `privatelink.*` zones live in the connectivity subscription and are linked to the hub; a policy automatically registers new Private Endpoints in the right zone.", "**Subscription vending**: new workload subscriptions are created by automation, with a spoke VNet peered to the hub and an address range allocated from IPAM."]}, {"k": "code", "t": "Management group layout (simplified)", "x": "Tenant root\n└─ Contoso\n   ├─ Platform\n   │  ├─ Connectivity  (hub VNets / Virtual WAN, Azure Firewall, ExpressRoute, DNS)\n   │  ├─ Identity\n   │  └─ Management    (Log Analytics, Sentinel)\n   ├─ Landing zones\n   │  ├─ Corp    (internal apps, connected to hub, no public endpoints)\n   │  └─ Online  (Internet-facing apps)\n   └─ Sandbox"}, {"k": "tip", "kind": "Tip", "x": "The **Corp** vs **Online** split is useful: Corp landing zones get strict \"no public anything\" policies; Online landing zones allow public entry only through approved services like Front Door or Application Gateway with WAF."}]}, {"t": "Real-world scenario: peered spokes that couldn't talk", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** An Azure hub-and-spoke has a hub VNet with Azure Firewall and two spokes (app and data), each peered to the hub. The app servers can reach the Internet through the firewall, but cannot connect to the database in the data spoke. Both teams say \"the peering is connected\"."}, {"k": "p", "x": "**Investigation.**"}, {"k": "ol", "x": ["**Effective routes** on the app VM's NIC show `0.0.0.0/0 → 10.0.1.4` (the firewall), from the UDR, but **no route for the data spoke's range**. VNet peering is non-transitive, so the app spoke learns nothing about the data spoke.", "Traffic to the data spoke's IP therefore matches `0.0.0.0/0` and goes to the firewall, which is the intended design.", "**Azure Firewall logs** show the traffic arriving and being denied: there's no network rule allowing app subnet → data subnet on 1433.", "Once a firewall rule is added, the database still doesn't answer: the **data spoke** has no UDR, so return traffic goes directly back to the app spoke via peering... except there's no peering between spokes, so the return goes nowhere and asymmetric routing breaks the firewall's state."]}, {"k": "p", "x": "**Fix.**"}, {"k": "ol", "x": ["Add a firewall network rule: app subnet → data subnet, TCP 1433.", "Attach a route table to the data spoke subnets with routes to other spokes (or `0.0.0.0/0`) via the firewall, so return traffic is symmetric.", "Document the pattern: every spoke subnet gets the same UDR template."]}, {"k": "p", "x": "**Lessons learned.** In hub-and-spoke, spoke-to-spoke traffic needs three things: routes in both spokes pointing to the hub firewall, firewall rules allowing the flow, and symmetry on the return path."}]}], "q": [{"t": "Two spoke VNets are both peered to a hub. By default, can they reach each other?", "o": ["Yes", "No", "Only through Bastion", "Only over IPv6"], "a": 1, "x": "Peering is non-transitive; route through a hub firewall or use Virtual WAN."}, {"t": "Which Azure service is a global L7 entry point with CDN features?", "o": ["Application Gateway", "Load Balancer", "Front Door", "VPN Gateway"], "a": 2, "x": "Front Door is global; Application Gateway is regional."}, {"t": "What must the subnet for an Azure VPN or ExpressRoute gateway be named?", "o": ["VpnSubnet", "HubSubnet", "GatewaySubnet", "AzureGatewaySubnet"], "a": 2, "x": "Gateways deploy only into a subnet named exactly GatewaySubnet."}, {"t": "A Private Endpoint for a storage account is created, but on-premises clients still reach the public IP. What is the likely cause?", "o": ["The NSG blocks traffic", "The Private Endpoint is in the wrong region", "On-premises DNS is not forwarding the privatelink zone to Azure", "ExpressRoute is down"], "a": 2, "x": "Private Endpoints depend on DNS resolving the name to the private IP."}, {"t": "Which NSG feature lets rules target VMs by role instead of IP address?", "o": ["Service tags", "Application security groups", "Route tables", "Subnet delegation"], "a": 1, "x": "ASGs group NICs so rules follow workloads, not addresses."}, {"t": "In Azure hub-and-spoke, what is needed for spoke-to-spoke traffic through the hub firewall?", "o": ["Only VNet peering between each spoke and the hub", "UDRs in both spokes pointing at the firewall, plus firewall rules allowing the flow", "A VPN gateway in each spoke", "Service endpoints"], "a": 1, "x": "Peering is non-transitive; routing via the firewall must be explicit and symmetric."}], "lv": 4, "h": 9, "p": "az", "goal": "Design hub-and-spoke and private networks on Azure.", "terms": ["VNet", "subnet delegation", "GatewaySubnet", "NSG", "ASG", "service tag", "UDR", "Route Server", "VNet peering", "Virtual WAN", "Virtual Network Manager", "Private Endpoint", "Private DNS zone", "Application Gateway", "Front Door", "ExpressRoute"]}, {"id": "m15", "t": "Google Cloud Networking", "res": [["Google Cloud VPC overview", "https://cloud.google.com/vpc/docs/overview"], ["Cloud NGFW (firewall) overview", "https://cloud.google.com/firewall/docs/about-firewalls"], ["Cloud Load Balancing overview", "https://cloud.google.com/load-balancing/docs/load-balancing-overview"], ["Cloud NAT overview", "https://cloud.google.com/nat/docs/overview"], ["Network Connectivity Center", "https://cloud.google.com/network-connectivity/docs/network-connectivity-center/concepts/overview"]], "sum": ["One global VPC with regional subnets; use custom mode and plan secondary ranges for GKE.", "Firewall policies plus service-account or secure-tag targets give scalable, IAM-controlled rules.", "Shared VPC is the standard way to centralise networking across projects.", "Cloud NAT, Private Google Access and Private Service Connect keep VMs private."], "ls": [{"t": "The global VPC", "tag": null, "blocks": [{"k": "p", "x": "A Google Cloud **VPC network** is a **global** resource. **Subnets** are regional, and each has a primary IPv4 range and optional **secondary ranges** (used for GKE Pods and Services). VMs in any region of the same VPC communicate over internal IPs across Google's private backbone, with no peering or VPN."}, {"k": "p", "x": "VPCs come in two modes. **Auto mode** creates a /20 subnet in every region from 10.128.0.0/9; convenient for labs but it will overlap with other auto-mode VPCs and wastes space. **Custom mode** lets you create exactly the subnets you need. Use custom mode for anything real; the `default` network in new projects is auto mode, so delete it."}, {"k": "code", "t": "Create a custom-mode VPC with two regional subnets (gcloud)", "x": "gcloud compute networks create vpc-prod --subnet-mode=custom\ngcloud compute networks subnets create snet-me-central1 --network=vpc-prod \\\n  --region=me-central1 --range=10.30.0.0/20 \\\n  --secondary-range=pods=10.31.0.0/16,services=10.32.0.0/20 \\\n  --enable-private-ip-google-access\ngcloud compute networks subnets create snet-europe-west1 --network=vpc-prod \\\n  --region=europe-west1 --range=10.30.16.0/20"}, {"k": "p", "x": "Google Cloud also offers two **network service tiers**: **Premium** (traffic enters and leaves Google's network close to the user; required for global load balancing) and **Standard** (traffic uses the public Internet more; cheaper, regional only)."}, {"k": "tip", "kind": "Tip", "x": "You can expand a subnet's primary range later (for example /20 → /19) without downtime, but you can't shrink it. Start reasonably and grow."}]}, {"t": "Firewall rules and policies", "tag": null, "blocks": [{"k": "p", "x": "Google Cloud's distributed firewall (**Cloud NGFW**) is stateful and enforced at each VM. Every VPC has two **implied rules**: allow all egress, and deny all ingress (priority 65535)."}, {"k": "p", "x": "Rules have a **priority** (0–65535, lower wins; default 1000), a direction, an action, a source or destination, protocols and ports, and a **target**:"}, {"k": "ul", "x": ["**All instances** in the network", "**Network tags** (free-text labels on VMs; anyone who can edit the VM can change them)", "**Service accounts** (stronger, because changing a VM's service account needs IAM permission)", "**Secure tags** (IAM-governed tags, usable in firewall policies)"]}, {"k": "p", "x": "There are several layers, evaluated in order: **hierarchical firewall policies** (at organization and folder level, set by the security team), **global and regional network firewall policies** (attached to a VPC), then **VPC firewall rules**. Cloud NGFW **Enterprise** adds intrusion prevention (IPS) and TLS inspection."}, {"k": "code", "t": "Allow load balancer health checks and HTTPS to web servers", "x": "gcloud compute firewall-rules create allow-hc-and-web --network=vpc-prod \\\n  --direction=INGRESS --action=ALLOW --rules=tcp:443,tcp:8080 \\\n  --source-ranges=35.191.0.0/16,130.211.0.0/22 \\\n  --target-service-accounts=web-sa@my-proj.iam.gserviceaccount.com"}, {"k": "tip", "kind": "Tip", "x": "Use **Firewall Insights** to find shadowed, unused and overly permissive rules, and enable **firewall rules logging** on the rules you need to audit."}]}, {"t": "Shared VPC, peering and Network Connectivity Center", "tag": null, "blocks": [{"k": "p", "x": "**Shared VPC** lets a **host project** own the VPC while **service projects** deploy VMs, GKE clusters and serverless connectors into its subnets. The network team keeps control of subnets, routes and firewalls; app teams get `roles/compute.networkUser` on chosen subnets. This is Google's recommended pattern for organisations."}, {"k": "p", "x": "**VPC Network Peering** connects two VPCs (in any projects or organisations) with internal IP connectivity. It is **non-transitive** and the ranges must not overlap. Each side controls whether it imports and exports custom routes."}, {"k": "p", "x": "**Network Connectivity Center (NCC)** is a hub-and-spoke service. **VPC spokes** connect many VPCs through a central hub with full mesh or star topologies, and **hybrid spokes** (HA VPN tunnels, Interconnect attachments, router appliances) can use Google's backbone to connect your sites to each other."}, {"k": "tip", "kind": "Tip", "x": "A common enterprise layout: one Shared VPC host project per environment (prod, non-prod), each with regional subnets, connected to on-premises with Interconnect, and NCC when you need many VPCs to talk."}]}, {"t": "Cloud Router and Cloud NAT", "tag": null, "blocks": [{"k": "p", "x": "**Cloud Router** is a managed BGP speaker. It exchanges routes with your on-premises routers over HA VPN and Interconnect, and advertises your VPC subnets automatically (or custom ranges you choose). The VPC's **dynamic routing mode** decides whether learned routes apply only in the Cloud Router's region (**regional**) or in all regions (**global**)."}, {"k": "p", "x": "**Cloud NAT** gives VMs without external IPs outbound Internet access. It is not a VM or appliance: it is software-defined and configured on a Cloud Router, per region. You choose which subnets use it and whether it uses automatically allocated or reserved external IPs. **Dynamic port allocation** helps busy VMs avoid port exhaustion. **Private NAT** translates between overlapping private ranges (for example, between VPCs connected via NCC)."}, {"k": "code", "t": "Cloud NAT for a region", "x": "gcloud compute routers create cr-me-central1 --network=vpc-prod --region=me-central1\ngcloud compute routers nats create nat-me-central1 --router=cr-me-central1 \\\n  --region=me-central1 --auto-allocate-nat-external-ips \\\n  --nat-all-subnet-ip-ranges --enable-dynamic-port-allocation"}, {"k": "tip", "kind": "Watch out", "x": "Cloud NAT does not handle inbound connections. VMs behind it remain unreachable from the Internet, which is usually what you want."}]}, {"t": "Private Google Access and Private Service Connect", "tag": null, "blocks": [{"k": "p", "x": "**Private Google Access** (a per-subnet setting) lets VMs without external IPs reach Google APIs such as Cloud Storage and BigQuery. Combine it with the special domains `private.googleapis.com` (199.36.153.8/30) or `restricted.googleapis.com` (199.36.153.4/30, for use with VPC Service Controls), and DNS that points `*.googleapis.com` at them."}, {"k": "p", "x": "**Private Service Connect (PSC)** creates **endpoints** with internal IPs in your VPC:"}, {"k": "ul", "x": ["PSC endpoints for **Google APIs** (an internal IP for all supported APIs)", "PSC endpoints for **published services**: services from other VPCs, other organisations or Google-managed services (such as Cloud SQL, AlloyDB, Vertex AI). Producers publish a **service attachment**, consumers create an endpoint. Address ranges can overlap."]}, {"k": "p", "x": "**VPC Service Controls** adds a security perimeter around Google-managed services to stop data exfiltration, even by someone with valid credentials."}, {"k": "tip", "kind": "Tip", "x": "For Cloud SQL and other managed databases, choose a private IP (via PSC or private services access) and disable the public IP."}]}, {"t": "Load balancing, Cloud CDN and Cloud Armor", "tag": null, "blocks": [{"k": "p", "x": "Google Cloud load balancers are software-defined and many are **global**:"}, {"k": "ul", "x": ["**Application Load Balancers** (L7, HTTP/HTTPS): **global external** (one anycast IP worldwide, routing users to the nearest healthy backend in any region), regional external, regional internal and cross-region internal.", "**Proxy Network Load Balancers** (L4 TCP proxy, with optional SSL offload): global or regional.", "**Passthrough Network Load Balancers** (L4, TCP/UDP/ESP/ICMP): regional, preserve client IPs, backends see the original packets."]}, {"k": "p", "x": "Backends are **instance groups**, **network endpoint groups (NEGs)** for containers, serverless (Cloud Run) or Internet backends."}, {"k": "p", "x": "**Cloud CDN** caches content at Google's edge for global external Application Load Balancers. **Cloud Armor** adds WAF rules (preconfigured OWASP rules), rate limiting, geo-blocking, bot management and DDoS protection, attached as security policies to backend services."}, {"k": "tip", "kind": "Tip", "x": "A single global external Application Load Balancer with backends in two regions gives you multi-region failover with one IP address and one TLS certificate, without DNS tricks."}]}, {"t": "Hybrid connectivity on Google Cloud", "tag": null, "blocks": [{"k": "p", "x": "**Cloud VPN** connects through IPsec:"}, {"k": "ul", "x": ["**HA VPN**: a gateway with two interfaces (two public IPs). With two tunnels to your peer devices and BGP via Cloud Router, it offers a **99.99% SLA**. This is the recommended option.", "**Classic VPN**: a single interface, 99.9% SLA, mostly legacy."]}, {"k": "p", "x": "**Cloud Interconnect** provides private connections:"}, {"k": "ul", "x": ["**Dedicated Interconnect**: your own 10 Gbps or 100 Gbps circuits in a Google colocation facility.", "**Partner Interconnect**: through a service provider, from 50 Mbps to 50 Gbps.", "**Cross-Cloud Interconnect**: dedicated links from Google Cloud to other clouds (AWS, Azure, OCI, Alibaba)."]}, {"k": "p", "x": "**VLAN attachments** connect an Interconnect to a Cloud Router in a region. For 99.99% availability Google requires connections in two metropolitan areas with four connections in total; 99.9% needs two connections in one metro, in different edge availability domains."}, {"k": "tip", "kind": "Tip", "x": "HA VPN over Interconnect lets you encrypt traffic across a private Interconnect when compliance requires it."}]}, {"t": "Operating and troubleshooting Google Cloud networks", "tag": null, "blocks": [{"k": "p", "x": "**Network Intelligence Center** groups the analysis tools:"}, {"k": "ul", "x": ["**Connectivity Tests**: static analysis of a path between two endpoints (VMs, IPs, load balancers, Cloud SQL), showing which route or firewall rule allows or drops it, plus an optional live data-plane check.", "**Network Topology**: a live map of your VPCs, regions and traffic.", "**Performance Dashboard**: packet loss and latency between zones and regions.", "**Firewall Insights**: shadowed, unused and overly broad rules.", "**Network Analyzer**: automatic detection of misconfigurations such as IP exhaustion or invalid routes."]}, {"k": "p", "x": "Logging: **VPC Flow Logs** (sampled flow records per subnet), **firewall rules logging**, **Cloud NAT logging**, and **Packet Mirroring** to send copies of traffic to an inspection tool."}, {"k": "code", "t": "Run a connectivity test", "x": "gcloud network-management connectivity-tests create app-to-db \\\n  --source-instance=projects/p/zones/me-central1-a/instances/app-1 \\\n  --destination-ip-address=10.30.4.5 --destination-port=5432 --protocol=TCP\ngcloud network-management connectivity-tests describe app-to-db"}, {"k": "tip", "kind": "Tip", "x": "Connectivity Tests understand GKE, Cloud SQL, load balancers and hybrid routes. Run one before guessing."}]}, {"t": "Deep dive: designing Shared VPC at scale", "tag": null, "blocks": [{"k": "p", "x": "Large Google Cloud organisations usually run a few **Shared VPC host projects** rather than many small VPCs. Design choices that matter:"}, {"k": "ul", "x": ["**How many host projects**: typically one per environment (prod, non-prod) so environments are isolated at the network level, sometimes split further for regulated workloads.", "**Subnets per region and per team**: give each team (or service project) its own subnet(s) in each region they use, and grant `compute.networkUser` only on those subnets. This keeps teams from deploying into each other's subnets.", "**Secondary ranges for GKE**: plan pod and Service ranges per cluster, sized for growth (Module 21). GKE can also add extra pod ranges later (discontiguous multi-Pod CIDR), but planning avoids pain.", "**Firewalls**: hierarchical firewall policies at organisation and folder level for global rules (allow health checks and IAP, deny known-bad ranges); network firewall policies for environment rules; team-specific rules targeting service accounts or secure tags.", "**Hybrid connectivity** lives in the host project: Cloud Routers, HA VPN or Interconnect VLAN attachments, with **global dynamic routing** if all regions need on-premises routes.", "**Connecting environments**: if prod and non-prod must share services, use **Network Connectivity Center** with VPC spokes and filtering, or Private Service Connect for specific services, rather than peering everything."]}, {"k": "code", "t": "Example layout", "x": "Organization\n├─ folder: prod     → host project net-prod-host  (vpc-prod: subnets per region per team)\n│                      service projects: payments-prod, web-prod, data-prod\n├─ folder: nonprod  → host project net-nonprod-host\n└─ folder: shared   → project net-hub (Interconnect, Cloud Routers, NCC hub)"}, {"k": "tip", "kind": "Tip", "x": "Use custom IAM conditions or subnet-level bindings so each team's service account can only use its own subnets. The most common Shared VPC mistake is granting networkUser on the whole host project."}]}, {"t": "Real-world scenario: GKE cluster creation fails with IP errors", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** A team tries to create a new GKE cluster in a Shared VPC subnet and gets errors about insufficient IP space for Pods. The subnet has plenty of free primary addresses."}, {"k": "p", "x": "**Investigation.**"}, {"k": "ol", "x": ["The cluster uses VPC-native networking with a **secondary range** for Pods. The team reused an existing `/20` secondary range (4,096 addresses).", "With the default of 110 max Pods per node, GKE reserves a **/24 of Pod IPs per node** (256 addresses). A /20 therefore supports only 16 nodes, and other clusters were already using part of that range.", "The new cluster's requested node count exceeded what was left."]}, {"k": "p", "x": "**Fix.**"}, {"k": "ol", "x": ["Create a new, dedicated Pod secondary range (a /16) for this cluster in the subnet.", "Lower **max Pods per node** to 32 for this workload (GKE then reserves a /26 per node), quadrupling how many nodes fit in a given range.", "Document Pod range sizing in the network design: nodes × per-node reservation, plus room for upgrades (surge nodes)."]}, {"k": "p", "x": "**Lessons learned.** In GKE, IP planning is per node, not per Pod. The max-Pods-per-node setting decides how much address space every node consumes."}]}], "q": [{"t": "How do two VMs in different regions of the same Google Cloud VPC communicate?", "o": ["They need VPC peering", "Directly over internal IPs", "Only via Cloud NAT", "Only via VPN"], "a": 1, "x": "The VPC is global, so internal routing works across regions."}, {"t": "Which service gives private VMs outbound Internet access without a NAT VM?", "o": ["Cloud Router", "Cloud NAT", "Private Google Access", "Cloud Armor"], "a": 1, "x": "Cloud NAT is a managed, software-defined NAT."}, {"t": "Why is targeting firewall rules by service account stronger than by network tag?", "o": ["Service accounts are faster", "Changing a VM's service account requires IAM permission, while tags can be edited by anyone who can edit the VM", "Tags don't work with ingress rules", "Service accounts are free"], "a": 1, "x": "Service-account targets tie firewall scope to IAM, preventing users from tagging their way past rules."}, {"t": "What does HA VPN need to reach its 99.99% SLA?", "o": ["One tunnel and static routes", "Two tunnels using both gateway interfaces, with BGP via Cloud Router", "A Classic VPN gateway", "Dedicated Interconnect"], "a": 1, "x": "HA VPN's SLA requires both interfaces in use with dynamic routing."}, {"t": "Which feature lets service projects deploy into subnets owned by a central project?", "o": ["VPC Network Peering", "Shared VPC", "Private Service Connect", "Cloud Router"], "a": 1, "x": "Shared VPC separates network ownership (host project) from workload projects."}, {"t": "With the default 110 max Pods per node, how much Pod address space does GKE reserve per node?", "o": ["A /28", "A /26", "A /24", "A /20"], "a": 2, "x": "GKE reserves twice the max Pods rounded up to a power of two: 256 addresses, a /24."}], "lv": 4, "h": 9, "p": "gcp", "goal": "Use the global VPC, Shared VPC and Google’s load balancers well.", "terms": ["global VPC", "custom-mode", "secondary range", "firewall policy", "network tag", "secure tag", "Shared VPC", "VPC Network Peering", "Network Connectivity Center", "Cloud Router", "Cloud NAT", "Private Google Access", "Private Service Connect", "Cloud Armor", "HA VPN", "Interconnect"]}, {"id": "m16", "t": "Oracle Cloud (OCI) Networking", "res": [["OCI Networking overview", "https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/overview.htm"], ["OCI Dynamic Routing Gateways", "https://docs.oracle.com/en-us/iaas/Content/Network/Tasks/managingDRGs.htm"], ["OCI FastConnect", "https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/fastconnect.htm"], ["OCI Network Load Balancer", "https://docs.oracle.com/en-us/iaas/Content/NetworkLoadBalancer/overview.htm"]], "sum": ["VCNs are regional; prefer regional subnets, chosen as public or private at creation.", "Prefer NSGs for per-workload rules; use security lists for broad subnet rules.", "Internet, NAT and Service gateways cover public, outbound and Oracle-service traffic.", "The DRG is OCI's hub for VCNs, VPNs, FastConnect and other regions."], "ls": [{"t": "VCNs and subnets", "tag": null, "blocks": [{"k": "p", "x": "An OCI **Virtual Cloud Network (VCN)** is regional and holds one or more IPv4 CIDR blocks (each /16 to /30) and optional IPv6 prefixes. You create **subnets** inside it."}, {"k": "p", "x": "Two choices are made per subnet **at creation and cannot be changed**:"}, {"k": "ul", "x": ["**Regional or AD-specific**: regional subnets span all availability domains in the region (recommended); AD-specific subnets exist in one AD.", "**Public or private**: instances in private subnets cannot have public IPs."]}, {"k": "p", "x": "OCI reserves 3 addresses per subnet (first two and last). Each VCN and subnet can have a **DNS label**, so instances get hostnames like `app1.snetapp.vcnprod.oraclevcn.com` resolved by the VCN's built-in resolver."}, {"k": "code", "t": "Create a VCN and a private regional subnet (OCI CLI)", "x": "oci network vcn create --compartment-id $C --cidr-blocks '[\"10.40.0.0/16\"]' \\\n  --display-name vcn-prod --dns-label vcnprod\noci network subnet create --compartment-id $C --vcn-id $VCN \\\n  --cidr-block 10.40.10.0/24 --display-name snet-app \\\n  --prohibit-public-ip-on-vnic true --dns-label snetapp"}, {"k": "tip", "kind": "Tip", "x": "Because public/private can't be changed, decide per tier up front: only load balancers, bastions and NAT-facing resources need public subnets."}]}, {"t": "Security lists and NSGs", "tag": null, "blocks": [{"k": "p", "x": "OCI has two firewall mechanisms, both **stateful by default** (stateless rules are optional):"}, {"k": "ul", "x": ["**Security lists** apply to **every VNIC in a subnet**. A subnet can have up to five. Good for broad rules that apply to the whole subnet.", "**Network security groups (NSGs)** apply to the **VNICs you choose**, regardless of subnet. Rules can use another NSG as the source or destination, just like AWS security groups. Oracle recommends NSGs for most designs."]}, {"k": "p", "x": "If both apply, traffic is allowed if **either** a security list or an NSG allows it (the union of rules). This differs from AWS and Azure, where both layers must allow traffic."}, {"k": "p", "x": "Every new VCN gets a **default security list** that allows SSH from anywhere and some ICMP. Tighten or replace it before production."}, {"k": "code", "t": "NSG rules for a three-tier app", "x": "nsg-lb   ingress: TCP 443 from 0.0.0.0/0\nnsg-app  ingress: TCP 8080 from NSG nsg-lb\nnsg-db   ingress: TCP 1521 from NSG nsg-app\ndefault security list: remove \"SSH from 0.0.0.0/0\""}, {"k": "tip", "kind": "Watch out", "x": "Because security lists and NSGs combine as a union, a permissive default security list can open access your NSGs were meant to block."}]}, {"t": "Gateways", "tag": null, "blocks": [{"k": "p", "x": "OCI gives each kind of traffic its own gateway, used as a route target:"}, {"k": "ul", "x": ["**Internet gateway**: two-way Internet access for resources with public IPs in public subnets.", "**NAT gateway**: outbound-only Internet access for private subnets, with a public IP Oracle provides (or one you reserve).", "**Service gateway**: private access to Oracle services (such as Object Storage, Autonomous Database public endpoints, OS update mirrors) without the Internet. Route rules target the service CIDR label **All <region> Services in Oracle Services Network** or **OCI <region> Object Storage**.", "**Dynamic Routing Gateway (DRG)**: connects the VCN to other VCNs, on-premises networks and other regions.", "**Local peering gateway (LPG)**: the older way to peer two VCNs in the same region; DRG attachments are now preferred."]}, {"k": "code", "t": "Route tables for public and private subnets", "x": "rt-public:   0.0.0.0/0 → Internet gateway\nrt-private:  0.0.0.0/0 → NAT gateway\n             All <region> Services in Oracle Services Network → Service gateway\n             10.0.0.0/8 (on-prem and other VCNs) → DRG"}, {"k": "tip", "kind": "Tip", "x": "A private subnet can have both a NAT gateway route (0.0.0.0/0) and a service gateway route. The service gateway route is more specific, so traffic to Oracle services stays private and only other Internet traffic uses NAT."}]}, {"t": "The DRG as a hub", "tag": null, "blocks": [{"k": "p", "x": "The **Dynamic Routing Gateway (DRG)** is OCI's virtual router and its central hub. A single DRG can have many **attachments**:"}, {"k": "ul", "x": ["**VCN attachments** (many VCNs in the same region, for hub-and-spoke)", "**IPSec tunnel attachments** (Site-to-Site VPN)", "**Virtual circuit attachments** (FastConnect)", "**Remote peering connection (RPC) attachments** (to DRGs in other regions or tenancies)"]}, {"k": "p", "x": "Each attachment uses a **DRG route table**, and **import route distributions** decide which routes each table learns. This lets you build segmentation and **transit routing**, such as sending all spoke-to-spoke and on-premises traffic through a firewall in a hub VCN."}, {"k": "code", "t": "Hub-and-spoke with a firewall in the hub VCN", "x": "DRG route table for spoke VCN attachments:  0.0.0.0/0 → hub VCN attachment\nDRG route table for the hub attachment:     imports routes from all spokes and on-prem\nHub VCN ingress route table (on the DRG attachment): 0.0.0.0/0 → firewall private IP"}, {"k": "tip", "kind": "Tip", "x": "Use one DRG per region as the hub, and remote peering connections between regional DRGs for a global network."}]}, {"t": "Load balancing, DNS and edge security", "tag": null, "blocks": [{"k": "p", "x": "**OCI Load Balancer** (flexible shape) is an L7 HTTP/HTTPS proxy that can also balance TCP. It supports path and host routing, TLS termination, session persistence and integration with **OCI WAF**. Bandwidth is set as a flexible range (minimum and maximum Mbps)."}, {"k": "p", "x": "**OCI Network Load Balancer** is an L3/L4 pass-through load balancer for TCP, UDP and ICMP, preserving source and destination IPs, with very low latency. It is free of charge, which makes it popular for internal services and appliance clusters."}, {"k": "p", "x": "**OCI DNS** hosts public zones and, inside VCNs, **private DNS** with **private views** and a **resolver** per VCN. **Listening endpoints** answer queries from on-premises; **forwarding endpoints** with rules send queries for on-premises zones to your DNS servers."}, {"k": "p", "x": "Edge protection: **OCI WAF** (attached to load balancers or as an edge policy), DDoS protection included at the edge, and **OCI Network Firewall** (a managed next-generation firewall built with Palo Alto Networks technology) for inspection inside VCNs."}, {"k": "tip", "kind": "Tip", "x": "Public load balancers need a public subnet; their backends should sit in private subnets reachable only from the load balancer's NSG."}]}, {"t": "Hybrid and multi-cloud connectivity on OCI", "tag": null, "blocks": [{"k": "p", "x": "**Site-to-Site VPN** connects your network to a DRG with **two redundant IPsec tunnels** per connection. Routing can be **BGP** (recommended), static, or policy-based. Use IKEv2 and configure both tunnels."}, {"k": "p", "x": "**FastConnect** provides private connectivity:"}, {"k": "ul", "x": ["**Oracle partner**: through a service provider, in bandwidths from 1 Gbps", "**Colocation with Oracle**: your own cross-connects of 1, 10, 100 or 400 Gbps at an Oracle FastConnect location", "**Third-party provider**: through a provider not in the partner list", "**Private peering** reaches your VCNs via the DRG; **public peering** reaches OCI public services.", "**MACsec** encryption is supported on cross-connects."]}, {"k": "p", "x": "For multi-cloud, **Oracle Interconnect for Microsoft Azure** and **Oracle Interconnect for Google Cloud** provide direct, low-latency private links between OCI and those clouds in paired regions, and **Oracle Database@Azure / @Google Cloud / @AWS** run Oracle Database services inside those clouds' data centres."}, {"k": "tip", "kind": "Tip", "x": "Two FastConnect virtual circuits at different locations (or one FastConnect plus Site-to-Site VPN as backup) with BGP is the standard resilient design."}]}, {"t": "Operating and troubleshooting OCI networks", "tag": null, "blocks": [{"k": "p", "x": "Key tools in OCI's **Network Command Center**:"}, {"k": "ul", "x": ["**Network Path Analyzer**: analyses route tables, security lists, NSGs and gateways between a source and destination and shows where traffic is allowed or blocked.", "**VCN flow logs**: records of accepted and rejected traffic, configured per subnet, VNIC or VCN through capture filters, delivered to OCI Logging.", "**Capture filters and VTAP**: virtual test access points mirror traffic from a source (VNIC, load balancer, database) to a target for deep analysis.", "**Inter-region latency** dashboards."]}, {"k": "p", "x": "**OCI Bastion** provides time-limited, audited SSH sessions to private instances without public IPs or open SSH from the Internet."}, {"k": "code", "t": "Typical checklist when an OCI instance can't reach something", "x": "1. Subnet route table: is there a rule to the right gateway (NAT, service, DRG)?\n2. Security lists + NSGs: does any rule allow it? (union of both)\n3. Instance OS firewall: Oracle Linux images ship with firewalld enabled\n4. DRG route tables and import distributions (for cross-VCN/on-prem)\n5. Run Network Path Analyzer to confirm"}, {"k": "tip", "kind": "Watch out", "x": "Oracle-provided Linux images have firewalld (and on some images iptables rules) enabled by default. Opening an NSG is not enough; open the port in the OS too."}]}, {"t": "Deep dive: networking for Oracle databases on OCI", "tag": null, "blocks": [{"k": "p", "x": "Many organisations choose OCI for Oracle Database workloads, which have specific networking patterns:"}, {"k": "ul", "x": ["**Exadata Database Service** and **Base Database Service** deploy into **your VCN**: a **client subnet** (application connections, SCAN listeners) and, for Exadata, a **backup subnet**. Both should be private. Size them per the service documentation; Exadata needs several IPs per VM cluster node plus SCAN and VIP addresses.", "**Autonomous Database** can use a **private endpoint** in your subnet, with NSGs controlling which clients connect, instead of a public endpoint with access control lists.", "**Ports**: SQL*Net listener on TCP 1521 (or 1522 for Autonomous with TLS/mTLS); allow them only from the application NSG.", "**Backups** to Object Storage go through the **service gateway**, keeping them off the Internet.", "**Data Guard** between regions travels over **remote peering** between DRGs on Oracle's backbone; between availability domains in one region it stays in the VCN.", "**Multicloud**: Oracle Database@Azure, @Google Cloud and @AWS place Oracle-managed Exadata infrastructure inside those clouds' data centres, with the database networked into the other cloud's virtual network."]}, {"k": "code", "t": "Typical private Exadata layout", "x": "VCN 10.80.0.0/16\n  snet-db-client  10.80.10.0/24  (private)  NSG: 1521 from nsg-app; SSH from bastion only\n  snet-db-backup  10.80.11.0/24  (private)  route: Oracle Services → service gateway\n  snet-app        10.80.20.0/24  (private)  NSG nsg-app\nDRG: VCN attachment + FastConnect + RPC to the DR region"}, {"k": "tip", "kind": "Tip", "x": "Use NSGs (not security lists) for database access, so rules follow the database VMs and application instances regardless of subnet changes."}]}, {"t": "Real-world scenario: Data Guard lag across regions", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** A bank runs its core Oracle database on OCI with Data Guard to a standby in a second region. During month-end batch processing, the standby falls hours behind, putting the recovery point objective at risk."}, {"k": "p", "x": "**Investigation.**"}, {"k": "ol", "x": ["Data Guard metrics show redo transport lag growing during batch windows.", "The network between regions is the DRG remote peering connection over Oracle's backbone, with ample bandwidth. Network metrics show no saturation or loss.", "Database-side analysis shows redo was being sent over a single transport process, with compression off, from a primary generating very high redo volumes. Per-connection throughput over the ~40 ms inter-region path was the limit (the bandwidth-delay product problem from Module 29)."]}, {"k": "p", "x": "**Fix.**"}, {"k": "ol", "x": ["Enable redo transport compression and tune the database's network buffer sizes (the Oracle Net SDU and send/receive buffers sized to the bandwidth-delay product).", "Review OS-level TCP buffer limits on database hosts.", "Add monitoring and alerts on apply and transport lag."]}, {"k": "p", "x": "Lag stayed under one minute through the next month-end."}, {"k": "p", "x": "**Lessons learned.** \"The network is fine\" and \"the transfer is slow\" can both be true. Long-distance replication needs settings sized for the path's latency, not just bandwidth."}]}], "q": [{"t": "Which OCI gateway gives private subnets access to Object Storage without the Internet?", "o": ["Internet Gateway", "NAT Gateway", "Service Gateway", "DRG"], "a": 2, "x": "The Service Gateway reaches Oracle Services Network privately."}, {"t": "How many IP addresses does OCI reserve in each subnet?", "o": ["3", "4", "5", "0"], "a": 0, "x": "The first two and the last address."}, {"t": "A VNIC is covered by both a security list and an NSG. When is traffic allowed?", "o": ["Only if both allow it", "If either the security list or the NSG allows it", "Only if the NSG allows it", "Never"], "a": 1, "x": "OCI evaluates the union of security list and NSG rules."}, {"t": "Which OCI component connects VCNs, VPN tunnels, FastConnect and other regions as a hub?", "o": ["Local peering gateway", "NAT gateway", "Dynamic Routing Gateway", "Service gateway"], "a": 2, "x": "The DRG is OCI's virtual router with attachments for all of these."}, {"t": "You open port 8080 in an NSG, but an Oracle Linux instance still refuses connections from other hosts. What should you check next?", "o": ["The Internet gateway", "The instance's firewalld rules", "The DNS label", "The compartment policy"], "a": 1, "x": "Oracle Linux images enable the host firewall by default, so the port must be opened there too."}, {"t": "Which OCI gateway should Exadata backups to Object Storage use?", "o": ["Internet gateway", "NAT gateway", "Service gateway", "Local peering gateway"], "a": 2, "x": "The service gateway reaches Oracle services privately."}], "lv": 4, "h": 9, "p": "oci", "goal": "Build VCNs and use the DRG as a routing hub.", "terms": ["VCN", "regional subnet", "security list", "network security group", "Internet gateway", "NAT gateway", "service gateway", "DRG", "DRG attachment", "remote peering connection", "FastConnect", "Network Load Balancer", "Network Path Analyzer"]}, {"id": "m30", "t": "Global Traffic, Edge & DDoS", "res": [["Amazon CloudFront developer guide", "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html"], ["AWS Global Accelerator", "https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html"], ["Azure Front Door overview", "https://learn.microsoft.com/en-us/azure/frontdoor/front-door-overview"], ["Google Cloud: external Application Load Balancer", "https://cloud.google.com/load-balancing/docs/https"], ["OCI DNS traffic management", "https://docs.oracle.com/en-us/iaas/Content/TrafficManagement/Concepts/overview.htm"], ["Cloudflare Learning: what is a DDoS attack", "https://www.cloudflare.com/learning/ddos/what-is-a-ddos-attack/"]], "sum": ["Global entry combines DNS, anycast edges, CDNs and regional load balancers.", "Terminate TLS and absorb attacks at the edge, close to users and far from your origin.", "Choose active-active or active-passive deliberately; both need data replication plans.", "DDoS defence is layered: provider network, edge WAF and rate limits, and resilient origins."], "ls": [{"t": "Anatomy of a global entry point", "tag": "all", "blocks": [{"k": "p", "x": "When users around the world reach your application, several layers can sit between them and your servers:"}, {"k": "ol", "x": ["**DNS**: resolves your name, possibly with geo, latency or failover policies.", "**Edge / point of presence (PoP)**: a provider location near the user that receives the connection over **anycast**, terminates TCP and TLS, applies WAF and DDoS protection, and serves cached content.", "**Backbone**: the provider carries the request over its private network to the right region, avoiding congested Internet paths.", "**Regional load balancer**: distributes to backends in a region.", "**Origin**: your application servers, containers or storage."]}, {"k": "p", "x": "Terminating TLS at the edge is a big latency win: the handshake's round trips happen over a short distance to the nearby PoP, and the long-distance part runs over warm, reused connections."}, {"k": "code", "t": "Where the time goes for a user 3,000 km from the region", "x": "Direct to region:    TCP + TLS 1.3 handshake = 2 RTT × 60 ms = 120 ms before the request is even sent\nVia nearby edge PoP: 2 RTT × 5 ms = 10 ms, then the request travels on an existing backbone connection"}, {"k": "tip", "kind": "Tip", "x": "Even for dynamic, uncacheable APIs, an edge entry point usually cuts latency for distant users because of edge TLS termination and backbone routing."}]}, {"t": "AWS: CloudFront, Global Accelerator and Route 53", "tag": "aws", "blocks": [{"k": "ul", "x": ["**Amazon CloudFront**: CDN and edge proxy with hundreds of PoPs. Behaviours route paths to different **origins** (S3, ALB, API Gateway, any HTTP server). **Origin Access Control** keeps S3 buckets private so they can only be read through CloudFront. **CloudFront Functions** and **Lambda@Edge** run code at the edge. Integrates with **AWS WAF** and **Shield**. **VPC origins** let CloudFront reach private ALBs and instances without exposing them publicly.", "**AWS Global Accelerator**: two static **anycast IP addresses** that route TCP/UDP traffic over the AWS backbone to the nearest healthy endpoint (ALB, NLB, EC2, Elastic IP) in one or more regions, with fast failover (no DNS caching involved). Good for non-HTTP protocols, games, VoIP, or clients that need fixed IPs.", "**Amazon Route 53**: latency, geolocation, weighted and failover routing with health checks; **Application Recovery Controller** adds routing controls and readiness checks for regional failover."]}, {"k": "tip", "kind": "Tip", "x": "CloudFront for HTTP(S) and caching; Global Accelerator for static IPs and non-HTTP traffic; Route 53 policies for coarse DNS-level steering and disaster recovery."}]}, {"t": "Azure: Front Door, Traffic Manager and cross-region load balancing", "tag": "az", "blocks": [{"k": "ul", "x": ["**Azure Front Door** (Standard/Premium): global L7 entry on Microsoft's edge, combining anycast, TLS termination, caching (CDN), path-based routing across regions, health probes and **WAF**. Premium adds managed WAF rule sets with bot protection and **Private Link origins**, so App Services, storage or internal load balancers can stay fully private.", "**Azure Traffic Manager**: DNS-based global routing (priority, weighted, performance, geographic, multivalue, subnet). Works for any protocol but inherits DNS caching delays.", "**Cross-region (global) Load Balancer**: a global L4 load balancer with a static anycast IP in front of regional Standard Load Balancers, for TCP/UDP failover across regions."]}, {"k": "code", "t": "A private, global web app on Azure", "x": "Front Door Premium (WAF, custom domain, managed certificate)\n  → Private Link origin: App Service in UAE North (primary)\n  → Private Link origin: App Service in West Europe (secondary, priority 2)\nApp Services: public network access disabled"}, {"k": "tip", "kind": "Tip", "x": "Lock origins so they only accept Front Door traffic: use Private Link origins, or check the `X-Azure-FDID` header plus the `AzureFrontDoor.Backend` service tag."}]}, {"t": "Google Cloud: global load balancing, Cloud CDN and Cloud Armor", "tag": "gcp", "blocks": [{"k": "p", "x": "Google Cloud's **global external Application Load Balancer** is itself an edge service: one anycast IP, TLS terminated at Google's edge, and requests routed over Google's backbone to the closest healthy backend in any region. There's no separate edge product to stitch in."}, {"k": "ul", "x": ["**Backend services** can span instance groups and NEGs in many regions; traffic fills the nearest region and overflows to others based on capacity settings.", "**Cloud CDN** enables caching on backend services or backend buckets (Cloud Storage); **Media CDN** targets large-scale video and file delivery.", "**Cloud Armor** attaches security policies: preconfigured WAF rules, rate limiting, geo rules, bot management and **Adaptive Protection**, which uses machine learning to detect layer 7 attacks and suggest rules.", "**Certificate Manager** handles many certificates and domains for the load balancer."]}, {"k": "code", "t": "A multi-region backend service (concept)", "x": "URL map: /api/* → backend-service api-bs ; default → backend-bucket static-site (Cloud CDN on)\napi-bs backends: MIG in me-central1 (max 80% utilisation) + MIG in europe-west1\nCloud Armor policy on api-bs: OWASP rules + rate limit 300 req/min per client IP"}, {"k": "tip", "kind": "Tip", "x": "Google's global load balancer requires the Premium network tier. Standard tier is regional only."}]}, {"t": "OCI: global traffic steering and edge security", "tag": "oci", "blocks": [{"k": "p", "x": "OCI's global traffic tools build on DNS and regional services:"}, {"k": "ul", "x": ["**OCI DNS traffic management steering policies**: failover, load balancing (weighted), geolocation, ASN and IP prefix steering, with **health checks** on endpoints. Typically point each answer at a regional OCI Load Balancer.", "**OCI Load Balancer** and **Network Load Balancer** in each region, with backends in private subnets.", "**OCI WAF**: protects load balancers with access control, rate limiting, protection rules and bot management.", "**DDoS protection**: OCI includes protection against layer 3/4 attacks at no extra cost.", "For CDN needs, OCI customers typically use a third-party or partner CDN in front of OCI origins."]}, {"k": "tip", "kind": "Tip", "x": "Combine a DNS failover policy (with health checks and a low TTL) with regional load balancers in two OCI regions for a simple, robust active-passive setup."}]}, {"t": "DDoS fundamentals and defences", "tag": "all", "blocks": [{"k": "p", "x": "A **distributed denial-of-service (DDoS)** attack floods a target from many sources. Three broad types:"}, {"k": "ul", "x": ["**Volumetric** (layer 3/4): huge traffic volumes, often amplified via open DNS, NTP or memcached servers, aiming to saturate links. Measured in Gbps or Tbps.", "**Protocol / state exhaustion**: SYN floods and similar attacks fill connection tables on firewalls, load balancers or servers. Measured in packets per second.", "**Application layer** (layer 7): realistic-looking HTTP requests at high rates, often targeting expensive pages (search, login). Hardest to distinguish from real users."]}, {"k": "p", "x": "Defence in layers:"}, {"k": "ol", "x": ["**Provider network protection** (AWS Shield, Azure DDoS Protection, Google Cloud's built-in protection plus Cloud Armor, OCI's included DDoS protection) absorbs volumetric and protocol attacks at massive scale.", "**Edge and WAF**: anycast edges spread attack traffic over many locations; WAF rules, **rate limiting**, bot management and geo rules filter layer 7 attacks.", "**Hide the origin**: origins accept traffic only from the edge. An attacker who finds an origin IP can bypass everything.", "**Resilient application**: autoscaling, caching, queueing, and graceful degradation (serve a cached page when the backend is overloaded).", "**Runbook**: who to call, which rules to tighten, and how to reach the provider's response team."]}, {"k": "tip", "kind": "Watch out", "x": "Autoscaling under a layer 7 attack can turn a security incident into a large bill. Pair autoscaling with rate limits and budget alerts."}]}, {"t": "Real-world scenario: the flash sale that looked like an attack", "tag": "all", "blocks": [{"k": "p", "x": "**Situation.** An online store in the Gulf runs a 24-hour flash sale. At 20:00, traffic jumps 40×. Pages slow to 9 seconds, the checkout API returns 503 errors, and the security team sees thousands of requests per second to `/search` from a few hundred IP ranges. Is it a DDoS attack or real customers?"}, {"k": "p", "x": "**Investigation.**"}, {"k": "ol", "x": ["**Edge logs** show most traffic comes from normal browsers in expected countries with valid sessions: real customers. But 30% of `/search` requests come from about 200 IPs at hundreds of requests per minute each, with no cookies and a scripted user agent: a scraping bot, probably a competitor.", "**Backend metrics**: the database CPU is pinned by uncached search queries.", "**Cache metrics**: the CDN cache hit ratio is only 15%, because the cache key includes a tracking query parameter (`utm_*`) that is different for every visitor."]}, {"k": "p", "x": "**Fix.**"}, {"k": "ol", "x": ["Add a **rate-limiting rule** on `/search` (for example, 60 requests per minute per client IP) and a **bot management** rule challenging requests with no cookies. The scraper's traffic drops by 95%.", "Remove marketing query parameters from the **cache key**. The cache hit ratio rises to 85% within minutes and origin load falls sharply.", "Cache search results for popular terms for 30 seconds.", "Raise the autoscaling maximum for the checkout service, now that it's protected from abusive traffic."]}, {"k": "p", "x": "**Lessons learned.** Distinguish good from bad traffic with edge logs before reacting; blocking real customers during a sale is worse than slow pages. Cache keys and rate limits are often more effective than raw scaling. Prepare these rules before big events, in count mode, and switch them to block when needed."}]}], "q": [{"t": "Why does terminating TLS at a nearby edge reduce latency for distant users?", "o": ["Edge servers have faster CPUs", "Handshake round trips happen over a short distance, and the long leg reuses warm backbone connections", "TLS is disabled at the edge", "DNS is skipped"], "a": 1, "x": "Edge termination moves handshake round trips close to the user."}, {"t": "Which AWS service gives two static anycast IPs that route TCP/UDP traffic to the nearest healthy regional endpoint?", "o": ["CloudFront", "Global Accelerator", "Route 53", "Transit Gateway"], "a": 1, "x": "Global Accelerator provides static anycast IPs and backbone routing for any TCP/UDP traffic."}, {"t": "How can you keep Azure App Service origins private behind Front Door?", "o": ["Use Traffic Manager", "Use Front Door Premium with Private Link origins and disable public access", "Add a public IP", "Use a NAT gateway"], "a": 1, "x": "Private Link origins let Front Door reach origins that have no public access."}, {"t": "What does a SYN flood target?", "o": ["DNS caches", "Connection-state tables on servers, firewalls or load balancers", "TLS certificates", "CDN cache keys"], "a": 1, "x": "SYN floods exhaust half-open connection state."}, {"t": "A CDN's cache hit ratio is very low because every URL has unique marketing parameters. Best fix?", "o": ["Add more origin servers", "Exclude those parameters from the cache key", "Disable the CDN", "Shorten the TTL"], "a": 1, "x": "Removing irrelevant parameters from the cache key lets requests share cached objects."}], "lv": 4, "h": 6, "goal": "Design global entry points, CDNs and DDoS defences across all four clouds.", "terms": ["point of presence", "anycast", "edge TLS", "origin", "origin shield", "cache key", "global load balancing", "active-active", "active-passive", "failover", "volumetric attack", "SYN flood", "layer 7 attack", "rate limiting"]}, {"id": "m17", "t": "Hybrid Connectivity", "res": [["AWS Direct Connect resiliency recommendations", "https://docs.aws.amazon.com/directconnect/latest/UserGuide/resiliency_toolkit.html"], ["Azure ExpressRoute high availability", "https://learn.microsoft.com/en-us/azure/expressroute/designing-for-high-availability-with-expressroute"], ["Google Cloud Interconnect topologies", "https://cloud.google.com/network-connectivity/docs/interconnect/concepts/overview"], ["OCI FastConnect redundancy best practices", "https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/fastconnectresiliency.htm"]], "sum": ["Every cloud's private link uses eBGP; your router design is the same everywhere.", "Resilience needs two links, two locations, two devices and tested failover.", "Steer primary and backup paths deliberately with BGP attributes, and summarise routes.", "Private links are not encrypted by default; add MACsec or IPsec when required."], "ls": [{"t": "Private links in all four clouds", "tag": "all", "blocks": [{"k": "p", "x": "Each provider sells a dedicated private connection from your network to theirs:"}, {"k": "ul", "x": ["**AWS Direct Connect**: dedicated 1/10/100/400 Gbps ports or hosted connections via partners; virtual interfaces (private, transit, public); Direct Connect gateway for multi-region reach.", "**Azure ExpressRoute**: circuits through a connectivity provider or ExpressRoute Direct (10/100 Gbps); private peering and Microsoft peering; Global Reach between your sites.", "**Google Cloud Interconnect**: Dedicated (10/100 Gbps), Partner (50 Mbps–50 Gbps) and Cross-Cloud Interconnect; VLAN attachments to Cloud Router.", "**OCI FastConnect**: partner, colocation (1/10/100/400 Gbps cross-connects) or third-party; private and public peering via the DRG."]}, {"k": "p", "x": "They all follow the same pattern: a **physical connection** at a colocation facility or through a carrier, a **logical circuit** (VLAN, virtual interface, VLAN attachment, virtual circuit) on top, and an **eBGP session** over that circuit to exchange routes."}, {"k": "p", "x": "Why use them instead of VPN over the Internet? Predictable latency and throughput, higher bandwidth, lower data-transfer prices on some providers, and traffic that never touches the public Internet."}, {"k": "tip", "kind": "Tip", "x": "Many enterprises meet all their clouds in one or two carrier-neutral colocation facilities (Equinix, Digital Realty and similar), with short cross-connects to each provider. That colocation becomes the network's centre."}]}, {"t": "VPN as primary or backup", "tag": "all", "blocks": [{"k": "p", "x": "**Site-to-site IPsec VPN** over the Internet is quick to set up (minutes, not weeks), cheap, and available everywhere. Its limits are variable latency, lower throughput per tunnel (for example, about 1.25 Gbps per AWS tunnel), and dependence on Internet quality."}, {"k": "p", "x": "Common patterns:"}, {"k": "ul", "x": ["**VPN only**: small sites, labs, or while waiting for a private link.", "**Private link primary, VPN backup**: the most common enterprise design. BGP prefers the private link; if it fails, routes fail over to the VPN automatically.", "**VPN over the private link**: encrypts traffic across Direct Connect, ExpressRoute, Interconnect or FastConnect when compliance requires encryption.", "**SD-WAN**: branch routers build overlay tunnels to cloud hubs (AWS Cloud WAN, Azure Virtual WAN, Google NCC router appliances and OCI all integrate with SD-WAN vendors)."]}, {"k": "tip", "kind": "Watch out", "x": "When VPN backs up a private link, make sure the VPN can actually carry the load. A 10 Gbps link failing over to a 1 Gbps VPN still causes an outage for heavy workloads."}]}, {"t": "Designing for resilience", "tag": "all", "blocks": [{"k": "p", "x": "A single connection will fail eventually: fibre cuts, device failures, provider maintenance. Design so that any one component can fail without an outage."}, {"k": "p", "x": "The resilience ladder, from weakest to strongest:"}, {"k": "ol", "x": ["One connection, one device, one location: **no redundancy**.", "Two connections at **one location**, on two devices: survives a device or port failure, not a site failure.", "Connections at **two locations**, one device each: survives a site failure.", "**Two locations, two devices and two connections at each**: the maximum resiliency model AWS, Azure, Google Cloud and Oracle all describe for critical workloads."]}, {"k": "p", "x": "Also remove shared dependencies: different carriers, different building entrances, separate power. And make failover fast: use **BFD** (Bidirectional Forwarding Detection) where supported so BGP notices a dead link in about a second instead of 90 seconds."}, {"k": "code", "t": "Checklist for a production hybrid design", "x": "[ ] At least two physical connections, at two locations\n[ ] Separate customer routers for each connection\n[ ] BGP on every link; BFD enabled where supported\n[ ] Failover tested by shutting each link in a maintenance window\n[ ] Monitoring and alerts on BGP session state and link utilisation"}, {"k": "tip", "kind": "Tip", "x": "Test failover regularly. An untested backup link is often a broken backup link."}]}, {"t": "Steering traffic with BGP", "tag": "all", "blocks": [{"k": "p", "x": "With two or more links you decide which one carries traffic in each direction."}, {"k": "p", "x": "**Traffic from you to the cloud (outbound)**: set **local preference** on the routes you learn from the cloud. Higher wins. For example, local-pref 200 on the primary link and 100 on the backup."}, {"k": "p", "x": "**Traffic from the cloud to you (inbound)**: influence the cloud's choice with **AS-path prepending** (make the backup path look longer), **MED**, or by advertising **more specific prefixes** on the primary link. Each provider documents its own preference order, so check it:"}, {"k": "ul", "x": ["AWS prefers the longest prefix, then Direct Connect over VPN, then honours AS-path length and local preference communities on Direct Connect.", "Azure ExpressRoute prefers the longest prefix and then the shortest AS path; connection **weight** can set preference.", "Google Cloud Router uses **advertised route priority (MED)** that you set per BGP session.", "OCI uses the longest prefix match first and lets you influence the choice with AS-path prepending; check OCI's route-preference rules for FastConnect versus VPN."]}, {"k": "p", "x": "**Equal-cost multipath (ECMP)** lets you use several links at once for more bandwidth when paths look identical."}, {"k": "code", "t": "Primary/backup with prepending and local preference (Cisco-style)", "x": "! Prefer link A for outbound\nroute-map FROM-CLOUD-A permit 10\n set local-preference 200\n! Make link B less attractive for inbound\nroute-map TO-CLOUD-B permit 10\n set as-path prepend 65010 65010 65010"}, {"k": "tip", "kind": "Watch out", "x": "Asymmetric routing (out via link A, back via link B) breaks stateful firewalls in the path. Steer both directions consistently."}]}, {"t": "Encryption, MTU and route limits", "tag": "all", "blocks": [{"k": "p", "x": "Three details cause many hybrid problems."}, {"k": "p", "x": "**Encryption.** Private links are private, not encrypted. Options: **MACsec** (Layer 2 encryption on supported dedicated ports: AWS Direct Connect, ExpressRoute Direct, Google Dedicated/Cross-Cloud Interconnect, OCI FastConnect cross-connects), **IPsec over the private link**, or application-level TLS everywhere."}, {"k": "p", "x": "**MTU.** Private links typically support 1,500 bytes and some support jumbo frames (AWS Direct Connect private VIFs up to 9,001; Google Interconnect up to 8,896). VPN tunnels need a smaller MTU, often around 1,400 bytes once IPsec headers are added. Mismatches cause large transfers to hang; use MSS clamping on the tunnel interfaces."}, {"k": "p", "x": "**Route limits.** Every provider limits the number of prefixes you can advertise per session (for example, 100 on an AWS private VIF; 4,000 on ExpressRoute private peering with Standard, 10,000 with Premium). Exceeding the limit drops the BGP session. Advertise **summaries** such as `10.100.0.0/14` rather than every subnet."}, {"k": "tip", "kind": "Tip", "x": "Before go-live, agree in writing on the prefixes each side advertises and the filters each side applies. Most hybrid incidents come from unexpected route advertisements."}]}, {"t": "A complete hybrid design", "tag": "all", "blocks": [{"k": "p", "x": "Putting the pieces together for an organisation with a Dubai data centre and workloads in two clouds:"}, {"k": "ol", "x": ["**Colocation**: rent space in a carrier-neutral facility near the cloud regions. Place two routers there.", "**Cloud links**: from each router, a private link to AWS (Direct Connect via a Direct Connect gateway to Transit Gateway) and to Azure (ExpressRoute to a hub VNet or Virtual WAN). Use a second colocation site for the second pair of links.", "**Data centre link**: two diverse circuits from the data centre to the colocation routers.", "**Backup**: Site-to-Site VPN from the data centre directly to each cloud, with BGP, lower preference.", "**Routing**: on-premises advertises `10.100.0.0/14`; each cloud advertises its summary (for example AWS `10.64.0.0/12`, Azure `10.80.0.0/12`). No overlaps.", "**DNS**: conditional forwarding between on-premises DNS and each cloud's resolver endpoints.", "**Security**: inspection firewalls in the cloud hubs; MACsec on dedicated ports or IPsec where policy requires.", "**Operations**: monitor BGP sessions, utilisation and latency; test failover every quarter."]}, {"k": "tip", "kind": "In the cloud", "x": "The colocation routers can also route between the two clouds, so AWS and Azure traffic stays on private links instead of crossing the Internet."}]}, {"t": "Real-world scenario: failover that didn't fail over", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** A company has ExpressRoute as its primary connection to Azure and a Site-to-Site VPN as backup, both with BGP. During a carrier outage, ExpressRoute goes down. Users lose access to Azure for 45 minutes, although the VPN tunnels are up."}, {"k": "p", "x": "**Investigation.**"}, {"k": "ol", "x": ["The VPN gateway's BGP status shows routes learned from on-premises, but the on-premises routers show **no Azure routes** learned over the VPN.", "The on-premises VPN firewall had an outbound route filter, configured during setup, that only accepted Azure routes when \"a test tag\" was present. The test had ended, but the filter remained.", "The backup path had never been tested end to end since installation."]}, {"k": "p", "x": "**Fix.**"}, {"k": "ol", "x": ["Correct the route filters so Azure prefixes are accepted over the VPN with a lower local preference than ExpressRoute.", "Verify that ExpressRoute stays preferred when both are up, and VPN takes over when ExpressRoute withdraws.", "Schedule quarterly failover tests: shut the ExpressRoute BGP sessions in a maintenance window and confirm traffic moves, then restore.", "Alert when the backup path's learned-route count drops to zero."]}, {"k": "p", "x": "**Lessons learned.** A backup path that hasn't been tested is an assumption, not a backup. Monitor the backup's routes continuously and test failover on a schedule."}]}], "q": [{"t": "Which protocol do all four providers use to exchange routes over private links?", "o": ["OSPF", "BGP", "RIP", "EIGRP"], "a": 1, "x": "eBGP is universal for cloud hybrid connectivity."}, {"t": "Is traffic on a dedicated private link encrypted by default?", "o": ["Yes, always", "No", "Only for IPv6", "Only on Azure"], "a": 1, "x": "Private does not mean encrypted; add MACsec or IPsec."}, {"t": "Which design survives the loss of an entire colocation facility?", "o": ["Two connections at one location on one device", "Two connections at one location on two devices", "Connections at two different locations", "One connection with a bigger port"], "a": 2, "x": "Only diversity across locations protects against a site-level failure."}, {"t": "Which feature helps BGP detect a failed link in about a second?", "o": ["Prepending", "MED", "BFD", "Route summarisation"], "a": 2, "x": "Bidirectional Forwarding Detection detects path failure much faster than BGP hold timers."}, {"t": "You advertise 300 individual /24 routes over an AWS private VIF and the session keeps dropping. Best fix?", "o": ["Use a bigger port", "Add a VPN", "Advertise summary routes to stay under the prefix limit", "Change the ASN"], "a": 2, "x": "Private VIFs accept a limited number of prefixes; summarise."}, {"t": "How do you know a backup hybrid path will work when the primary fails?", "o": ["Its tunnels show \"up\"", "Test failover regularly and monitor the routes learned over the backup path", "Buy a bigger primary link", "Use static routes"], "a": 1, "x": "Tunnels can be up while routing is broken; only testing and route monitoring prove it."}], "lv": 5, "h": 7, "goal": "Connect data centres to cloud with resilient, BGP-steered links.", "terms": ["Direct Connect", "ExpressRoute", "Interconnect", "FastConnect", "colocation", "cross-connect", "virtual circuit", "BFD", "ECMP", "MACsec", "SD-WAN"]}, {"id": "m18", "t": "Multi-Cloud Architecture", "res": [["Google Cloud: hybrid and multi-cloud patterns", "https://cloud.google.com/architecture/hybrid-multicloud-patterns-and-practices"], ["AWS: building a scalable multi-VPC network", "https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/welcome.html"], ["Azure landing zone network topology", "https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/azure-best-practices/define-an-azure-network-topology"], ["OCI and Azure interconnect", "https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/azure.htm"]], "sum": ["One address plan for everything; no overlaps, room to grow.", "Use each cloud's native transit hub, then connect hubs to each other and to on-premises.", "DNS must be designed across clouds as carefully as routing.", "Only go multi-cloud for a clear reason, and design for egress costs."], "ls": [{"t": "IP address management (IPAM)", "tag": "all", "blocks": [{"k": "p", "x": "In a multi-cloud estate, address overlaps are the most expensive mistake. Two networks with the same range cannot be routed to each other without NAT, which complicates everything that follows."}, {"k": "p", "x": "Build one hierarchical plan and allocate from it:"}, {"k": "code", "t": "A multi-cloud address plan inside 10.0.0.0/8", "x": "10.0.0.0/12     on-premises data centres and offices\n10.16.0.0/12    reserved for growth\n10.32.0.0/12    AWS     (10.32/14 me-central-1, 10.36/14 eu-west-1, ...)\n10.48.0.0/12    Azure   (10.48/14 UAE North, 10.52/14 West Europe, ...)\n10.64.0.0/12    Google Cloud\n10.80.0.0/12    OCI\n10.96.0.0/11    Kubernetes pod and service ranges (or use non-routed overlays)"}, {"k": "p", "x": "Tools help enforce it: **Amazon VPC IPAM** can allocate VPC CIDRs automatically from pools and monitor usage; **Azure Virtual Network Manager IPAM** manages address pools across subscriptions; Google Cloud and OCI rely on careful planning plus third-party IPAM (Infoblox, NetBox)."}, {"k": "tip", "kind": "Tip", "x": "Each cloud gets one large, summarisable block per region. Then on-premises routers need only one route per cloud region, and routing stays simple."}]}, {"t": "Topologies", "tag": "all", "blocks": [{"k": "p", "x": "Choose a topology inside each cloud, then connect the clouds."}, {"k": "p", "x": "Inside a cloud, the standard is **hub-and-spoke**: workload networks (spokes) connect to a hub that holds shared services, firewalls and the hybrid links. Each provider has a native hub: **AWS Transit Gateway / Cloud WAN**, **Azure hub VNet or Virtual WAN**, **Google NCC or Shared VPC**, **OCI DRG**."}, {"k": "p", "x": "Between clouds and on-premises, common shapes are:"}, {"k": "ul", "x": ["**On-premises as the hub**: every cloud connects back to the data centre. Simple, but cloud-to-cloud traffic hairpins through the data centre.", "**Colocation as the hub**: routers in a colocation facility connect to all clouds and to on-premises. Short paths and one place for policy.", "**Direct cloud-to-cloud**: provider interconnects such as Oracle Interconnect for Azure and for Google Cloud, or Google Cross-Cloud Interconnect. Lowest latency for heavy flows between two clouds.", "**Cloud VPN mesh**: IPsec between cloud VPN gateways. Quick and cheap, limited throughput."]}, {"k": "tip", "kind": "Tip", "x": "Segment consistently everywhere. If \"prod\" and \"dev\" are separate route domains in AWS Transit Gateway, keep them separate in Azure, Google Cloud and OCI too, and across the interconnects."}]}, {"t": "Connecting the clouds", "tag": "all", "blocks": [{"k": "p", "x": "For each pair of clouds that must talk, weigh bandwidth, latency, cost and effort:"}, {"k": "ul", "x": ["**VPN between cloud gateways** (for example, AWS Site-to-Site VPN to Azure VPN Gateway, or Google HA VPN to AWS). Set up in an hour, encrypted, but limited per tunnel and crosses the Internet.", "**Private links meeting in colocation**: Direct Connect, ExpressRoute, Interconnect and FastConnect all land on your routers, which route between them. High bandwidth, predictable, but you operate the routers.", "**Provider-to-provider interconnects**: Oracle Interconnect for Microsoft Azure and for Google Cloud link specific region pairs directly with sub-2 ms latency in many locations. Google Cross-Cloud Interconnect provides dedicated physical links from Google to AWS, Azure, OCI and Alibaba Cloud.", "**Partner network-as-a-service**: Equinix Fabric, Megaport and similar let you create virtual circuits between clouds in minutes from a portal."]}, {"k": "tip", "kind": "In the cloud", "x": "A typical example is an application on Azure using Oracle Database on OCI over the Oracle–Azure interconnect, or Oracle Database@Azure, which runs Oracle's database service inside Azure data centres."}]}, {"t": "DNS across clouds", "tag": "all", "blocks": [{"k": "p", "x": "Every cloud has its own private DNS, and each one only answers for its own zones by default. A multi-cloud design must let every environment resolve names in every other."}, {"k": "p", "x": "The building blocks are the same in each cloud: an **inbound** endpoint (others can send queries in) and an **outbound** endpoint with **forwarding rules** (send queries for other zones out):"}, {"k": "ul", "x": ["**AWS**: Route 53 Resolver inbound and outbound endpoints with forwarding rules", "**Azure**: DNS Private Resolver inbound and outbound endpoints with forwarding rulesets", "**Google Cloud**: Cloud DNS inbound server policies and forwarding zones", "**OCI**: private DNS resolver with listening and forwarding endpoints"]}, {"k": "p", "x": "A clean design gives each environment its own zone, such as `aws.corp.example`, `azure.corp.example`, `gcp.corp.example`, `oci.corp.example` and `dc.corp.example`, and forwards each zone to the resolver that owns it. Many organisations make on-premises DNS (or a central resolver in the colocation) the hub for forwarding."}, {"k": "tip", "kind": "Watch out", "x": "Private endpoint zones (`privatelink.*` on Azure, PSC and interface endpoint names elsewhere) must also be forwarded, or clients in other environments will resolve the public addresses."}]}, {"t": "Choosing where workloads live", "tag": "all", "blocks": [{"k": "p", "x": "Multi-cloud adds complexity: more skills to maintain, more tools, more connections and more places for mistakes. Adopt it for a clear reason:"}, {"k": "ul", "x": ["**Best-of-breed services**: Oracle Database on OCI, analytics on Google Cloud, Microsoft workloads on Azure.", "**Regulation and sovereignty**: a service must stay in a country where only one provider has a region.", "**Acquisitions**: two companies already use different clouds.", "**Resilience or negotiating leverage** (harder to justify; true active-active across clouds is expensive)."]}, {"k": "p", "x": "Then place each workload by **data gravity** (keep compute close to its largest data), **latency to users**, **egress cost** (cross-cloud data transfer is billed as egress by the sending cloud), **compliance**, and **team skills**."}, {"k": "tip", "kind": "Tip", "x": "Make chatty systems live in the same cloud and region. Send only summarised, infrequent traffic across clouds."}]}, {"t": "Running multi-cloud as code", "tag": "all", "blocks": [{"k": "p", "x": "At this scale, networks must be managed as code and observed in one place."}, {"k": "ul", "x": ["**Infrastructure as code**: Terraform with all four providers (covered in Module 20), one repository per layer (foundation, hubs, spokes), reviewed changes, and automated policy checks.", "**Central policy**: guardrails in every cloud (SCPs, Azure Policy, organization policies, OCI security zones) enforcing no public IPs on VMs, mandatory flow logs, approved regions.", "**Unified observability**: send flow logs and firewall logs from every cloud to one SIEM; monitor BGP sessions and interconnects in one dashboard.", "**Documentation as data**: the IP plan, DNS zones and connectivity matrix kept in version control (or in a tool like NetBox), never in someone's head."]}, {"k": "tip", "kind": "Tip", "x": "Write an \"allowed flows\" matrix (which environment may talk to which, on which ports) and implement it identically in each cloud's firewall layer. It becomes the single source of truth for audits."}]}, {"t": "Real-world scenario: \"Let's be multi-cloud for resilience\"", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** After a widely reported cloud outage, a company's board asks the IT team to make the main customer application \"multi-cloud active-active\" across two providers within six months."}, {"k": "p", "x": "**Analysis the network architect presents.**"}, {"k": "ol", "x": ["**Data**: the application uses a relational database with strong consistency. Active-active writes across two clouds would need either a distributed database that supports both clouds, or a single writer with cross-cloud replication (which is active-passive for writes).", "**Network**: cross-cloud links (interconnects or VPN) add latency (5–30 ms or more) and cost per GB; every cross-cloud call slows user requests.", "**Operations**: two sets of IAM, networking, security tooling and on-call skills.", "**Actual risk**: most outages the company experienced were caused by its own deployments and configuration, not provider outages. Multi-region within one provider already covers regional failures."]}, {"k": "p", "x": "**Recommendation adopted.**"}, {"k": "ol", "x": ["Phase 1: **multi-region active-passive** on the current provider (secondary region, data replication, tested failover); fix deployment practices (progressive rollouts, automated rollback).", "Phase 2: **multi-cloud for specific risks**: DNS hosted on two providers, backups replicated to a second cloud, and a documented \"cold\" recovery plan in the second cloud.", "Revisit full multi-cloud active-active only if regulation or customer contracts require it."]}, {"k": "p", "x": "**Lessons learned.** Multi-cloud is a means, not a goal. Match the architecture to the real risks, and remember that data and operations, not networking alone, decide what's feasible."}]}], "q": [{"t": "What breaks peering and hybrid routing most often in multi-cloud?", "o": ["Too many subnets", "Overlapping CIDR ranges", "Using IPv6", "Using BGP"], "a": 1, "x": "Overlapping ranges cannot be routed between."}, {"t": "What lets each cloud resolve private names hosted in another cloud?", "o": ["A NAT gateway", "Conditional DNS forwarding", "VPC peering", "A CDN"], "a": 1, "x": "Resolver endpoints forward specific zones to the cloud that hosts them."}, {"t": "Which is a direct private interconnect between two different cloud providers?", "o": ["AWS Transit Gateway", "Oracle Interconnect for Microsoft Azure", "Azure Virtual WAN", "Google Shared VPC"], "a": 1, "x": "Oracle and Microsoft link paired OCI and Azure regions directly."}, {"t": "Why give each cloud region one large, summarisable address block?", "o": ["It is required by all providers", "Other networks then need only one route per region, keeping routing simple", "It makes IPv6 unnecessary", "It reduces egress cost"], "a": 1, "x": "Summarisable blocks keep route tables small and stay under BGP prefix limits."}, {"t": "Which factor is \"data gravity\" about?", "o": ["The weight of servers", "Keeping compute close to where its largest datasets live", "The number of regions", "DNS TTLs"], "a": 1, "x": "Moving large data is slow and costly, so applications are best placed next to it."}, {"t": "What usually makes cross-cloud active-active hardest?", "o": ["Lack of BGP support", "Keeping strongly consistent data writable in both clouds", "DNS limits", "IPv6 support"], "a": 1, "x": "Networking can be solved; consistent multi-writer data across clouds is the hard part."}], "lv": 5, "h": 7, "goal": "Plan addresses, topology and DNS across four clouds and on-premises.", "terms": ["IPAM", "landing zone", "transit hub", "colocation", "cloud-to-cloud interconnect", "DNS forwarding", "data gravity", "egress cost", "segmentation", "network as code"]}, {"id": "m19", "t": "Cloud Network Security", "res": [["AWS Network Firewall", "https://docs.aws.amazon.com/network-firewall/latest/developerguide/what-is-aws-network-firewall.html"], ["Azure Firewall features", "https://learn.microsoft.com/en-us/azure/firewall/features-by-sku"], ["Google Cloud Armor", "https://cloud.google.com/armor/docs/cloud-armor-overview"], ["OCI Network Firewall", "https://docs.oracle.com/en-us/iaas/Content/network-firewall/overview.htm"], ["CIS Benchmarks", "https://www.cisecurity.org/cis-benchmarks"]], "sum": ["Stack controls: edge (DDoS, WAF), network (segmentation, firewalls), identity, host, data, monitoring.", "Inspect egress and east-west traffic, not only inbound.", "Nothing internal should have a public IP; admin access goes through identity-aware services.", "Log every flow and decision, and alert on what matters."], "ls": [{"t": "Defense in depth", "tag": "all", "blocks": [{"k": "p", "x": "No single control stops every attack. Cloud network security layers independent controls so that an attacker who gets past one is stopped by the next:"}, {"k": "ol", "x": ["**Edge**: DDoS protection, CDN and WAF in front of public endpoints.", "**Perimeter**: only load balancers and gateways face the Internet.", "**Segmentation**:
