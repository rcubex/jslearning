**: give only the permissions needed for the task", "**MFA** for every human, especially administrators", "**No long-lived keys**: workloads get temporary credentials from roles or managed identities", "**Federation**: log in with your company identity (Microsoft Entra ID, Okta, Google Workspace) via single sign-on rather than separate cloud users", "**Separation of duties**: network admins, security admins and developers get different roles"]}, {"k": "tip", "kind": "Watch out", "x": "The root/owner account of a cloud tenancy should have MFA, no access keys, and be used almost never. Lock it away."}]}, {"t": "AWS IAM", "tag": "aws", "blocks": [{"k": "p", "x": "AWS IAM has **users** (people or legacy apps), **groups** of users, and **roles**, identities without permanent credentials that can be *assumed* to get temporary credentials. Permissions are written in **JSON policies** that allow or deny actions on resources."}, {"k": "code", "t": "An AWS policy allowing read-only access to VPC configuration", "x": "{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [{\n    \"Effect\": \"Allow\",\n    \"Action\": [\"ec2:Describe*\"],\n    \"Resource\": \"*\"\n  }]\n}"}, {"k": "p", "x": "EC2 instances, Lambda functions and containers get permissions through an attached role (an **instance profile** for EC2). Humans should sign in through **IAM Identity Center** with single sign-on. Across many accounts, **service control policies (SCPs)** in AWS Organizations set maximum permissions; for example, \"nobody may delete VPC flow logs\" or \"only these regions may be used\"."}, {"k": "p", "x": "Useful managed policies for networking: **NetworkAdministrator** (job function) and **AmazonVPCReadOnlyAccess**."}, {"k": "tip", "kind": "Tip", "x": "An explicit Deny always wins over any Allow in AWS. Use SCP denies for guardrails that must never be bypassed."}]}, {"t": "Microsoft Entra ID and Azure RBAC", "tag": "az", "blocks": [{"k": "p", "x": "Azure identities live in **Microsoft Entra ID** (formerly Azure Active Directory): users, groups, and **service principals** for applications. Access to Azure resources is controlled by **Azure RBAC**: you assign a **role** to a **principal** at a **scope**."}, {"k": "p", "x": "Scopes form a hierarchy, and assignments inherit downwards: **management group → subscription → resource group → resource**. A Network Contributor assignment on a resource group applies to every network resource in it."}, {"k": "p", "x": "Built-in roles you will use: **Owner** (everything, including granting access), **Contributor** (everything except granting access), **Reader**, and **Network Contributor** (manage networks but not VMs or data)."}, {"k": "p", "x": "For workloads, use **managed identities**: Azure creates and rotates the credentials automatically. A VM or function with a managed identity can call other Azure services with no secrets in code."}, {"k": "code", "t": "Grant Network Contributor on one resource group (Azure CLI)", "x": "az role assignment create \\\n  --assignee netops@contoso.com \\\n  --role \"Network Contributor\" \\\n  --scope /subscriptions/<sub-id>/resourceGroups/rg-network-prod"}, {"k": "tip", "kind": "Tip", "x": "Use **Privileged Identity Management (PIM)** so administrators activate high-privilege roles only when needed, for a limited time, with approval."}]}, {"t": "Google Cloud IAM", "tag": "gcp", "blocks": [{"k": "p", "x": "In Google Cloud, you grant **roles** to **principals** (Google accounts, groups, service accounts, or federated identities) on a **resource**. The resource hierarchy is **organization → folders → projects → resources**, and permissions granted higher up are inherited below."}, {"k": "p", "x": "Roles come in three kinds: **basic** (Owner, Editor, Viewer; too broad for production), **predefined** (such as `roles/compute.networkAdmin`, `roles/compute.securityAdmin`, `roles/compute.networkViewer`) and **custom**."}, {"k": "p", "x": "**Service accounts** represent workloads. Attach one to a VM or GKE workload and the code gets credentials automatically. Avoid downloading service account keys; use **Workload Identity Federation** for workloads outside Google Cloud."}, {"k": "code", "t": "Grant network admin on a project (gcloud)", "x": "gcloud projects add-iam-policy-binding my-net-project \\\n  --member=\"group:netops@example.com\" \\\n  --role=\"roles/compute.networkAdmin\""}, {"k": "tip", "kind": "In the cloud", "x": "Google Cloud firewall rules can target VMs by **service account**, which is stronger than network tags, because changing a VM's service account requires IAM permission."}]}, {"t": "OCI IAM", "tag": "oci", "blocks": [{"k": "p", "x": "OCI organises resources in **compartments** inside a **tenancy**. Compartments can be nested, and policies apply to a compartment and everything below it. Identities live in **identity domains**: users, groups and **dynamic groups** (which match instances or functions by rules, so workloads can call OCI APIs without keys)."}, {"k": "p", "x": "OCI policies are written in readable sentences:"}, {"k": "code", "t": "Example OCI policies", "x": "Allow group NetAdmins to manage virtual-network-family in compartment Network\nAllow group AppTeam to use virtual-network-family in compartment Apps\nAllow group AppTeam to manage instance-family in compartment Apps\nAllow dynamic-group AppServers to read objects in compartment Data"}, {"k": "p", "x": "The verbs go from weakest to strongest: **inspect** (list), **read**, **use** (work with existing resources, such as attaching a VNIC to a subnet), **manage** (everything including create and delete). `virtual-network-family` covers VCNs, subnets, gateways, route tables and security lists."}, {"k": "tip", "kind": "Tip", "x": "A common OCI pattern: the network team *manages* the network in a shared compartment, and application teams get *use* permission so they can place instances in subnets without changing the network."}]}, {"t": "Separating network and application duties", "tag": "all", "blocks": [{"k": "p", "x": "In larger organisations, the network is a shared platform and should be protected from accidental changes by application teams. The same pattern exists in every cloud:"}, {"k": "ul", "x": ["**AWS**: a central network account owns VPCs and shares subnets to application accounts with **AWS Resource Access Manager (RAM)**. App teams launch resources into shared subnets but cannot change route tables or gateways.", "**Azure**: the hub VNet and firewall sit in a connectivity subscription owned by the platform team. App teams own spoke VNets but Azure Policy prevents risky changes (like adding public IPs).", "**Google Cloud**: **Shared VPC**: a host project owns the network; service projects attach to it. Granting `roles/compute.networkUser` on specific subnets lets app teams use them without managing them.", "**OCI**: the network in a dedicated compartment; app teams get `use virtual-network-family`."]}, {"k": "tip", "kind": "Tip", "x": "Combine this with guardrail policies (SCPs, Azure Policy, organization policies) such as \"no public IPs on VMs\" and \"flow logs must stay enabled\"."}]}, {"t": "Real-world scenario: the leaked access key", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** A developer pushes code to a public GitHub repository with an AWS access key in a config file. Within 20 minutes, automated scanners find it and someone starts launching large GPU instances in several regions for crypto-mining. The key belonged to a user with broad permissions, including networking changes."}, {"k": "p", "x": "**Response.**"}, {"k": "ol", "x": ["**Contain**: deactivate the access key immediately; AWS often detects public key leaks and applies a quarantine policy, but don't wait for that.", "**Assess**: CloudTrail shows what the key did: instances launched, a security group opened to the world, a new IAM user created as a backdoor.", "**Clean up**: terminate the instances, delete the backdoor user, revert the security group change, check every region.", "**Prevent**: - Remove long-lived access keys: developers use single sign-on (IAM Identity Center) and short-lived credentials; CI pipelines use OIDC federation to assume roles. - SCPs deny launching instances in regions the company doesn't use and deny GPU instance types outside approved accounts. - Secret scanning on all repositories (pre-commit hooks and the Git platform's scanning). - Budget and anomaly alerts."]}, {"k": "p", "x": "**Lessons learned.** Identity is the cloud's real perimeter. Long-lived keys with broad permissions are a liability; temporary credentials, least privilege and guardrails limit the damage of a single mistake."}]}], "q": [{"t": "Which OCI construct groups resources for policy and isolation?", "o": ["Resource group", "Compartment", "Project", "Account"], "a": 1, "x": "OCI policies are written against compartments."}, {"t": "Which Azure built-in role manages networks but not VMs?", "o": ["Owner", "Contributor", "Network Contributor", "Reader"], "a": 2, "x": "Network Contributor is scoped to networking resources."}, {"t": "What is the recommended way for an AWS EC2 instance to get permissions to call AWS APIs?", "o": ["Store an access key in a config file", "Use the root user's keys", "Attach an IAM role through an instance profile", "Use a shared IAM user"], "a": 2, "x": "Roles give temporary, automatically rotated credentials with no secrets on disk."}, {"t": "In Google Cloud, how can application teams deploy into a centrally managed network?", "o": ["VPC peering", "Shared VPC with the network user role on chosen subnets", "Giving them Owner on the host project", "Copying the network into each project"], "a": 1, "x": "Shared VPC lets service projects use subnets of a host project without managing it."}, {"t": "In AWS, if one policy allows an action and another explicitly denies it, what happens?", "o": ["The allow wins", "The explicit deny wins", "The most recent policy wins", "It depends on the region"], "a": 1, "x": "An explicit Deny always overrides any Allow."}, {"t": "What is the best long-term fix for leaked long-lived access keys?", "o": ["Rotate keys monthly", "Remove long-lived keys in favour of SSO and short-lived role credentials, plus guardrails", "Use longer passwords", "Store keys in a private repository"], "a": 1, "x": "Short-lived credentials and least privilege remove the leaked-key risk at its source."}], "lv": 3, "h": 4, "goal": "Control who can change your networks in every cloud.", "terms": ["authentication", "authorization", "least privilege", "MFA", "role", "policy", "RBAC", "managed identity", "service account", "compartment", "SCP"]}, {"id": "m12", "t": "Virtual Networks Across Clouds", "res": [["AWS VPC", "https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html"], ["Azure Virtual Network", "https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-overview"], ["Google Cloud VPC", "https://cloud.google.com/vpc/docs/overview"], ["OCI Networking", "https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/overview.htm"]], "sum": ["VPC, VNet, VCN and Google VPC are the same idea: your private network in the cloud.", "Scope differs: AWS subnets are per zone; Azure, Google Cloud and OCI subnets are regional.", "Public vs private is decided by routing (and, on OCI, by the subnet setting).", "Every cloud filters at the instance level; AWS and OCI also filter at the subnet level."], "ls": [{"t": "The virtual network", "tag": "all", "blocks": [{"k": "p", "x": "In every cloud you start by creating a private, isolated network and giving it one or more address ranges from RFC 1918. Then you divide it into **subnets**, attach **route tables**, add **gateways** for Internet or on-premises access, and apply **security rules**."}, {"k": "ul", "x": ["**AWS**: **VPC** (Virtual Private Cloud). Primary CIDR between /16 and /28, plus up to four secondary CIDRs by default.", "**Azure**: **VNet** (Virtual Network). One or more address spaces; you can add more later.", "**Google Cloud**: **VPC network**. The network itself has no CIDR; each subnet has its own primary range, plus optional secondary ranges (used by GKE).", "**OCI**: **VCN** (Virtual Cloud Network). One or more CIDR blocks (/16 to /30 each)."]}, {"k": "p", "x": "Under the hood these are software-defined networks: there are no real switches or VLANs you can see. The provider's virtual network delivers packets between your VMs, enforces your rules and answers ARP and DHCP on behalf of the network."}, {"k": "tip", "kind": "Tip", "x": "Before creating any network, take its range from your address plan (Module 03). Changing the range of a live network is difficult or impossible."}]}, {"t": "Scope differences", "tag": "all", "blocks": [{"k": "p", "x": "The biggest structural differences between providers are about *where* things live."}, {"k": "ul", "x": ["**AWS**: the VPC is regional. Each **subnet lives in exactly one availability zone**. For a three-zone design you create three public and three private subnets.", "**Azure**: the VNet is regional. **Subnets span all zones** in the region; you choose the zone per VM or service, not per subnet.", "**Google Cloud**: the **VPC is global**. **Subnets are regional** and span all zones in that region. VMs in different regions of the same VPC talk over internal IPs with no peering.", "**OCI**: the VCN is regional. **Subnets are regional** (recommended) or tied to a single availability domain."]}, {"k": "p", "x": "This changes how you design. On AWS, the number of subnets multiplies by the number of zones. On Azure, Google Cloud and OCI, one subnet per tier is often enough, and resilience comes from placing instances in different zones or fault domains."}, {"k": "tip", "kind": "Watch out", "x": "On AWS, if all your private subnets route to a NAT gateway in one zone and that zone fails, every zone loses Internet access. Use one NAT gateway per zone for production."}]}, {"t": "Routing in the cloud", "tag": "all", "blocks": [{"k": "p", "x": "Every virtual network automatically routes traffic between its own subnets (the **local** route). You add routes for everything else."}, {"k": "ul", "x": ["**AWS**: route tables are associated with subnets. A subnet is \"public\" only because its route table sends `0.0.0.0/0` to an **Internet gateway**; a \"private\" subnet sends it to a **NAT gateway** (or has no default route).", "**Azure**: **system routes** are created automatically, including a default route to the Internet. You override them with **user-defined routes (UDRs)** in route tables attached to subnets, for example sending `0.0.0.0/0` to Azure Firewall.", "**Google Cloud**: routes belong to the VPC network, not to subnets. There is a default route to the Internet gateway, and custom static routes can apply to all instances or only to instances with a given **network tag**, with priorities.", "**OCI**: **route tables** are attached to subnets, with rules pointing to an Internet gateway, NAT gateway, service gateway, DRG or a private IP (for a firewall appliance)."]}, {"k": "code", "t": "The same \"private subnet\" in each cloud", "x": "AWS:   private-rt: 0.0.0.0/0 → nat-gateway (in a public subnet)\nAzure: UDR on subnet: 0.0.0.0/0 → Azure Firewall private IP (or attach a NAT Gateway resource to the subnet)\nGCP:   VMs without external IPs + Cloud Router + Cloud NAT for the region\nOCI:   private subnet route table: 0.0.0.0/0 → NAT gateway; Oracle services → service gateway"}, {"k": "tip", "kind": "Tip", "x": "When something can't reach a destination, read the effective routes. Azure shows them per network interface (\"Effective routes\"); AWS Reachability Analyzer, Google Connectivity Tests and OCI Network Path Analyzer evaluate routes for you."}]}, {"t": "Filtering in the cloud", "tag": "all", "blocks": [{"k": "p", "x": "Each cloud filters traffic, but in different places."}, {"k": "ul", "x": ["**AWS**: **security groups** on network interfaces (stateful, allow-only, can reference other security groups) and **network ACLs** on subnets (stateless, numbered allow and deny rules).", "**Azure**: **network security groups (NSGs)** with priority-ordered allow and deny rules (stateful), attached to subnets, NICs, or both. **Application security groups** let rules target VMs by role.", "**Google Cloud**: **VPC firewall rules** and **firewall policies** (stateful), applied to the network and targeting instances by tag, service account or all instances. Every VPC has implied rules: allow all egress and deny all ingress.", "**OCI**: **security lists** on subnets and **network security groups** on VNICs. Rules are stateful by default; stateless is optional."]}, {"k": "code", "t": "\"Database only reachable from the app tier\", four ways", "x": "AWS:   sg-db inbound: TCP 5432 from sg-app\nAzure: NSG rule: allow TCP 5432 from ASG app-servers to ASG db-servers\nGCP:   firewall: allow tcp:5432 from service account app-sa to target service account db-sa\nOCI:   nsg-db ingress: TCP 5432 from source NSG nsg-app"}, {"k": "tip", "kind": "Watch out", "x": "If both a subnet-level and an instance-level filter apply (AWS NACL + security group, Azure subnet NSG + NIC NSG, OCI security list + NSG), traffic must be allowed by **both**."}]}, {"t": "Public IPs and Internet exposure", "tag": "all", "blocks": [{"k": "p", "x": "A resource can only be reached from the Internet if it has a public address (or sits behind something that does, like a load balancer) **and** routing and security rules allow it."}, {"k": "ul", "x": ["**AWS**: public IPv4 addresses (auto-assigned or **Elastic IPs**) on instances in subnets with an Internet gateway route. AWS charges for public IPv4 addresses.", "**Azure**: **public IP address** resources attached to NICs, load balancers or gateways. VMs without a public IP can still reach the Internet through a NAT gateway or firewall; Azure is retiring \"default outbound access\" for new VNets, so plan explicit egress.", "**Google Cloud**: **external IP addresses** (ephemeral or static) on VM interfaces.", "**OCI**: **public IPs** (ephemeral or reserved) on VNICs, only in **public subnets**. A subnet's public/private setting is fixed at creation."]}, {"k": "p", "x": "Best practice is the same everywhere: application and database servers have **no public IPs**. Only load balancers, NAT gateways, VPN gateways and (if needed) bastions face the Internet."}, {"k": "tip", "kind": "Tip", "x": "Use guardrail policies to block public IPs on VMs (AWS SCPs, Azure Policy, Google Cloud organization policy `compute.vmExternalIpAccess`, OCI security zones)."}]}, {"t": "Reference design: a three-tier network", "tag": "all", "blocks": [{"k": "p", "x": "Here is one design, used for the rest of the course, mapped to each provider."}, {"k": "ol", "x": ["**Public tier**: L7 load balancer with WAF, NAT gateway(s). The only Internet-facing parts.", "**App tier**: application servers or containers in private subnets, reachable only from the load balancer.", "**Data tier**: managed database with a private endpoint, reachable only from the app tier.", "**Admin access**: managed, identity-based access (Session Manager, Azure Bastion, IAP, OCI Bastion), never open SSH/RDP.", "**Logging**: flow logs enabled on the network."]}, {"k": "code", "t": "Mapping summary", "x": "              AWS                      Azure                         Google Cloud                OCI\nNetwork       VPC                      VNet                          VPC (global)                VCN\nPublic tier   ALB + WAF, NAT GW/AZ     App Gateway + WAF, NAT GW     Global ALB + Cloud Armor    LB + WAF, NAT GW\nApp tier      private subnet per AZ    snet-app (zone-redundant)     regional subnet             private regional subnet\nData tier     RDS in private subnets   Private Endpoint to Azure SQL Cloud SQL private IP / PSC   Autonomous DB private endpoint\nFiltering     SGs (+NACLs)             NSGs + ASGs                   firewall rules/policies     NSGs (+security lists)"}, {"k": "tip", "kind": "Tip", "x": "Draw this design for your own app before touching a console. Every deep-dive module in Level 4 builds this exact design on one provider."}]}, {"t": "Real-world scenario: one design, four clouds", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** A software company must deploy the same customer-facing application in AWS, Azure, Google Cloud and OCI, because different enterprise customers require different providers. The team wants one design, translated consistently."}, {"k": "p", "x": "**Approach.**"}, {"k": "ol", "x": ["**One logical design**: public tier (L7 load balancer with WAF), app tier (containers), data tier (managed PostgreSQL with private access), admin access without open ports, flow logs on.", "**One address plan**: each cloud gets its own /16 from the company plan, with the same internal layout (public /24s, app /20s, data /24s).", "**Translation table** for each building block (the Cloud Rosetta tab is exactly this). Notable differences handled explicitly: - AWS: three app subnets (one per AZ) and three NAT gateways; others: one regional app subnet. - Azure: dedicated subnets for Application Gateway and Private Endpoints; delegated subnet for PostgreSQL Flexible Server. - Google Cloud: firewall rules by service account; Cloud NAT on a Cloud Router; Cloud SQL with Private Service Connect. - OCI: public/private decided at subnet creation; NSGs per tier; service gateway for Oracle services.", "**Infrastructure as code**: one Terraform module per cloud with identical inputs (name, CIDR, tiers), producing identical outputs.", "**Same tests**: the same connectivity tests run against each deployment (Internet can reach only the load balancer; app can reach database; nothing else can)."]}, {"k": "p", "x": "**Lessons learned.** Design once at the logical level, then translate. Writing down the differences between providers up front prevents subtle security gaps (for example, OCI's union of security lists and NSGs, or AWS's per-AZ subnets)."}]}], "q": [{"t": "Which provider VPC is global by default?", "o": ["AWS", "Azure", "Google Cloud", "OCI"], "a": 2, "x": "A Google Cloud VPC spans all regions; its subnets are regional."}, {"t": "In AWS, a subnet lives in…", "o": ["A region", "An availability zone", "A peering connection", "An edge location"], "a": 1, "x": "Each AWS subnet maps to exactly one AZ."}, {"t": "What makes an AWS subnet \"public\"?", "o": ["A checkbox on the subnet", "A route table entry sending 0.0.0.0/0 to an Internet gateway", "Having a NAT gateway", "Its CIDR range"], "a": 1, "x": "Public is a routing property: a default route to the Internet gateway."}, {"t": "An AWS NACL allows traffic but the instance's security group does not. What happens?", "o": ["Traffic is allowed", "Traffic is blocked", "Only replies are allowed", "It depends on the port"], "a": 1, "x": "Traffic must pass both the subnet filter and the instance filter."}, {"t": "On OCI, when is a subnet's public or private setting chosen?", "o": ["Any time, in the console", "When the subnet is created; it can't be changed later", "When the first instance launches", "When a route table is attached"], "a": 1, "x": "OCI fixes public/private at subnet creation, so plan it up front."}, {"t": "What is the most reliable way to deploy one application consistently across four clouds?", "o": ["Click through each console carefully", "One logical design and address plan, translated into per-cloud IaC modules with the same tests", "Use only the default networks", "Copy one cloud's templates into the others unchanged"], "a": 1, "x": "Logical design plus per-cloud modules and shared tests keeps deployments equivalent."}], "lv": 3, "h": 5, "goal": "Map one network design onto all four providers.", "terms": ["VPC", "VNet", "VCN", "subnet", "regional subnet", "route table", "Internet gateway", "NAT gateway", "security group", "NSG", "firewall rule", "security list"]}, {"id": "m28", "t": "Serverless & PaaS Networking", "res": [["AWS Lambda: connecting to a VPC", "https://docs.aws.amazon.com/lambda/latest/dg/configuration-vpc.html"], ["Azure App Service networking features", "https://learn.microsoft.com/en-us/azure/app-service/networking-features"], ["Cloud Run: Direct VPC egress", "https://cloud.google.com/run/docs/configuring/vpc-direct-vpc"], ["OCI Functions networking", "https://docs.oracle.com/en-us/iaas/Content/Functions/Tasks/functionsconfiguringnetwork.htm"]], "sum": ["Every managed service has two network questions: how do requests come in, and how does it reach out?", "Attaching a function or app to your network gives private reach-out, but also takes away default Internet access.", "Private endpoints control inbound access; VNet/VPC integration controls outbound access.", "Managed databases should live on private addresses only, reachable from the app tier."], "ls": [{"t": "How managed services meet your network", "tag": "all", "blocks": [{"k": "p", "x": "With virtual machines, the network is obvious: the VM has a NIC in your subnet. With serverless and PaaS (functions, container platforms, app services, managed databases), the compute runs in the **provider's** network, and you choose how it connects to yours."}, {"k": "p", "x": "Always answer two separate questions:"}, {"k": "ol", "x": ["**Inbound**: how do clients reach the service? Over a public endpoint on the Internet, a public endpoint restricted by IP rules, or a **private endpoint** with an IP inside your network?", "**Outbound**: when the service calls something (a database, an internal API, the Internet), which network does that traffic use? The provider's default Internet path, or **your network** through VPC/VNet integration, with your routes, firewalls and NAT?"]}, {"k": "p", "x": "Two more terms help: the **control plane** is the provider's management API (deploying, configuring), which stays on the provider's public endpoints; the **data plane** is your application traffic, which is what you're securing."}, {"k": "code", "t": "The four combinations for a web app calling a private database", "x": "Inbound public  + outbound default   → app can't reach the private DB at all\nInbound public  + outbound integrated → typical: public site, private DB access\nInbound private + outbound integrated → fully private internal app\nInbound private + outbound default   → internal app that can't reach private resources (rarely useful)"}, {"k": "tip", "kind": "Tip", "x": "Draw these two arrows (in and out) for every managed service in your design. Most \"it can't connect\" problems are about the outbound arrow."}]}, {"t": "AWS: Lambda, Fargate and API Gateway", "tag": "aws", "blocks": [{"k": "p", "x": "**AWS Lambda** runs, by default, in an AWS-managed network with Internet access but no access to your private resources. When you **attach a function to your VPC** (choosing subnets and security groups), Lambda creates shared **Hyperplane ENIs** in those subnets, and the function's outbound traffic now flows through your VPC."}, {"k": "p", "x": "Consequences:"}, {"k": "ul", "x": ["The function can reach RDS, ElastiCache and internal services privately.", "It **loses default Internet access**. To call the Internet or public AWS APIs it needs a **NAT gateway** route, or **VPC endpoints** for AWS services (S3 gateway endpoint, interface endpoints for STS, Secrets Manager, SQS, and so on).", "Security groups on the function control what it can reach, and database security groups should allow the function's security group."]}, {"k": "p", "x": "**Amazon ECS on Fargate** uses **awsvpc** networking: every task gets its own ENI and private IP in your subnet, with its own security group. Tasks pulling images from ECR in private subnets need NAT or the ECR, S3 and CloudWatch Logs endpoints."}, {"k": "p", "x": "**API Gateway** can be public (regional or edge-optimised) or **private**, reachable only through an `execute-api` interface endpoint in your VPC. It reaches private backends through **VPC links** to NLBs or ALBs."}, {"k": "tip", "kind": "Watch out", "x": "A Lambda function in a private subnet that \"times out\" calling an external API almost always has no NAT route. It's networking, not code."}]}, {"t": "Azure: App Service, Functions, Container Apps and API Management", "tag": "az", "blocks": [{"k": "p", "x": "Azure separates inbound and outbound clearly for its app platforms."}, {"k": "p", "x": "**App Service and Azure Functions**:"}, {"k": "ul", "x": ["**Inbound**: public by default; add **access restrictions** (IP or service-tag rules) or a **private endpoint** to make the app reachable only from your network, then disable public access.", "**Outbound**: **regional VNet integration** connects the app to a **delegated subnet** in your VNet. Its traffic to private IPs (and, with \"route all\", all traffic) follows your VNet's routes, NSGs and NAT gateway or firewall. Size the integration subnet for scaling (a /26 or larger is a safe start)."]}, {"k": "p", "x": "**Azure Container Apps** runs inside a **Container Apps environment** that you can deploy into your own VNet (internal or external ingress). **Azure Kubernetes Service** follows the networking options covered in Module 21."}, {"k": "p", "x": "**API Management** can be deployed into a VNet in **external** mode (public gateway, private backends) or **internal** mode (gateway only on a private IP), often behind Application Gateway with WAF."}, {"k": "code", "t": "App with private inbound and private outbound (summary)", "x": "Private endpoint: app-orders → 10.20.5.10 in snet-pe\nVNet integration: delegated subnet snet-appint 10.20.6.0/26, route all = on\nUDR on snet-appint: 0.0.0.0/0 → Azure Firewall\nAzure SQL: private endpoint 10.20.5.20, public network access disabled\nPrivate DNS zones: privatelink.azurewebsites.net, privatelink.database.windows.net"}, {"k": "tip", "kind": "Tip", "x": "For App Service, inbound and outbound are independent. A private endpoint alone does not let the app reach private resources, and VNet integration alone does not make the app private."}]}, {"t": "Google Cloud: Cloud Run and serverless", "tag": "gcp", "blocks": [{"k": "p", "x": "**Cloud Run** (which also runs **Cloud Run functions**) runs containers on Google-managed infrastructure."}, {"k": "p", "x": "**Inbound** is controlled by the **ingress setting**: `all` (Internet), `internal` (only from your VPC networks, Shared VPC and some Google services), or `internal-and-cloud-load-balancing` (also through your external Application Load Balancer, so you can add Cloud Armor and custom domains). Combine with IAM authentication (`--no-allow-unauthenticated`) for private services."}, {"k": "p", "x": "**Outbound** to your VPC uses either:"}, {"k": "ul", "x": ["**Direct VPC egress** (recommended): instances get IPs directly from a subnet you choose, with no connector to manage, lower latency and firewall rules that can target them by network tag.", "**Serverless VPC Access connector**: an older approach using connector VMs in a small /28 subnet."]}, {"k": "p", "x": "You choose whether **all traffic** or only **private ranges** go through the VPC. Sending all traffic lets you use Cloud NAT with a static IP, which matters when a partner allow-lists your address."}, {"k": "code", "t": "Deploy Cloud Run with Direct VPC egress", "x": "gcloud run deploy orders --image=me-central1-docker.pkg.dev/p/repo/orders:1.4 \\\n  --region=me-central1 --network=vpc-prod --subnet=snet-run \\\n  --vpc-egress=all-traffic --ingress=internal-and-cloud-load-balancing \\\n  --no-allow-unauthenticated"}, {"k": "tip", "kind": "Tip", "x": "Size the Direct VPC egress subnet for scale: each running instance uses IP addresses, so give it room (a /24 or larger for busy services)."}]}, {"t": "OCI: Functions, API Gateway and Container Instances", "tag": "oci", "blocks": [{"k": "p", "x": "On OCI, serverless resources are placed directly into **your subnets**:"}, {"k": "ul", "x": ["**OCI Functions**: each application is associated with one or more subnets. Functions in a **private subnet** need a **service gateway** (to reach Oracle services such as Object Storage, Vault and the container registry) and a **NAT gateway** for Internet calls. NSGs can be attached to function applications.", "**OCI API Gateway**: deployed into a public or private subnet, routing to backends (functions, HTTP services, private IPs). A private gateway is reachable only from the VCN and connected networks.", "**OCI Container Instances**: serverless containers that get VNICs in your subnet, with NSGs, like a small VM.", "**OKE virtual nodes** run Kubernetes pods without managing worker nodes, using VCN-native pod networking."]}, {"k": "code", "t": "Typical private functions setup", "x": "Subnet snet-fn (private, regional)\n  route 0.0.0.0/0 → NAT gateway\n  route All <region> Services in Oracle Services Network → service gateway\nNSG nsg-fn: egress to nsg-db on TCP 1521; egress 443 to 0.0.0.0/0\nAutonomous Database: private endpoint in snet-db, NSG allows TCP 1521-1522 from nsg-fn"}, {"k": "tip", "kind": "Watch out", "x": "If a function in a private subnet fails to start and can't pull its image, check the service gateway route: the image registry is an Oracle service."}]}, {"t": "Managed databases on private networks", "tag": "all", "blocks": [{"k": "p", "x": "Managed databases should be reachable only on private addresses, only from the app tier. The provider-specific patterns:"}, {"k": "ul", "x": ["**AWS RDS / Aurora**: launched into a **DB subnet group** (private subnets in two or more AZs); \"publicly accessible\" set to No; a security group allowing only the app's security group. The DNS endpoint follows failovers between AZs.", "**Azure SQL Database, PostgreSQL, MySQL**: **private endpoints** with public network access disabled, or (for Flexible Server) **VNet injection** into a delegated subnet. Private DNS zones must resolve the server name to the private IP.", "**Google Cloud SQL / AlloyDB**: **private IP** through private services access (a peered, Google-managed VPC using a reserved range you allocate) or **Private Service Connect**; disable public IP. The Cloud SQL Auth Proxy adds IAM-based authentication and TLS.", "**OCI Autonomous Database / Base Database / Exadata**: **private endpoints** or deployment into your subnets, with NSGs controlling access; access to Oracle services via the service gateway."]}, {"k": "p", "x": "Connection behaviour matters too: database failover changes the IP behind the DNS name, so applications must reconnect and not cache IPs. Connection pools (RDS Proxy, PgBouncer) protect databases from connection storms when serverless functions scale out."}, {"k": "tip", "kind": "Tip", "x": "For Google Cloud SQL with private services access, reserve a generous range (a /20 or larger) up front; every managed service using that peering shares it."}]}, {"t": "Real-world scenario: the function that couldn't call the payment API", "tag": "all", "blocks": [{"k": "p", "x": "**Situation.** A retail company moves its checkout logic from VMs to serverless functions. In testing, the function reaches the orders database perfectly, but every call to the external payment provider times out after 30 seconds. The payment provider also requires calls to come from a fixed, allow-listed IP address."}, {"k": "p", "x": "**Investigation.** The team first suspects the payment provider. Then they draw the outbound arrow: the function was attached to the private subnets so it could reach the database. That attachment means all outbound traffic now uses the VPC's routes, and the private subnets have no default route to a NAT gateway. Database traffic works (local route); Internet traffic has nowhere to go and times out."}, {"k": "p", "x": "**Fix.**"}, {"k": "ol", "x": ["Add a NAT gateway in each zone's public subnet (on Azure: a NAT gateway on the integration subnet; on Google Cloud: Cloud NAT with reserved static IPs and all-traffic egress; on OCI: a NAT gateway with a reserved public IP).", "Route `0.0.0.0/0` from the function subnets to the NAT gateway in the same zone.", "Give the NAT gateway(s) reserved public IPs and send those to the payment provider for allow-listing.", "Add private endpoints for the cloud services the function uses (secrets store, queues, logging), so that traffic doesn't pass through NAT at all."]}, {"k": "p", "x": "**Lessons learned.** Attaching serverless compute to a private network changes its outbound path completely. Always design inbound and outbound separately, and remember that fixed egress IPs come from NAT, not from the function itself."}, {"k": "tip", "kind": "Tip", "x": "Write \"egress IP requirements\" into every integration checklist. Partners frequently require allow-listing, and it shapes the network design."}]}], "q": [{"t": "What happens to an AWS Lambda function's Internet access when you attach it to private VPC subnets?", "o": ["Nothing changes", "It loses default Internet access unless the subnets route through a NAT gateway", "It gets a public IP automatically", "It can only call S3"], "a": 1, "x": "VPC-attached functions use your VPC's routing, so they need NAT or endpoints."}, {"t": "An Azure App Service has a private endpoint but still can't reach a database on a private IP. What is missing?", "o": ["Access restrictions", "Regional VNet integration for outbound traffic", "A public IP", "A service tag"], "a": 1, "x": "Private endpoints handle inbound only; outbound needs VNet integration."}, {"t": "Which Cloud Run option gives instances IPs directly in your subnet without connector VMs?", "o": ["Serverless VPC Access", "Direct VPC egress", "Private Google Access", "Cloud Interconnect"], "a": 1, "x": "Direct VPC egress places Cloud Run traffic directly on a subnet."}, {"t": "An OCI function in a private subnet can't pull its container image. What should you check first?", "o": ["The Internet gateway", "The service gateway route to Oracle services", "The DNS label", "The load balancer"], "a": 1, "x": "The container registry is an Oracle service reached through the service gateway."}, {"t": "A partner requires calls from one fixed IP. Where does that IP come from for private serverless workloads?", "o": ["The function's own address", "A NAT gateway with a reserved public IP", "The load balancer", "The DNS server"], "a": 1, "x": "Outbound traffic is translated to the NAT gateway's public IP."}], "lv": 3, "h": 5, "goal": "Connect functions, containers, app platforms and managed databases privately and securely.", "terms": ["control plane", "data plane", "inbound access", "outbound access", "VPC-attached Lambda", "Hyperplane ENI", "awsvpc", "VNet integration", "delegated subnet", "Direct VPC egress", "Serverless VPC Access", "private endpoint", "subnet group"]}, {"id": "m29", "t": "Cloud Network Performance", "res": [["AWS: EC2 instance network bandwidth", "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-network-bandwidth.html"], ["Azure: accelerated networking", "https://learn.microsoft.com/en-us/azure/virtual-network/accelerated-networking-overview"], ["Google Cloud: network bandwidth", "https://cloud.google.com/compute/docs/network-bandwidth"], ["iperf3", "https://software.es.net/iperf/"]], "sum": ["Throughput is limited by instance size, per-flow limits, TCP windows and latency, not just \"bandwidth\".", "The bandwidth-delay product tells you how much data must be in flight to fill a path.", "Use the provider's enhanced networking and place chatty components close together.", "Measure with iperf3 and the provider's network metrics before tuning anything."], "ls": [{"t": "What limits throughput in the cloud", "tag": "all", "blocks": [{"k": "p", "x": "A VM's network performance has several independent ceilings. Whichever is lowest wins."}, {"k": "ul", "x": ["**Instance bandwidth**: every provider scales network bandwidth with VM size. Small instances may get \"up to\" a burst value for short periods, then drop to a baseline.", "**Per-flow limits**: a single TCP connection often can't use all of an instance's bandwidth. For example, AWS documents a 5 Gbps limit per flow between instances outside a cluster placement group (and per flow to the Internet or through a VPN or Direct Connect connection); parallel flows go beyond it.", "**Packets per second (PPS)** and **connection tracking** limits: workloads with many small packets or huge numbers of connections hit these before bandwidth. On AWS, the ENA driver exposes counters such as `bw_in_allowance_exceeded`, `pps_allowance_exceeded` and `conntrack_allowance_exceeded`.", "**Gateways and services**: NAT gateways, VPN tunnels, firewalls and load balancers have their own throughput and connection limits.", "**Latency and TCP behaviour**: on long-distance paths, TCP windows limit how fast one connection can go."]}, {"k": "tip", "kind": "Tip", "x": "When someone says \"the network is slow\", ask: one connection or many? Same zone or far away? Through a gateway or direct? The answer points to the limit."}]}, {"t": "Bandwidth-delay product and TCP tuning", "tag": "all", "blocks": [{"k": "p", "x": "TCP can only have a limited amount of unacknowledged data \"in flight\". To fill a path, the window must be at least the **bandwidth-delay product (BDP)**:"}, {"k": "code", "t": "BDP = bandwidth × round-trip time", "x": "1 Gbps × 100 ms = 1,000,000,000 bits/s × 0.1 s = 100 Mbit ≈ 12.5 MB in flight\nWith a 64 KB window on that path: 64 KB / 0.1 s ≈ 5 Mbps maximum, however fast the link is"}, {"k": "p", "x": "Modern operating systems use **TCP window scaling** and auto-tuning, so windows grow large automatically, but limits in the OS, the application or a middlebox can still cap them."}, {"k": "p", "x": "**Congestion control** decides how quickly TCP speeds up and how it reacts to loss. **CUBIC** (the Linux default) treats loss as congestion and backs off. **BBR** models the path's bandwidth and RTT and copes better with long, slightly lossy paths, often giving much higher throughput for cross-region and Internet transfers."}, {"k": "code", "t": "Inspect and adjust TCP settings on Linux (test before using in production)", "x": "sysctl net.ipv4.tcp_congestion_control          # usually cubic\nsysctl net.ipv4.tcp_rmem net.ipv4.tcp_wmem      # min / default / max buffer sizes\nsudo sysctl -w net.core.default_qdisc=fq\nsudo sysctl -w net.ipv4.tcp_congestion_control=bbr\nss -ti dst 10.30.4.5                            # per-connection cwnd, rtt, retransmits"}, {"k": "tip", "kind": "Tip", "x": "For big transfers between regions, run several parallel streams (many tools support this, such as `aws s3 cp` with multipart uploads, `gsutil -m`, `azcopy`, `rclone --transfers`). Parallelism beats tuning."}]}, {"t": "Enhanced networking and NIC types", "tag": "all", "blocks": [{"k": "p", "x": "Cloud VMs reach high performance with hardware offload that bypasses the hypervisor (SR-IOV and dedicated network cards):"}, {"k": "ul", "x": ["**AWS**: the **Elastic Network Adapter (ENA)** on Nitro instances; **ENA Express** uses AWS's SRD protocol to raise single-flow bandwidth and reduce tail latency between supported instances in the same AZ; **EFA** (Elastic Fabric Adapter) for HPC and ML clusters.", "**Azure**: **Accelerated Networking** (SR-IOV) cuts latency and CPU use; newer VM families use the **Microsoft Azure Network Adapter (MANA)**. Enable it on supported VM sizes; most production sizes support it.", "**Google Cloud**: **gVNIC** is the recommended virtual NIC (required for higher bandwidth tiers); **Tier_1 networking** raises per-VM egress bandwidth on supported machine types.", "**OCI**: **hardware-assisted (SR-IOV)** or **paravirtualized** VNIC attachment; bandwidth scales with the shape's OCPU count; **cluster networks** with RDMA for HPC."]}, {"k": "p", "x": "Make sure the guest OS has the right drivers (current cloud images do) and that the feature is enabled on the instance or NIC."}, {"k": "tip", "kind": "Watch out", "x": "Choosing a tiny VM size for a gateway, proxy or database replica often caps its network bandwidth far below what the workload needs. Check the documented bandwidth for the size, not just CPU and memory."}]}, {"t": "Placement and latency", "tag": "all", "blocks": [{"k": "p", "x": "Physical distance sets the floor for latency, so place components that talk constantly close to each other:"}, {"k": "ul", "x": ["**Same region** for anything chatty; cross-region calls add tens of milliseconds.", "**Same zone** for the lowest latency, at the cost of resilience; many architectures keep each app tier's traffic within a zone and replicate across zones.", "**Placement groups** for tightly coupled workloads: AWS **cluster placement groups**, Azure **proximity placement groups**, Google Cloud **compact placement policies**, and OCI **cluster networks** or capacity in the same fault domain."]}, {"k": "p", "x": "Application design matters as much as the network:"}, {"k": "ul", "x": ["**Reuse connections** (HTTP keep-alive, connection pools) to avoid repeated TCP and TLS handshakes.", "**Batch** small requests; one call with 100 items beats 100 calls.", "Use **HTTP/2 or gRPC** for many concurrent requests over one connection.", "**Cache** close to the consumer."]}, {"k": "code", "t": "Why chatty designs suffer across distance", "x": "Page needs 40 sequential database queries\nSame zone (0.3 ms RTT):   40 × 0.3 ms  ≈ 12 ms\nOther region (40 ms RTT): 40 × 40 ms   ≈ 1.6 s"}, {"k": "tip", "kind": "Tip", "x": "Before moving a component to another zone or region, count how many sequential round trips it makes per user request."}]}, {"t": "Measuring performance properly", "tag": "all", "blocks": [{"k": "p", "x": "Measure before and after any change, with the right tools:"}, {"k": "ul", "x": ["**iperf3** measures raw TCP/UDP throughput between two hosts.", "**ping / mtr** measure latency and loss along a path.", "**Provider metrics**: per-instance network in/out, packets, dropped packets and allowance counters; load balancer and NAT gateway metrics (active connections, port allocation errors).", "**Application metrics**: request latency percentiles (p50, p95, p99) tell you what users feel."]}, {"k": "code", "t": "iperf3 tests", "x": "# on the server\niperf3 -s\n# on the client: 30 s single stream, then 8 parallel streams, then reverse direction\niperf3 -c 10.30.4.5 -t 30\niperf3 -c 10.30.4.5 -t 30 -P 8\niperf3 -c 10.30.4.5 -t 30 -R\n# check the ENA allowance counters on AWS\nethtool -S eth0 | grep allowance"}, {"k": "p", "x": "If one stream is slow but eight parallel streams reach the instance limit, the bottleneck is per-flow (TCP window, latency or per-flow caps), not the instance."}, {"k": "tip", "kind": "Watch out", "x": "Testing through the public Internet, across regions, or from a laptop on Wi-Fi measures that path, not your cloud network. Test from VMs in the locations that matter."}]}, {"t": "Real-world scenario: the nightly backup that never finished", "tag": "all", "blocks": [{"k": "p", "x": "**Situation.** A company copies a 4 TB database backup every night from its primary region in the Middle East to a disaster-recovery region in Europe, about 4,500 km away. Both VMs are large, with 25 Gbps of documented bandwidth. The copy uses a single `scp` stream and takes more than 14 hours, overlapping with the next business day."}, {"k": "p", "x": "**Investigation.**"}, {"k": "ol", "x": ["`ping` shows about 90 ms round-trip time between the regions.", "`iperf3` with one stream reaches about 650 Mbps; with 16 parallel streams it reaches over 9 Gbps. So the instances and network are fine; the limit is per connection.", "The BDP at 90 ms and 10 Gbps is about 112 MB, far larger than one scp connection's effective window. scp also encrypts on a single CPU core.", "Provider metrics show no drops or allowance-exceeded counters."]}, {"k": "p", "x": "**Fix.**"}, {"k": "ol", "x": ["Switch to a tool with parallel, multipart transfers (the provider's storage CLI to object storage, or rclone) with 16–32 streams.", "Enable BBR congestion control on both hosts after testing.", "Write the backup to object storage in the primary region and use the provider's cross-region replication, which runs on the provider's backbone.", "Compress before transfer to reduce data volume."]}, {"k": "p", "x": "The nightly copy dropped to about 75 minutes."}, {"k": "p", "x": "**Lessons learned.** Instance bandwidth means nothing if a single TCP stream across a long path can't fill it. Measure single versus parallel streams to find per-flow limits, and use parallelism and the provider's managed replication for bulk data."}]}], "q": [{"t": "What is the bandwidth-delay product of a 1 Gbps path with 50 ms RTT?", "o": ["50 KB", "625 KB", "About 6.25 MB", "50 MB"], "a": 2, "x": "1,000,000,000 × 0.05 = 50 Mbit ≈ 6.25 MB."}, {"t": "One iperf3 stream reaches 600 Mbps; eight parallel streams reach 8 Gbps. Where is the bottleneck?", "o": ["The instance size", "Per-flow limits such as TCP window, latency or per-flow caps", "The physical cable", "DNS"], "a": 1, "x": "The aggregate is fine, so the limit applies to each single flow."}, {"t": "Which TCP congestion control algorithm often performs better on long, slightly lossy paths?", "o": ["Reno", "CUBIC", "BBR", "Vegas"], "a": 2, "x": "BBR models bandwidth and RTT instead of treating every loss as congestion."}, {"t": "What is Azure's SR-IOV feature for higher VM network performance called?", "o": ["Elastic Network Adapter", "Accelerated Networking", "gVNIC", "Tier_1 networking"], "a": 1, "x": "Accelerated Networking bypasses the host's virtual switch for lower latency and CPU use."}, {"t": "A page makes 40 sequential database calls. What happens if the database moves to a region 40 ms away?", "o": ["Nothing noticeable", "About 40 ms slower", "About 1.6 seconds slower", "It becomes faster"], "a": 2, "x": "40 sequential round trips × 40 ms ≈ 1.6 s added latency."}], "lv": 3, "h": 5, "goal": "Measure, explain and improve throughput and latency for cloud workloads.", "terms": ["bandwidth-delay product", "TCP window", "window scaling", "congestion control", "BBR", "CUBIC", "iperf3", "packets per second", "connection tracking", "SR-IOV", "ENA", "accelerated networking", "gVNIC", "placement group", "jumbo frames"]}, {"id": "m13", "t": "AWS Networking", "res": [["Amazon VPC User Guide", "https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html"], ["AWS Transit Gateway", "https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html"], ["AWS PrivateLink", "https://docs.aws.amazon.com/vpc/latest/privatelink/what-is-privatelink.html"], ["Elastic Load Balancing", "https://docs.aws.amazon.com/elasticloadbalancing/latest/userguide/what-is-load-balancing.html"], ["AWS Direct Connect", "https://docs.aws.amazon.com/directconnect/latest/UserGuide/Welcome.html"]], "sum": ["Build one subnet per tier per AZ; route public subnets to an IGW and private ones to a NAT gateway per AZ.", "Security groups (stateful, reference each other) are the main control; NACLs are a coarse backstop.", "Use Transit Gateway or Cloud WAN once you have more than a handful of VPCs.", "Keep AWS service traffic private with gateway and interface endpoints."], "ls": [{"t": "VPC and subnets", "tag": null, "blocks": [{"k": "p", "x": "A **VPC** is a regional, isolated network. You give it a primary IPv4 CIDR (between /16 and /28) and optionally secondary CIDRs and an IPv6 /56. Inside it you create **subnets**, each in exactly one **availability zone**."}, {"k": "p", "x": "A standard production layout uses three AZs and three tiers, so nine subnets:"}, {"k": "code", "t": "Production VPC 10.10.0.0/16 across three AZs", "x": "public-a   10.10.0.0/24    public-b   10.10.1.0/24    public-c   10.10.2.0/24\napp-a      10.10.16.0/20   app-b      10.10.32.0/20   app-c      10.10.48.0/20\ndata-a     10.10.64.0/24   data-b     10.10.65.0/24   data-c     10.10.66.0/24"}, {"k": "p", "x": "Gateways and route tables make the tiers behave differently:"}, {"k": "ul", "x": ["**Internet gateway (IGW)**: one per VPC, horizontally scaled, free. Public subnets route `0.0.0.0/0 → igw-…`.", "**NAT gateway**: lives in a public subnet with an **Elastic IP**, gives private subnets outbound-only Internet access. It is zonal, so create **one per AZ** and point each private subnet's route table at the NAT gateway in its own AZ.", "**Egress-only Internet gateway**: the IPv6 equivalent of NAT (outbound only)."]}, {"k": "p", "x": "Every VPC also has a built-in DNS resolver at the VPC base address plus two (for 10.10.0.0/16 that is 10.10.0.2), and the instance metadata service at 169.254.169.254."}, {"k": "tip", "kind": "Tip", "x": "Make app subnets large (/20 or bigger). Containers on EKS with the VPC CNI and Lambda functions in a VPC consume IP addresses quickly."}]}, {"t": "Security groups vs network ACLs", "tag": null, "blocks": [{"k": "p", "x": "**Security groups (SGs)** attach to network interfaces (ENIs). They are **stateful** and contain only **allow** rules; anything not allowed is denied. Their superpower is that a rule's source can be **another security group**: \"allow 5432 from sg-app\" keeps working however many app instances exist and whatever their IPs."}, {"k": "p", "x": "**Network ACLs (NACLs)** attach to subnets. They are **stateless**, have numbered **allow and deny** rules evaluated lowest number first, and end with an implicit deny. Because they are stateless, you need rules for return traffic on ephemeral ports."}, {"k": "code", "t": "A three-tier security group design", "x": "sg-alb   inbound: TCP 443 from 0.0.0.0/0 (and ::/0)\nsg-app   inbound: TCP 8080 from sg-alb\nsg-db    inbound: TCP 5432 from sg-app\n(no inbound SSH anywhere; use Systems Manager Session Manager)"}, {"k": "p", "x": "Use security groups as your main control. Use NACLs sparingly, for coarse subnet-wide rules such as blocking a known bad range, or as a guardrail that a database subnet can never accept traffic from public subnets."}, {"k": "tip", "kind": "Watch out", "x": "The default NACL allows everything. A custom NACL starts by denying everything, including return traffic. If you add one, test both directions."}]}, {"t": "Connecting VPCs: peering, Transit Gateway and Cloud WAN", "tag": null, "blocks": [{"k": "p", "x": "**VPC peering** connects two VPCs (same or different account, same or different region) privately. It is simple and has no hourly charge, but it is **non-transitive**: if A peers with B and B with C, A cannot reach C through B. CIDRs must not overlap. Full mesh peering of 10 VPCs needs 45 connections, each with route table entries."}, {"k": "p", "x": "**AWS Transit Gateway (TGW)** is a regional, managed hub router. You attach VPCs, VPN connections, Direct Connect gateways and peering connections to other TGWs. TGW has its own **route tables**, so you can segment traffic: for example, production and development VPCs both reach shared services but not each other. It is billed per attachment-hour and per GB."}, {"k": "p", "x": "**AWS Cloud WAN** builds a global network from a central **policy**: you define segments (prod, dev, shared) and which attachments join which segment, and AWS builds the TGW-like core across regions for you."}, {"k": "code", "t": "Transit Gateway segmentation example", "x": "TGW route table \"prod\":    routes to prod VPCs + shared-services + on-prem\nTGW route table \"dev\":     routes to dev VPCs + shared-services\nTGW route table \"shared\":  routes to everything\nAttach each VPC to the table matching its environment."}, {"k": "tip", "kind": "Tip", "x": "Rough guide: peering for 2–5 VPCs, Transit Gateway for more or for hybrid hubs, Cloud WAN for multi-region networks managed as policy."}]}, {"t": "Private access to services", "tag": null, "blocks": [{"k": "p", "x": "By default, an instance in a private subnet reaching Amazon S3 or another AWS API goes out through the NAT gateway and over public endpoints. **VPC endpoints** keep that traffic inside AWS, improve security and often save NAT costs."}, {"k": "ul", "x": ["**Gateway endpoints** (S3 and DynamoDB only) add a route to the subnet route tables using a managed prefix list. They are **free**.", "**Interface endpoints** (powered by **AWS PrivateLink**) place an ENI with a private IP in your subnets for a specific service (STS, ECR, Secrets Manager, CloudWatch, and hundreds more). Private DNS makes the normal service hostname resolve to that private IP. They are billed per hour per AZ and per GB."]}, {"k": "p", "x": "**Endpoint policies** restrict what can be done through the endpoint, for example \"only these S3 buckets\", which helps prevent data exfiltration."}, {"k": "p", "x": "PrivateLink also lets you publish **your own** service: put it behind an NLB, create an **endpoint service**, and consumers in other VPCs or accounts create interface endpoints to it. Address ranges can overlap, because only the endpoint IP is exposed."}, {"k": "p", "x": "**VPC Lattice** is a newer application-networking service that connects services across VPCs and accounts at the application layer, with built-in auth policies."}, {"k": "tip", "kind": "Tip", "x": "Always add the S3 gateway endpoint to every VPC. It costs nothing and removes S3 traffic from the NAT gateway bill."}]}, {"t": "DNS with Route 53", "tag": null, "blocks": [{"k": "p", "x": "**Amazon Route 53** provides DNS in several roles:"}, {"k": "ul", "x": ["**Public hosted zones** for your Internet domains.", "**Private hosted zones** associated with one or more VPCs, for internal names like `db.prod.internal`.", "**Route 53 Resolver**: the VPC's built-in resolver. **Inbound endpoints** let on-premises DNS servers resolve your private zones; **outbound endpoints** with **forwarding rules** let VPCs resolve on-premises zones (such as `corp.example.com`).", "**Resolver DNS Firewall**: block or allow domain lookups from your VPCs."]}, {"k": "p", "x": "Routing policies decide which answer each user gets: **simple**, **weighted** (canary releases), **latency-based** (nearest region), **failover** (with health checks), **geolocation**, **geoproximity**, **multivalue** and **IP-based**."}, {"k": "p", "x": "**Alias records** point a name (including the zone apex) at AWS resources such as an ALB, CloudFront distribution or S3 website, with no extra query cost."}, {"k": "tip", "kind": "In the cloud", "x": "Resolver endpoints are the standard way to make DNS work across hybrid and multi-account networks; share forwarding rules to other accounts with AWS RAM."}]}, {"t": "Load balancing and edge services", "tag": null, "blocks": [{"k": "p", "x": "**Elastic Load Balancing** offers three types:"}, {"k": "ul", "x": ["**Application Load Balancer (ALB)**: L7 HTTP/HTTPS/gRPC. Host, path, header and query routing; redirects; authentication with OIDC or Amazon Cognito; integrates with **AWS WAF**. Targets can be instances, IPs or Lambda functions.", "**Network Load Balancer (NLB)**: L4 TCP/UDP/TLS. Very high throughput, a static IP per AZ (or your Elastic IPs), preserves client IP, can sit in front of PrivateLink services.", "**Gateway Load Balancer (GWLB)**: inserts third-party virtual appliances (firewalls, IDS) transparently using GENEVE encapsulation, with **GWLB endpoints** as route targets."]}, {"k": "p", "x": "At the edge: **Amazon CloudFront** (CDN with edge TLS, caching and WAF), **AWS Global Accelerator** (two static anycast IPs routing users over the AWS backbone to the closest healthy regional endpoint), **AWS Shield** (DDoS protection; Advanced adds response team support and cost protection)."}, {"k": "tip", "kind": "Tip", "x": "Put internet-facing ALBs in public subnets and their targets in private subnets. Targets need no public IPs; the ALB reaches them over private addresses."}]}, {"t": "Hybrid connectivity on AWS", "tag": null, "blocks": [{"k": "p", "x": "**AWS Site-to-Site VPN** creates two IPsec tunnels (in different AZs) from a **virtual private gateway** or **Transit Gateway** to your customer gateway device. Each tunnel supports up to 1.25 Gbps; with Transit Gateway and ECMP you can spread traffic over many tunnels. Use BGP for automatic failover."}, {"k": "p", "x": "**AWS Direct Connect (DX)** gives a private, dedicated connection from your router at a DX location to AWS:"}, {"k": "ul", "x": ["**Dedicated connections** of 1, 10, 100 or 400 Gbps, or **hosted connections** from a partner (from 50 Mbps upwards).", "**Virtual interfaces (VIFs)**: **private VIF** to a VPC (via virtual private gateway or Direct Connect gateway), **transit VIF** to Transit Gateways via a Direct Connect gateway, **public VIF** to AWS public services.", "A **Direct Connect gateway** is a global object that lets one connection reach VPCs and TGWs in many regions.", "**MACsec** encryption is available on many dedicated connections."]}, {"k": "p", "x": "For production, AWS recommends **maximum resiliency**: connections at two DX locations, two devices at each. A common budget design is one DX connection plus Site-to-Site VPN as backup."}, {"k": "tip", "kind": "Watch out", "x": "A private VIF accepts a limited number of prefixes from you (100 by default). Advertising more drops the BGP session; summarise your on-premises routes."}]}, {"t": "Operating and troubleshooting AWS networks", "tag": null, "blocks": [{"k": "p", "x": "AWS gives you several tools that save hours:"}, {"k": "ul", "x": ["**VPC Flow Logs**: metadata for every accepted and rejected flow at VPC, subnet or ENI level, sent to CloudWatch Logs, S3 or Firehose. A `REJECT` tells you a security group or NACL dropped the traffic.", "**Reachability Analyzer**: picks a source and destination and analyses route tables, SGs, NACLs and gateways, then tells you exactly which component blocks the path, without sending packets.", "**Network Access Analyzer**: finds unintended access, such as \"any path from the Internet to a database subnet\".", "**Traffic Mirroring**: copies packets from an ENI to a monitoring appliance for deep inspection.", "**AWS Network Firewall**: managed stateful firewall with Suricata-compatible rules and domain filtering, deployed into dedicated subnets."]}, {"k": "code", "t": "A flow log record, decoded", "x": "2 123456789012 eni-0a1b2c 10.10.16.25 10.10.64.10 49152 5432 6 10 840 1700000000 1700000060 REJECT OK\n          (version account interface src dst srcport dstport proto packets bytes start end action status)\n→ App server 10.10.16.25 tried PostgreSQL on 10.10.64.10 and was REJECTED: check sg-db and the data subnet NACL."}, {"k": "tip", "kind": "Tip", "x": "Run Reachability Analyzer before opening a support case. It names the exact security group, NACL or route that blocks traffic."}]}, {"t": "Deep dive: centralised egress and inspection on AWS", "tag": null, "blocks": [{"k": "p", "x": "As AWS estates grow to dozens of VPCs, giving each VPC its own NAT gateways and firewalls becomes expensive and inconsistent. The standard alternative routes traffic through shared **egress** and **inspection** VPCs attached to **Transit Gateway**."}, {"k": "p", "x": "**Centralised egress.** Spoke VPCs have no Internet gateway or NAT gateway. Their route tables send `0.0.0.0/0` to the Transit Gateway. The TGW sends it to an **egress VPC** with NAT gateways in each AZ, which then route to an Internet gateway. Return traffic follows the same path back. This saves NAT costs, gives one set of egress IPs to allow-list, and one place to filter."}, {"k": "p", "x": "**Centralised inspection.** An **inspection VPC** holds **AWS Network Firewall** endpoints (or third-party appliances behind a **Gateway Load Balancer**). TGW route tables send spoke-to-spoke, spoke-to-on-premises and spoke-to-Internet traffic through it."}, {"k": "code", "t": "Traffic path: spoke VPC → Internet with inspection", "x": "spoke subnet RT:        0.0.0.0/0 → TGW\nTGW \"spokes\" RT:        0.0.0.0/0 → inspection VPC attachment\ninspection VPC (TGW subnet RT): 0.0.0.0/0 → Network Firewall endpoint (same AZ)\nfirewall subnet RT:     0.0.0.0/0 → NAT gateway (or → TGW → egress VPC)\nreturn traffic:         symmetric path back through the same firewall endpoint"}, {"k": "p", "x": "Two settings make or break this design:"}, {"k": "ul", "x": ["**Appliance mode** on the inspection VPC's TGW attachment keeps both directions of each flow in the same AZ, so stateful firewalls see the whole connection.", "**Per-AZ routing**: each AZ's subnets route to the firewall endpoint in the same AZ, avoiding cross-AZ charges and AZ-failure coupling."]}, {"k": "tip", "kind": "Tip", "x": "AWS also supports a **distributed** model (a firewall endpoint inside each VPC) and a **combined** model. Centralised suits shared policy and many small VPCs; distributed suits very high-throughput VPCs that shouldn't hairpin through a hub."}]}, {"t": "Real-world scenario: the AZ outage that took everything offline", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** During a partial outage of one availability zone in its primary region, a company's entire application lost Internet access, even though two of three zones were healthy and the load balancer kept serving users."}, {"k": "p", "x": "**Investigation.** The application's private subnets in all three AZs routed `0.0.0.0/0` to a single NAT gateway, created in AZ-a when the VPC was built \"temporarily\". When AZ-a degraded, every instance lost outbound access: payment calls, package downloads and calls to third-party APIs all failed. The app's inbound path was fine, so the failure looked like an application bug at first."}, {"k": "p", "x": "**Fix.**"}, {"k": "ol", "x": ["Create a NAT gateway in each AZ's public subnet.", "Give each AZ's private subnets their own route table pointing to the NAT gateway **in the same AZ**.", "Review every other zonal dependency: interface endpoints enabled in all AZs, Network Firewall endpoints per AZ, databases with Multi-AZ, instances spread across AZs.", "Add a game-day exercise: simulate an AZ failure (for example with AWS Fault Injection Service) twice a year."]}, {"k": "p", "x": "**Lessons learned.** Multi-AZ isn't just about where instances run. Every component in the path, including NAT, endpoints and firewalls, must be zonal and independent, or one zone can take down all three."}]}], "q": [{"t": "Which AWS control is stateless?", "o": ["Security group", "Network ACL", "PrivateLink", "Route 53 Resolver"], "a": 1, "x": "NACLs need explicit rules for return traffic."}, {"t": "VPC A peers with B and B peers with C. Can A reach C through B?", "o": ["Yes", "No", "Only with NAT", "Only over IPv6"], "a": 1, "x": "Peering is non-transitive. Use Transit Gateway or a direct peering."}, {"t": "Why should production VPCs have one NAT gateway per availability zone?", "o": ["NAT gateways are free", "A NAT gateway is zonal; if its AZ fails, private subnets in other AZs lose Internet access", "AWS requires it", "It doubles bandwidth for each instance"], "a": 1, "x": "Keep each AZ's egress independent so one AZ failure doesn't spread."}, {"t": "Which endpoint type is free and supports only S3 and DynamoDB?", "o": ["Interface endpoint", "Gateway endpoint", "Gateway Load Balancer endpoint", "Resolver endpoint"], "a": 1, "x": "Gateway endpoints add routes for S3 and DynamoDB at no charge."}, {"t": "Which tool tells you which security group or route blocks traffic between two resources, without sending packets?", "o": ["VPC Flow Logs", "Traffic Mirroring", "Reachability Analyzer", "CloudTrail"], "a": 2, "x": "Reachability Analyzer analyses configuration and names the blocking component."}, {"t": "Why is appliance mode enabled on the inspection VPC's Transit Gateway attachment?", "o": ["To encrypt traffic", "To keep both directions of each flow on the same AZ and firewall endpoint", "To enable IPv6", "To reduce costs"], "a": 1, "x": "Stateful inspection needs symmetric paths; appliance mode provides them."}, {"t": "All private subnets in three AZs used one NAT gateway in AZ-a. What happens if AZ-a fails?", "o": ["Only AZ-a loses Internet access", "All three AZs lose outbound Internet access", "Traffic automatically fails over to a NAT gateway in AZ-b", "Nothing; NAT gateways are regional"], "a": 1, "x": "The single zonal NAT gateway becomes a shared point of failure."}], "lv": 4, "h": 9, "p": "aws", "goal": "Design and build production VPC networks on AWS.", "terms": ["VPC", "subnet", "Internet gateway", "NAT gateway", "Elastic IP", "security group", "network ACL", "VPC peering", "Transit Gateway", "Cloud WAN", "gateway endpoint", "PrivateLink", "Route 53", "ALB", "NLB", "Direct Connect"]}, {"id": "m14", "t": "Azure Networking", "res": [["Azure Virtual Network documentation", "https://learn.microsoft.com/en-us/azure/virtual-network/"], ["Azure hub-spoke topology", "https://learn.microsoft.com/en-us/azure/architecture/networking/architecture/hub-spoke"], ["Azure Private Link and Private Endpoint", "https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview"], ["Azure ExpressRoute", "https://learn.microsoft.com/en-us/azure/expressroute/expressroute-introduction"], ["Azure Network Watcher", "https://learn.microsoft.com/en-us/azure/network-watcher/network-watcher-overview"]], "sum": ["VNets are regional, subnets are zone-spanning; several services need their own named subnet.", "NSGs with service tags and ASGs are the core filter; UDRs force traffic through a firewall.", "Hub-and-spoke (or Virtual WAN) is the standard enterprise topology.", "Private Endpoints plus Private DNS zones keep PaaS traffic off the Internet."], "ls": [{"t": "VNets and subnets", "tag": null, "blocks": [{"k": "p", "x": "An Azure **virtual network (VNet)** is regional and has one or more address spaces. **Subnets** span every availability zone in the region; you pick the zone per VM or per zone-redundant service."}, {"k": "p", "x": "Several Azure services require a **dedicated subnet with a fixed name** and minimum size:"}, {"k": "ul", "x": ["**GatewaySubnet** for VPN and ExpressRoute gateways (/27 or larger recommended)", "**AzureFirewallSubnet** for Azure Firewall (/26)", "**AzureBastionSubnet** for Azure Bastion (/26 or larger)", "**RouteServerSubnet** for Azure Route Server (/26 or larger)"]}, {"k": "p", "x": "Other services use **subnet delegation**, which hands a subnet to a PaaS service (such as Azure SQL Managed Instance, App Service VNet integration or Azure Container Instances) so it can create its own resources there."}, {"k": "code", "t": "Create a VNet with app and data subnets (Azure CLI)", "x": "az network vnet create -g rg-net-prod -n vnet-prod-uaen \\\n  --address-prefixes 10.20.0.0/16 \\\n  --subnet-name snet-app --subnet-prefixes 10.20.1.0/24\naz network vnet subnet create -g rg-net-prod --vnet-name vnet-prod-uaen \\\n  -n snet-data --address-prefixes 10.20.2.0/24"}, {"k": "tip", "kind": "Watch out", "x": "Azure reserves 5 addresses per subnet, and you cannot resize a subnet that has resources in it. Size dedicated subnets generously from the start."}]}, {"t": "NSGs, ASGs and service tags", "tag": null, "blocks": [{"k": "p", "x": "A **network security group (NSG)** is a stateful list of allow and deny rules, evaluated by **priority** (100–4096, lowest number first, first match wins). Attach NSGs to subnets, NICs or both; traffic must pass both if both are present."}, {"k": "p", "x": "Every NSG has **default rules** at priorities 65000+: allow traffic within the VNet (`VirtualNetwork` tag), allow Azure Load Balancer probes, allow all outbound to the Internet, and deny everything else inbound."}, {"k": "p", "x": "Two features make NSG rules much cleaner:"}, {"k": "ul", "x": ["**Service tags** are Microsoft-maintained groups of IP ranges, such as `Internet`, `VirtualNetwork`, `AzureLoadBalancer`, `Storage`, `Sql.UAENorth` or `AzureCloud`. They update automatically.", "**Application security groups (ASGs)** group NICs by role. A rule like \"allow 1433 from asg-app to asg-db\" follows VMs regardless of their IPs."]}, {"k": "code", "t": "NSG rules for a data subnet", "x": "Priority 100  Allow  TCP 1433  from ASG asg-app   to ASG asg-db\nPriority 4000 Deny   Any       from VirtualNetwork to Any\n(defaults below: AllowVnetInBound would otherwise allow all VNet traffic)"}, {"k": "tip", "kind": "Tip", "x": "The default \"AllowVnetInBound\" rule allows all traffic inside the VNet, including from peered VNets. Add an explicit deny above it on sensitive subnets."}]}, {"t": "Routing, UDRs and Route Server", "tag": null, "blocks": [{"k": "p", "x": "Azure creates **system routes** automatically: local VNet traffic, peered VNets, gateway-learned routes and a default route to the Internet."}, {"k": "p", "x": "**User-defined routes (UDRs)** in **route tables** attached to subnets override them. Each route has a next hop type: **Virtual appliance** (a firewall's private IP), **Virtual network gateway**, **Internet**, **Virtual network** or **None** (drop)."}, {"k": "p", "x": "The most common UDR sends everything leaving a spoke subnet through the hub firewall:"}, {"k": "code", "t": "Force tunnelling a spoke through Azure Firewall", "x": "Route table rt-spoke-app (attached to snet-app)\n  0.0.0.0/0     → Virtual appliance 10.0.1.4   (Azure Firewall private IP)\n  10.0.0.0/8    → Virtual appliance 10.0.1.4   (east-west inspection)\nOption on the route table: disable BGP route propagation if on-prem routes should also go via the firewall"}, {"k": "p", "x": "**Azure Route Server** lets network virtual appliances (third-party firewalls, SD-WAN routers) exchange routes with the VNet using **BGP**, so you don't have to maintain UDRs by hand."}, {"k": "tip", "kind": "Tip", "x": "In the portal, a VM's NIC shows **Effective routes** and **Effective security rules**. These are the first things to check when traffic goes the wrong way."}]}, {"t": "Hub-and-spoke, Virtual WAN and Virtual Network Manager", "tag": null, "blocks": [{"k": "p", "x": "**VNet peering** connects VNets in the same region or across regions (global peering) over Microsoft's backbone with low latency. It is **non-transitive**: two spokes peered to the same hub cannot talk to each other unless traffic is routed through something in the hub (a firewall or NVA) with UDRs."}, {"k": "p", "x": "The **hub-and-spoke** pattern puts shared services in a **hub VNet**: Azure Firewall, VPN/ExpressRoute gateways, Bastion and DNS resolvers. Each workload gets a **spoke VNet** peered to the hub. Peering options **Allow gateway transit** (on the hub) and **Use remote gateways** (on the spoke) let spokes use the hub's VPN/ExpressRoute gateway."}, {"k": "p", "x": "**Azure Virtual WAN** is a Microsoft-managed hub: you deploy **virtual hubs** per region, connect VNets, VPN sites, ExpressRoute and remote users, and the hubs route between all of them automatically. A **secured virtual hub** includes Azure Firewall and routing intent to inspect traffic."}, {"k": "p", "x": "**Azure Virtual Network Manager (AVNM)** manages connectivity and security at scale: create hub-and-spoke or mesh topologies across many VNets and subscriptions, and apply **security admin rules** that override NSGs (for example, \"always deny RDP from the Internet\")."}, {"k": "tip", "kind": "Tip", "x": "Choose self-managed hub-and-spoke when you need full control or third-party appliances; choose Virtual WAN when you have many branches and regions and want Microsoft to manage the routing."}]}, {"t": "Private Endpoints and Private DNS", "tag": null, "blocks": [{"k": "p", "x": "Azure PaaS services (Storage, SQL Database, Key Vault, Cosmos DB and many more) have public endpoints by default. Two ways keep traffic private:"}, {"k": "ul", "x": ["**Service endpoints**: extend your VNet identity to the service over the Azure backbone; the service's firewall can then allow only your subnet. The service still uses its public IP.", "**Private Endpoints** (Azure Private Link): a NIC with a **private IP in your subnet** that maps to one specific resource (one storage account, one SQL server). You can then disable public access entirely. This is the recommended approach."]}, {"k": "p", "x": "Private Endpoints need DNS to work: the public name `mystorage.blob.core.windows.net` must resolve to the private IP. Azure does this with a CNAME to `mystorage.privatelink.blob.core.windows.net` and a **Private DNS zone** `privatelink.blob.core.windows.net` linked to your VNets."}, {"k": "p", "x": "For hybrid DNS, **Azure DNS Private Resolver** provides an **inbound endpoint** (on-premises DNS forwards Azure zones to it) and an **outbound endpoint** with forwarding rulesets (Azure resolves on-premises zones)."}, {"k": "tip", "kind": "Watch out", "x": "The most common Private Endpoint problem is DNS: on-premises clients still resolve the public IP. Forward `privatelink.*` zones (or the service zones) to the Private Resolver inbound endpoint."}]}, {"t": "Load balancing and edge services", "tag": null, "blocks": [{"k": "p", "x": "Azure has four main traffic services:"}, {"k": "ul", "x": ["**Azure Load Balancer** (Standard SKU): regional L4, TCP/UDP, zone-redundant, internal or public. Also used for outbound rules.", "**Application Gateway v2**: regional L7 reverse proxy with path and host routing, TLS termination, autoscaling and **Web Application Firewall** (OWASP rule sets, bot protection).", "**Azure Front Door** (Standard/Premium): global L7 entry point on Microsoft's edge, with CDN caching, WAF, and Private Link to origins (Premium).", "**Traffic Manager**: DNS-based global routing (priority, weighted, performance, geographic)."]}, {"k": "p", "x": "Protection: **Azure DDoS Protection** (network-level, per VNet) and **Azure Firewall** in three SKUs: Basic, Standard (FQDN filtering, threat intelligence) and Premium (TLS inspection, IDPS, URL filtering)."}, {"k": "tip", "kind": "Tip", "x": "A typical global web app: Front Door (WAF) → Application Gateway or AKS ingress in two regions → private backends. For a single region: Application Gateway with WAF in front of private backends."}]}, {"t": "Hybrid connectivity on Azure", "tag": null, "blocks": [{"k": "p", "x": "**VPN Gateway** provides site-to-site IPsec (IKEv1/IKEv2), point-to-site for users, and VNet-to-VNet tunnels. SKUs (VpnGw1–5 and their zone-redundant **AZ** variants) set throughput and tunnel counts. Deploy **active-active** with BGP for resilience."}, {"k": "p", "x": "**ExpressRoute** provides private connectivity through a connectivity provider or directly (**ExpressRoute Direct**, 10 or 100 Gbps ports):"}, {"k": "ul", "x": ["An **ExpressRoute circuit** has two connections for redundancy.", "**Private peering** reaches your VNets; **Microsoft peering** reaches Microsoft 365 and Azure public services.", "**ExpressRoute Global Reach** links your on-premises sites to each other through Microsoft's backbone.", "**FastPath** sends traffic directly to VMs, bypassing the gateway, for higher performance.", "Premium add-on extends reach across geopolitical regions and raises route limits."]}, {"k": "code", "t": "Typical resilient hybrid design", "x": "Two ExpressRoute circuits in different peering locations\n  → zone-redundant ExpressRoute gateway (ErGw*AZ) in the hub\nSite-to-Site VPN (active-active, BGP) as backup over the Internet\nBGP: on-prem advertises summaries; prefer ExpressRoute by default"}, {"k": "tip", "kind": "Watch out", "x": "ExpressRoute is not encrypted by default. Use MACsec on ExpressRoute Direct, or run IPsec over private peering when encryption is required."}]}, {"t": "Operating and troubleshooting Azure networks", "tag": null, "blocks": [{"k": "p", "x": "**Azure Network Watcher** is the toolbox:"}, {"k": "ul", "x": ["**IP flow verify**: is a specific packet to or from a VM allowed, and by which NSG rule?", "**Next hop**: where would traffic to a given IP go, and which route table decides
