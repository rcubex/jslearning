<script>
(function(){
  var gate=document.getElementById('gate'); if(!gate) return;
  var card=document.getElementById('gateCard'), msg=document.getElementById('gateMsg');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* live clock */
  function tick(){var d=new Date();document.getElementById('lkTime').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false});document.getElementById('lkDate').textContent=d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});}
  tick(); setInterval(tick,15000);

  /* wallpaper: a new scene on every refresh, logout or timeout, and every 30 minutes while the login page is open */
  var wallsEl=document.getElementById('lkWalls'), wallIdx=-1, wallAt=0;
  function pickWall(n){ var last=-1; try{ last=parseInt(localStorage.getItem('p2c-wall-last'),10); }catch(e){} if(isNaN(last)) last=wallIdx;
    if(n<2) return 0; var i; do{ i=Math.floor(Math.random()*n); }while(i===last||i===wallIdx); return i; }
  function applyWall(){
    var W=window.LK_WALLS; if(!W||!W.length||!wallsEl) return;
    var i=pickWall(W.length), first=wallIdx===-1; wallIdx=i; wallAt=Date.now(); var w=W[i];
    try{ localStorage.setItem('p2c-wall-last',String(i)); }catch(e){}
    gate.style.setProperty('--lk-ink',w.i); gate.style.setProperty('--lk-sub',w.u); gate.style.setProperty('--lk-card',w.c);
    gate.setAttribute('data-wall',w.n);
    var layer=document.createElement('div'); layer.className='lk-layer';
    layer.innerHTML='<svg viewBox="0 0 1333 760" preserveAspectRatio="xMidYMid slice" focusable="false">'+w.s+'</svg>';
