 separate accounts/subscriptions/projects, separate networks per environment, separate subnets per tier, security groups per workload.", "**Inspection**: managed firewalls for egress and east-west traffic.", "**Identity**: MFA, least privilege, no long-lived keys, identity-aware admin access.", "**Data**: private endpoints for managed services, encryption in transit and at rest.", "**Detection**: flow logs, firewall logs, DNS logs, threat detection services, SIEM."]}, {"k": "tip", "kind": "Tip", "x": "For each layer, write down which service you use in each cloud. Gaps in the table are your next priorities."}]}, {"t": "Edge protection", "tag": "all", "blocks": [{"k": "p", "x": "Every public endpoint should sit behind DDoS protection and a web application firewall."}, {"k": "ul", "x": ["**AWS**: **AWS Shield** Standard (automatic, free) and Advanced (paid, with the Shield Response Team and cost protection); **AWS WAF** on CloudFront, ALB, API Gateway and others.", "**Azure**: **Azure DDoS Protection** (network or IP protection plans); **Azure WAF** on Application Gateway and Front Door.", "**Google Cloud**: **Cloud Armor** security policies on external load balancers: WAF rules, rate limiting, geo and IP rules, Adaptive Protection that learns normal traffic, and bot management.", "**OCI**: built-in DDoS protection at the edge; **OCI WAF** on load balancers or as an edge policy."]}, {"k": "p", "x": "A good WAF policy starts with the provider's managed rule sets (OWASP Top 10 protections such as SQL injection and cross-site scripting), adds rate limits per client IP, and blocks countries or IP lists you never expect traffic from. Run new rules in **count / detection mode** first to avoid blocking real users."}, {"k": "tip", "kind": "Watch out", "x": "A WAF in front of a load balancer does nothing if the backend also has a public IP that attackers can hit directly. Lock backends so they only accept traffic from the load balancer."}]}, {"t": "Central inspection with managed firewalls", "tag": "all", "blocks": [{"k": "p", "x": "Security groups decide *who* may connect; a firewall can also inspect *what* is being sent. Each cloud has a managed next-generation firewall:"}, {"k": "ul", "x": ["**AWS Network Firewall**: stateful rules, Suricata-compatible IPS signatures, domain allow and deny lists, TLS inspection. Deployed in dedicated subnets, often in an inspection VPC behind Transit Gateway.", "**Azure Firewall**: Standard (FQDN filtering, threat intelligence) and Premium (TLS inspection, IDPS, URL filtering, web categories). Usually in the hub VNet with UDRs from spokes.", "**Google Cloud NGFW**: distributed firewall policies; the Enterprise tier adds IPS and TLS inspection through firewall endpoints.", "**OCI Network Firewall**: managed NGFW based on Palo Alto Networks technology with URL filtering, IPS and TLS inspection."]}, {"k": "p", "x": "Inspect three directions:"}, {"k": "ul", "x": ["**North-south inbound**: Internet → app (usually WAF plus load balancer is enough for HTTP)", "**North-south outbound (egress)**: app → Internet. Allow only required domains; this blocks malware call-backs and data exfiltration", "**East-west**: between VPCs/VNets, environments and tiers"]}, {"k": "tip", "kind": "Tip", "x": "Egress filtering is one of the highest-value controls. Most servers only need to reach a handful of domains (OS updates, a payment API). Allow those, deny the rest, and log the denials."}]}, {"t": "Private by default", "tag": "all", "blocks": [{"k": "p", "x": "Reduce what is reachable at all."}, {"k": "ul", "x": ["**No public IPs** on VMs, databases or containers. Enforce it with policy (AWS SCPs, Azure Policy, Google organization policy, OCI security zones).", "**Private endpoints** for managed services: AWS interface and gateway endpoints, Azure Private Endpoints, Google Private Service Connect and Private Google Access, OCI service gateway and private endpoints. Disable public network access on the services themselves.", "**Managed administrative access** instead of open SSH/RDP:", "AWS **Systems Manager Session Manager** (no inbound ports at all) or EC2 Instance Connect Endpoint", "**Azure Bastion** (browser or native client, through the portal)", "Google Cloud **IAP TCP forwarding** (`gcloud compute ssh --tunnel-through-iap`)", "**OCI Bastion** (time-limited sessions)"]}, {"k": "code", "t": "SSH to a private Google Cloud VM through IAP", "x": "# Firewall: allow tcp:22 only from IAP's range 35.235.240.0/20\ngcloud compute ssh app-1 --zone=me-central1-a --tunnel-through-iap"}, {"k": "tip", "kind": "Tip", "x": "Every one of these logs who connected and when, which an open SSH port never does well."}]}, {"t": "Flow logs and detection", "tag": "all", "blocks": [{"k": "p", "x": "You cannot defend what you cannot see. Turn on logging everywhere and send it to one place."}, {"k": "ul", "x": ["**Flow logs**: AWS VPC Flow Logs, Azure VNet flow logs, Google Cloud VPC Flow Logs, OCI VCN flow logs.", "**Firewall and WAF logs**: every allow and deny with the rule that matched.", "**DNS query logs**: Route 53 Resolver query logs, Azure DNS (via Private Resolver and Azure Firewall DNS proxy logs), Cloud DNS logging, OCI DNS logs. DNS logs often reveal malware first.", "**Threat detection**: Amazon GuardDuty, Microsoft Defender for Cloud, Google Security Command Center, OCI Cloud Guard. These analyse logs for suspicious behaviour such as crypto-mining, port scans or calls to known malicious IPs.", "**Posture management (CSPM)**: continuously checks for misconfigurations such as open security groups or public buckets."]}, {"k": "p", "x": "Send everything to a **SIEM** (Microsoft Sentinel, Google Security Operations, Splunk and others) and write alerts for what matters: rejected traffic to databases, outbound traffic to new countries, changes to security groups or route tables."}, {"k": "tip", "kind": "Watch out", "x": "Logs cost money to store. Keep high-volume flow logs for a shorter period or sample them, and keep security-relevant logs longer."}]}, {"t": "Security checklist for a cloud network", "tag": "all", "blocks": [{"k": "p", "x": "Use this checklist for any new environment, in any cloud:"}, {"k": "ol", "x": ["No resource except load balancers, NAT and VPN gateways has a public IP.", "No security rule allows SSH (22) or RDP (3389) from 0.0.0.0/0 or ::/0.", "Databases accept connections only from the application tier.", "Managed services use private endpoints with public access disabled.", "Public endpoints sit behind WAF and DDoS protection.", "Egress is filtered through a firewall with a domain allow list.", "Production and non-production are separated at the account/subscription/project level.", "Flow logs, firewall logs and DNS logs are enabled and centralised.", "Network changes are made through reviewed infrastructure as code.", "Guardrail policies prevent the above from being undone."]}, {"k": "tip", "kind": "Tip", "x": "Benchmarks such as the CIS Foundations Benchmarks for AWS, Azure, Google Cloud and OCI turn these principles into hundreds of checkable rules; posture management tools can scan for them automatically."}]}, {"t": "Real-world scenario: data exfiltration through DNS", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** A threat detection service raises an alert: a server in a private subnet is making thousands of DNS queries per hour for random-looking subdomains of an unknown domain, like `a9f3k2.d8x.exfil-example.net`. The server has no Internet access except DNS."}, {"k": "p", "x": "**Analysis.** This is **DNS tunnelling**: malware encodes stolen data in DNS query names, which travel through the cloud's resolver to the attacker's authoritative server. Because \"DNS is always allowed\", it bypassed egress firewall rules."}, {"k": "p", "x": "**Response.**"}, {"k": "ol", "x": ["Isolate the server (move it to a quarantine security group with no outbound access) and capture its disk for forensics.", "Block the domain with **DNS firewall** rules (Route 53 Resolver DNS Firewall, Azure Firewall DNS proxy with FQDN filtering or DNS security policies, Cloud DNS response policies, OCI DNS policies or a security appliance).", "Hunt for the same pattern on other hosts using **DNS query logs**."]}, {"k": "p", "x": "**Prevention.**"}, {"k": "ul", "x": ["Allow-list domains that servers may resolve where practical; block newly registered and known-malicious domains.", "Alert on high query volumes, long random subdomains and unusual TXT queries.", "Treat DNS as an egress channel in your security design."]}, {"k": "p", "x": "**Lessons learned.** Egress filtering must include DNS. Query logs are one of the best early warning signals in the cloud."}]}], "q": [{"t": "What is the managed way to SSH into a private Google Cloud VM with no public IP?", "o": ["Cloud NAT", "IAP TCP forwarding", "Cloud Armor", "Private Service Connect"], "a": 1, "x": "Identity-Aware Proxy tunnels SSH after checking identity."}, {"t": "Where should a WAF sit?", "o": ["Behind the database", "In front of public web endpoints", "Inside each VM", "On the DNS server"], "a": 1, "x": "A WAF inspects HTTP requests before they reach your app."}, {"t": "Why is egress filtering valuable?", "o": ["It speeds up downloads", "It blocks malware call-backs and data exfiltration to unapproved destinations", "It removes the need for a WAF", "It is required for NAT to work"], "a": 1, "x": "Most servers need only a few destinations; denying the rest limits damage after a compromise."}, {"t": "Which AWS service lets you reach an instance's shell with no inbound ports open?", "o": ["Elastic IP", "Systems Manager Session Manager", "Network ACL", "Route 53"], "a": 1, "x": "Session Manager connects through the SSM agent's outbound connection, with IAM authentication and logging."}, {"t": "New WAF rules should first be deployed in which mode?", "o": ["Block mode", "Count or detection mode", "Disabled", "Bypass mode"], "a": 1, "x": "Observe what the rule would block before enforcing, to avoid blocking real users."}, {"t": "Why did DNS tunnelling bypass the egress firewall in the scenario?", "o": ["The firewall was off", "DNS was allowed for all servers and passed through the cloud resolver to the attacker's server", "The server had a public IP", "TLS hid the traffic"], "a": 1, "x": "Data hidden in DNS queries reaches the attacker's authoritative server via normal resolution."}], "lv": 5, "h": 7, "goal": "Build defense in depth with each provider’s native controls.", "terms": ["WAF", "DDoS", "NGFW", "IDPS", "TLS inspection", "egress filtering", "bastion", "private endpoint", "flow logs", "SIEM", "CSPM", "microsegmentation"]}, {"id": "m20", "t": "Infrastructure as Code", "res": [["Terraform documentation", "https://developer.hashicorp.com/terraform/docs"], ["Terraform AWS provider", "https://registry.terraform.io/providers/hashicorp/aws/latest/docs"], ["Azure Bicep documentation", "https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/overview"], ["OCI Resource Manager", "https://docs.oracle.com/en-us/iaas/Content/ResourceManager/Concepts/resourcemanager.htm"], ["Checkov", "https://www.checkov.io/"]], "sum": ["Networks built in code are reviewable, repeatable and recoverable.", "Terraform's plan shows exactly what will change; always read it.", "Keep state remote, locked and separated per environment.", "Check every change automatically with policy as code before it reaches production."], "ls": [{"t": "Why infrastructure as code", "tag": "all", "blocks": [{"k": "p", "x": "Clicking through a console is fine for learning, but it fails for real networks: nobody can review the change, it cannot be repeated exactly in another region, and after a few months nobody knows why a rule exists."}, {"k": "p", "x": "**Infrastructure as code (IaC)** describes the desired network in text files kept in Git. Benefits:"}, {"k": "ul", "x": ["**Review**: every change is a pull request someone checks before it is applied", "**Repeatability**: the same code builds identical dev, test and prod networks, or a new region", "**History**: Git shows who changed which rule, when and why", "**Recovery**: if something is deleted, the code rebuilds it", "**Drift detection**: the tool reports when someone changed things by hand"]}, {"k": "tip", "kind": "Tip", "x": "Treat the console as read-only for production networks. If a change isn't in code, it shouldn't exist."}]}, {"t": "Terraform across clouds", "tag": "all", "blocks": [{"k": "p", "x": "**Terraform** (and its open-source fork **OpenTofu**) uses one language, **HCL**, for all four clouds through **providers**: `hashicorp/aws`, `hashicorp/azurerm`, `hashicorp/google` and `oracle/oci`."}, {"k": "p", "x": "The workflow is always the same: `terraform init` (download providers), `terraform plan` (show the changes), `terraform apply` (make them), and `terraform destroy` (remove everything)."}, {"k": "code", "t": "A minimal AWS VPC with Terraform", "x": "terraform {\n  required_providers { aws = { source = \"hashicorp/aws\", version = \"~> 5.0\" } }\n}\nprovider \"aws\" { region = \"me-central-1\" }\n\nresource \"aws_vpc\" \"main\" {\n  cidr_block           = \"10.32.0.0/16\"\n  enable_dns_hostnames = true\n  tags = { Name = \"vpc-prod\" }\n}\n\nresource \"aws_subnet\" \"app_a\" {\n  vpc_id            = aws_vpc.main.id\n  cidr_block        = \"10.32.16.0/20\"\n  availability_zone = \"me-central-1a\"\n  tags = { Name = \"app-a\" }\n}"}, {"k": "p", "x": "Key concepts: **resources** (things to create), **data sources** (read existing things), **variables** and **outputs**, and **modules** (reusable packages, such as \"a standard three-tier network\"). Use well-maintained community modules (for example `terraform-aws-modules/vpc/aws`) or write your own organisation-standard modules."}, {"k": "tip", "kind": "Tip", "x": "Build one module per cloud with the same inputs (name, CIDR, zones, tiers). Teams then request a network the same way regardless of provider."}]}, {"t": "Native tools", "tag": "all", "blocks": [{"k": "p", "x": "Each provider also has its own IaC option:"}, {"k": "ul", "x": ["**AWS CloudFormation** (YAML/JSON templates) and the **AWS CDK** (write infrastructure in TypeScript, Python, Java and others, compiled to CloudFormation).", "**Azure Bicep**: a concise language compiled to ARM templates, with excellent support for new Azure features on day one. **Azure Verified Modules** provide tested building blocks.", "**Google Cloud Infrastructure Manager**: runs Terraform as a managed service; Google also publishes Terraform blueprints (Cloud Foundation Fabric).", "**OCI Resource Manager**: runs Terraform as a managed service with stored state, drift detection and ready-made stacks."]}, {"k": "code", "t": "The same VNet in Bicep", "x": "resource vnet 'Microsoft.Network/virtualNetworks@2023-09-01' = {\n  name: 'vnet-prod-uaen'\n  location: 'uaenorth'\n  properties: {\n    addressSpace: { addressPrefixes: [ '10.48.0.0/16' ] }\n    subnets: [ { name: 'snet-app', properties: { addressPrefix: '10.48.1.0/24' } } ]\n  }\n}"}, {"k": "tip", "kind": "Tip", "x": "Use Terraform when you span several clouds; native tools are a good choice if you are committed to one provider and want the newest features immediately."}]}, {"t": "State and safety", "tag": "all", "blocks": [{"k": "p", "x": "Terraform records what it created in a **state file**. State is critical: lose it and Terraform no longer knows what it manages; corrupt it with two simultaneous runs and you get broken infrastructure."}, {"k": "p", "x": "Rules:"}, {"k": "ul", "x": ["Store state **remotely** with **locking**: an S3 bucket (with native S3 locking or DynamoDB), Azure Storage with blob leases, a Google Cloud Storage bucket, OCI Object Storage, HCP Terraform, or OCI Resource Manager.", "**Separate state per environment and layer** (prod-network, prod-apps, dev-network) so a mistake has a small blast radius.", "**Never commit secrets** or state files to Git; state can contain sensitive values.", "**Read every plan**. Watch especially for `destroy` and `forces replacement` on networks, gateways and subnets.", "Protect critical resources with `lifecycle { prevent_destroy = true }`."]}, {"k": "code", "t": "Remote state in Azure Storage", "x": "terraform {\n  backend \"azurerm\" {\n    resource_group_name  = \"rg-tfstate\"\n    storage_account_name = \"sttfstateprod01\"\n    container_name       = \"tfstate\"\n    key                  = \"prod/network.tfstate\"\n  }\n}"}, {"k": "tip", "kind": "Watch out", "x": "Changing a subnet's CIDR or an immutable property usually *replaces* the subnet, deleting everything in it. The plan says \"must be replaced\"; stop and rethink when you see it on a network."}]}, {"t": "Policy as code and CI/CD", "tag": "all", "blocks": [{"k": "p", "x": "Automate checks so that mistakes are caught before they reach the cloud."}, {"k": "ul", "x": ["**Static analysis**: **Checkov**, **tfsec/Trivy** or **KICS** scan Terraform for risky patterns (security group open to the world, missing flow logs, public storage).", "**Custom policies**: **Open Policy Agent** with **Conftest**, or HashiCorp **Sentinel**, enforce your own rules on the plan output, such as \"only approved CIDRs\" or \"no public IPs\".", "**Pipeline**: on every pull request, run `terraform fmt -check`, `terraform validate`, `terraform plan` and the policy checks, and post the plan to the pull request. After approval, apply from the pipeline, never from a laptop."]}, {"k": "code", "t": "A small Conftest (Rego) policy: no SSH from the Internet", "x": "package main\ndeny[msg] {\n  r := input.resource_changes[_]\n  r.type == \"aws_security_group_rule\"\n  r.change.after.from_port <= 22\n  r.change.after.to_port >= 22\n  r.change.after.cidr_blocks[_] == \"0.0.0.0/0\"\n  msg := sprintf(\"%s opens SSH to the Internet\", [r.address])\n}"}, {"k": "tip", "kind": "Tip", "x": "Use the cloud's workload identity (OIDC federation from GitHub Actions or GitLab to AWS roles, Azure managed identities, Google Workload Identity Federation, OCI) so pipelines need no stored keys."}]}, {"t": "Drift, imports and day-two operations", "tag": "all", "blocks": [{"k": "p", "x": "Real environments change. Handle it deliberately:"}, {"k": "ul", "x": ["**Drift**: someone changes a rule by hand. `terraform plan` shows the difference; either revert it by applying, or update the code to match. Scheduled plans can alert on drift.", "**Importing existing resources**: `import` blocks (Terraform 1.5+) bring resources created by hand under management without recreating them.", "**Refactoring**: `moved` blocks rename resources or move them into modules without destroying them.", "**Upgrades**: pin provider versions, upgrade them deliberately, and read the changelogs."]}, {"k": "code", "t": "Bring an existing VPC under Terraform", "x": "import {\n  to = aws_vpc.legacy\n  id = \"vpc-0abc123def4567890\"\n}\nresource \"aws_vpc\" \"legacy\" {\n  cidr_block = \"10.9.0.0/16\"\n}\n# terraform plan -generate-config-out=generated.tf can draft the resource block for you"}, {"k": "tip", "kind": "Tip", "x": "Start small: put one non-critical network under Terraform, practise plan/apply/import, then expand."}]}, {"t": "Real-world scenario: the plan nobody read", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** An engineer changes a variable in a Terraform module to add a new subnet. The pipeline shows the plan, a reviewer approves after glancing at \"Plan: 2 to add, 1 to change, 3 to destroy\", and it's applied. Production loses its NAT gateway and route tables; outbound traffic fails for 25 minutes."}, {"k": "p", "x": "**Investigation.** The variable change altered the **index** of subnets in a `count`-based list. Terraform therefore planned to destroy and recreate the subnets after the new one in the list, together with their route table associations and the NAT gateway inside one of them. The plan said so, but nobody read the destroy lines."}, {"k": "p", "x": "**Fix and prevention.**"}, {"k": "ol", "x": ["Restore from the previous state by reverting the change and applying (resources recreated with new IDs).", "Refactor the module to use `for_each` with stable keys (subnet names) instead of `count` indexes, using `moved` blocks to migrate state without recreation.", "Add `prevent_destroy` to critical network resources.", "Add a policy check that **fails the pipeline** if a plan destroys or replaces network resources in production without an explicit override label.", "Post a summary of destroyed resources prominently in the pull request."]}, {"k": "p", "x": "**Lessons learned.** Terraform tells you exactly what it will do; the risk is people not reading it. Use stable keys, protect critical resources, and let automation block destructive changes."}]}], "q": [{"t": "Which command shows changes without applying them?", "o": ["terraform init", "terraform plan", "terraform apply", "terraform fmt"], "a": 1, "x": "plan previews; apply executes."}, {"t": "Which OCI service runs Terraform for you?", "o": ["Resource Manager", "Cloud Shell", "DevOps", "Bastion"], "a": 0, "x": "OCI Resource Manager is managed Terraform."}, {"t": "Why must Terraform state be stored remotely with locking?", "o": ["To make plans faster", "So team members share one source of truth and two runs can't corrupt it at once", "Because providers require it", "To encrypt the code"], "a": 1, "x": "Locking prevents concurrent applies; remote storage gives everyone the same state."}, {"t": "A plan shows a production subnet \"must be replaced\". What should you do?", "o": ["Apply quickly before anyone notices", "Stop and review: replacement deletes the subnet and everything in it", "Ignore it; subnets are recreated without impact", "Run terraform fmt"], "a": 1, "x": "Replacing network resources is destructive; change the approach or plan a migration."}, {"t": "Which Terraform feature brings an existing, hand-made resource under management?", "o": ["moved block", "import block", "output block", "backend block"], "a": 1, "x": "import blocks attach existing resources to Terraform state without recreating them."}, {"t": "Why did adding a subnet to a count-based list destroy existing subnets?", "o": ["Terraform has a bug", "Resources are identified by list index, so inserting an item shifts indexes and forces replacement", "The provider version changed", "State was stored locally"], "a": 1, "x": "for_each with stable keys avoids index-based replacement."}], "lv": 5, "h": 7, "goal": "Define every network in reviewable, repeatable code.", "terms": ["IaC", "Terraform", "HCL", "provider", "resource", "module", "state", "plan", "apply", "drift", "Bicep", "CloudFormation", "policy as code", "CI/CD"]}, {"id": "m21", "t": "Kubernetes & Container Networking", "res": [["Kubernetes: services and networking", "https://kubernetes.io/docs/concepts/services-networking/"], ["Amazon EKS networking", "https://docs.aws.amazon.com/eks/latest/best-practices/networking.html"], ["AKS networking concepts", "https://learn.microsoft.com/en-us/azure/aks/concepts-network"], ["GKE networking overview", "https://cloud.google.com/kubernetes-engine/docs/concepts/network-overview"], ["OKE pod networking", "https://docs.oracle.com/en-us/iaas/Content/ContEng/Concepts/contengpodnetworking.htm"]], "sum": ["Every pod gets an IP and can reach every other pod; a CNI plugin makes it happen.", "Services give pods stable addresses; Ingress or Gateway API handles HTTP routing.", "VPC-native pod networking consumes many cloud IPs; plan ranges early.", "Default-deny NetworkPolicies are essential, and only work with a policy-capable CNI."], "ls": [{"t": "The Kubernetes network model", "tag": "all", "blocks": [{"k": "p", "x": "Kubernetes defines simple rules for networking:"}, {"k": "ul", "x": ["Every **pod** gets its own IP address.", "Every pod can reach every other pod on any node **without NAT**.", "Agents on a node (such as the kubelet) can reach all pods on that node."]}, {"k": "p", "x": "Kubernetes itself does not implement this. A **CNI plugin** (Container Network Interface) does. There are two broad approaches:"}, {"k": "ul", "x": ["**Overlay** (such as Flannel VXLAN, Calico in overlay mode, Azure CNI Overlay): pods get addresses from a private range that the cloud network doesn't know about; traffic between nodes is encapsulated or routed by the plugin. Saves cloud IP addresses.", "**VPC-native / routed** (AWS VPC CNI, Azure CNI with pod subnets, GKE VPC-native, OKE VCN-native pod networking): pods get real addresses from the cloud network. Pods are directly reachable and visible in flow logs, but they consume many IPs."]}, {"k": "p", "x": "Modern CNIs such as **Cilium** use **eBPF** in the Linux kernel for fast routing, load balancing, network policy and visibility."}, {"k": "tip", "kind": "Tip", "x": "The CNI choice is hard to change after the cluster is built. Decide it together with your IP plan."}]}, {"t": "Services, Ingress and Gateway API", "tag": "all", "blocks": [{"k": "p", "x": "Pods come and go, so their IPs change. A **Service** gives a set of pods a stable name and virtual IP:"}, {"k": "ul", "x": ["**ClusterIP** (default): reachable only inside the cluster, for example `orders.prod.svc.cluster.local`.", "**NodePort**: opens a port (30000–32767) on every node.", "**LoadBalancer**: asks the cloud to create a load balancer (an L4 load balancer by default on all four clouds) that forwards to the pods.", "**Headless** (`clusterIP: None`): DNS returns the pod IPs directly, used by databases and stateful sets."]}, {"k": "p", "x": "**kube-proxy** (or the CNI's eBPF replacement) programs each node so traffic to a Service IP reaches a healthy pod. **CoreDNS** answers DNS for Services and pods."}, {"k": "p", "x": "For HTTP, an **Ingress** or the newer **Gateway API** describes host and path routing, TLS and more, implemented by a controller: AWS Load Balancer Controller (creates ALBs), Application Gateway for Containers on Azure, GKE Gateway controller (Google Cloud load balancers), OCI native ingress controller, or in-cluster controllers like NGINX and Envoy-based gateways."}, {"k": "code", "t": "A Gateway API route", "x": "apiVersion: gateway.networking.k8s.io/v1\nkind: HTTPRoute\nmetadata: { name: shop, namespace: prod }\nspec:\n  parentRefs: [ { name: public-gw } ]\n  hostnames: [ \"shop.example.com\" ]\n  rules:\n  - matches: [ { path: { type: PathPrefix, value: /api } } ]\n    backendRefs: [ { name: orders, port: 8080 } ]\n  - backendRefs: [ { name: web, port: 80 } ]"}, {"k": "tip", "kind": "Tip", "x": "Gateway API is the successor to Ingress, with clearer roles (platform team owns the Gateway, app teams own their routes). Prefer it for new clusters."}]}, {"t": "Managed clusters in each cloud", "tag": "all", "blocks": [{"k": "p", "x": "Each managed Kubernetes service has its own networking defaults:"}, {"k": "ul", "x": ["**Amazon EKS**: the **Amazon VPC CNI** gives each pod a real VPC IP from the node's subnet (secondary IPs or prefix delegation). Options: custom networking to place pods in separate subnets, and **security groups for pods**. Cluster endpoints can be public, private or both.", "**Azure AKS**: **Azure CNI Overlay** (pods in a private overlay range; recommended default for most clusters), **Azure CNI** with pod subnets (pods get VNet IPs), or kubenet (legacy). **Azure CNI Powered by Cilium** adds eBPF dataplane and policy. Private clusters keep the API server off the Internet.", "**Google GKE**: **VPC-native** clusters use alias IPs from subnet **secondary ranges** for pods and Services. **GKE Dataplane V2** (based on Cilium/eBPF) provides network policy and logging. Private clusters, Autopilot mode, and multi-cluster Gateways.", "**Oracle OKE**: **VCN-native pod networking** (pods get VCN IPs, with NSGs applied to pods) or the **flannel overlay**. Virtual nodes offer a serverless option."]}, {"k": "tip", "kind": "In the cloud", "x": "Private clusters (API server reachable only from your network) are the secure default in all four. Reach them via a bastion, VPN or a CI runner inside the network."}]}, {"t": "IP planning for pods", "tag": "all", "blocks": [{"k": "p", "x": "VPC-native pod networking is powerful but hungry for addresses. A rough sizing formula:"}, {"k": "code", "t": "Estimate addresses for VPC-native pods", "x": "nodes × max pods per node = pod IPs needed\n50 nodes × 30 pods = 1,500 pod IPs  → at least a /21 (2,048), more for upgrades and scaling\nAdd surge capacity: rolling node upgrades temporarily add extra nodes."}, {"k": "p", "x": "Guidelines per provider:"}, {"k": "ul", "x": ["**EKS**: use prefix delegation to fit more pods per node; give pods their own large subnets (custom networking) or a secondary CIDR such as 100.64.0.0/16 if the primary range is short.", "**AKS**: Azure CNI Overlay avoids the problem entirely for most clusters; with pod subnets, size them for the maximum pod count.", "**GKE**: plan secondary ranges for pods (often a /14 to /16) and Services (often a /20); the max-pods-per-node setting decides how much range each node reserves.", "**OKE**: with VCN-native pods, size pod subnets for nodes × pods per node."]}, {"k": "tip", "kind": "Watch out", "x": "Running out of pod IPs makes new pods stay \"Pending\" with network errors and blocks node scaling and upgrades. Monitor subnet utilisation."}]}, {"t": "Network policies", "tag": "all", "blocks": [{"k": "p", "x": "By default, every pod can talk to every other pod in the cluster, across namespaces. A **NetworkPolicy** restricts that, selecting pods by label and allowing specific ingress and egress."}, {"k": "p", "x": "Start with **default deny** in each namespace, then allow only the required flows:"}, {"k": "code", "t": "Default deny, then allow frontend → backend on 8080", "x": "apiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: { name: default-deny, namespace: prod }\nspec:\n  podSelector: {}\n  policyTypes: [ Ingress, Egress ]\n---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: { name: backend-from-frontend, namespace: prod }\nspec:\n  podSelector: { matchLabels: { app: backend } }\n  ingress:\n  - from: [ { podSelector: { matchLabels: { app: frontend } } } ]\n    ports: [ { protocol: TCP, port: 8080 } ]"}, {"k": "p", "x": "Remember that a default-deny egress policy also blocks DNS, so add a rule allowing UDP/TCP 53 to CoreDNS."}, {"k": "p", "x": "NetworkPolicies only work if the CNI enforces them: Calico, Cilium, GKE Dataplane V2, Azure Network Policy Manager or Cilium on AKS, the VPC CNI's network policy feature on EKS, and Calico on OKE."}, {"k": "tip", "kind": "Tip", "x": "Cilium and Calico also offer richer policies (DNS/FQDN-based egress rules, cluster-wide policies, L7 rules) beyond the standard NetworkPolicy API."}]}, {"t": "Service mesh", "tag": "all", "blocks": [{"k": "p", "x": "A **service mesh** adds a layer for service-to-service traffic without changing application code:"}, {"k": "ul", "x": ["**mTLS**: every connection between services is encrypted and both sides authenticated with certificates issued by the mesh.", "**Traffic management**: retries, timeouts, circuit breaking, canary releases (send 5% of traffic to a new version).", "**Observability**: request-level metrics and traces for every service call.", "**Authorization policies**: \"only the orders service may call payments, and only POST /charge\"."]}, {"k": "p", "x": "Popular meshes are **Istio** (including its sidecar-less **ambient mode**), **Linkerd** and **Cilium Service Mesh**. Managed options include **Istio-based service mesh add-on for AKS** and **Cloud Service Mesh** on Google Cloud."}, {"k": "tip", "kind": "Tip", "x": "A mesh adds real operational complexity. Adopt one when you need mTLS everywhere or advanced traffic control across many services, not by default."}]}, {"t": "Real-world scenario: a NetworkPolicy that broke everything", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** To improve security, a platform team applies a default-deny NetworkPolicy to the `prod` namespace, followed by allow rules for frontend → backend and backend → database. Within minutes, every service in `prod` fails health checks and stops resolving names."}, {"k": "p", "x": "**Investigation.**"}, {"k": "ol", "x": ["Pods can't resolve any names: the default-deny **egress** policy blocked DNS traffic to CoreDNS in `kube-system`.", "Readiness probes are failing on some nodes: the CNI in use evaluates probe traffic from the node against policies, and no rule allowed it.", "The ingress controller in another namespace can't reach frontend pods: no rule allowed traffic from the `ingress` namespace."]}, {"k": "p", "x": "**Fix.**"}, {"k": "ol", "x": ["Add an egress rule allowing UDP and TCP 53 to CoreDNS pods (selected by namespace and label).", "Allow ingress from the ingress controller's namespace to the frontend pods.", "Allow health-check traffic where the CNI requires it (check your CNI's documentation).", "Next time: apply policies first in a staging cluster, use the CNI's policy audit or visibility tools (Cilium Hubble, Calico flow logs) to see what would be blocked, then roll out."]}, {"k": "p", "x": "**Lessons learned.** Default-deny is right, but it denies *everything*, including DNS, probes and ingress controllers. Map real flows before enforcing."}]}], "q": [{"t": "What enforces Kubernetes NetworkPolicy?", "o": ["kube-proxy", "The CNI plugin", "CoreDNS", "etcd"], "a": 1, "x": "Without a policy-capable CNI, NetworkPolicies have no effect."}, {"t": "Which GKE feature gives pods IPs from VPC secondary ranges?", "o": ["VPC-native (alias IPs)", "Cloud NAT", "Shared VPC", "Autopilot"], "a": 0, "x": "VPC-native clusters allocate pod IPs from alias ranges."}, {"t": "Which Service type is reachable only from inside the cluster?", "o": ["ClusterIP", "NodePort", "LoadBalancer", "ExternalName"], "a": 0, "x": "ClusterIP is the default internal virtual IP."}, {"t": "After applying a default-deny egress policy, pods can't resolve any names. Why?", "o": ["CoreDNS crashed", "The policy also blocks DNS traffic to CoreDNS on port 53", "The CNI doesn't support DNS", "Services were deleted"], "a": 1, "x": "Default-deny egress blocks everything, including DNS; add an allow rule for port 53."}, {"t": "Which AKS networking option avoids consuming VNet addresses for every pod?", "o": ["Azure CNI with pod subnets", "Azure CNI Overlay", "Host networking", "Service endpoints"], "a": 1, "x": "In overlay mode, pods use a private range separate from the VNet."}, {"t": "After a default-deny egress policy, pods can't resolve names. What must you allow?", "o": ["TCP 443 to the Internet", "UDP and TCP 53 to the cluster DNS (CoreDNS)", "ICMP", "All traffic in kube-system"], "a": 1, "x": "Default-deny egress blocks DNS unless explicitly allowed."}], "lv": 5, "h": 7, "goal": "Plan and secure pod networking on EKS, AKS, GKE and OKE.", "terms": ["pod", "CNI", "overlay", "VPC-native", "ClusterIP", "NodePort", "LoadBalancer", "Ingress", "Gateway API", "NetworkPolicy", "CoreDNS", "kube-proxy", "eBPF", "service mesh", "mTLS"]}, {"id": "m22", "t": "Troubleshooting & Capstone", "res": [["AWS Reachability Analyzer", "https://docs.aws.amazon.com/vpc/latest/reachability/what-is-reachability-analyzer.html"], ["Azure Network Watcher", "https://learn.microsoft.com/en-us/azure/network-watcher/network-watcher-overview"], ["Google Cloud Connectivity Tests", "https://cloud.google.com/network-intelligence-center/docs/connectivity-tests/concepts/overview"], ["OCI Network Path Analyzer", "https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/path_analyzer.htm"]], "sum": ["Work methodically up the layers and change one thing at a time.", "Use each cloud's path analyzer before guessing.", "Flow logs and packet captures show what really happened.", "Design, build, break and fix a real two-cloud system to prove your skills."], "ls": [{"t": "A method for every outage", "tag": "all", "blocks": [{"k": "p", "x": "Good troubleshooting is a method, not luck. Use the same steps every time:"}, {"k": "ol", "x": ["**Define the problem precisely**: what source, what destination, what port, since when, for whom? \"The app is down\" is not a problem statement; \"VMs in app-subnet can't reach the database on 5432 since 14:10\" is.", "**Check what changed**: deployments, rule changes, route changes, certificate expiry. Audit logs (CloudTrail, Activity Log, Cloud Audit Logs, OCI Audit) answer this quickly.", "**Walk the path layer by layer**: is the target running and listening? Does DNS resolve correctly? Is there a route each way? Do all filters (OS firewall, security group/NSG, subnet ACL, cloud firewall) allow it in both directions? Is NAT or a load balancer in the path healthy?", "**Form one hypothesis, test it, change one thing.**", "**Fix, verify, and write down what happened.**"]}, {"k": "code", "t": "The questions, in order", "x": "Is the destination up and listening?        ss -tulpn / service status\nDoes the name resolve to the right IP?       dig / nslookup\nIs there a route there AND back?             cloud route tables, effective routes\nDo all filters allow it, both ways?          SG/NSG/NACL/firewall + host firewall\nIs anything in between unhealthy?            NAT, LB health checks, VPN/BGP state"}, {"k": "tip", "kind": "Tip", "x": "Most outages are caused by recent changes. Always ask \"what changed?\" before diving deep."}]}, {"t": "Built-in path analyzers", "tag": "all", "blocks": [{"k": "p", "x": "All four clouds offer tools that analyse configuration and tell you where a path is blocked, without needing access to the VMs:"}, {"k": "ul", "x": ["**AWS Reachability Analyzer**: source and destination (instances, ENIs, gateways, endpoints); checks routes, SGs, NACLs, gateways and peering, and names the blocking component.", "**Azure Network Watcher**: IP flow verify (which NSG rule matches), next hop, effective routes and security rules, and connection troubleshoot.", "**Google Cloud Connectivity Tests**: analyses routes, firewall policies and rules, load balancers, Cloud NAT and hybrid paths; optionally checks the live data plane.", "**OCI Network Path Analyzer**: analyses route tables, security lists, NSGs, gateways and DRG routing between endpoints."]}, {"k": "p", "x": "These tools are the fastest way to rule configuration in or out. If the analyzer says the path is open, look at the guest OS, the application, DNS or something outside the cloud."}, {"k": "tip", "kind": "Tip", "x": "Run the analyzer in both directions. Many problems are on the return path."}]}, {"t": "Packet-level visibility", "tag": "all", "blocks": [{"k": "p", "x": "When configuration looks right but traffic still fails, capture the packets:"}, {"k": "ul", "x": ["**AWS Traffic Mirroring**: copies traffic from an ENI to a monitoring target.", "**Azure Network Watcher packet capture**: captures on a VM (or scale set) to storage, readable in Wireshark.", "**Google Cloud Packet Mirroring**: clones traffic from instances to a collector behind an internal load balancer.", "**OCI VTAP** with capture filters: mirrors traffic from VNICs and other sources."]}, {"k": "p", "x": "Or simply run `tcpdump` on both ends (Module 08). Combine with **flow logs**, which show accepted and rejected flows at scale, to find which direction and which hop is failing."}, {"k": "tip", "kind": "Tip", "x": "Capture on the sender and the receiver at the same time. If packets leave A but never reach B, the problem is in the network between; if they reach B and B replies, but A never gets the reply, look at the return path."}]}, {"t": "Common failure patterns", "tag": "all", "blocks": [{"k": "p", "x": "Most cloud network problems fall into a handful of patterns. Learn to recognise them:"}, {"k": "ul", "x": ["**Connection timeout** to a new VM: security group/NSG/firewall rule missing, or wrong route. Check the analyzer.", "**Works from one subnet, not another**: subnet-level filter (NACL, subnet NSG, security list) or route table differs.", "**Private VM can't reach the Internet**: no NAT route, NAT gateway in the wrong place, or (AWS) NACL blocking return ports.", "**Load balancer returns 502/503**: health checks failing; backend security rule doesn't allow the LB's ranges, or the app isn't listening.", "**Works by IP but not by name**: DNS; especially private zones not linked to the network, or hybrid forwarding missing.", "**Small requests work, large ones hang**: MTU across VPN or tunnels.", "**Intermittent failures under load**: NAT port exhaustion, connection limits, or one unhealthy backend.", "**Hybrid traffic one-way**: asymmetric routing through stateful firewalls, or a missing route on one side.", "**Everything broke at once at a specific time**: a change, or an expired certificate."]}, {"k": "tip", "kind": "Tip", "x": "Keep a personal runbook. Each time you solve a problem, add the symptom, the cause and the fix."}]}, {"t": "Cost and performance review", "tag": "all", "blocks": [{"k": "p", "x": "A network can work and still be expensive or slow. Review it regularly:"}, {"k": "ul", "x": ["**Egress**: which flows leave the cloud, cross regions or cross zones? Can a CDN, caching or co-locating services reduce them?", "**NAT gateways**: high NAT data processing often means traffic to cloud services that should use endpoints instead (S3 gateway endpoint, Private Google Access, OCI service gateway, Azure Private Endpoints or service endpoints).", "**Idle resources**: unused load balancers, NAT gateways, VPN gateways, public IPs and endpoints left from tests.", "**Latency**: place services that talk a lot in the same zone or region; use the providers' latency dashboards.", "**Right-sizing**: VPN/ExpressRoute gateway SKUs, interconnect bandwidth and firewall capacity sized for real usage."]}, {"k": "tip", "kind": "Tip", "x": "Tag every network resource with an owner and environment. Unowned resources are usually the ones nobody remembered to delete."}]}, {"t": "Capstone brief", "tag": "all", "blocks": [{"k": "p", "x": "Prove your skills end to end. Build a small but real system across two clouds of your choice."}, {"k": "p", "x": "**Requirements**"}, {"k": "ol", "x": ["An address plan for both clouds and an imaginary data centre, with no overlaps.", "In cloud A: a hub-and-spoke network; a public L7 load balancer with WAF; app servers or containers in private subnets; a managed database with a private endpoint and no public access; NAT for outbound traffic; managed admin access with no open SSH/RDP.", "In cloud B: a private network with one service that the app in cloud A must call privately.", "A cloud-to-cloud HA VPN with BGP between the two clouds.", "Private DNS working in both directions.", "Flow logs and firewall logs enabled.", "Everything built with Terraform, with a policy check that blocks SSH from the Internet."]}, {"k": "p", "x": "**Then break it on purpose** and fix it using only the tools from this course: remove a route, delete a firewall rule, break a DNS forwarding rule, and shut one VPN tunnel. Note how you found each fault."}, {"k": "p", "x": "**Deliverables**: an architecture diagram, the IP plan, the Terraform code, and a one-page runbook. Then tear everything down."}, {"k": "tip", "kind": "Tip", "x": "Keep costs low by using the smallest sizes, running the lab for a few hours at a time, and destroying it with `terraform destroy` when you stop. Set a budget alert before you start."}]}, {"t": "Real-world scenario: an end-to-end investigation", "tag": null, "blocks": [{"k": "p", "x": "**Situation.** Users report that an internal reporting web app on Google Cloud, accessed from offices over HA VPN, shows \"502 Bad Gateway\" since this morning. Nothing in the app changed."}, {"k": "p", "x": "**Walking the method.**"}, {"k": "ol", "x": ["**Define**: users in all offices get 502 from the internal Application Load Balancer for `reports.corp.example`, since 07:30.", "**What changed?** Cloud Audit Logs show a firewall policy update at 07:25 by the security team: a new rule \"deny all ingress from 35.191.0.0/16 and 130.211.0.0/22\" was added at high priority, intended to block a scan from an external range they thought these were.", "**Confirm**: the load balancer shows all backends **unhealthy**. Those two ranges are Google's **health-check source ranges**; and for internal Application Load Balancers, traffic also comes from the **proxy-only subnet**, which the same change had been grouped with.", "**Connectivity Tests** from the proxy-only subnet to a backend on port 8080 report \"dropped by firewall policy rule 'deny-scan'\"."]}, {"k": "p", "x": "**Fix.** Roll back the rule (service restored in 3 minutes after health checks pass), then re-implement the security team's intent correctly: block the actual scanning range, and add a hierarchical policy rule explicitly allowing health-check ranges and proxy-only subnets, with a comment explaining why."}, {"k": "p", "x": "**Postmortem actions.**"}, {"k": "ul", "x": ["Firewall policy changes go through the same IaC pipeline with Connectivity Tests as a pre-merge check.", "Add a \"load balancer healthy backends = 0\" alert that pages.", "Document Google's health-check ranges in the firewall policy itself."]}, {"k": "p", "x": "**Lessons learned.** Ask \"what changed?\" first, confirm with the path analyzer, mitigate quickly, then fix the process so the same mistake can't recur."}]}], "q": [{"t": "A private AWS instance cannot reach the Internet. A route to the NAT exists and the security group allows egress. What next?", "o": ["The CPU", "The subnet NACL, including the return path", "The DNS TTL", "The instance size"], "a": 1, "x": "Stateless NACLs often block the return traffic on ephemeral ports."}, {"t": "Which path-analysis tool belongs to OCI?", "o": ["Reachability Analyzer", "Connectivity Tests", "Network Path Analyzer", "Network Watcher"], "a": 2, "x": "AWS, Google Cloud and Azure use the other three names."}, {"t": "Everything worked yesterday and fails today for all users. What should you check first?", "o": ["Replace the load balancer", "What changed: recent deployments, rule changes and certificate expiry", "Reboot every server", "Increase the instance sizes"], "a": 1, "x": "Most outages follow a change; audit logs show what changed and when."}, {"t": "Requests work by IP address but fail by host name. Where is the fault?", "o": ["Routing", "MTU", "DNS", "Security groups"], "a": 2, "x": "If the IP works, the network path is fine; name resolution is the problem."}, {"t": "NAT gateway data-processing charges are very high. What is a likely improvement?", "o": ["Add a second NAT gateway", "Route traffic to cloud services through private or gateway endpoints instead of NAT", "Use bigger instances", "Disable flow logs"], "a": 1, "x": "Traffic to storage and other cloud APIs often goes through NAT unnecessarily; endpoints avoid it."}, {"t": "In the scenario, why did all backends become unhealthy?", "o": ["The app crashed", "DNS failed", "A new firewall rule blocked Google's health-check and proxy source ranges", "The VPN went down"], "a": 2, "x": "Health checks and proxy traffic must be allowed, or load balancers mark every backend unhealthy."}], "lv": 5, "h": 12, "goal": "Diagnose any cloud network fault and prove your skills end to end.", "terms": ["runbook", "hypothesis", "path analysis", "effective routes", "packet mirroring", "flow logs", "egress review", "postmortem", "capstone"]}, {"id": "m31", "t": "Network Automation", "res": [["AWS SDK for Python (boto3)", "https://boto3.amazonaws.com/v1/documentation/api/latest/index.html"], ["Azure SDK for Python", "https://learn.microsoft.com/en-us/azure/developer/python/sdk/azure-sdk-overview"], ["Google Cloud Python client libraries", "https://cloud.google.com/python/docs/reference"], ["OCI Python SDK", "https://docs.oracle.com/en-us/iaas/tools/python/latest/"], ["Ansible documentation", "https://docs.ansible.com/"], ["Batfish", "https://batfish.org/"]], "sum": ["Everything in the cloud is an API call; the console is just one client.", "Good automation is idempotent, handles pagination and rate limits, and logs what it did.", "Use Terraform for desired state, scripts for queries and reports, and events for fast remediation.", "Test network changes before production with analysis tools and reviewed pipelines."], "ls": [{"t": "Why automate networks", "tag": "all", "blocks": [{"k": "p", "x": "Cloud networks change constantly: new environments, new rules, new peers. Doing this by hand is slow, error-prone and impossible to audit at scale. Automation brings:"}, {"k": "ul", "x": ["**Consistency**: the same change applied the same way everywhere.", "**Speed**: minutes instead of tickets waiting days.", "**Safety**: changes are reviewed, tested and reversible.", "**Visibility**: scripts can inventory and check thousands of resources in seconds."]}, {"k": "p", "x": "Different jobs need different tools:"}, {"k": "ul", "x": ["**Declarative desired state** (what the network should look like): Terraform, Bicep, CloudFormation (Module 20).", "**Queries, reports and one-off bulk changes**: Python with the cloud SDKs, or the CLIs.", "**Configuring network devices and servers**: Ansible.", "**Reacting to events** (someone opened SSH to the world): event-driven functions."]}, {"k": "tip", "kind": "Tip", "x": "Start with read-only automation: inventories and compliance reports. They're useful on day one and carry no risk."}]}, {"t": "APIs and SDKs", "tag": "all", "blocks": [{"k": "p", "x": "Every cloud action, including clicks in the console, is an **API call** over HTTPS, authenticated and logged. **SDKs** wrap these APIs in your programming language: **boto3** (AWS), the **Azure SDK for Python** (`azure-identity`, `azure-mgmt-network`), **Google Cloud client libraries** (`google-cloud-compute`), and the **OCI Python SDK** (`oci`)."}, {"k": "p", "x": "Four things every script must handle:"}, {"k": "ul", "x": ["**Authentication**: use the environment's identity (instance roles, managed identities, workload identity, instance principals), never hard-coded keys.", "**Pagination**: list calls return results in pages; read them all.", "**Rate limits / throttling**: back off and retry on throttling errors (SDKs often retry automatically, but large loops can still be throttled).", "**Regions and scopes**: resources are per region, per subscription, per project or per compartment; loop over all of them."]}, {"k": "code", "t": "Find security groups that allow SSH from anywhere, in every AWS region (boto3)", "x": "import boto3\nec2 = boto3.client(\"ec2\", region_name=\"us-east-1\")\nregions = [r[\"RegionName\"] for r in ec2.describe_regions()[\"Regions\"]]\nfor region in regions:\n    client = boto3.client(\"ec2\", region_name=region)\n    for page in client.get_paginator(\"describe_security_groups\").paginate():\n        for sg in page[\"SecurityGroups\"]:\n            for rule in sg[\"IpPermissions\"]:\n                open_world = any(r.get(\"CidrIp\") == \"0.0.0.0/0\" for r in rule.get(\"IpRanges\", []))\n                port_from, port_to = rule.get(\"FromPort\", 0), rule.get(\"ToPort\", 65535)\n                if open_world and port_from <= 22 <= port_to:\n                    print(region, sg[\"GroupId\"], sg[\"GroupName\"])"}, {"k": "tip", "kind": "Watch out", "x": "A rule with protocol \"-1\" (all traffic) has no FromPort/ToPort but still opens SSH. Good scripts handle these edge cases; that's why the example defaults to 0–65535."}]}, {"t": "The same task in Azure, Google Cloud and OCI", "tag": "all", "blocks": [{"k": "p", "x": "The pattern is identical in each cloud: authenticate, list, filter, report."}, {"k": "code", "t": "Azure: NSG rules allowing inbound 3389 from Internet", "x": "from azure.identity import DefaultAzureCredential\nfrom azure.mgmt.network import NetworkManagementClient\nnet = NetworkManagementClient(DefaultAzureCredential(), \"<subscription-id>\")\nfor nsg in net.network_security_groups.list_all():\n    for r in nsg.security_rules or []:\n        src = (r.source_address_prefix or \"\").lower()\n        if r.direction == \"Inbound\" and r.access == \"Allow\" and src in (\"*\", \"internet\", \"0.0.0.0/0\") \\\n           and (r.destination_port_range in (\"3389\", \"*\")):\n            print(nsg.name, r.name, r.priority)"}, {"k": "code", "t": "Google Cloud: firewall rules open to 0.0.0.0/0", "x": "from google.cloud import compute_v1\nfor fw in compute_v1.FirewallsClient().list(project=\"my-project\"):\n    if fw.direction == \"INGRESS\" and \"0.0.0.0/0\" in fw.source_ranges and not fw.disabled:\n        print(fw.name, [(a.I_p_protocol, list(a.ports)) for a in fw.allowed])"}, {"k": "code", "t": "OCI: security list rules open to 0.0.0.0/0 in a compartment", "x": "import oci\ncfg = oci.config.from_file()\nvcn = oci.core.VirtualNetworkClient(cfg)\nlists = oci.pagination.list_call_get_all_results(vcn.list_security_lists, compartment_id=\"<ocid>\").data\nfor sl in lists:\n    for r in sl.ingress_security_rules:\n        if r.source == \"0.0.0.0/0\":\n            print(sl.display_name, r.protocol, r.tcp_options)"}, {"k": "tip", "kind": "Tip", "x": "Run these reports on a schedule and send the output to a channel or ticket queue. Compliance becomes continuous instead of yearly."}]}, {"t": "Ansible for networks and clouds", "tag": "all", "blocks": [{"k": "p", "x": "**Ansible** runs **playbooks** (YAML lists of tasks) against an **inventory** of hosts, over SSH or APIs, with no agent to install. It's popular for configuring routers, switches and firewalls (collections exist for Cisco, Juniper, Arista, Palo Alto, Fortinet and others) and for servers, and it has collections for all four clouds (`amazon.aws`, `azure.azcollection`, `google.cloud`, `oracle.oci`)."}, {"k": "p", "x": "Ansible modules are **idempotent**: they describe the desired state, so running a playbook twice makes no extra changes."}, {"k": "code", "t": "Push a standard NTP and SNMP config to all branch routers", "x": "- name: Baseline branch routers\n  hosts: branch_routers\n  gather_facts: false\n  tasks:\n    - name: NTP servers\n      cisco.ios.ios_ntp_global:\n        config:\n          servers:\n            - server: 10.100.0.10\n            - server: 10.100.0.11\n        state: merged\n    - name: Save configuration if changed\n      cisco.ios.ios_config:\n        save_when: changed"}, {"k": "p", "x": "Use `--check --diff` to preview changes, and keep playbooks in Git with the same review process as Terraform."}, {"k": "tip", "kind": "Tip", "x": "A good split: Terraform builds cloud networks; Ansible configures the devices and appliances at the edges (on-premises routers, firewall VMs, SD-WAN boxes)."}]}, {"t": "Event-driven remediation", "tag": "all", "blocks": [{"k": "p", "x": "Some problems need fixing in seconds, not at the next scheduled scan. Every cloud can trigger code from change events:"}, {"k": "ul", "x": ["**AWS**: CloudTrail events → **Amazon EventBridge** rule → **Lambda** (or AWS Config rules with automatic remediation via Systems Manager).", "**Azure**: Activity Log / resource events → **Event Grid** → **Azure Functions** or Logic Apps; **Azure Policy** with deny or modify effects prevents many issues upfront.", "**Google Cloud**: Cloud Audit Logs → **Eventarc** → **Cloud Run** functions; organization policies prevent many issues upfront.", "**OCI**: **Events** service → **Functions** or Notifications; **Cloud Guard** responders can fix problems automatically."]}, {"k": "code", "t": "EventBridge rule pattern: someone added a security group ingress rule", "x": "{\n  \"source\": [\"aws.ec2\"],\n  \"detail-type\": [\"AWS API Call via CloudTrail\"],\n  \"detail\": { \"eventName\": [\"AuthorizeSecurityGroupIngress\"] }\n}\n→ Lambda checks for 0.0.0.0/0 on 22/3389, revokes it, and notifies the owner"}, {"k": "tip", "kind": "Watch out", "x": "Auto-remediation that fights your own Terraform creates loops (Terraform re-adds a rule, the function removes it). Prevent with policy where possible, and remediate only what should never exist."}]}, {"t": "Testing network changes", "tag": "all", "blocks": [{"k": "p", "x": "Network changes are risky because a small mistake can cut everyone off. Test before production:"}, {"k": "ul", "x": ["**Static checks** in CI: formatting, validation, policy as code (Module 20).", "**Plan review**: read the Terraform plan and the cloud's own analysis (for example, Reachability Analyzer or Connectivity Tests run in a pipeline against a staging environment).", "**Configuration analysis**: **Batfish** models router, switch and firewall configurations (and AWS network configuration) and answers questions like \"can subnet A reach the database on 5432?\" or \"did this change break any existing flows?\" without touching the network.", "**Staged rollout**: apply to dev, then one region or site, then everywhere.", "**Automatic rollback**: keep the previous version ready; for device changes, use commit-confirmed style features that roll back if you lose access."]}, {"k": "tip", "kind": "Tip", "x": "Write \"intent tests\" that encode what must always be true: \"the Internet can never reach the data subnets\", \"prod can't reach dev\". Run them after every change."}]}, {"t": "Real-world scenario: 4,000 firewall rules nobody understood", "tag": "all", "blocks": [{"k": "p", "x": "**Situation.** After years of manual changes, a company has about 4,000 security group and NSG rules across 60 AWS accounts and 25 Azure subscriptions. An audit finds 37 rules allowing SSH or RDP from the Internet, and nobody knows which rules are still used. Every change request takes a week because people are afraid to break something."}, {"k": "p", "x": "**Approach.**"}, {"k": "ol", "x": ["**Inventory**: Python scripts using boto3 and the Azure SDK export every rule, its owner tags and attachments to a database, nightly.", "**Usage data**: VPC Flow Logs and VNet flow logs show which rules actually match traffic over 90 days. About 30% of rules never matched anything.", "**Fix the urgent risk**: the 37 Internet-facing admin rules are replaced with Session Manager and Azure Bastion within two weeks, and an SCP plus Azure Policy now deny new ones.", "**Clean up**: unused rules are disabled in batches (with a quick rollback path), then deleted after 30 quiet days.", "**Move to code**: remaining rules are imported into Terraform; all future changes go through pull requests with Checkov and a custom \"no admin ports from the Internet\" policy.", "**Event-driven guard**: EventBridge and Event Grid functions alert on any change made outside the pipeline."]}, {"k": "p", "x": "**Result.** Rules dropped from 4,000 to about 1,700. Change requests now take hours, not days, and the next audit found no Internet-exposed admin ports."}, {"k": "p", "x": "**Lessons learned.** You can't improve what you can't see: inventory and usage data come first. Fix the highest risk immediately, then move everything into code with guardrails so the mess can't grow back."}]}], "q": [{"t": "What makes an automation task idempotent?", "o": ["It runs very fast", "Running it repeatedly produces the same end state without extra changes", "It uses Python", "It runs on a schedule"], "a": 1, "x": "Idempotent tasks converge on a desired state; reruns change nothing."}, {"t": "A script listing security groups only finds the first 1,000. What did it forget?", "o": ["Authentication", "Pagination", "Retries", "Logging"], "a": 1, "x": "List APIs return pages; you must request every page."}, {"t": "Which AWS service routes CloudTrail API events to a Lambda function for remediation?", "o": ["CloudFront", "EventBridge", "Route 53", "Direct Connect"], "a": 1, "x": "EventBridge rules match events and invoke targets such as Lambda."}, {"t": "What does Batfish let you do?", "o": ["Encrypt configurations", "Analyse network configurations to answer reachability questions before deploying", "Replace BGP", "Monitor CPU usage"], "a": 1, "x": "Batfish models configurations and checks behaviour without touching the live network."}, {"t": "How should automation scripts authenticate in the cloud?", "o": ["Hard-coded access keys in the script", "The root account", "The environment's workload identity (roles, managed identities, service accounts, instance principals)", "A shared password file"], "a": 2, "x": "Workload identities give short-lived credentials without stored secrets."}], "lv": 5, "h": 7, "goal": "Automate cloud and network tasks safely with APIs, Python, Ansible and event-driven workflows.", "terms": ["REST API", "SDK", "pagination", "rate limiting", "idempotency", "boto3", "Azure SDK", "Google Cloud client libraries", "OCI SDK", "Ansible", "playbook", "inventory", "event-driven remediation", "GitOps", "Batfish"]}, {"id": "m32", "t": "Observability & Operations", "res": [["Google SRE book: monitoring distributed systems", "https://sre.google/sre-book/monitoring-distributed-systems/"], ["Amazon CloudWatch Internet Monitor", "https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-InternetMonitor.html"], ["Azure Connection Monitor", "https://learn.microsoft.com/en-us/azure/network-watcher/connection-monitor-overview"], ["Google Cloud Performance Dashboard", "https://cloud.google.com/network-intelligence-center/docs/performance-dashboard/concepts/overview"]], "sum": ["Monitor what users experience first, then the components that cause it.", "Flow logs become powerful when you can query them quickly.", "Alert on symptoms tied to SLOs, not on every metric that moves.", "Incidents end with a blameless postmortem and real follow-up actions."], "ls": [{"t": "What to monitor", "tag": "all", "blocks": [{"k": "p", "x": "A useful starting point is the **four golden signals**, applied to network services as well as applications:"}, {"k": "ul", "x": ["**Latency**: how long requests and round trips take (watch p95 and p99, not just averages).", "**Traffic**: requests per second, bandwidth, connections.", "**Errors**: HTTP 5xx from load balancers, TCP resets, dropped packets, rejected flows, failed DNS queries.", "**Saturation**: how full things are: NAT gateway port usage, VPN tunnel bandwidth, firewall throughput, subnet IP utilisation, instance network allowances."]}, {"k": "p", "x": "Network-specific items to always watch:"}, {"k": "ul", "x": ["**BGP session state** and number of received prefixes on every VPN and private link", "**Tunnel state** (both tunnels of every VPN)", "**Load balancer** healthy host counts and target response time", "**NAT gateway** connection errors and port allocation failures", "**Certificate expiry** dates", "**IP address utilisation** per subnet"]}, {"k": "tip", "kind": "Tip", "x": "An SLI (service level indicator) is a measurement, such as \"the share of checkout requests served under 300 ms\". An SLO (objective) is the target: \"99.5% over 30 days\". Build alerts around SLOs."}]}, {"t": "Metrics, logs and traces in each cloud", "tag": "all", "blocks": [{"k": "p", "x": "Each provider has a native observability stack:"}, {"k": "ul", "x": ["**AWS**: **CloudWatch** metrics, logs and alarms; VPC Flow Logs; **CloudWatch Network Monitoring** (Network Synthetic Monitor for hybrid paths, Internet Monitor for user-facing Internet performance); **X-Ray** / OpenTelemetry for traces.", "**Azure**: **Azure Monitor** metrics and Log Analytics (KQL); Network Watcher **Connection Monitor**; **Traffic Analytics** on VNet flow logs; Application Insights for traces.", "**Google Cloud**: **Cloud Monitoring** and **Cloud Logging**; Network Intelligence Center (**Performance Dashboard**, Network Topology, Flow Analyzer); **Cloud Trace**.", "**OCI**: **Monitoring** and **Logging**; **Logging Analytics**; **Health Checks** for endpoints; **APM** for traces."]}, {"k": "p", "x": "Many teams also export everything to one tool (Grafana, Datadog, Splunk, Elastic, a SIEM) using **OpenTelemetry**, so hybrid and multi-cloud environments look the same."}, {"k": "tip", "kind": "Tip", "x": "Correlate layers. A spike in load-balancer 5xx errors means much more next to backend CPU, NAT errors and flow-log rejects on the same timeline."}]}, {"t": "Querying flow logs", "tag": "all", "blocks": [{"k": "p", "x": "Raw flow logs are huge; querying them quickly is what makes them useful. Store them where you can run SQL or KQL:"}, {"k": "code", "t": "AWS: top rejected flows in the last hour (Amazon Athena over VPC Flow Logs)", "x": "SELECT srcaddr, dstaddr, dstport, protocol, COUNT(*) AS hits\nFROM vpc_flow_logs\nWHERE action = 'REJECT' AND start > to_unixtime(now() - interval '1' hour)\nGROUP BY srcaddr, dstaddr, dstport, protocol\nORDER BY hits DESC LIMIT 20;"}, {"k": "code", "t": "Azure: denied flows by destination port (KQL, Traffic Analytics table)", "x": "NTANetAnalytics\n| where TimeGenerated > ago(1h) and FlowStatus == \"Denied\"\n| summarize Flows = count() by DestPort, SrcIp, DestIp\n| top 20 by Flows"}, {"k": "code", "t": "Google Cloud: biggest talkers (BigQuery over exported VPC Flow Logs, schema simplified)", "x": "SELECT jsonPayload.connection.src_ip, jsonPayload.connection.dest_ip,\n       SUM(CAST(jsonPayload.bytes_sent AS INT64)) AS bytes\nFROM `proj.netlogs.compute_googleapis_com_vpc_flows_*`\nGROUP BY 1, 2 ORDER BY bytes DESC LIMIT 20;"}, {"k": "p", "x": "Typical questions flow logs answer: who is talking to the database? Which flows are being rejected right after a change? Which servers send the most data to the Internet (egress cost)? Is anything talking to an unexpected country?"}, {"k": "tip", "kind": "Tip", "x": "Flow logs record metadata (who, where, how much), not packet contents. For contents, use packet capture or mirroring."}]}, {"t": "Synthetic and Internet monitoring", "tag": "all", "blocks": [{"k": "p", "x": "Real-user metrics tell you something is wrong after users feel it. **Synthetic monitoring** tests continuously from known locations, so you find problems first and can tell whether the issue is your network or the Internet:"}, {"k": "ul", "x": ["**Uptime / health checks** from many regions against public endpoints (all four clouds offer them).", "**Path monitoring** between on-premises and cloud: AWS **Network Synthetic Monitor**, Azure **Connection Monitor**, Google Cloud **Performance Dashboard** for Google's own network, and agent-based tools.", "**Internet monitoring**: AWS **Internet Monitor** shows how Internet issues (an ISP outage in a city) affect your users; third-party platforms provide similar views across providers.", "**Transaction tests**: scripted logins or checkouts that exercise the whole stack, including DNS, TLS and the application."]}, {"k": "tip", "kind": "Tip", "x": "Always have at least one synthetic check from outside your own cloud provider. If your provider has a regional problem, its own monitoring might be affected too."}]}, {"t": "Alerting without fatigue", "tag": "all", "blocks": [{"k": "p", "x": "Too many alerts are as bad as too few: people start ignoring them. Good alerting rules:"}, {"k": "ul", "x": ["**Page a human only for symptoms that hurt users** or will soon (SLO burn rate, both VPN tunnels down, BGP session down, certificate expiring in under 7 days).", "**Send everything else to a ticket or dashboard** (one tunnel of two down, rising NAT usage).", "**Every alert has a runbook link**: what it means, how to check, how to fix, who to escalate to.", "**Tune or delete** alerts that fire without action. Review them monthly.", "**Use multi-window burn-rate alerts** for SLOs: a fast burn (lots of errors in 5 minutes) pages; a slow burn (errors over hours) opens a ticket."]}, {"k": "tip", "kind": "Watch out", "x": "Alerting on a single failed health check or a single dropped packet guarantees noise. Require a condition to persist or to cross a meaningful threshold."}]}, {"t": "Incident response and postmortems", "tag": "all", "blocks": [{"k": "p", "x": "When something breaks, a clear process limits the damage:"}, {"k": "ol", "x": ["**Detect and declare**: someone declares an incident and its severity.", "**Roles**: an **incident commander** coordinates; others investigate; one person handles communication.", "**Mitigate first**: restore service (roll back the change, fail over, disable the feature) before finding the root cause.", "**Communicate**: regular updates to stakeholders and a status page for customers.", "**Resolve and verify**: confirm with metrics that users are fine.", "**Postmortem**: a **blameless** write-up: timeline, impact, root cause, what went well, what went badly, and **action items with owners and dates**."]}, {"k": "tip", "kind": "Tip", "x": "Most network incidents start with a change. \"What changed in the last few hours?\" is the first question in every incident."}]}, {"t": "Real-world scenario: the slow Tuesdays", "tag": "all", "blocks": [{"k": "p", "x": "**Situation.** Every Tuesday around 10:00, users of an internal ERP system on OCI, accessed from three offices over FastConnect, complain that it is very slow for about 40 minutes. By the time anyone looks, it's fine. This has gone on for two months."}, {"k": "p", "x": "**Investigation.**"}, {"k": "ol", "x": ["The team adds **synthetic tests** from each office to the ERP every minute, recording latency and packet loss, plus monitoring on FastConnect virtual circuit utilisation and BGP state.", "The next Tuesday, the dashboards show the FastConnect circuit at 98% utilisation from 09:55 to 10:40, with latency rising from 4 ms to 180 ms and 2% packet loss. BGP stays up.", "**VCN flow logs** for that window show one source dominating: a backup server in the data centre copying VM images to Object Storage in OCI, scheduled weekly at 09:55 by a team that had recently moved its backups to the cloud."]}, {"k": "p", "x": "**Fix.**"}, {"k": "ol", "x": ["Immediate: move the backup job to 01:00.", "Longer term: send bulk transfers over a separate FastConnect virtual circuit (or the Site-to-Site VPN), and apply QoS on the on-premises routers to protect interactive traffic.", "Add alerts at 80% circuit utilisation for more than 10 minutes, and include large scheduled transfers in the change process."]}, {"k": "p", "x": "**Lessons learned.** Intermittent problems need continuous measurement; you can't troubleshoot from memories. Utilisation, latency and flow data on one timeline found in one week what complaints couldn't find in two months."}]}], "q": [{"t": "Which set are the four golden signals?", "o": ["CPU, memory, disk, network", "Latency, traffic, errors, saturation", "Uptime, cost, users, regions", "Bandwidth, jitter, loss, MTU"], "a": 1, "x": "The four golden signals from Google's SRE practice."}, {"t": "What is the difference between an SLI and an SLO?", "o": ["They are the same", "An SLI is a measurement; an SLO is the target for that measurement", "An SLO is a log; an SLI is a metric", "SLIs are only for networks"], "a": 1, "x": "For example, SLI = share of fast requests; SLO = 99.5% over 30 days."}, {"t": "Which alert should page an on-call engineer at night?", "o": ["One of two VPN tunnels is down", "Both VPN tunnels to a site are down and users can't reach the application", "NAT usage is at 40%", "A single health check failed once"], "a": 1, "x": "Page for user-impacting symptoms; route redundancy warnings to tickets."}, {"t": "What do flow logs NOT contain?", "o": ["Source and destination IPs", "Ports and protocol", "Bytes and packets", "Packet payload contents"], "a": 3, "x": "Flow logs capture metadata only; use packet capture to see contents."}, {"t": "What is the first priority during an incident?", "o": ["Finding the root cause", "Writing the postmortem", "Mitigating impact and restoring service", "Assigning blame"], "a": 2, "x": "Restore service first; root cause analysis comes after."}], "lv": 5, "h": 6, "goal": "Monitor, alert on and operate cloud networks like a production service.", "terms": ["SLI", "SLO", "golden signals", "metrics", "logs", "traces", "flow log analytics", "synthetic monitoring", "Internet monitoring", "alert fatigue", "runbook", "on-call", "incident commander", "postmortem"]}, {"id": "m33", "t": "SASE, SD-WAN & Zero Trust Access", "res": [["Cloudflare Learning: what is SASE", "https://www.cloudflare.com/learning/access-management/what-is-sase/"], ["Microsoft Entra Private Access", "https://learn.microsoft.com/en-us/entra/global-secure-access/concept-private-access"], ["AWS Verified Access", "https://docs.aws.amazon.com/verified-access/latest/ug/what-is-verified-access.html"], ["Google Cloud: Identity-Aware Proxy", "https://cloud.google.com/iap/docs/concepts-overview"], ["OCI Zero Trust Packet Routing", "https://docs.oracle.com/en-us/iaas/Content/zero-trust-packet-routing/overview.htm"]], "sum": ["Users and apps left the data centre, so security moved to the cloud edge and to identity.", "SD-WAN builds smart overlays across many links and connects branches to cloud hubs.", "SASE combines SD-WAN with cloud-delivered security (SWG, CASB, ZTNA, FWaaS).", "ZTNA grants access per application based on identity and device, replacing broad VPN access."], "ls": [{"t": "Why the perimeter moved", "tag": "all", "blocks": [{"k": "p", "x": "Ten years ago, most applications lived in the company data centre and most users sat in offices. Branch traffic was backhauled over MPLS to headquarters, through one big firewall stack, and out to the Internet."}, {"k": "p", "x": "Today applications are SaaS (Microsoft 365, Salesforce) and cloud-hosted, and users work from anywhere. Backhauling everything to headquarters adds latency, overloads the central firewall and the MPLS links, and gives remote users a poor experience. A traditional VPN also gives users broad network access: once connected, a compromised laptop can scan and reach far more than it needs."}, {"k": "p", "x": "Two shifts address this:"}, {"k": "ul", "x": ["**Networking**: branches connect directly to the Internet and clouds using **SD-WAN** instead of only expensive MPLS.", "**Security**: inspection and access control move into **cloud-delivered services** close to users, and access decisions are based on **identity and device**, not network location."]}, {"k": "tip", "kind": "Analogy", "x": "Instead of every employee driving to headquarters to be searched before going anywhere, security checkpoints are placed in every neighbourhood, and each door checks your badge."}]}, {"t": "SD-WAN", "tag": "all", "blocks": [{"k": "p", "x": "**SD-WAN** (software-defined WAN) puts an intelligent edge device or virtual appliance at each branch, connected over several **underlay** links (broadband, 5G, MPLS, fibre). It builds encrypted **overlay** tunnels between sites and to cloud hubs, managed from a central controller."}, {"k": "p", "x": "Key capabilities:"}, {"k": "ul", "x": ["**Application-aware path selection**: send Microsoft Teams over the link with the lowest jitter, backups over the cheapest link, and move traffic instantly when a link degrades.", "**Central policy**: one place to define routing, QoS and security for hundreds of sites.", "**Zero-touch provisioning**: a new branch device downloads its config when plugged in.", "**Local Internet breakout**: SaaS traffic goes straight to the Internet (through cloud security) instead of backhauling."]}, {"k": "p", "x": "**Cloud on-ramps** connect SD-WAN to cloud networks: SD-WAN virtual appliances in an AWS Transit Gateway Connect attachment (GRE plus BGP) or Cloud WAN, in an **Azure Virtual WAN** hub (with integrated partner appliances), via **Google Network Connectivity Center** router appliance spokes, or as appliances in an OCI hub VCN attached to the DRG."}, {"k": "tip", "kind": "Tip", "x": "When evaluating SD-WAN, test failover under real conditions: unplug a link during a video call and see whether the call survives."}]}, {"t": "SSE and SASE", "tag": "all", "blocks": [{"k": "p", "x": "**SASE** (secure access service edge, pronounced \"sassy\") combines **SD-WAN** networking with **SSE** (security service edge), a set of cloud-delivered security services, consumed from the provider's points of presence close to users:"}, {"k": "ul", "x": ["**Secure web gateway (SWG)**: inspects and filters web traffic (malware, URL categories, TLS inspection).", "**Cloud access security broker (CASB)**: visibility and control over SaaS usage (which apps, what data, sharing policies).", "**Zero trust network access (ZTNA)**: per-application private access (next lesson).", "**Firewall as a service (FWaaS)**: network firewall policies applied in the cloud.", "**Data loss prevention (DLP)**: detects and blocks sensitive data leaving the organisation."]}, {"k": "p", "x": "All traffic, from branches (via SD-WAN) and remote users (via an agent), goes to the nearest SSE PoP, gets the same policy, and continues to the Internet, SaaS or private apps."}, {"k": "p", "x": "Vendors include Zscaler, Netskope, Palo Alto Networks Prisma Access, Cloudflare One, Cisco and Fortinet, and Microsoft's **Global Secure Access** (Entra Internet Access and Entra Private Access)."}, {"k": "tip", "kind": "Watch out", "x": "TLS inspection in an SWG requires deploying a trusted root certificate to devices and excluding sensitive categories (banking, health) and apps with certificate pinning."}]}, {"t": "ZTNA versus VPN", "tag": "all", "blocks": [{"k": "p", "x": "A traditional **remote-access VPN** puts the user's device *on the network*. Access is broad, often whole subnets, and the network trusts the device once connected."}, {"k": "p", "x": "**ZTNA** connects users to **specific applications**, never to the network:"}, {"k": "ol", "x": ["The user authenticates with the identity provider (with MFA).", "The policy engine checks **identity, group, device posture** (managed, encrypted, patched, EDR running) and context (location, risk).", "If allowed, a broker connects the user to that one application, often through a **connector** that makes an outbound connection from the app's network, so no inbound ports are open.", "The decision is re-evaluated continuously; access ends when conditions change."]}, {"k": "p", "x": "Cloud-native options:"}, {"k": "ul", "x": ["**Google Cloud Identity-Aware Proxy (IAP)** for web apps and TCP forwarding; **Chrome Enterprise Premium** (formerly BeyondCorp Enterprise) for broader zero-trust access.", "**AWS Verified Access**: access to corporate applications without a VPN, with policies on identity and device trust.", "**Microsoft Entra Private Access**: ZTNA for private apps, with Conditional Access policies.", "**OCI Zero Trust Packet Routing (ZPR)**: security attributes on resources and intent-based policies that control which resources can talk, independent of network topology."]}, {"k": "tip", "kind": "Tip", "x": "Migrate in waves: publish web apps through ZTNA first (easiest), then SSH/RDP, then the remaining client-server apps, and shrink the VPN as you go."}]}, {"t": "Designing a SASE migration", "tag": "all", "blocks": [{"k": "p", "x": "A realistic plan for an organisation with offices, remote staff and multiple clouds:"}, {"k": "ol", "x": ["**Inventory** applications and who uses them: SaaS, public web, private web, legacy client-server.", "**Identity first**: one identity provider with MFA and device management everywhere; it is the foundation of every policy.", "**Internet and SaaS traffic** for remote users through the SSE (SWG, CASB), then for branches via SD-WAN local breakout.", "**Private apps** through ZTNA connectors placed in each cloud network and data centre.", "**Branches**: replace or augment MPLS with SD-WAN, connected to SSE PoPs and to cloud hubs.", "**Decommission**: retire the central web proxies and most VPN access."]}, {"k": "tip", "kind": "Tip", "x": "Measure user experience before and after (page load times, call quality). SASE should make things faster for remote user
