<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light">
<title>{{subject}}</title>
<!-- JS Learning · EmailJS template. Paste into EmailJS → Email Templates → Content → Edit content → code view (</>). -->
<style>
  @media (max-width:600px){ .card{border-radius:0!important} .pad{padding-left:24px!important;padding-right:24px!important} .h1{font-size:24px!important} }
  a{color:#0A84FF}
</style>
</head>
<body style="margin:0;padding:0;background:#eef2ff;-webkit-text-size-adjust:100%;">
  <!-- preheader (inbox preview text) -->
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;font-size:1px;line-height:1px;">{{preheader}}&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#eef2ff;background-image:linear-gradient(135deg,#cffafe 0%,#e0e7ff 50%,#ede9fe 100%);">
    <tr><td align="center" style="padding:36px 12px;">

      <table role="presentation" class="card" width="560" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px;background:#ffffff;border-radius:20px;border:1px solid #e5e9f2;box-shadow:0 18px 50px rgba(10,37,64,.12);overflow:hidden;">

        <!-- title bar -->
        <tr><td style="background:#f6f7f9;border-bottom:1px solid #e9ecf1;padding:12px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
            <td width="70" style="font-size:0;line-height:0;">
              <span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:#ff5f57;margin-right:7px;"></span><span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:#febc2e;margin-right:7px;"></span><span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:#28c840;"></span>
            </td>
            <td align="center" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;font-weight:600;color:#5b6577;">JS Learning</td>
            <td width="70"></td>
          </tr></table>
        </td></tr>

        <!-- icon + heading -->
        <tr><td class="pad" align="center" style="padding:34px 44px 6px;">
          <img src="https://rcubex.github.io/jslearning/icons/icon-192.png" width="64" height="64" alt="JS Learning" style="display:block;width:64px;height:64px;border-radius:16px;border:0;box-shadow:0 8px 20px rgba(10,132,255,.25);">
        </td></tr>
        <tr><td class="pad" align="center" style="padding:18px 44px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
          <h1 class="h1" style="margin:0;font-size:28px;line-height:1.2;font-weight:800;letter-spacing:-.5px;color:#0A2540;">{{heading}}</h1>
        </td></tr>

        <!-- message -->
        <tr><td class="pad" style="padding:22px 44px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#33415c;">
          <p style="margin:0 0 14px;">Hi {{to_name}},</p>
          {{{message_html}}}
        </td></tr>

        <!-- button -->
        <tr><td class="pad" align="center" style="padding:26px 44px 8px;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
            <td align="center" bgcolor="#0A84FF" style="border-radius:12px;background:#0A84FF;background-image:linear-gradient(180deg,#3d94fa,#0b6ef3);box-shadow:0 6px 16px rgba(10,132,255,.35);">
              <a href="{{cta_url}}" target="_blank" style="display:inline-block;padding:14px 30px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:12px;">{{cta_text}} &rarr;</a>
            </td>
          </tr></table>
        </td></tr>
        <tr><td class="pad" align="center" style="padding:10px 44px 30px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12.5px;line-height:1.5;color:#8a94a6;">
          Or open <a href="{{site}}" target="_blank" style="color:#0A84FF;text-decoration:none;">{{site}}</a>
        </td></tr>

        <!-- signature -->
        <tr><td class="pad" style="padding:0 44px 30px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-top:1px solid #edf0f5;"><tr>
            <td style="padding-top:18px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;color:#33415c;">
              Keep going,<br><b style="color:#f97316;">{{sender_name}}</b>
            </td>
          </tr></table>
        </td></tr>
      </table>

      <!-- footer -->
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px;">
        <tr><td align="center" style="padding:18px 20px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#7b8598;">
          You’re receiving this because you study on JS Learning.<br>Reply to this email to contact your admin.
        </td></tr>
      </table>

    </td></tr>
  </table>
</body>
</html>
